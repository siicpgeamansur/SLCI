<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Représentation d'état et linéarisation · ITC</title>
<style>
/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail blanche,
   panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --node-stroke:#33475b;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
/* cours */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:880px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
/* ateliers */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:190px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.stagebox{border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px;background:#fff;margin:8px 0}
/* formules et matrices */
.eq{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto;line-height:2.05}
.mat{display:inline-grid;grid-template-columns:auto auto;align-items:center;justify-items:center;gap:1px 14px;padding:1px 9px;border-left:2px solid var(--fg);border-right:2px solid var(--fg);vertical-align:middle;font-family:var(--font-mono);font-size:13.5px;margin:0 3px}
.mat.c3{grid-template-columns:auto auto auto}
.eq i,.formula i{font-style:italic}
/* graphiques */
.plot{width:100%;height:auto;display:block;touch-action:manipulation}
.plot .gl{stroke:#e3e7ec;stroke-width:1}
.plot .ax{stroke:#5a6068;stroke-width:1.3}
.plot .tick{font:11px var(--font-mono);fill:#5a6068}
.plot .lbl{font:12px var(--font-ui);fill:#111}
.plot .cap{font:600 12px var(--font-ui);fill:#5a6068}
/* circuits */
.circ{width:100%;max-width:470px;height:auto;display:block;margin:0 auto}
.circ .wire{stroke:#33475b;stroke-width:2;fill:none;stroke-linecap:round}
.circ .comp{stroke:#33475b;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.circ .src{stroke:#33475b;stroke-width:2;fill:#fff}
.circ .sym{font:13px var(--font-mono);fill:#33475b}
.circ .lbl{font:600 13px var(--font-ui);fill:#33475b}
.circ .arr{fill:#2e6da4}
.circ .hl{stroke:var(--accent)!important;stroke-width:3.2!important}
.circ text.hl{fill:var(--accent)!important}
.circ .mass{fill:#dcebf8;stroke:#33475b;stroke-width:2}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .opts input[type=range]{width:150px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="28" height="26" viewBox="0 0 28 26" aria-hidden="true">
        <path d="M7 3h-4v20h4" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <path d="M21 3h4v20h-4" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <rect x="8" y="7" width="3.6" height="3.6" fill="var(--ok)"/><rect x="16.4" y="7" width="3.6" height="3.6" fill="var(--warn)"/>
        <rect x="8" y="15.4" width="3.6" height="3.6" fill="var(--bad)"/><rect x="16.4" y="15.4" width="3.6" height="3.6" fill="var(--violet)"/>
      </svg>
      <span>Représentation d'état <small>ITC · PCSI / PSI*</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>
  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ============================ utilitaires ============================ */
const NS = 'http://www.w3.org/2000/svg';
const $ = (s, r) => (r || document).querySelector(s);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function sv(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; el.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function num(x, d) {
  if (!isFinite(x)) return x > 0 ? '+∞' : '−∞';
  let s = x.toFixed(d === undefined ? 2 : d);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s.replace('-', '−').replace('.', ',');
}
const M = rows => {
  const nc = Math.max(...rows.map(r => r.length));
  return '<span class="mat' + (nc === 3 ? ' c3' : '') + '">' + rows.flat().map(v => '<span>' + v + '</span>').join('') + '</span>';
};
const EQ = html => '<div class="eq">' + html + '</div>';
const isSmall = () => { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } };
const KEYS = { act: 'etat-lineaire-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
function chipRow(items, isOn, onClick) {
  const box = h('div', { class: 'chips' });
  items.forEach(it => {
    const on = isOn(it[0]);
    const b = h('button', { type: 'button', class: 'chip' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', onclick: () => onClick(it[0]) });
    b.innerHTML = it[1];
    box.append(b);
  });
  return box;
}
function stats(list) { return h('div', { class: 'gstats' }, list.map(k => h('div', { class: 'stat' }, h('span', null, k[0]), h('b', null, k[1])))); }
function setMsg(sel, text, kind) { const m = $(sel); if (!m) return; m.innerHTML = text; m.className = 'verdict' + (kind ? ' ' + kind : ''); }

/* tracé SVG générique */
function plot(o) {
  const W = o.W || 470, H = o.H || 250, m = o.m || { l: 46, r: 16, t: 12, b: 28 };
  const [x0, x1] = o.xr, [y0, y1] = o.yr;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const root = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'plot' });
  (o.xticks || []).forEach(t => root.append(sv('line', { x1: X(t.v), y1: m.t, x2: X(t.v), y2: H - m.b, class: 'gl' })));
  (o.yticks || []).forEach(t => root.append(sv('line', { x1: m.l, y1: Y(t.v), x2: W - m.r, y2: Y(t.v), class: 'gl' })));
  const yA = (y0 <= 0 && y1 >= 0) ? Y(0) : H - m.b;
  const xA = (x0 <= 0 && x1 >= 0) ? X(0) : m.l;
  root.append(sv('line', { x1: m.l, y1: yA, x2: W - m.r, y2: yA, class: 'ax' }));
  root.append(sv('line', { x1: xA, y1: m.t, x2: xA, y2: H - m.b, class: 'ax' }));
  (o.xticks || []).forEach(t => root.append(sv('text', { x: X(t.v), y: H - m.b + 16, class: 'tick', 'text-anchor': 'middle' }, t.label)));
  (o.yticks || []).forEach(t => root.append(sv('text', { x: m.l - 6, y: Y(t.v) + 4, class: 'tick', 'text-anchor': 'end' }, t.label)));
  (o.series || []).forEach(sr => {
    if (!sr.pts.length) return;
    const pts = sr.pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
    root.append(sv('polyline', { points: pts, fill: 'none', stroke: sr.color || '#2e6da4', 'stroke-width': sr.w || 2, 'stroke-dasharray': sr.dash || null, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  });
  (o.dots || []).forEach(d => root.append(sv('circle', { cx: X(d.x), cy: Y(d.y), r: d.r || 4, fill: d.color || '#c0281f' })));
  (o.texts || []).forEach(t => root.append(sv('text', { x: X(t.x), y: Y(t.y), class: 'cap', 'text-anchor': t.anchor || 'start' }, t.s)));
  root._map = { X, Y, W, H, m, x0, x1, y0, y1 };
  return root;
}
/* intégration RK4 d'un système 2D */
function rk4(f, ic, T, step) {
  let p = ic.slice(); const pts = [p.slice()];
  for (let t = 0; t < T; t += step) {
    const k1 = f(p);
    const k2 = f([p[0] + step / 2 * k1[0], p[1] + step / 2 * k1[1]]);
    const k3 = f([p[0] + step / 2 * k2[0], p[1] + step / 2 * k2[1]]);
    const k4 = f([p[0] + step * k3[0], p[1] + step * k3[1]]);
    p = [p[0] + step / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
         p[1] + step / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])];
    if (!isFinite(p[0]) || !isFinite(p[1]) || Math.abs(p[0]) > 60 || Math.abs(p[1]) > 60) break;
    pts.push(p.slice());
  }
  return pts;
}

/* ============================ Atelier 1 ============================ */
const CIRCUIT_SVG = `
<svg viewBox="0 0 440 210" class="circ" role="img" aria-label="Circuit RLC série">
  <g class="wire">
    <line x1="80" y1="50" x2="160" y2="50"/>
    <line x1="260" y1="50" x2="390" y2="50"/>
    <line x1="390" y1="50" x2="390" y2="80"/>
    <line x1="390" y1="140" x2="390" y2="150"/>
    <line x1="390" y1="150" x2="236" y2="150"/>
    <line x1="220" y1="150" x2="80" y2="150"/>
    <line x1="80" y1="150" x2="80" y2="122"/>
    <line x1="80" y1="78" x2="80" y2="50"/>

const S3 = { th: 0.9, c: 0.25, d: 0.6 };
function mountS3(root) {

      '<label class="fld"><span>Point de linéarisation θ₀ = <b id="s3-thout"></b> rad</span><input type="range" id="s3-th" min="-3.14159" max="3.14159" step="0.01"></label>' +

function drawS3() {
  const th0 = S3.th, c = S3.c, d = S3.d;
  $('#s3-thout').textContent = num(th0);
  $('#s3-cout').textContent = num(c);
  $('#s3-dout').textContent = num(d);

  /* --- graphe de f et tangente --- */
  const pts = [];
  for (let i = 0; i <= 240; i++) { const x = -Math.PI + 2 * Math.PI * i / 240; pts.push([x, -Math.sin(x)]); }
  const slope = -Math.cos(th0);
  const tan = [[-Math.PI, -Math.sin(th0) + slope * (-Math.PI - th0)], [Math.PI, -Math.sin(th0) + slope * (Math.PI - th0)]];
  const p1 = $('#s3-plot1'); p1.innerHTML = '';
  p1.append(plot({
    W: 480, H: 240, xr: [-Math.PI, Math.PI], yr: [-1.7, 1.7],
    xticks: [{ v: -Math.PI, label: '−π' }, { v: -Math.PI / 2, label: '−π/2' }, { v: 0, label: '0' }, { v: Math.PI / 2, label: 'π/2' }, { v: Math.PI, label: 'π' }],
    yticks: [{ v: -1, label: '−1' }, { v: 0, label: '0' }, { v: 1, label: '1' }],
    series: [{ pts: pts, color: '#2e6da4', w: 2.6 }, { pts: tan, color: '#c0281f', w: 2, dash: '7 5' }],
    dots: [{ x: th0, y: -Math.sin(th0), color: '#c0281f', r: 5 }],
    texts: [{ x: -Math.PI + 0.1, y: 1.5, s: '−sin θ (réel)' }, { x: 1.0, y: 1.5, s: 'tangente en θ₀' }]
  }));
  const eq = Math.abs(Math.sin(th0)) < 0.03;
  const vd = $('#s3-verdict');
  if (eq) {
    const stable = Math.cos(th0) > 0;
    vd.className = 'verdict ' + (stable ? 'yes' : 'no');
    vd.innerHTML = stable
      ? '<b>θ₀ = ' + num(th0) + ' rad est un point d\'équilibre stable.</b> La pente de la tangente vaut −cos θ₀ = ' + num(slope) + ' &lt; 0 : une petite perturbation est rappelée vers l\'équilibre. C\'est le pendule « en bas ».'
      : '<b>θ₀ = ' + num(th0) + ' rad est un point d\'équilibre instable.</b> La pente vaut −cos θ₀ = ' + num(slope) + ' &gt; 0 : la moindre perturbation s\'amplifie. C\'est le pendule « en haut ».';
  } else {
    vd.className = 'verdict warn';
    vd.innerHTML = '<b>θ₀ = ' + num(th0) + ' rad n\'est pas un point d\'équilibre</b> (sin θ₀ ≠ 0). La tangente est tracée, mais un modèle linéarisé n\'a de sens qu\'autour d\'un point d\'équilibre. Faites glisser le curseur vers 0 ou vers ±π.';
  }

  /* --- jacobienne --- */
  const J = [['0', '1'], [num(slope), num(-c)]];
  let eigs, nat;
  const tr = -c, det = -slope, disc = tr * tr - 4 * det;
  if (disc >= 0) {
    const r = Math.sqrt(disc);
    eigs = [num((tr + r) / 2), num((tr - r) / 2)];
    nat = (tr + r) / 2 > 0 ? 'deux valeurs propres réelles, dont une positive → équilibre instable (nœud instable)' : 'deux valeurs propres réelles négatives → équilibre stable (nœud stable)';
  } else {
    const re = tr / 2, im = Math.sqrt(-disc) / 2;
    eigs = [num(re) + ' ± ' + num(im) + ' j'];
    nat = re < 0 ? 'valeurs propres complexes de partie réelle négative → foyer stable (oscillations amorties)' : 'valeurs propres complexes de partie réelle positive → foyer instable';
  }
  $('#s3-jac').innerHTML =
    EQ('<b>A</b> = ∂<b>f</b>/∂<b>x</b> |<sub><b>x</b>₀</sub> = ' + M([['0', '1'], ['−cos θ₀', '−c']]) + ' = ' + M(J)) +
    stats([['λ (valeurs propres)', eigs.join('  ;  ')], ['Interprétation', nat]]) +
    '<p class="small">La matrice jacobienne s\'obtient en dérivant chaque ligne de <b>f</b> par rapport à chaque variable d\'état, puis en évaluant au point d\'équilibre.</p>';

  /* --- simulation --- */
  const fNL = p => [p[1], -Math.sin(p[0]) - c * p[1]];
  const fL = p => [p[1], -Math.cos(th0) * (p[0] - th0) - c * p[1]];
  const T = 10, st = 0.02;
  const nl = rk4(fNL, [th0 + d, 0], T, st).map((p, i) => [i * st, p[0]]);
  const li = rk4(fL, [th0 + d, 0], T, st).map((p, i) => [i * st, p[0]]);
  let ymin = Infinity, ymax = -Infinity;
  nl.forEach(p => { ymin = Math.min(ymin, p[1]); ymax = Math.max(ymax, p[1]); });
  li.forEach(p => { ymin = Math.min(ymin, p[1]); ymax = Math.max(ymax, p[1]); });
  const pad = (ymax - ymin) * 0.15 + 0.05;
  const p2 = $('#s3-plot2'); p2.innerHTML = '';
  p2.append(plot({
    W: 480, H: 220, xr: [0, T], yr: [ymin - pad, ymax + pad],
    xticks: [{ v: 0, label: '0' }, { v: 2, label: '2' }, { v: 4, label: '4' }, { v: 6, label: '6' }, { v: 8, label: '8' }, { v: 10, label: '10 s' }],
    yticks: [{ v: ymin, label: num(ymin, 1) }, { v: 0, label: '0' }, { v: ymax, label: num(ymax, 1) }],
    series: [{ pts: nl, color: '#2e6da4', w: 2.2 }, { pts: li, color: '#c0281f', w: 2, dash: '7 5' }],
    texts: [{ x: 0.2, y: ymax + pad * 0.5, s: 'bleu : non linéaire — rouge pointillé : linéarisé' }]
  }));
  let ecart = 0;
  const nmin = Math.min(nl.length, li.length);
  for (let i = 0; i < nmin; i++) ecart = Math.max(ecart, Math.abs(nl[i][1] - li[i][1]));
  $('#s3-cmp').innerHTML = '<div class="verdict">' + (
    ecart < 0.05
      ? '<b>Les deux courbes se superposent.</b> Le modèle linéarisé est une excellente approximation tant qu\'on reste au voisinage du point d\'équilibre.'
      : '<b>Écart maximal : ' + num(ecart) + ' rad.</b> Plus l\'écart initial δ est grand, plus le modèle linéarisé s\'éloigne de la réalité : la linéarisation n\'est <i>valable que localement</i>.') + '</div>';
}

function mountS4(root) {

    '</div>' +
    '<div class="stagebox"><div id="s4-plot"></div></div>' +
    '<p class="small">Cliquez dans le plan pour choisir une nouvelle condition initiale : la trajectoire bleue est recalculée.</p>' +
    '<div id="s4-info"></div>';
  $('#s4-w').value = S4.w; $('#s4-z').value = S4.z;
  $('#s4-w').addEventListener('input', e => { S4.w = +e.target.value; drawS4(); });
  $('#s4-z').addEventListener('input', e => { S4.z = +e.target.value; drawS4(); });
  $('#s4-reset').addEventListener('click', () => { S4.ic = [2, 0]; drawS4(); });
  drawS4();
}
function drawS4() {
  const w = S4.w, z = S4.z;
  $('#s4-wout').textContent = num(w, 1);
  $('#s4-zout').textContent = num(z);
  const A = [[0, 1], [-w * w, -2 * z * w]];
  const f = p => [A[0][0] * p[0] + A[0][1] * p[1], A[1][0] * p[0] + A[1][1] * p[1]];
  const XR = [-4, 4], YR = [-4, 4];
  const series = [];
  const R = 2.6;
  for (let i = 0; i < 12; i++) {
    const a = 2 * Math.PI * i / 12;
    const ic = [R * Math.cos(a), R * Math.sin(a)];
    series.push({ pts: rk4(f, ic, 8, 0.02), color: '#9fb4ca', w: 1.3 });
  }
  const main = rk4(f, S4.ic, 8, 0.02);
  series.push({ pts: main, color: '#2e6da4', w: 2.4 });

  const box = $('#s4-plot'); box.innerHTML = '';
  const g = plot({
    W: 470, H: 380, xr: XR, yr: YR,
    xticks: [{ v: -4, label: '−4' }, { v: -2, label: '−2' }, { v: 0, label: '0' }, { v: 2, label: '2' }, { v: 4, label: '4' }],
    yticks: [{ v: -4, label: '−4' }, { v: -2, label: '−2' }, { v: 0, label: '0' }, { v: 2, label: '2' }, { v: 4, label: '4' }],
    series: series,
    dots: [{ x: S4.ic[0], y: S4.ic[1], color: '#c0281f', r: 5 }],
    texts: [{ x: 3.1, y: 3.6, s: 'x₁' }, { x: 0.15, y: 3.6, s: 'x₂' }]
  });
  box.append(g);
  /* clic pour choisir une condition initiale */
  g.addEventListener('click', e => {
    const r = g.getBoundingClientRect();
    const map = g._map;
    const px = (e.clientX - r.left) / r.width * map.W;
    const py = (e.clientY - r.top) / r.height * map.H;
    const x = map.x0 + (px - map.m.l) / (map.W - map.m.l - map.m.r) * (map.x1 - map.x0);
    const y = map.y1 - (py - map.m.t) / (map.H - map.m.t - map.m.b) * (map.y1 - map.y0);
    if (x < XR[0] || x > XR[1] || y < YR[0] || y > YR[1]) return;
    S4.ic = [clamp(x, -3.8, 3.8), clamp(y, -3.8, 3.8)];
    drawS4();
  });

  /* valeurs propres et nature */
  const tr = -2 * z * w, det = w * w, disc = tr * tr - 4 * det;
  let eigTxt, nature, cls;
  if (disc >= 0) {
    const r = Math.sqrt(disc);
    eigTxt = num((tr + r) / 2) + ' et ' + num((tr - r) / 2);
    if (tr < 0) { nature = 'deux valeurs propres réelles négatives : <b>nœud stable</b>, retour à l\'équilibre sans oscillation'; cls = 'yes'; }
    else { nature = 'au moins une valeur propre réelle positive : <b>nœud instable</b>, éloignement de l\'équilibre'; cls = 'no'; }
  } else {
    const re = tr / 2, im = Math.sqrt(-disc) / 2;
    eigTxt = num(re) + ' ± ' + num(im) + ' j';
    if (re < 0) { nature = 'valeurs propres complexes conjuguées de partie réelle négative : <b>foyer stable</b>, spirale qui converge vers l\'origine'; cls = 'yes'; }
    else if (re > 0) { nature = 'valeurs propres complexes de partie réelle positive : <b>foyer instable</b>, spirale divergente'; cls = 'no'; }
    else { nature = 'valeurs propres imaginaires pures : <b>centre</b>, trajectoires elliptiques, équilibre marginalement stable'; cls = 'warn'; }
  }
  if (Math.abs(z) < 1e-9 && Math.abs(tr) < 1e-9) { nature = 'valeurs propres imaginaires pures (ζ = 0) : <b>centre</b>, oscillations entretenues, équilibre marginalement stable'; cls = 'warn'; }
  $('#s4-info').innerHTML = stats([
    ['ω₀', num(w, 1) + ' rad/s'], ['ζ', num(z)],
    ['trace de A', num(tr)], ['déterminant de A', num(det)],
    ['valeurs propres', eigTxt]
  ]) + '<div class="verdict ' + cls + '">' + nature + '</div>' +
     '<p class="small">Stabilité : l\'origine est asymptotiquement stable si et seulement si <b>toutes</b> les valeurs propres de <b>A</b> ont une partie réelle strictement négative (ici : ζ &gt; 0).</p>';
}

<ul>
<li>L'approche <b>classique</b> (ou <i>fréquentielle</i>) : on transforme l'équation différentielle en fonction de transfert <i>G</i>(<i>p</i>). Les calculs sont algébriques, rapides, et donnent immédiatement stabilité et réponse transitoire. Mais elle ne s'applique qu'aux systèmes <b>linéaires et invariants</b>, et mal aux systèmes à plusieurs entrées et sorties.</li>
<li>L'approche <b>moderne</b> (ou <i>temporelle</i>), dite <b>représentation d'état</b> : on décrit le système par un système d'équations différentielles du premier ordre. Elle s'applique aussi aux systèmes multivariables, aux conditions initiales non nulles, aux systèmes variables dans le temps, et — après linéarisation — aux systèmes non linéaires.</li>
</ul>
<h3>Pourquoi « état » ?</h3>
<p>L'<b>état</b> d'un système est l'ensemble minimal d'informations à connaître à l'instant <i>t</i>₀ pour pouvoir prédire toute l'évolution future, l'entrée étant connue. Pour un circuit, ce sont les tensions de condensateurs et les courants de bobines : les éléments qui stockent de l'énergie et gardent la mémoire du passé.</p>
<div class="retain"><b>À retenir.</b> La représentation d'état décrit le système par des équations du premier ordre, sous forme matricielle : c'est l'outil adapté aux systèmes multivariables et aux calculs sur ordinateur.</div>` });

COURSE.push({ id: 'etat', t: 'Variables et équations d\'état', h: `
<h3>Définitions</h3>
<dl class="gloss">
<dt>Variable d'état</dt><dd>Grandeur interne d'un système telle que la connaissance de ses valeurs en <i>t</i>₀ (avec l'entrée pour <i>t</i> ≥ <i>t</i>₀) détermine complètement le comportement futur.</dd>
<dt>Vecteur d'état</dt><dd>Le vecteur <b>x</b> formé des variables d'état <i>x</i>₁, …, <i>x<sub>n</sub></i>.</dd>
<dt>Espace d'état</dt><dd>L'espace à <i>n</i> dimensions dont les axes sont les variables d'état. La solution <b>x</b>(<i>t</i>) y décrit une <b>trajectoire</b>.</dd>
<dt>Équation d'état</dt><dd>Le système de <i>n</i> équations différentielles du premier ordre <b>ẋ</b> = <b>f</b>(<b>x</b>, <b>u</b>, <i>t</i>).</dd>
<dt>Équation de sortie</dt><dd>L'équation <i>algébrique</i> <b>y</b> = <b>g</b>(<b>x</b>, <b>u</b>, <i>t</i>) qui exprime les sorties en fonction de l'état et de l'entrée.</dd>
</dl>
<h3>Méthode en cinq étapes (exemple du RLC série)</h3>
<ol>
<li>Choisir un sous-ensemble de variables : les <b>variables d'état</b>.</li>
<li>Écrire <i>n</i> équations différentielles du premier ordre simultanées en ces variables : les <b>équations d'état</b>.</li>
<li>Résoudre ces équations connaissant <b>x</b>(<i>t</i>₀) et l'entrée pour <i>t</i> ≥ <i>t</i>₀.</li>
<li>Exprimer algébriquement toutes les autres grandeurs à partir de l'état et de l'entrée : l'<b>équation de sortie</b>.</li>
<li>Le couple (équations d'état, équation de sortie) constitue la <b>représentation d'état</b>.</li>
</ol>
<p>Pour le circuit RLC série de la figure, avec <i>x</i>₁ = <i>q</i> (charge) et <i>x</i>₂ = <i>i</i> (courant) :</p>
${EQ('<i>dq</i>/<i>dt</i> = <i>i</i>')}
${EQ('<i>di</i>/<i>dt</i> = − (1/<i>LC</i>) <i>q</i> − (<i>R</i>/<i>L</i>) <i>i</i> + (1/<i>L</i>) <i>v</i>(<i>t</i>)')}
<p>et la tension aux bornes de la bobine, qui est une sortie :</p>
${EQ('<i>v<sub>L</sub></i>(<i>t</i>) = − (1/<i>C</i>) <i>q</i> − <i>R i</i> + <i>v</i>(<i>t</i>)')}
<div class="retain"><b>À retenir.</b> Un système d'ordre <i>n</i> se décrit par <i>n</i> équations d'état du premier ordre, plus une équation de sortie algébrique.</div>` });

COURSE.push({ id: 'matrices', t: 'La forme matricielle', h: `
<p>Pour un système <b>linéaire invariant</b>, les équations d'état et de sortie s'écrivent sous forme matricielle :</p>
${EQ('<b>ẋ</b> = <b>A x</b> + <b>B u</b>')}
${EQ('<b>y</b> = <b>C x</b> + <b>D u</b>')}
<table class="ctable"><thead><tr><th>Objet</th><th>Nom</th><th>Dimension</th></tr></thead><tbody>
<tr><td><b>x</b></td><td>vecteur d'état</td><td><i>n</i> × 1</td></tr>
<tr><td><b>u</b></td><td>vecteur des entrées (commandes)</td><td><i>m</i> × 1</td></tr>
<tr><td><b>y</b></td><td>vecteur des sorties</td><td><i>p</i> × 1</td></tr>
<tr><td><b>A</b></td><td>matrice du système (dynamique)</td><td><i>n</i> × <i>n</i></td></tr>
<tr><td><b>B</b></td><td>matrice d'entrée</td><td><i>n</i> × <i>m</i></td></tr>
<tr><td><b>C</b></td><td>matrice de sortie (observation)</td><td><i>p</i> × <i>n</i></td></tr>
<tr><td><b>D</b></td><td>matrice d'action directe</td><td><i>p</i> × <i>m</i></td></tr>
</tbody></table>
<p>Souvent <b>D</b> = <b>0</b> : l'entrée n'agit pas instantanément sur la sortie (le système est dit <i>strictement propre</i>).</p>
<h3>Lien avec la fonction de transfert</h3>
<p>En transformant les équations avec des conditions initiales nulles : <i>s</i><b>X</b>(<i>s</i>) = <b>A X</b>(<i>s</i>) + <b>B U</b>(<i>s</i>), d'où <b>X</b> = (<i>s</i><b>I</b> − <b>A</b>)⁻¹<b>B U</b> et :</p>
${EQ('<i>G</i>(<i>s</i>) = <b>C</b>(<i>s</i><b>I</b> − <b>A</b>)⁻¹<b>B</b> + <b>D</b>')}
<p>Les pôles de <i>G</i> sont les valeurs propres de <b>A</b>, c'est-à-dire les racines de det(<i>s</i><b>I</b> − <b>A</b>) = 0 : c'est le <b>polynôme caractéristique</b>.</p>
<div class="retain"><b>À retenir.</b> Les valeurs propres de <b>A</b> sont les pôles du système : elles gouvernent stabilité et dynamique, quel que soit le choix des variables d'état.</div>` });

COURSE.push({ id: 'choix', t: 'Comment choisir les variables d\'état ?', h: `
<h3>Deux règles</h3>
<ol>
<li><b>Nombre minimal.</b> Il est égal à l'ordre du système, c'est-à-dire au degré du dénominateur de la fonction de transfert (après simplifications), ou encore au nombre d'<b>éléments indépendants stockant de l'énergie</b> : inductances, capacités, masses, ressorts, inerties…</li>
<li><b>Indépendance linéaire.</b> Aucune variable ne doit pouvoir s'écrire comme combinaison linéaire des autres.</li>
</ol>
<h3>Exemples de dépendance à repérer</h3>
<ul>
<li>Circuits : <i>v<sub>R</sub></i> = <i>R i</i> (résistance) et <i>v<sub>C</sub></i> = <i>q</i>/<i>C</i> (condensateur) sont liées au courant et à la charge. On ne peut donc pas prendre à la fois <i>i</i> et <i>v<sub>R</sub></i>.</li>
<li>Mécanique : la position et la vitesse sont <b>indépendantes</b> (la vitesse est la dérivée de la position, ce n'est pas une combinaison linéaire).</li>
<li>Une variable et sa dérivée sont toujours linéairement indépendantes.</li>
</ul>
<h3>Non-unicité</h3>
<p>Le choix n'est pas unique : pour le RLC, (<i>q</i>, <i>i</i>), (<i>v<sub>C</sub></i>, <i>i</i>) ou (<i>v<sub>C</sub></i>, <i>v<sub>R</sub></i>) conviennent. On obtient des matrices <b>A</b>, <b>B</b>, <b>C</b> différentes, mais les <b>valeurs propres sont identiques</b> : il s'agit du même système physique vu dans une autre base.</p>
<h3>Méthode pratique</h3>
<ol>
<li>Écrire l'équation différentielle de chaque élément stockant de l'énergie.</li>
<li>Isoler chaque dérivée première.</li>
<li>Choisir ces dérivées comme variables d'état.</li>
<li>Remplacer toutes les autres grandeurs par leur expression en fonction des états et de l'entrée.</li>
<li>Écrire les sorties comme combinaisons linéaires des états et des entrées.</li>
</ol>
<div class="retain"><b>À retenir.</b> Autant de variables d'état que d'éléments indépendants stockant de l'énergie, et des variables linéairement indépendantes.</div>` });

COURSE.push({ id: 'exemples', t: 'Exemples classiques', h: `
<h3>Système mécanique masse-ressort-amortisseur</h3>
<p><i>m ẍ</i> + <i>b ẋ</i> + <i>k x</i> = <i>F</i>(<i>t</i>). Avec <i>x</i>₁ = <i>x</i> et <i>x</i>₂ = <i>ẋ</i> :</p>
${EQ('<b>A</b> = ' + M([['0', '1'], ['−k/m', '−b/m']]) + ' , <b>B</b> = ' + M([['0'], ['1/m']]) + ' , <b>C</b> = ' + M([['1', '0']]) + ' , <b>D</b> = 0')}
<p>Polynôme caractéristique : <i>s</i>² + (<i>b</i>/<i>m</i>)<i>s</i> + <i>k</i>/<i>m</i>.</p>
<h3>Circuit RLC série</h3>
<p>Avec <i>x</i>₁ = <i>q</i> et <i>x</i>₂ = <i>i</i> :</p>
${EQ('<b>A</b> = ' + M([['0', '1'], ['−1/(LC)', '−R/L']]) + ' , <b>B</b> = ' + M([['0'], ['1/L']]))}
<h3>Système d\'ordre n quelconque</h3>
<p>À partir de <i>y</i><sup>(<i>n</i>)</sup> + <i>a</i><sub><i>n</i>−1</sub><i>y</i><sup>(<i>n</i>−1)</sup> + … + <i>a</i>₀<i>y</i> = <i>u</i>, on pose <i>x</i>₁ = <i>y</i>, <i>x</i>₂ = <i>ẏ</i>, …, <i>x<sub>n</sub></i> = <i>y</i><sup>(<i>n</i>−1)</sup>. On obtient la <b>forme compagne</b> :</p>
${EQ('<b>A</b> = ' + M([['0', '1', '0', '…'], ['0', '0', '1', '…'], ['⋮', '', '', '⋮'], ['−a₀', '−a₁', '…', '−a<sub>n−1</sub>']]))}
<div class="retain"><b>À retenir.</b> Les formes canoniques (compagne, observable, commandable) permettent d'écrire directement les matrices à partir de la fonction de transfert.</div>` });

COURSE.push({ id: 'lineaire', t: 'Linéarisation', h: `
<p>Un système réel est presque toujours non linéaire (frottements, sin θ, caractéristiques de composants). La représentation d'état linéaire reste utilisable <b>au voisinage d'un point de fonctionnement</b>.</p>
<h3>Point d'équilibre</h3>
<p>Un point <b>x</b>₀ (avec entrée <b>u</b>₀ constante) est un <b>point d'équilibre</b> si <b>f</b>(<b>x</b>₀, <b>u</b>₀) = <b>0</b> : le système y reste indéfiniment si on l'y place sans perturbation.</p>
<h3>Développement de Taylor au premier ordre</h3>
<p>On pose <b>x</b> = <b>x</b>₀ + Δ<b>x</b> et <b>u</b> = <b>u</b>₀ + Δ<b>u</b>. Alors :</p>
${EQ('Δ<b>ẋ</b> ≈ <b>A</b> Δ<b>x</b> + <b>B</b> Δ<b>u</b> &nbsp; avec &nbsp; <b>A</b> = ∂<b>f</b>/∂<b>x</b> |<sub>(<b>x</b>₀,<b>u</b>₀)</sub> &nbsp; et &nbsp; <b>B</b> = ∂<b>f</b>/∂<b>u</b> |<sub>(<b>x</b>₀,<b>u</b>₀)</sub>')}
<p>La matrice <b>A</b> est la <b>matrice jacobienne</b> de <b>f</b> : le coefficient ligne <i>i</i>, colonne <i>j</i> vaut ∂<i>f<sub>i</sub></i>/∂<i>x<sub>j</sub></i>.</p>
<h3>Exemple du pendule</h3>
<p><i>θ̈</i> = −(<i>g</i>/ℓ) sin <i>θ</i> − (<i>b</i>/<i>m</i>ℓ²) <i>θ̇</i>. Avec <i>x</i>₁ = <i>θ</i>, <i>x</i>₂ = <i>θ̇</i> :</p>
${EQ('<b>A</b> = ' + M([['0', '1'], ['−(g/ℓ)cos θ₀', '−b/(mℓ²)']]))}
<ul>
<li>Équilibre <b>θ₀ = 0</b> (pendule en bas) : cos θ₀ = 1, <b>A</b> = ' + M([['0', '1'], ['−g/ℓ', '−b/(mℓ²)']]) + ' → <b>stable</b> si <i>b</i> &gt; 0.</li>
<li>Équilibre <b>θ₀ = π</b> (pendule en haut) : cos θ₀ = −1, le déterminant de <b>A</b> vaut +<i>g</i>/ℓ &gt; 0… mais la trace est −<i>b</i>/(<i>m</i>ℓ²) : selon l'amortissement, on conclut à une <b>selle</b> (instable) ou à un foyer instable. En pratique, sans frottement, c'est une selle.</li>
</ul>
<h3>Validité</h3>
<p>L'approximation n'est valable que <b>localement</b> : plus on s'éloigne de <b>x</b>₀, plus les termes d'ordre 2 et plus deviennent importants. L'atelier 3 permet de visualiser cet écart entre réponse réelle et réponse linéarisée.</p>
<div class="retain"><b>À retenir.</b> Linéariser = calculer la jacobienne de <b>f</b> au point d'équilibre ; le modèle obtenu ne vaut qu'au voisinage de ce point.</div>` });

COURSE.push({ id: 'bilan', t: 'Bilan et vocabulaire', h: `
<table class="ctable"><thead><tr><th>Notion</th><th>Formule / règle</th></tr></thead><tbody>
<tr><td>Équation d'état</td><td><b>ẋ</b> = <b>A x</b> + <b>B u</b></td></tr>
<tr><td>Équation de sortie</td><td><b>y</b> = <b>C x</b> + <b>D u</b></td></tr>
<tr><td>Fonction de transfert</td><td><i>G</i>(<i>s</i>) = <b>C</b>(<i>s</i><b>I</b> − <b>A</b>)⁻¹<b>B</b> + <b>D</b></td></tr>
<tr><td>Pôles</td><td>racines de det(<i>s</i><b>I</b> − <b>A</b>) = 0, c'est-à-dire valeurs propres de <b>A</b></td></tr>
<tr><td>Ordre</td><td>nombre minimal de variables d'état = nombre d'éléments indépendants stockant de l'énergie</td></tr>
<tr><td>Stabilité</td><td>toutes les valeurs propres de <b>A</b> à partie réelle strictement négative</td></tr>
<tr><td>Linéarisation</td><td><b>A</b> = ∂<b>f</b>/∂<b>x</b> évaluée au point d'équilibre</td></tr>
</tbody></table>
<h3>Vocabulaire</h3>
<dl class="gloss">
<dt>État</dt><dd>Information minimale nécessaire pour prédire l'évolution future.</dd>
<dt>Variable d'état</dt><dd>Composante du vecteur d'état.</dd>
<dt>Espace d'état</dt><dd>Espace vectoriel engendré par les variables d'état.</dd>
<dt>Trajectoire</dt><dd>Courbe décrite par <b>x</b>(<i>t</i>) dans l'espace d'état.</dd>
<dt>Matrice jacobienne</dt><dd>Matrice des dérivées partielles de <b>f</b>, utilisée pour linéariser.</dd>
<dt>Point d'équilibre</dt><dd>Point où <b>f</b>(<b>x</b>₀, <b>u</b>₀) = <b>0</b>.</dd>
<dt>Forme compagne</dt><dd>Écriture canonique des matrices à partir des coefficients de l'équation différentielle.</dd>

</dl>
<div class="retain"><b>À retenir.</b> Représentation d'état = <b>ẋ</b> = <b>A x</b> + <b>B u</b>, <b>y</b> = <b>C x</b> + <b>D u</b> ; les valeurs propres de <b>A</b> contiennent toute l'information sur la dynamique et la stabilité.</div>` });

/* ============================ interface ============================ */
const UI = { cur: 's1' };
const AS = { key: 's1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}) };
const CS = { open: false, id: 'intro' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', {
    type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false',
    'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id)
  }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  if (CS.open) { CS.open = false; renderCourse(); }
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time));
    body.append(h('div', { class: 'goal', html: '<b>Objectif. </b>' + a.goal }));
    body.append(h('ol', { class: 'steps', html: a.steps.map(s => '<li>' + s + '</li>').join('') }));
    body.append(h('details', { class: 'defi' },
      h('summary', null, 'Défi'),
      h('p', { html: '<b>' + a.defi.q + '</b>' }),
      h('p', { html: a.defi.a })));
  } else {
    const s = actState();
    const score = actScore(a);
    body.append(h('div', { class: 'score' }, 'Score : ' + score + ' / ' + nq + (s.checked ? ' ✔' : '')));
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' });
      fs.append(h('legend', { html: 'Q' + (i + 1) + '. ' + q.q }));
      q.o.forEach((opt, j) => {
        const id = 'q' + AS.key + '_' + i + '_' + j;
        const lab = h('label', { class: 'opt', for: id });
        const inp = h('input', { type: 'radio', name: 'q' + AS.key + '_' + i, id: id });
        inp.checked = s.a[i] === j;
        inp.disabled = s.checked;
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        if (s.checked) { if (j === q.a) lab.classList.add('good'); else if (s.a[i] === j) lab.classList.add('bad'); }
        lab.append(inp, h('span', { html: opt }));
        fs.append(lab);
      });
      if (s.checked) fs.append(h('p', { class: 'why', html: '<b>Explication :</b> ' + q.w }));
      body.append(fs);
    });
    const s2 = actState();
    if (!s2.checked) {
      body.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s2.checked = true; actSave(); renderAct(); } }, 'Valider mes réponses'));
    } else {
      body.append(h('button', { class: 'btn', type: 'button', onclick: () => { s2.checked = false; s2.a = {}; actSave(); renderAct(); } }, 'Recommencer'));
    }
  }
  box.append(body);
  if (keep) { const nb = box.querySelector('.pbody'); if (nb) nb.scrollTop = keep; }
}

  const wrap = h('div', { class: 'cwrap' });
  const toc = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire' });
  COURSE.forEach(c => toc.append(h('button', { type: 'button', class: c.id === CS.id ? 'on' : '', onclick: () => { CS.id = c.id; renderCourse(); } }, c.t)));
  const cur = COURSE.find(c => c.id === CS.id) || COURSE[0];
  const idx = COURSE.indexOf(cur);
  const cbody = h('div', { class: 'cbody' });
  cbody.append(h('p', { class: 'ckick' }, 'Cours · chapitre 3 — modélisation dans le domaine temporel'));
  cbody.append(h('h2', null, cur.t));
  cbody.append(h('div', { html: cur.h }));
  const pn = h('div', { class: 'cpn' });
  if (idx > 0) pn.append(h('button', { class: 'btn', type: 'button', onclick: () => { CS.id = COURSE[idx - 1].id; renderCourse(); } }, '◀ ' + COURSE[idx - 1].t));
  else pn.append(h('span'));
  if (idx < COURSE.length - 1) pn.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { CS.id = COURSE[idx + 1].id; renderCourse(); } }, COURSE[idx + 1].t + ' ▶'));
  cbody.append(pn);
  wrap.append(toc, cbody);
  sec.append(wrap);
  cbody.scrollTop = 0;
}

/* aide */
function openHelp() {
  const d = $('#dlg');
  d.hidden = false;
  d.innerHTML = '';
  const box = h('div', { class: 'dlgbox' });
  box.append(h('header', null, h('b', null, 'Aide'), h('button', { class: 'btn sm', type: 'button', onclick: () => { d.hidden = true; } }, 'Fermer')));
  const b = h('div', { class: 'dbody' });
  b.innerHTML =
    '<p>Cette page accompagne le chapitre <b>Modélisation dans le domaine temporel</b> : représentation d\'état et linéarisation.</p>' +
    '<h3>Les quatre ateliers</h3>' +
    '<ul>' +
    '<li><b>Variables d\'état</b> : choisir deux variables indépendantes pour un circuit RLC et lire les matrices.</li>' +
    '<li><b>Des équations aux matrices</b> : passer de <i>m ẍ + b ẋ + k x = F</i> à <b>ẋ</b> = <b>A x</b> + <b>B u</b>.</li>' +
    '<li><b>Linéarisation</b> : tangente à la courbe non linéaire, matrice jacobienne, comparaison des réponses.</li>' +
    '<li><b>Espace d\'état</b> : trajectoires, valeurs propres et stabilité.</li>' +
    '</ul>' +
    '<h3>Boutons</h3>' +
    '<p><b>Activité</b> ouvre le panneau de consignes et de QCM (progression mémorisée dans le navigateur). <b>Cours</b> affiche le cours complet avec sommaire.</p>' +
    '<h3>Conseils</h3>' +
    '<p>Manipulez toujours les curseurs avant de lire les formules : c\'est en faisant varier les paramètres qu\'on comprend le rôle de chaque coefficient.</p>';
  box.append(b);
  d.append(box);
}

/* démarrage */
renderSeg();
mountWs();
renderAct();
renderCourse();
$('#bAct').addEventListener('click', () => { AS.open = !AS.open; renderAct(); });
$('#bCourse').addEventListener('click', () => {
  CS.open = !CS.open;
  $('#bCourse').setAttribute('aria-pressed', CS.open ? 'true' : 'false');
  $('#bCourse').classList.toggle('pri', CS.open);
  renderCourse();
});
$('#bHelp').addEventListener('click', openHelp);
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') $('#dlg').hidden = true; });
</script>
</body>
