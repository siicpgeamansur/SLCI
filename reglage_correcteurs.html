<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-correcteurs-v2' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];


/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmt = (x, d = 2) => { if (!isFinite(x)) return x > 0 ? '∞' : '−∞'; const r = Math.round(x * 10 ** d) / 10 ** d; return String(Object.is(r, -0) ? 0 : r).replace('.', ','); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const PLANT0 = { K0: 1, t1: 1, t2: 0.1 };
const PLANT = Object.assign({}, PLANT0);
const GRID = (() => { const g = [], n = 3000, a = -3, b = 5; for (let i = 0; i <= n; i++) g.push(Math.pow(10, a + (b - a) * i / n)); return g; })();
const dB = m => 20 * Math.log10(Math.max(m, 1e-12));

/* ---------- modèles fréquentiels : système H, correcteur C, boucle ouverte L = C·H ---------- */
function plantFR(w, P) { return [P.K0 / Math.sqrt((1 + w * w * P.t1 * P.t1) * (1 + w * w * P.t2 * P.t2)), -(Math.atan(w * P.t1) + Math.atan(w * P.t2)) * R2D]; }
function ctrlFR(w, c) {
  if (!c || c.type === 'none') return [1, 0];
  if (c.type === 'P') return [c.Kp, 0];
  if (c.type === 'PI') { const x = w * c.Ti; return [c.Kp * Math.sqrt(1 + x * x) / x, Math.atan(x) * R2D - 90]; }
  const x = c.a * c.T * w, y = c.T * w;
  return [c.K * Math.sqrt((1 + x * x) / (1 + y * y)), (Math.atan(x) - Math.atan(y)) * R2D];
}
function loopFR(w, P, c) { const a = plantFR(w, P), b = ctrlFR(w, c); return [a[0] * b[0], a[1] + b[1]]; }
const unitCtrl = type => type === 'P' ? { type: 'P', Kp: 1 } : type === 'PI' ? { type: 'PI', Kp: 1, Ti: 1 } : { type: 'AV', K: 1, a: 1, T: 1 };
const dcGain = (P, c) => { if (c.type === 'PI') return 1; const k = c.type === 'P' ? c.Kp : c.K; const l0 = k * P.K0; return l0 / (1 + l0); };

/* ---------- analyse : pulsation de coupure, marges, bande passante ---------- */
function analyzeFreq(P, c) {
  const G = GRID; let wc = null, M = null;
  let prev = loopFR(G[0], P, c);
  for (let i = 1; i < G.length; i++) {
    const cur = loopFR(G[i], P, c);
    if (prev[0] >= 1 && cur[0] < 1) {
      let lo = G[i - 1], hi = G[i];
      for (let k = 0; k < 50; k++) { const m = Math.sqrt(lo * hi); if (loopFR(m, P, c)[0] >= 1) lo = m; else hi = m; }
      wc = Math.sqrt(lo * hi); M = 180 + loopFR(wc, P, c)[1]; break;
    }
    prev = cur;
  }
  let w180 = null, Mg = Infinity;
  let pp = loopFR(G[0], P, c)[1];
  for (let i = 1; i < G.length; i++) {
    const ph = loopFR(G[i], P, c)[1];
    if (pp > -180 && ph <= -180) {
      let lo = G[i - 1], hi = G[i];
      for (let k = 0; k < 50; k++) { const m = Math.sqrt(lo * hi); if (loopFR(m, P, c)[1] > -180) lo = m; else hi = m; }
      w180 = Math.sqrt(lo * hi); Mg = -dB(loopFR(w180, P, c)[0]); break;
    }

  curves.push({ name: 'C·H (corrigée)', color: '#2e6da4', width: 2.4, fn: w => { const r = loopFR(w, P, c); return [dB(r[0]), r[1]]; } });
  bodeSvg($('#' + px + '-bode'), { curves, marks: A.wc ? { wc: A.wc, phWc: loopFR(A.wc, P, c)[1], M: A.M, w180: A.w180, Mg: A.Mg } : { w180: A.w180, Mg: A.Mg } });
  stepSvg($('#' + px + '-step'), { tmax: A.tmax, curves: [{ name: 'sortie y(t)', color: '#2e6da4', t: A.S.t, y: A.S.y, yf: A.unstable ? null : A.yf }] });
  const b = $('#' + px + '-stats').querySelectorAll('.stat b');
  b[0].textContent = A.wc ? fmt(A.wc, 2) + ' rad/s' : '—';
  b[1].textContent = A.M !== null ? fmt(A.M, 1) + ' °' : '—';
  b[2].textContent = isFinite(A.Mg) ? fmt(A.Mg, 1) + ' dB' : '∞';
  b[3].textContent = A.bp ? fmt(A.bp, 2) + ' rad/s' : '—';
  b[4].textContent = A.unstable ? '—' : fmt(A.D, 1) + ' %';
  b[5].textContent = A.unstable ? '—' : (isFinite(A.tr) ? fmt(A.tr, 3) + ' s' : '> ' + fmt(A.tmax, 1) + ' s');
  b[6].textContent = A.unstable ? '—' : fmt(A.eStat, 2) + ' %';
  const v = verdictFor(A), m = $('#' + px + '-msg'); m.className = 'verdict ' + v[0]; m.innerHTML = v[1];
  return A;
}

/* ================= Atelier 1 : Démarche et cahier des charges ================= */

    '<div class="flow" aria-label="Démarche en six étapes"><span class="bx">1. Cahier des charges</span><span class="ar">→</span><span class="bx">2. Critères fréquentiels</span><span class="ar">→</span><span class="bx">3. Choix du correcteur</span><span class="ar">→</span><span class="bx">4. Calcul des paramètres</span><span class="ar">→</span><span class="bx">5. Vérification</span><span class="ar">→</span><span class="bx">6. Ajustement</span></div>' +

    '<h3>1. Du temporel au fréquentiel</h3><p>Pour un système du second ordre en boucle fermée (pulsation propre ωₙ, amortissement ζ), tout se calcule. Déplacez le curseur : un petit ζ donne un grand dépassement <b>et</b> une petite marge de phase.</p>' +
    '<div id="q1-z"></div>' + statsHtml([['Amortissement ζ', ''], ['Dépassement D', ''], ['Marge de phase Mφ', ''], ['ω₀dB / ωₙ', ''], ['ωBP / ωₙ', ''], ['ωₙ · tr5 %', ''], ['Facteur de résonance Q', '']], 'q1-stats') +

    '<h3>3. Critères du cahier des charges et liens avec la boucle ouverte</h3><div class="dwrap"><table class="dt"><thead><tr><th>Performance</th><th>Critère en boucle fermée</th><th>Lien avec la FTBO</th></tr></thead><tbody>' +

    '<tr><td><b>Précision</b></td><td>Erreur permanente nulle ou limitée (échelon, rampe) ; sensibilité aux perturbations</td><td>Gain statique K<sub>BO</sub> et classe α de la FTBO (en amont de la perturbation)</td></tr>' +
    '<tr><td><b>Rapidité</b></td><td>Temps de réponse à 5 % limité ; temps de montée ; bande passante à −3 dB</td><td>Pulsation de coupure à 0 dB de la FTBO</td></tr></tbody></table></div>' +
    '<div class="analogy"><b>Trois règles pour agir :</b> pour la <b>précision</b>, augmenter le gain statique de la FTBO ; pour la <b>rapidité</b>, choisir une pulsation de coupure à 0 dB plus élevée ; pour la <b>stabilité</b>, corriger la courbe de <b>phase</b> au voisinage de la pulsation de coupure. Ces actions sont localisées en fréquence alors que celle d\'un correcteur est globale : il y a donc des <b>compromis</b>.</div>' +

    const ts = [], ys = []; const tmax = Math.max(8, Math.min(40, tn * 1.4));

    const m = $('#q1-msg'); m.className = 'verdict ' + (zz < 0.4 ? 'warn' : 'yes');
    m.innerHTML = 'Pour ζ = ' + fmt(zz, 2) + ' : Mφ = <b>' + fmt(M, 1) + ' °</b> et D = <b>' + fmt(D, 1) + ' %</b>. Règle pratique : <b>Mφ ≈ 100 · ζ</b> (en degrés) tant que ζ ≤ 0,7.' + (zz >= 0.65 && zz <= 0.75 ? ' C\'est la zone où la réponse est la plus rapide sans dépassement excessif (ωₙ·tr5 % ≈ 3).' : '');
  };
  // tableau Mφ -> ζ
  const zOfM = M => { let lo = 0.05, hi = 1.5; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (so.M(m) < M) lo = m; else hi = m; } return (lo + hi) / 2; };
  $('#q1-tab').innerHTML = '<div class="dwrap"><table class="dt"><thead><tr><th>Marge de phase</th><th>Amortissement ζ</th><th>Dépassement D</th><th>ωₙ · tr5 %</th></tr></thead><tbody>' + [30, 45, 60, 70].map(M => { const zz = zOfM(M); return '<tr><td>' + M + ' °</td><td class="m">' + fmt(zz, 2) + '</td><td class="m">' + fmt(so.D(zz), 1) + ' %</td><td class="m">' + fmt(so.tr5(zz), 1) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  const spec = () => {

  };
  $('#q1-D').value = fmt(S.D, 1).replace(',', '.'); $('#q1-tr').value = String(S.tr);
  $('#q1-D').addEventListener('input', spec); $('#q1-tr').addEventListener('input', spec);

}
WORKSHOPS.push({ id: 'q1', title: 'Démarche', hint: 'Faites le lien entre cahier des charges temporel (dépassement, temps de réponse) et critères fréquentiels (marge de phase, pulsation de coupure).',

/* ================= Atelier 2 : Correcteur proportionnel ================= */
const Q2 = { Kp: 5, Mt: 60 };
function mountQ2(root) {
  root.innerHTML = '<h2>Correcteur proportionnel</h2><p>Le correcteur P multiplie l\'erreur par un gain : <b>C(p) = Kp</b>. Il ne change pas la phase, il ne fait que <b>monter ou descendre la courbe de gain</b>. Régler Kp revient donc à choisir la pulsation où la courbe coupe 0 dB, c\'est-à-dire la marge de phase obtenue.</p>' +
    '<div id="q2-plant"></div><h3>Réglage</h3><div id="q2-sl"></div><div id="q2-sl2"></div><div class="files" style="margin:6px 0"><button class="btn pri" id="q2-apply" type="button">Kp pour la marge de phase visée</button></div><p class="verdict goal" id="q2-calc" aria-live="polite"></p>' +
    '<h3>Autres critères de réglage du cours</h3><div class="opts"><label class="fld"><span>Erreur statique maximale (%)</span><input type="text" id="q2-eps" class="mono" value="2"></label><button class="btn" id="q2-beps" type="button">Kp minimal pour cette erreur</button><label class="fld"><span>Bande passante ωBP visée (rad/s)</span><input type="text" id="q2-bw" class="mono" value="20"></label><button class="btn" id="q2-bbw" type="button">Kp pour cette bande passante</button></div><p class="verdict goal" id="q2-calc2" aria-live="polite">Choisissez un critère : l\'erreur imposée donne un Kp <b>minimal</b> (précision), la bande passante donne un Kp par calcul de ωBP.</p>' + analysisHtml('q2') +
    '<h3>Influence de Kp sur les performances</h3><div id="q2-tab"></div><p class="small">Kp ↗ : la précision et la rapidité (ωBP) augmentent, la stabilité diminue. Pour Kp très grand, le dépassement devient important et le temps de réponse à 5 % finit par augmenter à nouveau.</p>' +
    '<div class="analogy"><b>À retenir :</b> avec un système de classe 0, le correcteur P laisse une erreur statique <b>εs = 1 / (1 + Kp·K₀)</b>. Pour la réduire il faut augmenter Kp, mais cela fait monter ω₀dB et diminuer la marge de phase : P impose un compromis précision / amortissement.</div>';
  const S = Q2;
  const s1 = slider($('#q2-sl'), { name: 'Kp', min: 0.1, max: 200, step: 0.1, dec: 1, get: () => S.Kp, set: v => { S.Kp = v; }, onchange: () => upd() });
  const s2 = slider($('#q2-sl2'), { name: 'Marge de phase visée Mφ', min: 20, max: 85, step: 1, dec: 0, unit: '°', get: () => S.Mt, set: v => { S.Mt = v; }, onchange: () => upd() });
  plantEditor($('#q2-plant'), () => upd());
  const calc = () => {
    const r = designP(PLANT, S.Mt), el = $('#q2-calc');
    if (!r) { el.innerHTML = 'Aucune pulsation ne donne cette marge de phase.'; return null; }
    el.innerHTML = '<b>Démarche :</b> (1) on cherche ω tel que arg H(jω) = −(180 − Mφ) = <b>' + fmt(-(180 - S.Mt), 0) + ' °</b> : ω = <b>' + fmt(r.w, 2) + ' rad/s</b>. (2) À cette pulsation la boucle doit valoir 0 dB : Kp = 1 / |H(jω)| = <b>' + fmt(r.c.Kp, 2) + '</b>. (3) Conséquence : εs = 1 / (1 + Kp K₀) = ' + fmt(100 / (1 + r.c.Kp * PLANT.K0), 1) + ' %.';
    return r;
  };
  const tab = () => {
    const rows = [0.5, 1, 2, 5, 10, 20, 50, 100].map(k => { const A = analyze(PLANT, { type: 'P', Kp: k }); return '<tr><td class="m">' + fmt(k, 1) + '</td><td class="m">' + (A.M !== null ? fmt(A.M, 0) + ' °' : '—') + '</td><td class="m">' + (A.unstable ? 'instable' : fmt(A.D, 0) + ' %') + '</td><td class="m">' + (A.unstable ? '—' : isFinite(A.tr) ? fmt(A.tr, 2) + ' s' : '> ' + fmt(A.tmax, 1) + ' s') + '</td><td class="m">' + fmt(A.eStat, 1) + ' %</td><td class="m">' + (A.bp ? fmt(A.bp, 1) : '—') + '</td></tr>'; }).join('');
    $('#q2-tab').innerHTML = '<div class="dwrap"><table class="dt"><thead><tr><th>Kp</th><th>Mφ</th><th>D</th><th>tr5 %</th><th>εs</th><th>ωBP</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  };
  const upd = () => { calc(); renderAnalysis('q2', { type: 'P', Kp: S.Kp }); tab(); };
  const rd = id => parseFloat($(id).value.replace(',', '.'));
  $('#q2-beps').addEventListener('click', () => {
    const e = rd('#q2-eps'), el = $('#q2-calc2'); if (!(e > 0 && e < 100)) { el.innerHTML = 'Saisissez une erreur entre 0 et 100 %.'; return; }
    const kmin = (100 / e - 1) / PLANT.K0; S.Kp = clamp(kmin, 0.1, 200); s1.sync(); upd();
    const A = analyze(PLANT, { type: 'P', Kp: S.Kp });
    el.innerHTML = '<b>Précision :</b> ε = 1 / (1 + Kp·K₀) ≤ ' + fmt(e, 1) + ' % donne Kp·K₀ ≥ ' + fmt(100 / e - 1, 1) + ', soit <b>Kp ≥ ' + fmt(kmin, 2) + '</b>. Avec ce Kp, la marge de phase vaut ' + (A.M !== null ? fmt(A.M, 1) + ' °' : '—') + (A.M !== null && A.M < 45 ? ' : <b>insuffisante</b>, le correcteur P ne tient pas à la fois la précision et la stabilité.' : '.');
  });
  $('#q2-bbw').addEventListener('click', () => {
    const w = rd('#q2-bw'), el = $('#q2-calc2'); if (!(w > 0)) { el.innerHTML = 'Saisissez une pulsation positive.'; return; }
    const r = designPBW(PLANT, w);
    if (!r) { el.innerHTML = 'Cette bande passante n\'est pas atteignable avec un correcteur P sur ce système (ou exige un Kp supérieur à 1000).'; return; }
    S.Kp = clamp(r, 0.1, 200); s1.sync(); upd();
    el.innerHTML = '<b>Rapidité :</b> la bande passante se mesure sur la <b>boucle fermée</b> : on cherche Kp tel que le gain en boucle fermée ait perdu 3 dB à ωBP = ' + fmt(w, 1) + ' rad/s. Résultat : <b>Kp ≈ ' + fmt(r, 2) + '</b>' + (r > 200 ? ' (hors curseur, plafonné à 200)' : '') + '.';
  });
  $('#q2-apply').addEventListener('click', () => { const r = calc(); if (r) { S.Kp = r.c.Kp; s1.sync(); upd(); } });
  upd();
}
WORKSHOPS.push({ id: 'q2', title: 'Correcteur P', hint: 'Faites varier Kp : la courbe de gain monte ou descend, ω₀dB et la marge de phase changent, mais la phase ne bouge pas.',

/* ================= Atelier 3 : Correcteur PI ================= */
/* État : Kp et Kᵢ. Kᵢ = 0 correspond à un correcteur P pur ; Tᵢ = Kp / Kᵢ. */
const Q3 = { Kp: 9.7, Ki: 0, Mt: 60, method: 'pole', k: 10 };
function mountQ3(root) {
  root.innerHTML = '<h2>Correcteur proportionnel intégral</h2><p>Le correcteur PI s\'écrit <b>C(p) = Kp (1 + Tᵢ p) / (Tᵢ p) = Kp + Kᵢ / p</b> avec Tᵢ = Kp/Kᵢ. Il ajoute un intégrateur : l\'erreur statique devient nulle. En contrepartie il retire de la phase aux basses pulsations (−90° très en dessous de 1/Tᵢ). On règle <b>en trois étapes</b> : d\'abord Kp <b>seul</b> (Kᵢ = 0) pour la marge de phase, puis on <b>ajoute Kᵢ</b> (le correcteur et la boucle corrigée changent sur le Bode), puis on <b>réajuste Kp</b>.</p>' +
    '<div id="q3-plant"></div><h3>1. Choisir la méthode</h3><div id="q3-met"></div><div id="q3-k"></div><div class="verdict goal" id="q3-metx"></div>' +
    '<h3>2. Régler en trois étapes</h3><div id="q3-sl3"></div><div class="files" style="margin:6px 0"><button class="btn" id="q3-b1" type="button"></button><button class="btn" id="q3-b2" type="button"></button><button class="btn" id="q3-b3" type="button"></button><button class="btn" id="q3-ball" type="button">Tout régler (étapes 1, 2, 3)</button></div><p class="small">Un bouton se colore et affiche ✓ lorsque le réglage courant correspond à l\'étape. Étape 1 : Kᵢ = 0, seul le gain de C change. Étape 2 : Kᵢ non nul, la courbe orange (C) et la courbe bleue (C·H) changent. Étape 3 : Kp réajusté pour retrouver la marge visée.</p>' +
    '<h3>Réglage manuel</h3><div id="q3-sl"></div><div id="q3-sl2"></div><div class="verdict" id="q3-calc" aria-live="polite"></div>' + analysisHtml('q3') +
    '<h3>Pourquoi placer 1/Tᵢ une décade sous ω₀dB′ ?</h3><p>Notons k = Tᵢ·ω₀dB′ (k = 10 : une décade ; k = 100 : deux décades). En ω₀dB′, le PI a pour phase <b>−arctan(1/k)</b> et multiplie le gain par <b>√(1 + 1/k²)</b>. Le tableau compare plusieurs choix de k pour le réglage courant (Kp réajusté à chaque fois pour retrouver la marge visée).</p>' +
    '<div id="q3-dec"></div>' +
    '<div class="analogy"><b>Lecture :</b> <b>k trop petit</b> (1 à 2) : l\'intégrateur retire 27 à 45° de marge ; pour la retrouver il faut baisser Kp, donc ω₀dB, donc la réponse ralentit et oscille. <b>k trop grand</b> (≥ 50) : la marge n\'est presque pas touchée (autour de ω₀dB′, le PI se comporte comme un P), mais Kᵢ = Kp/Tᵢ devient minuscule : l\'intégrateur n\'est pas « supprimé », il agit trop lentement, avec une queue lente de constante de temps proche de Tᵢ (colonne « Temps 5 % »). <b>k ≈ 10</b> : on ne perd que arctan(0,1) ≈ 5,7° (d\'où les « 5° » du cours) et l\'erreur résiduelle disparaît en quelques Tᵢ, soit quelques fois le temps de réponse du P seul. C\'est une règle empirique : k = 5 (≈ 11°) est acceptable si on peut sacrifier de la marge pour aller plus vite, k = 20 si la marge est très serrée.</div>' +
    '<div class="analogy"><b>Pourquoi la compensation marche :</b> avec Tᵢ = τ₁, le numérateur (1 + Tᵢ p) du correcteur annule le facteur (1 + τ₁ p) du système. Il reste L(p) = Kp·K₀ / (Tᵢ p (1 + τ₂ p)) : un intégrateur et un seul pôle, donc un second ordre facile à régler par la marge de phase. Cette méthode n\'est possible que si le pôle dominant est réel.</div>';
  const S = Q3, METH = [['pole', 'Compensation du pôle dominant'], ['freq', 'Placement fréquentiel'], ['man', 'Réglage manuel']];
  const TX = {
    pole: '<b>Compensation du pôle dominant.</b> Étape 1 : Kp′ seul pour la marge visée (ω₀dB′). Étape 2 : on ajoute Kᵢ avec Tᵢ = τ₁ (le zéro du PI élimine le pôle dominant). Étape 3 : on réajuste Kp (Tᵢ conservé). Plus rapide, mais exige un pôle dominant réel.',
    freq: '<b>Placement fréquentiel.</b> Étape 1 : Kp′ seul pour la marge visée, ce qui donne ω₀dB′. Étape 2 : on ajoute Kᵢ avec 1/Tᵢ = ω₀dB′/k (k = 10 : une décade plus bas ; choisissez k ci-dessous). Étape 3 : on réajuste Kp, car l\'intégrateur coûte arctan(1/k) de marge (environ 5° pour k = 10).',
    man: '<b>Réglage manuel.</b> Déplacez Kp et Kᵢ : comparez Bode et réponse indicielle. Kᵢ = 0 redonne le correcteur P. Les boutons des étapes restent disponibles avec la méthode « compensation de pôle ».'
  };
  const sl = [slider($('#q3-sl'), { name: 'Kp', min: 0.1, max: 200, step: 0.1, dec: 1, get: () => S.Kp, set: v => { S.Kp = v; }, onchange: () => upd() }),
    slider($('#q3-sl2'), { name: 'Kᵢ (0 = P seul)', min: 0, max: 300, step: 0.1, dec: 2, unit: 's⁻¹', get: () => S.Ki, set: v => { S.Ki = v; }, onchange: () => upd() })];
  slider($('#q3-sl3'), { name: 'Marge de phase visée Mφ', min: 20, max: 85, step: 1, dec: 0, unit: '°', get: () => S.Mt, set: v => { S.Mt = v; }, onchange: () => upd() });
  plantEditor($('#q3-plant'), () => upd());
  const syncAll = () => sl.forEach(x => x.sync());
  const hasI = () => S.Ki > 1e-9;
  const ctrl = () => hasI() ? { type: 'PI', Kp: S.Kp, Ti: S.Kp / S.Ki } : { type: 'P', Kp: S.Kp };
  const p1 = () => designP(PLANT, S.Mt);
  const tiTarget = () => { if (S.method === 'freq') { const r = p1(); return r ? S.k / r.w : null; } return PLANT.t1; };
  const kpFor = Ti => { const r = gainForMargin(PLANT, { type: 'PI', Kp: 1, Ti }, S.Mt); return r ? r.gain : null; };
  const do1 = () => { const r = p1(); if (!r) return false; S.Kp = clamp(r.c.Kp, 0.1, 200); S.Ki = 0; syncAll(); return true; };
  const do2 = () => { const Ti = tiTarget(); if (!Ti) return false; S.Ki = clamp(S.Kp / Ti, 0, 300); syncAll(); return true; };
  const do3 = () => { const Ti = hasI() ? S.Kp / S.Ki : tiTarget(); if (!Ti) return false; const k = kpFor(Ti); if (k === null) return false; S.Kp = clamp(k, 0.1, 200); S.Ki = clamp(S.Kp / Ti, 0, 300); syncAll(); return true; };
  const detail = A => {
    const el = $('#q3-calc'), r = p1(); let t = '';
    if (!r) t = 'Cette marge de phase n\'est pas atteignable avec un P seul : choisissez une valeur plus faible.';
    else {
      t = '<b>Étape 1 (P seul, Kᵢ = 0) :</b> Kp′ = <b>' + fmt(r.c.Kp, 2) + '</b> donne Mφ = ' + S.Mt + ' ° avec ω₀dB′ = <b>' + fmt(r.w, 2) + ' rad/s</b>. Sur le Bode, C est une droite horizontale à 20 log Kp et sa phase reste à 0 ° : seul le gain de la boucle bouge.<br>';
      const Ti = tiTarget(), kp3 = Ti ? kpFor(Ti) : null;
      if (S.method === 'freq') t += '<b>Étape 2 (ajout de Kᵢ) :</b> 1/Tᵢ = ω₀dB′/' + S.k + ', donc Tᵢ = <b>' + fmt(Ti, 2) + ' s</b> et Kᵢ = Kp/Tᵢ = <b>' + fmt(r.c.Kp / Ti, 2) + ' s⁻¹</b> (avec Kp′). L\'intégrateur retire arctan(1/' + S.k + ') = ' + fmt(Math.atan(1 / S.k) * R2D, 1) + ' ° de marge : C et C·H changent sur le Bode.<br>';
      else t += '<b>Étape 2 (ajout de Kᵢ) :</b> Tᵢ = τ₁ = <b>' + fmt(Ti, 2) + ' s</b> : le zéro (1 + Tᵢ p) annule le pôle dominant. Kᵢ = Kp/τ₁ = <b>' + fmt(r.c.Kp / Ti, 2) + ' s⁻¹</b> (avec Kp′). La boucle devient Kp·K₀ / (Tᵢ p (1 + τ₂ p)).<br>';
      t += '<b>Étape 3 (réajuster Kp, Tᵢ conservé) :</b> ' + (kp3 ? 'Kp = <b>' + fmt(kp3, 2) + '</b> et Kᵢ = Kp/Tᵢ = <b>' + fmt(kp3 / Ti, 2) + ' s⁻¹</b> pour retrouver Mφ = ' + S.Mt + ' °.' : 'impossible avec ce Tᵢ : choisissez une marge plus faible.');
    }
    if (hasI()) t += '<br>Valeurs actuelles : Kp = <b>' + fmt(S.Kp, 2) + '</b>, Kᵢ = <b>' + fmt(S.Ki, 2) + '</b> s⁻¹, Tᵢ = Kp/Kᵢ = <b>' + fmt(S.Kp / S.Ki, 2) + ' s</b>' + (A.wc ? ' ; phase perdue par l\'intégrateur en ω₀dB : ' + fmt(Math.atan(1 / ((S.Kp / S.Ki) * A.wc)) * R2D, 1) + ' °.' : '.') + (S.method === 'man' ? (S.Kp / S.Ki > PLANT.t1 * 1.02 ? ' Tᵢ &gt; τ₁ : le pôle dominant n\'est pas compensé, une <b>queue lente</b> apparaît.' : S.Kp / S.Ki < PLANT.t1 * 0.98 ? ' Tᵢ &lt; τ₁ : le zéro du correcteur est plus rapide que le pôle ; le dépassement croît.' : ' Tᵢ ≈ τ₁ : le pôle dominant est compensé.') : '');
    else t += '<br>Valeurs actuelles : Kp = <b>' + fmt(S.Kp, 2) + '</b>, Kᵢ = 0 : correcteur P pur (erreur statique ' + fmt(A.eStat, 1) + ' %).';
    el.innerHTML = t; el.className = 'verdict';
  };
  const refreshBtns = A => {
    const r = p1(), b1 = $('#q3-b1'), b2 = $('#q3-b2'), b3 = $('#q3-b3'), Ti2 = tiTarget();
    const ok1 = !hasI() && !!r && Math.abs(S.Kp - r.c.Kp) <= 0.03 * S.Kp + 0.06;
    const ok2 = hasI() && !!Ti2 && Math.abs(S.Kp / S.Ki - Ti2) <= 0.02 * (S.Kp / S.Ki) + 0.026;
    const ok3 = hasI() && A.M !== null && Math.abs(A.M - S.Mt) <= 0.7;
    b1.textContent = 'Étape 1 : Kp seul (Kᵢ = 0)' + (ok1 ? '  ✓' : '');
    b2.textContent = 'Étape 2 : ajouter Kᵢ (' + (S.method === 'freq' ? '1/Tᵢ = ω₀dB′/' + S.k : 'Tᵢ = τ₁') + ')' + (ok2 ? '  ✓' : '');
    b3.textContent = 'Étape 3 : réajuster Kp pour Mφ = ' + S.Mt + '°' + (ok3 ? '  ✓' : '');
    [[b1, ok1], [b2, ok2], [b3, ok3]].forEach(x => { x[0].classList.toggle('pri', x[1]); x[0].setAttribute('aria-pressed', x[1] ? 'true' : 'false'); });
  };
  const decTable = () => {
    const el = $('#q3-dec'), r = p1();
    if (!r) { el.innerHTML = '<p class="small">Marge visée non atteignable avec un P seul.</p>'; return; }
    const rows = [1, 2, 5, 10, 20, 100].map(k => {
      const Ti = k / r.w, kp = kpFor(Ti), hl = S.method === 'freq' && k === S.k;
      let kpT = '—', kiT = '—', dT = '—', trT = '—';
      if (kp !== null) {
        const A = analyze(PLANT, { type: 'PI', Kp: kp, Ti });
        kpT = fmt(kp, 2); kiT = fmt(kp / Ti, 2);
        dT = A.unstable ? 'instable' : fmt(A.D, 0) + ' %';
        trT = A.unstable ? '—' : (isFinite(A.tr) ? fmt(A.tr, 2) + ' s' : '> ' + fmt(A.tmax, 0) + ' s');
      }
      return '<tr' + (hl ? ' style="background:var(--accent-soft)"' : '') + '><td class="m"><b>' + k + '</b>' + (k === 10 ? ' (décade)' : k === 100 ? ' (2 décades)' : '') + '</td><td class="m">' + fmt(Ti, 2) + ' s</td><td class="m">' + fmt(Math.atan(1 / k) * R2D, 1) + ' °</td><td class="m">' + kpT + '</td><td class="m">' + kiT + '</td><td class="m">' + dT + '</td><td class="m">' + trT + '</td></tr>';
    }).join('');
    el.innerHTML = '<div class="dwrap"><table class="dt"><thead><tr><th>k = Tᵢ·ω₀dB′</th><th>Tᵢ</th><th>Phase perdue en ω₀dB′</th><th>Kp réajusté</th><th>Kᵢ</th><th>D</th><th>Temps 5 %</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="small">ω₀dB′ = ' + fmt(r.w, 2) + ' rad/s (P seul pour Mφ = ' + S.Mt + ' °). Ligne surlignée : valeur de k choisie avec la méthode « placement fréquentiel ».</p>';
  };
  const upd = () => {
    setChips('#q3-met', METH, S.method, id => { S.method = id; upd(); }, 'Méthode de réglage');
    if (S.method === 'freq') setChips('#q3-k', [[2, 'k = 2'], [5, 'k = 5'], [10, 'k = 10 (une décade)'], [20, 'k = 20'], [100, 'k = 100']], S.k, v => { S.k = v; upd(); }, 'Rapport k = Tᵢ·ω₀dB′');
    else $('#q3-k').innerHTML = '';
    $('#q3-metx').innerHTML = TX[S.method];
    const A = renderAnalysis('q3', ctrl());
    detail(A); refreshBtns(A); decTable();
  };
  const msg = t => { $('#q3-calc').innerHTML = t; };
  $('#q3-b1').addEventListener('click', () => { if (S.method === 'man') S.method = 'pole'; if (!do1()) msg('Cette marge de phase n\'est pas atteignable avec un P seul.'); upd(); });
  $('#q3-b2').addEventListener('click', () => { if (S.method === 'man') S.method = 'pole'; if (!do2()) msg('Réglage impossible pour cette marge.'); upd(); });
  $('#q3-b3').addEventListener('click', () => { if (S.method === 'man') S.method = 'pole'; if (!hasI()) { upd(); msg('Ajoutez d\'abord l\'action intégrale (étape 2) : sans Kᵢ, le réglage de Kp est celui de l\'étape 1.'); return; } if (!do3()) { upd(); msg('Aucune pulsation ne donne cette marge avec ce Tᵢ : choisissez un Tᵢ plus grand (k plus grand) ou une marge plus faible.'); return; } upd(); });
  $('#q3-ball').addEventListener('click', () => { if (S.method === 'man') S.method = 'pole'; do1(); do2(); do3(); upd(); });
  upd();
}
WORKSHOPS.push({ id: 'q3', title: 'Correcteur PI', hint: 'Étape 1 : réglez Kp seul (Kᵢ = 0) pour la marge. Étape 2 : ajoutez Kᵢ, le correcteur et la boucle corrigée changent. Étape 3 : réajustez Kp.',

/* ================= Atelier 4 : Avance de phase ================= */
const Q4 = { K: 16, a: 2.7, T: 0.04, wt: 15, Mt: 60, ok: false };
function mountQ4(root) {
  root.innerHTML = '<h2>Correcteur à avance de phase</h2><p>Le correcteur à avance de phase s\'écrit <b>C(p) = K (1 + a T p) / (1 + T p)</b> avec a &gt; 1. Il ajoute de la <b>phase positive</b> autour de la pulsation ωₘ = 1 / (T√a), sans intégrateur. Il permet de <b>monter ω₀dB</b> (réponse plus rapide) tout en gardant une bonne marge de phase.</p>' +
    '<div id="q4-plant"></div><h3>Démarche pas à pas</h3><div class="opts"></div><div id="q4-t"></div><p class="verdict goal" id="q4-calc" aria-live="polite"></p><div class="files" style="margin:6px 0"><button class="btn pri" id="q4-apply" type="button">Appliquer ce réglage</button></div>' +
    '<h3>Réglage manuel</h3><div id="q4-sl"></div><p class="verdict" id="q4-facts"></p>' + analysisHtml('q4') +
    '<div class="analogy"><b>Limites :</b> le gain en hautes pulsations vaut K·a : une grande avance amplifie les bruits. On limite en pratique a à 10 environ (avance de 55° au plus par cellule). Le correcteur à avance de phase ne corrige pas l\'erreur statique : pour la supprimer, on lui associe un intégrateur.</div>';
  const S = Q4;
  const sl = [];
  const calc = () => designAV(PLANT, S.wt, S.Mt);
  const fill = () => {
    const d = calc(), el = $('#q4-calc');
    let t = '<b>1.</b> À ω₀dB visée = ' + fmt(S.wt, 1) + ' rad/s : |H| = ' + fmt(d.mh, 4) + ' et arg H = ' + fmt(d.ph, 1) + ' °, donc sans correcteur Mφ = 180° + arg H = <b>' + fmt(d.M0, 1) + ' °</b>.<br><b>2.</b> Avance nécessaire : φ = Mφ visée − Mφ actuelle + 5° de sécurité = <b>' + fmt(d.need, 1) + ' °</b>.<br>';
    if (d.need <= 0) t += '<b>3.</b> Aucune avance n\'est nécessaire (a = 1) : il suffit d\'ajuster le gain K = 1 / |H| = ' + fmt(d.c.K, 2) + '.';
    else t += '<b>3.</b> a = (1 + sin φ) / (1 − sin φ) = <b>' + fmt(d.c.a, 2) + '</b>.<br><b>4.</b> On place le maximum de phase en ω₀dB : T = 1 / (ω₀dB √a) = <b>' + fmt(d.c.T, 4) + ' s</b>.<br><b>5.</b> En ωₘ le correcteur apporte un gain K√a : pour que L vaille 0 dB, K = 1 / (√a |H|) = <b>' + fmt(d.c.K, 2) + '</b>.';
    if (d.warn) t += '<br><b>Attention :</b> ' + d.warn;
    el.innerHTML = t; return d;
  };
  const upd = () => {
    fill();
    const A = renderAnalysis('q4', { type: 'AV', K: S.K, a: S.a, T: S.T });
    const phim = Math.asin((S.a - 1) / (S.a + 1)) * R2D, wm = 1 / (S.T * Math.sqrt(S.a));
    const f = $('#q4-facts'); f.className = 'verdict';
    const bf = ' <br>Forme équivalente C = Kp (1 + T<sub>d</sub> p) / (1 + b T<sub>d</sub> p) : b = 1/a = <b>' + fmt(1 / S.a, 3) + '</b>, T<sub>d</sub> = aT = <b>' + fmt(S.a * S.T, 3) + ' s</b>, Kp = K. Avec cette forme : b = (1 − sin φ)/(1 + sin φ) et K = √b quand |H(ω₀dB)| = 1.';
    f.innerHTML = 'φmax = arcsin((a − 1) / (a + 1)) = <b>' + fmt(phim, 1) + ' °</b> à ωₘ = 1 / (T√a) = <b>' + fmt(wm, 2) + ' rad/s</b>, où le gain du correcteur vaut K√a = <b>' + fmt(dB(S.K * Math.sqrt(S.a)), 1) + ' dB</b>.' + (A.wc ? ' Écart entre ωₘ et ω₀dB : ' + fmt(Math.abs(Math.log10(wm / A.wc)) * 100 / 1, 0) + ' % d\'une décade.' : '') + bf;
  };
  const apply = () => { const d = calc(); Object.assign(S, { K: d.c.K, a: d.c.a, T: d.c.T }); sl.forEach(x => x.sync()); upd(); };
  plantEditor($('#q4-plant'), () => { upd(); });
  const host = $('#q4-t');
  slider(host, { name: 'ω₀dB visée', min: 1, max: 100, step: 1, dec: 0, unit: 'rad/s', get: () => S.wt, set: v => { S.wt = v; }, onchange: () => fill() });
  slider(host, { name: 'Marge de phase visée Mφ', min: 20, max: 85, step: 1, dec: 0, unit: '°', get: () => S.Mt, set: v => { S.Mt = v; }, onchange: () => fill() });
  const mh = $('#q4-sl');
  sl.push(slider(mh, { name: 'K', min: 0.5, max: 300, step: 0.5, dec: 1, get: () => S.K, set: v => { S.K = v; }, onchange: () => upd() }));
  sl.push(slider(mh, { name: 'a', min: 1, max: 20, step: 0.1, dec: 1, get: () => S.a, set: v => { S.a = v; }, onchange: () => upd() }));
  sl.push(slider(mh, { name: 'T', min: 0.002, max: 1, step: 0.002, dec: 3, unit: 's', get: () => S.T, set: v => { S.T = v; }, onchange: () => upd() }));
  $('#q4-apply').addEventListener('click', apply);
  if (!S.ok) { const d = calc(); Object.assign(S, { K: d.c.K, a: d.c.a, T: d.c.T, ok: true }); sl.forEach(x => x.sync()); }
  upd();
}
WORKSHOPS.push({ id: 'q4', title: 'Avance de phase', hint: 'Appliquez la démarche (ω₀dB visée, marge visée, a, T, K), puis comparez avec un réglage manuel de K, a et T.',

/* ================= Atelier 5 : Mise en œuvre et comparaison ================= */
const Q5 = { Mt: 60, wt: 15, D: 20, tr: 0.5, es: 5 };
function mountQ5(root) {
  root.innerHTML = '<h2>Mettre en œuvre la démarche : P, PI ou avance de phase ?</h2><p>Le même système, le même cahier des charges, trois correcteurs réglés avec la démarche des ateliers précédents. À vous de choisir celui qui convient, ou de justifier pourquoi aucun ne suffit seul.</p>' +
    '<div id="q5-plant"></div><h3>Cahier des charges</h3><div class="opts"><label class="fld"><span>Dépassement max D (%)</span><input type="text" id="q5-D" class="mono"></label><label class="fld"><span>Temps de réponse à 5 % max (s)</span><input type="text" id="q5-tr" class="mono"></label><label class="fld"><span>Erreur statique max (%)</span><input type="text" id="q5-es" class="mono"></label></div>' +
    '<h3>Choix des critères de réglage</h3><div id="q5-sl"></div><p class="small">La marge de phase visée règle P, PI et avance de phase. La pulsation ω₀dB visée ne concerne que l\'avance de phase (pour P et PI, ω₀dB est une conséquence du réglage).</p>' +
    '<h3>Résultats</h3><div id="q5-tab"></div><p class="verdict" id="q5-msg" aria-live="polite"></p>' +
    '<h3>Boucles ouvertes</h3><svg id="q5-bode" viewBox="0 0 640 400" style="width:100%;max-width:680px;height:auto"></svg><h3>Réponses indicielles</h3><svg id="q5-step" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg>' +
    '<div class="dwrap"><table class="dt"><thead><tr><th>Correcteur</th><th>Ce qu\'il apporte</th><th>Ce qu\'il coûte</th></tr></thead><tbody><tr><td>P</td><td>Simplicité, réglage direct par la marge</td><td>Erreur statique non nulle, compromis précision / amortissement</td></tr><tr><td>PI (Tᵢ = τ₁)</td><td>Erreur statique nulle, second ordre simple</td><td>Rapidité limitée par la marge visée</td></tr><tr><td>Avance de phase</td><td>Réponse plus rapide à marge égale</td><td>Pas d\'intégrateur, amplification des bruits</td></tr></tbody></table></div>';
  const S = Q5;
  const sl = [];
  const rd = id => parseFloat($(id).value.replace(',', '.'));
  const upd = () => {
    const D = rd('#q5-D'), tr = rd('#q5-tr'), es = rd('#q5-es');
    if (isFinite(D)) S.D = D; if (isFinite(tr)) S.tr = tr; if (isFinite(es)) S.es = es;
    const P = PLANT;
    const dP = designP(P, S.Mt), dPI = designPI(P, S.Mt), dAV = designAV(P, S.wt, S.Mt);
    const ctrls = [{ name: 'P', color: '#2e6da4', c: dP ? dP.c : { type: 'P', Kp: 1 }, txt: dP ? 'Kp = ' + fmt(dP.c.Kp, 2) : 'impossible' },
      { name: 'PI', color: '#1e7a2e', c: dPI.c, txt: 'Kp = ' + fmt(dPI.c.Kp, 2) + ', Tᵢ = ' + fmt(dPI.c.Ti, 2) + ' s' },
      { name: 'Avance de phase', color: '#e08a00', c: dAV.c, txt: 'K = ' + fmt(dAV.c.K, 2) + ', a = ' + fmt(dAV.c.a, 2) + ', T = ' + fmt(dAV.c.T, 4) + ' s' }];
    const As = ctrls.map(x => analyze(P, x.c)), tmax = Math.max(...As.map(a => a.tmax));
    const A2 = ctrls.map((x, i) => analyze(P, x.c, tmax));
    const ok = (v, lim) => v <= lim + 1e-9;
    let rows = '', good = [];
    ctrls.forEach((x, i) => {
      const A = A2[i], okD = !A.unstable && ok(A.D, S.D), okT = !A.unstable && ok(A.tr, S.tr), okE = !A.unstable && ok(Math.abs(A.eStat), S.es);
      const cell = (txt, k) => '<td class="m" style="' + (k ? 'background:rgba(30,122,46,.13)' : 'background:rgba(192,40,31,.12)') + '">' + txt + (k ? ' ✓' : ' ✗') + '</td>';
      rows += '<tr><td><b style="color:' + x.color + '">' + x.name + '</b><br><span class="small">' + x.txt + '</span></td><td class="m">' + (A.wc ? fmt(A.wc, 2) : '—') + '</td><td class="m">' + (A.M !== null ? fmt(A.M, 1) + ' °' : '—') + '</td>' + cell(fmt(A.D, 1) + ' %', okD) + cell(isFinite(A.tr) ? fmt(A.tr, 3) + ' s' : '> ' + fmt(tmax, 1) + ' s', okT) + cell(fmt(A.eStat, 2) + ' %', okE) + '</tr>';
      if (okD && okT && okE) good.push(x.name);
    });
    $('#q5-tab').innerHTML = '<div class="dwrap"><table class="dt"><thead><tr><th>Correcteur</th><th>ω₀dB (rad/s)</th><th>Mφ</th><th>Dépassement (≤ ' + fmt(S.D, 1) + ' %)</th><th>Temps 5 % (≤ ' + fmt(S.tr, 2) + ' s)</th><th>Erreur statique (≤ ' + fmt(S.es, 1) + ' %)</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    const m = $('#q5-msg');
    if (good.length) { m.className = 'verdict yes'; m.innerHTML = '<b>Cahier des charges respecté par : ' + good.join(', ') + '.</b> Choisissez le plus simple qui convient, puis vérifiez la robustesse (marges de gain et de phase).'; }
    else { m.className = 'verdict warn'; m.innerHTML = '<b>Aucun correcteur ne respecte tout le cahier des charges.</b> ' + (A2[1].tr > S.tr && A2[2].eStat > S.es ? 'Le PI est précis mais trop lent, l\'avance de phase est rapide mais laisse une erreur statique : il faut les associer (PI + avance de phase) ou relâcher une exigence.' : 'Modifiez la marge visée, la pulsation visée ou le cahier des charges.') + (dAV.warn ? '<br>' + dAV.warn : ''); }
    bodeSvg($('#q5-bode'), { curves: ctrls.map((x, i) => ({ name: 'C·H avec ' + x.name, color: x.color, fn: w => { const r = loopFR(w, P, x.c); return [dB(r[0]), r[1]]; } })) });
    stepSvg($('#q5-step'), { tmax, curves: ctrls.map((x, i) => ({ name: x.name, color: x.color, t: A2[i].S.t, y: A2[i].S.y })) });
  };

  slider($('#q5-sl'), { name: 'ω₀dB visée (avance)', min: 1, max: 100, step: 1, dec: 0, unit: 'rad/s', get: () => S.wt, set: v => { S.wt = v; }, onchange: upd });

  s += '<rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - B - T) + '" fill="none" stroke="#55555f"/>';
  if (o.vline !== undefined) s += '<line x1="' + X(o.vline) + '" y1="' + T + '" x2="' + X(o.vline) + '" y2="' + (H - B) + '" stroke="#7b4fc2" stroke-dasharray="4 3"/><text x="' + (X(o.vline) + 4) + '" y="' + (T + 11) + '" font-size="10.5" fill="#7b4fc2">perturbation</text>';

  o.curves.forEach((c, i) => { const x = W - R - 150, y = T + 14 + i * 14; if (c.name) s += '<line x1="' + x + '" y1="' + y + '" x2="' + (x + 16) + '" y2="' + y + '" stroke="' + c.color + '" stroke-width="2"' + (c.dash ? ' stroke-dasharray="' + c.dash + '"' : '') + '/><text x="' + (x + 21) + '" y="' + (y + 3.5) + '" font-size="10.5" fill="#1f1f28">' + c.name + '</text>'; });
  svg.innerHTML = s;
}

  const place = ev => {

  const t5of = (a, b) => { let lo = 0, hi = 80 / Math.min(a, b); for (let i = 0; i < 70; i++) { const m = (lo + hi) / 2; if (y2(a, b, m) < 0.95) lo = m; else hi = m; } return hi; };
  const dsl = [slider($('#qp-dsl'), { name: 'Pôle 1 : p₁ = −a', min: 0.2, max: 5, step: 0.1, dec: 1, unit: 'rad/s', get: () => S.a, set: v => { S.a = v; }, onchange: () => ud() }),
    slider($('#qp-dsl'), { name: 'Pôle 2 : p₂ = −b', min: 0.5, max: 50, step: 0.5, dec: 1, unit: 'rad/s', get: () => S.b, set: v => { S.b = v; }, onchange: () => ud() })];
  const dsync = () => dsl.forEach(x => x.sync());
  const ud = () => {
    const dom = Math.min(S.a, S.b), fast = Math.max(S.a, S.b), r = fast / dom;
    setChips('#qp-dchips', [[1, 'rapport 1'], [2, 'rapport 2'], [5, 'rapport 5'], [10, 'rapport 10'], [20, 'rapport 20']], [1, 2, 5, 10, 20].find(q => Math.abs(r / q - 1) < 0.04) || null, q => {

    }, 'Rapport entre les pôles');

    const t5c = t5of(S.a, S.b), t5a = Math.log(20) / dom, ecart = (t5c - t5a) / t5c * 100, tm = 1.5 * t5c, n = 400, t = [], yc = [], ya = [], m1 = [], m2 = [];

const COURSE = [];
COURSE.push({ id: 'demarche', t: 'Performances et démarche générale', h: `
<p>Un système asservi doit satisfaire plusieurs exigences, <b>non indépendantes</b> : un comportement suffisamment <b>stable</b> (notion de marges), un régime transitoire <b>court</b> et <b>bien amorti</b>, une bonne <b>précision</b> en régime permanent, et une faible sensibilité aux <b>perturbations</b>.</p>
<p>Un asservissement compare la sortie à la consigne ; le <b>correcteur</b> C(p), placé en <b>série</b> après le comparateur, élabore la commande à partir de l'image de l'erreur. La boucle ouverte est <b>L(p) = C(p)·H(p)</b>.</p>
<table class="ctable"><thead><tr><th>Performance</th><th>Critères en boucle fermée</th><th>Liens avec la FTBO</th></tr></thead><tbody>
<tr><td>Stabilité</td><td>Premier dépassement D₁ % = 10 à 20 % maxi ; facteur de résonance Q ≤ 2,3 dB (Q ≈ 1,3)</td><td>Marges imposées : Mg ≥ 12 dB et Mφ ≥ 45°</td></tr>
<tr><td>Précision</td><td>Erreur permanente nulle ou limitée (échelon, rampe) ; sensibilité aux perturbations</td><td>Gain statique K<sub>BO</sub> et classe α de la FTBO (en amont de la perturbation)</td></tr>
<tr><td>Rapidité</td><td>Temps de réponse à 5 %, temps de montée, bande passante à −3 dB</td><td>Pulsation de coupure à 0 dB de la FTBO</td></tr></tbody></table>
<p>Le facteur de résonance est Q = |H(jω<sub>r</sub>)| / |H(jω→0)|, avec ω<sub>r</sub> la pulsation de résonance.</p>
<h3>Ce que peut (et ne peut pas) un correcteur</h3>
<ul><li>Il est peu coûteux (faible niveau d'énergie) et facile à modifier ; il est influent car il agit directement sur la commande.</li>
<li>Il ne compense jamais un défaut majeur de conception de la chaîne d'action (retard rendant le système instable, actionneur sous-dimensionné et saturé, frottement sec…).</li></ul>
<div class="analogy"><b>Trois règles sur le diagramme de Bode de la FTBO.</b> Pour la <b>précision</b> : augmenter le gain statique. Pour la <b>rapidité</b> : choisir une pulsation de coupure à 0 dB plus élevée. Pour la <b>stabilité</b> : corriger la courbe de phase au voisinage de ω₀dB. Mais l'action d'un correcteur est <b>globale</b> : elle agit sur tout le spectre, d'où des compromis.</div>
<h3>Les six étapes du réglage</h3>
<ol><li><b>Cahier des charges</b> (stabilité, rapidité, précision).</li><li><b>Critères fréquentiels</b> : D → Mφ ; temps de réponse → ω₀dB ; erreur → classe et gain.</li><li><b>Choix du correcteur</b> (P, PI, avance de phase).</li><li><b>Calcul des paramètres</b> à partir du Bode de H.</li><li><b>Vérification</b> (marges, réponse indicielle, erreur).</li><li><b>Ajustement</b>.</li></ol>
<h3>Définitions fréquentielles</h3>
<table class="ctable"><thead><tr><th>Grandeur</th><th>Définition</th></tr></thead><tbody>
<tr><td>Pulsation de coupure ω₀dB</td><td>|L(jω₀dB)| = 1 (0 dB)</td></tr>
<tr><td>Marge de phase Mφ</td><td>Mφ = 180° + arg L(jω₀dB)</td></tr>
<tr><td>Marge de gain Mg</td><td>Mg = −20 log |L(jω₋₁₈₀)| où arg L(jω₋₁₈₀) = −180°</td></tr>
<tr><td>Bande passante ω<sub>−3dB</sub></td><td>à −3 dB de la boucle <b>fermée</b> (gain atténué de 30 % : 0,7 × valeur de référence)</td></tr></tbody></table>` });
COURSE.push({ id: 'criteres', t: 'Critères temporels et fréquentiels', h: `
<p>Pour un système du second ordre en boucle fermée (gain statique 1, amortissement ζ, pulsation propre ωₙ) :</p>
<ul><li>Dépassement : <b>D = 100 · exp(−πζ / √(1 − ζ²))</b> (en %).</li>
<li>Marge de phase : <b>Mφ ≈ 100·ζ</b> (en °), valable pour ζ ≤ 0,7.</li>
<li>Pulsation de coupure de la boucle ouverte : ω₀dB/ωₙ = √(√(1 + 4ζ⁴) − 2ζ²) (≈ 0,7 pour ζ ≈ 0,7).</li>
<li>Temps de réponse à 5 % : <b>ωₙ · tr5 % ≈ 3</b> pour ζ ≈ 0,7 (plus grand si ζ est petit ou grand).</li>
<li>Facteur de résonance : Q = 1/(2ζ√(1 − ζ²)) pour ζ &lt; 0,707.</li>
<li>Bande passante : ωBP est de l'ordre de 1,2 à 1,5 fois ω₀dB.</li></ul>
<table class="ctable"><thead><tr><th>Mφ</th><th>ζ</th><th>D</th></tr></thead><tbody><tr><td>30°</td><td>0,29</td><td>38 %</td></tr><tr><td>45°</td><td>0,42</td><td>23 %</td></tr><tr><td>60°</td><td>0,60</td><td>9,5 %</td></tr></tbody></table>
<h3>Précision (rappel)</h3>
<ul><li>Échelon E₀/p : e<sub>r</sub>(∞) = E₀ / (1 + K<sub>BO</sub>) en classe 0, nulle en classe ≥ 1.</li><li>Rampe V₀/p² : e<sub>r</sub>(∞) = V₀ / K<sub>BO</sub> en classe 1.</li><li>Pour une perturbation, l'erreur est inversement proportionnelle au gain statique K₁ de la FTBO <b>en amont</b> de la perturbation.</li></ul>` });
COURSE.push({ id: 'physique', t: 'Actions des correcteurs : approche physique', h: `
<p>Prenons un moteur linéaire asservi (position ou vitesse) : bonne stabilité, excellente précision et bonne rapidité sont exigées. Chaque défaut a sa correction.</p>
<h3>Problème de rapidité : action proportionnelle</h3>
<p>Le système converge trop lentement : on « fait croire » au moteur que l'erreur est <b>Kp fois plus grande</b> que l'erreur réelle (u = Kp·ε). La réponse est beaucoup plus rapide, mais la commande s'annule dès que l'erreur est nulle : elle n'apporte plus d'énergie.</p>
<h3>Problème de précision : action intégrale</h3>
<p>Un système qui a besoin d'énergie pour maintenir sa sortie (asservissement de vitesse) ne peut pas être précis avec un P seul. On commande en fonction du <b>cumul des erreurs</b> : <b>u(t) = Kᵢ∫ε dt</b>, soit U(p) = (Kᵢ/p)·ε(p). La commande augmente tant qu'une erreur subsiste : le système devient précis. Inconvénients : temps de réponse allongé, dépassement (stabilité dégradée). On l'associe donc à un P : <b>au début l'action proportionnelle agit, puis l'action intégrale prend le relais</b> et fournit l'énergie permanente.</p>
<h3>Problème de stabilité : action dérivée</h3>
<p>Un système de grande inertie dépasse la consigne puis oscille. On <b>anticipe</b> : on diminue la commande quand l'erreur diminue vite, avec <b>u(t) = K<sub>d</sub> dε/dt</b>, U(p) = K<sub>d</sub> p ε(p). C'est un frein artificiel (comme un frottement visqueux). L'action dérivée agit en deux temps : à t = 0⁺ une commande forte (mise en mouvement plus brutale), puis un freinage quand le système prend de la vitesse.</p>
<div class="analogy"><b>Jamais de dérivée pure :</b> avec une consigne constante et une sortie convergée vers une valeur quelconque, l'erreur est constante et sa dérivée nulle : le système ne voit plus la distance à la consigne, la précision est dégradée. Elle se combine à un P (PD). La saturation de l'actionneur limite en réalité la commande à t = 0⁺ : le gain porte surtout sur la limitation des oscillations, peu sur le temps de montée.</div>
<h3>Premiers constats</h3>
<ul><li>P : commande proportionnelle à l'erreur ; I : proportionnelle au cumul des erreurs ; D : proportionnelle aux variations de l'erreur.</li><li>Associer les actions combine leurs effets, mais la mise en œuvre est plus complexe (paramètres interdépendants).</li><li>Au programme de CPGE : P, PI et avance de phase (version réaliste de la dérivée).</li></ul>` });
COURSE.push({ id: 'proportionnel', t: 'Correcteur proportionnel', h: `
<p><b>C(p) = Kp.</b> Un gain pur : il <b>ne modifie pas la phase</b> mais modifie, pour toutes les pulsations, le gain de la FTBO de <b>20 log Kp</b> : G<sub>dB,c</sub>(ω) = 20 log Kp + G<sub>dB,nc</sub>(ω) ; φ<sub>c</sub> = φ<sub>nc</sub>.</p>

<table class="ctable"><thead><tr><th></th><th>Stabilité</th><th>Précision</th><th>Rapidité</th></tr></thead><tbody>

<p>Précision : e<sub>r</sub>(∞) = E₀/(1 + K<sub>BO</sub>) pour un échelon ; V₀/K<sub>BO</sub> pour une rampe (classe 1).</p>
<h3>Réglage</h3>
<table class="ctable"><thead><tr><th>Critère imposé</th><th>Démarche</th></tr></thead><tbody>
<tr><td>Marges de stabilité</td><td><b>Approché (graphique)</b> : tracer le Bode de H, lire la translation verticale Δ<sub>dB</sub> qui donne la marge voulue, puis Kp ≈ 10<sup>Δ<sub>dB</sub>/20</sup>.<br><b>Précis (analytique)</b> : chercher ω₀dB tel que Mφ = marge imposée, puis Kp tel que |H<sub>c</sub>(jω₀dB)| = 1 ; ou chercher ω₋₁₈₀ (arg H = −180°) puis Kp tel que Mg = marge imposée.</td></tr>

<div class="analogy"><b>Limite :</b> un seul paramètre ne permet pas de régler indépendamment précision, rapidité et stabilité : la précision pousse Kp vers le haut, la stabilité le limite.</div>` });

<p><b>C(p) = Kᵢ/p = 1/(Tᵢ p).</b> Il augmente le gain de la FTBO aux basses pulsations, le diminue aux hautes, et apporte un <b>déphasage de −90° pour toutes les pulsations</b> :</p>

<tr><td>Précision</td><td>↗↗ annule l'erreur face à un échelon de consigne et, placé en amont, face à une perturbation en échelon</td></tr>
<tr><td>Stabilité</td><td>↘↘ phase diminuée de 90° partout : marges fortement réduites</td></tr>
<tr><td>Rapidité</td><td>légèrement ↗ ou ↘ selon Kᵢ (Kᵢ &gt; ω₀dB,nc : légèrement plus rapide)</td></tr></tbody></table>
<p>À cause de son effet néfaste sur la stabilité, il est très peu utilisé seul : on l'associe à une action proportionnelle.</p>` });
COURSE.push({ id: 'pi', t: 'Correcteur PI : deux méthodes de réglage', h: `
<p><b>C(p) = Kp + Kᵢ/p = Kp (1 + Tᵢ p)/(Tᵢ p)</b> avec <b>Tᵢ = Kp/Kᵢ</b> (attention : certains sujets écrivent C = Kp + 1/(Tᵢ p)). Intégral pur aux basses pulsations, proportionnel aux hautes ; cassure à ω = 1/Tᵢ, phase de −90° à 0°.</p>
<p>Avantages : l'augmentation de la <b>classe</b> améliore la précision ; au-delà de 1/Tᵢ la phase n'est plus diminuée, donc la stabilité est peu dégradée <b>si</b> la cassure est bien choisie. Plus 1/Tᵢ est faible, plus Kᵢ est faible et plus le système est lent : c'est un compromis stabilité / rapidité tout en garantissant la précision.</p>
<h3>Méthode 1 : par marge de phase imposée (placement fréquentiel)</h3>
<ol><li><b>Kp' (P seul, Kᵢ = 0)</b> : on règle Kp' pour la marge de phase imposée (graphiquement par translation Δ<sub>dB</sub>, ou analytiquement : ω₀dB' tel que Mφ = marge, puis |H<sub>c</sub>'(jω₀dB')| = 1).</li>
<li><b>Tᵢ</b> : on place l'effet intégral loin de ω₀dB' : 1/Tᵢ ≪ ω₀dB', en général une décade : <b>1/Tᵢ = ω₀dB'/10</b>.</li>
<li><b>Ajustement de Kp</b> : la cassure à une décade coûte environ <b>5° de marge</b>. Variante analytique : garder Tᵢ et recalculer Kp pour retrouver la marge ; variante graphique : viser dès l'étape 1 la marge souhaitée + 5°.</li></ol>
<h3>Pourquoi une décade (et pas deux, ni 1 ou 2) ?</h3>
<p>Posons k = Tᵢ·ω₀dB'. En ω₀dB', le PI a pour phase <b>−arctan(1/k)</b> et multiplie le gain par <b>√(1 + 1/k²)</b>.</p>
<table class="ctable"><thead><tr><th>k</th><th>1</th><th>2</th><th>5</th><th>10</th><th>20</th><th>100</th></tr></thead><tbody><tr><td>Phase perdue</td><td>45°</td><td>26,6°</td><td>11,3°</td><td>5,7°</td><td>2,9°</td><td>0,6°</td></tr><tr><td>Gain ajouté</td><td>3 dB</td><td>0,97 dB</td><td>0,17 dB</td><td>0,04 dB</td><td>0,01 dB</td><td>≈ 0</td></tr></tbody></table>
<ul><li><b>k trop petit</b> : l'intégrateur consomme beaucoup de marge ; pour la retrouver, il faut baisser Kp, donc ω₀dB : réponse plus lente et plus oscillante.</li>
<li><b>k trop grand</b> : la marge n'est presque pas touchée (autour de ω₀dB', le PI ressemble à un P), mais Kᵢ = Kp/Tᵢ devient minuscule. L'intégrateur agit encore, mais trop lentement : la queue lente a une constante de temps voisine de Tᵢ (pôle lent ≈ −Kp·K₀ / (Tᵢ(1 + Kp·K₀))). Sur la durée d'un essai, on a un P avec une erreur statique qui ne s'annule pas.</li>
<li><b>k ≈ 10</b> : coût de phase modeste (≈ 5,7°, d'où les « 5° » du cours) et erreur résiduelle éliminée en quelques Tᵢ, soit quelques fois le temps de réponse du P seul.</li></ul>
<p>C'est une règle empirique, pas un théorème : k = 5 convient si on peut céder davantage de marge pour aller plus vite, k = 20 si la marge est très serrée.</p>
<h3>Méthode 2 : compensation du pôle dominant réel</h3>
<p>Si H<sub>nc</sub>(p) = G(p)/(1 + τp) avec un <b>pôle dominant réel</b> −1/τ, on choisit <b>Tᵢ = τ</b> :</p>
<p>H<sub>c</sub>(p) = G(p)·(1/(1 + τp))·Kp(1 + Tᵢp)/(Tᵢp) = G(p)·Kp/(Tᵢ p).</p>
<p>On limite ainsi la dégradation de stabilité due à l'intégrateur et on impacte peu la rapidité (ω₀dB repoussée vers les hautes pulsations). Puis on règle Kp pour la marge de phase imposée (translation Δ<sub>dB</sub> ≈ 20 log Kp, ou analytiquement).</p>
<p>Pour H = K₀/((1 + τ₁p)(1 + τ₂p)) : L = Kp·K₀/(τ₁p(1 + τ₂p)), Mφ = 90° − arctan(ω₀dB τ₂), donc <b>ω₀dB = 1/(τ₂ tan Mφ)</b> et <b>Kp = τ₁ ω₀dB √(1 + ω₀dB²τ₂²)/K₀</b>.</p>
<div class="analogy"><b>Attention :</b> la méthode 2 est plus rapide à mettre en œuvre, mais n'est possible que si le pôle dominant est réel. Aux concours, suivez la démarche proposée par le sujet.</div>` });
COURSE.push({ id: 'avance', t: 'Correcteur à avance de phase', h: `
<p>Pour augmenter la phase (donc la marge), on pense aux correcteurs dérivés C = K<sub>d</sub>p ou Kp + K<sub>d</sub>p. Mais leur gain croît indéfiniment avec ω : amplification inacceptable des bruits parasites. On limite donc le gain à partir d'une pulsation : c'est l'<b>avance de phase</b>.</p>
<p><b>C(p) = Kp (1 + a T<sub>d</sub> p)/(1 + T<sub>d</sub> p)</b> avec <b>a &gt; 1</b>. Il augmente la phase dans une bande de fréquences, avec un maximum :</p>
<p><b>φ<sub>m</sub> = arcsin((a − 1)/(a + 1))</b> en <b>ω<sub>m</sub> = 1/(T<sub>d</sub>√a)</b> (milieu, en échelle logarithmique, de 1/(aT<sub>d</sub>) et 1/T<sub>d</sub>). Gain : 0 dB (à Kp = 1) à basse fréquence, 20 log a à haute fréquence, 10 log a en ω<sub>m</sub>.</p>
<table class="ctable"><thead><tr><th>a</th><th>2</th><th>4</th><th>10</th><th>20</th></tr></thead><tbody><tr><td>φ<sub>m</sub></td><td>19,5°</td><td>37°</td><td>55°</td><td>65°</td></tr></tbody></table>
<h3>Influence</h3><ul><li>Stabilité : ↗↗ (phase augmentée entre 1/(aT<sub>d</sub>) et 1/T<sub>d</sub>).</li><li>Précision : ↗ ou ↘ selon Kp, mais en pratique Kp modifie peu l'erreur permanente.</li><li>Rapidité : légèrement ↗ (le gain en haute fréquence augmente un peu ω₀dB).</li></ul>
<h3>Réglage (trois étapes)</h3>
<ol><li><b>a</b> : ω₀dB,nc (ou ω₀dB visée) et marge M<sub>φnc</sub> correspondante ; φ<sub>m</sub> = M<sub>imposée</sub> − M<sub>φnc</sub> ; <b>a = (1 + sin φ<sub>m</sub>)/(1 − sin φ<sub>m</sub>)</b>.</li>
<li><b>T<sub>d</sub></b> : on centre le maximum de phase en ω₀dB : ω<sub>m</sub> = 1/(T<sub>d</sub>√a) = ω₀dB, donc <b>T<sub>d</sub> = 1/(ω₀dB√a)</b>.</li>
<li><b>Kp</b> : le correcteur ajoute 10 log a dB en ω<sub>m</sub> ; pour que la coupure reste en ω<sub>m</sub> : <b>Kp = 10<sup>−10 log(a)/20</sup> = 1/√a</b> (si |H(jω₀dB)| = 1 ; sinon Kp = 1/(√a |H(jω₀dB)|)).</li></ol>
<h3>Autre forme</h3>
<p><b>C(p) = Kp (1 + T<sub>d</sub>p)/(1 + bT<sub>d</sub>p)</b> avec <b>b &lt; 1</b> (b = 1/a). Même démarche, mais les relations changent : ω<sub>m</sub> = 1/(T<sub>d</sub>√b) ; <b>b = (1 − sin φ<sub>m</sub>)/(1 + sin φ<sub>m</sub>)</b> ; <b>Kp = √b</b>.</p>
<h3>Démonstration (φ<sub>m</sub> et ω<sub>m</sub>)</h3>
<p>φ(ω) = arctan(aT<sub>d</sub>ω) − arctan(T<sub>d</sub>ω). dφ/dω = 0 donne (a − 1)(1 − aT<sub>d</sub>²ω²) = 0, d'où ω<sub>m</sub> = 1/(T<sub>d</sub>√a). En ω<sub>m</sub>, H(jω) a pour partie réelle 1 + a T<sub>d</sub>²ω² = 2 et pour partie imaginaire (a − 1)/√a, donc φ<sub>m</sub> = arcsin((a − 1)/(a + 1)).</p>` });
COURSE.push({ id: 'bilan', t: 'Synthèse et choix du correcteur', h: `
<table class="ctable"><thead><tr><th>Correcteur</th><th>C(p)</th><th>Stabilité</th><th>Précision</th><th>Rapidité</th></tr></thead><tbody>
<tr><td>P</td><td>Kp</td><td>↘ si Kp &gt; 1 ; ↗ si Kp &lt; 1</td><td>↗ si Kp &gt; 1 ; ↘ si Kp &lt; 1</td><td>↗ si Kp &gt; 1 ; ↘ si Kp &lt; 1</td></tr>
<tr><td>PI</td><td>Kp + Kᵢ/p</td><td>~ ou ↗</td><td>↗↗</td><td>~ ou ↗</td></tr>
<tr><td>Avance de phase</td><td>Kp(1 + aT<sub>d</sub>p)/(1 + T<sub>d</sub>p), a &gt; 1</td><td>↗↗</td><td>↗ ou ↘</td><td>~ ou ↗</td></tr></tbody></table>
<p>~ : conservée ; ↗ : améliorée ; ↘ : dégradée. Pour PI et avance de phase, il existe une <b>forte interdépendance</b> entre les paramètres : certains exercices contredisent donc ce tableau.</p>
<h3>Démarche de mise en œuvre</h3>
<ol><li>Traduire le cahier des charges : Mφ minimale, ω₀dB minimale, classe du système.</li><li>Erreur statique nulle exigée : PI (compensation de pôle si le pôle dominant est réel).</li><li>Phase insuffisante en ω₀dB visée : avance de phase.</li><li>Régler, puis vérifier marges, dépassement, temps de réponse, erreur statique.</li><li>Si aucun correcteur seul ne convient : les associer (PI + avance de phase) ou relâcher une exigence en le justifiant.</li></ol>
<div class="analogy"><b>Piège classique :</b> une marge de phase élevée est bonne pour la stabilité mais ralentit la réponse. Visez la marge strictement nécessaire (45° à 60°), pas davantage.</div>` });
COURSE.push({ id: 'boucles', t: 'Boucles complémentaires et filtre réjecteur', h: `
<p>On améliore aussi les performances en <b>modifiant la structure</b> de l'asservissement. Deux solutions courantes sur les systèmes du laboratoire de SII, pour un moteur à courant continu :</p>
<h3>Boucle de vitesse (tachymétrique)</h3>
<p>Dans un asservissement de position θ, on mesure la vitesse Ω et on élabore une tension de commande qui en tient compte (gain B). La vitesse étant la dérivée de la grandeur asservie, l'<b>effet est similaire à une correction dérivée</b> : elle améliore surtout la <b>rapidité</b> et la <b>stabilité</b>, sans les inconvénients d'une dérivée pure. On peut l'affiner avec un correcteur usuel C(p).</p>
<h3>Boucle de courant</h3>
<p>Au démarrage (vitesse nulle), l'intensité peut atteindre des valeurs trop fortes. Sans boucle : <b>i(t) = U₀/R</b>. Avec une boucle de courant de gain R<sub>H</sub> (capteur à effet Hall) : i = (U₀ − R<sub>H</sub>·i)/R, soit <b>i(t) = U₀/(R + R<sub>H</sub>)</b>. Le courant est limité (résistance d'induit augmentée artificiellement) et, le couple étant proportionnel au courant, c'est un <b>contrôle en couple</b>. On peut y placer un correcteur, souvent PI.</p>
<h3>Filtre réjecteur (Notch)</h3>
<p>Pour atténuer localement l'effet de perturbations sinusoïdales de fréquence connue : <b>C(p) = (ω<sub>R</sub>² + 2z₁ω<sub>R</sub>p + p²)/(ω<sub>R</sub>² + 2z₂ω<sub>R</sub>p + p²)</b>, où ω<sub>R</sub> est la pulsation à rejeter. Numérateur et dénominateur sont du second ordre à faible amortissement (z₁, z₂ &lt; 0,7). Le gain en ω<sub>R</sub> vaut z₁/z₂ : le puits est profond lorsque z₁ est petit devant z₂.</p>` });
COURSE.push({ id: 'redaction', t: 'Exemple de rédaction type', h: `
<p>Bras manipulateur collaboratif (Centrale-Supélec MP 2016). Cahier des charges de l'asservissement de vitesse : <b>Mφ = 80°</b> ; écart statique <b>nul</b> vis-à-vis d'un échelon de consigne et d'une perturbation constante ; <b>ω₀dB = 40 rad/s</b>. Pour une masse de 100 kg : FTBO<sub>nc</sub>(p) = K<sub>BO</sub>/p avec K<sub>BO</sub> = 218.</p>
<ul><li><b>Q12 (marge de phase)</b> : la FTBO<sub>nc</sub> est un intégrateur d'ordre 1, sa phase vaut −90° pour toutes les pulsations. Donc <b>Mφ = 90° &gt; 80°</b> : le critère de stabilité est satisfait.</li>
<li><b>Q13 (pourquoi un PI)</b> : la FTBO est de classe 0 en amont de la perturbation, le critère de précision vis-à-vis de la perturbation constante n'est pas satisfait : d'où le correcteur PI C<sub>v</sub>(p) = Kᵢ(1 + 1/(Tᵢp)). Bode asymptotique : pente −20 dB/décade puis gain 20 log Kᵢ au-delà de 1/Tᵢ ; phase de −π/2 à 0.</li>
<li><b>Q14 (réglage)</b> : FTBO<sub>c</sub>(p) = Kᵢ K<sub>BO</sub>(1 + Tᵢp)/(Tᵢp²). La rapidité impose ω₀dB = 40 rad/s ; Mφ = arg FTBO<sub>c</sub>(jω₀dB) + 180° = arctan(Tᵢω₀dB), donc <b>Tᵢ = tan 80°/40 = 0,14 s</b>. Puis |FTBO<sub>c</sub>(jω₀dB)| = 1 donne <b>Kᵢ = 0,18</b>.</li></ul>
<div class="analogy"><b>Méthode de rédaction :</b> citer la propriété (« la phase d'un intégrateur vaut −90° »), écrire la relation littérale, puis l'application numérique ; encadrer le résultat et conclure vis-à-vis du critère du cahier des charges.</div>` });
COURSE.push({ id: 'vocabulaire', t: 'Vocabulaire', h: `
<dl>
<dt>Boucle ouverte (FTBO)</dt><dd>L(p) = C(p)·H(p).</dd>
<dt>Pulsation de coupure ω₀dB</dt><dd>Pulsation où le gain de la boucle ouverte vaut 0 dB.</dd>
<dt>Marge de phase</dt><dd>Distance à −180° de la phase en ω₀dB ; mesure l'amortissement.</dd>
<dt>Marge de gain</dt><dd>Gain qu'on peut ajouter avant l'instabilité, mesuré à la pulsation où la phase vaut −180°.</dd>
<dt>Bande passante</dt><dd>Pulsation à −3 dB de la boucle fermée ; mesure la rapidité.</dd>
<dt>Facteur de résonance Q</dt><dd>Rapport du gain maximal au gain statique en boucle fermée ; Q ≈ 1,3 (2,3 dB) maximum.</dd>
<dt>Compensation de pôle</dt><dd>Annulation d'un pôle du système par un zéro du correcteur.</dd>
<dt>Avance de phase</dt><dd>Correcteur qui ajoute de la phase positive autour d'une pulsation choisie, avec un gain limité en haute fréquence.</dd>
<dt>Erreur statique</dt><dd>Écart consigne − sortie en régime permanent.</dd>
<dt>Classe</dt><dd>Nombre d'intégrateurs dans la boucle ouverte.</dd>
<dt>Boucle complémentaire</dt><dd>Boucle supplémentaire (vitesse, courant) qui modifie la structure de l'asservissement.</dd>
<dt>Filtre réjecteur (Notch)</dt><dd>Filtre qui creuse un puits de gain à une pulsation à rejeter.</dd>
</dl>` });

COURSE.splice(COURSE.findIndex(s => s.id === 'demarche') + 1, 0, { id: 'poles', t: 'Pôles : lieu dans le plan complexe', h: `
<p>Pour une entrée impulsionnelle, la sortie est une somme de termes associés aux pôles. Pour un pôle <b>pᵢ = σᵢ + jωᵢ</b> (et son conjugué), le terme est : <b>s(t) = Aᵢ e<sup>σᵢt</sup> cos(ωᵢt + φᵢ)</b> ; pour un pôle réel pur pᵢ = σᵢ : <b>s(t) = Aᵢ e<sup>σᵢt</sup></b>.</p>
<p>Il suffit donc d'<b>un seul pôle à partie réelle positive ou nulle</b> pour que la sortie ne revienne pas à zéro, diverge, et que le système soit qualifié d'<b>instable</b>.</p>
<table class="ctable"><thead><tr><th>Position du pôle</th><th>Réponse impulsionnelle</th><th>Stabilité</th></tr></thead><tbody>
<tr><td>Complexes conjugués, σ &lt; 0</td><td>oscillations amorties</td><td>stable</td></tr>
<tr><td>Réel, σ &lt; 0</td><td>exponentielle décroissante</td><td>stable</td></tr>
<tr><td>Imaginaires purs, σ = 0, ω ≠ 0</td><td>oscillations entretenues</td><td>limite</td></tr>
<tr><td>Nul, p = 0</td><td>constante non nulle</td><td>limite</td></tr>
<tr><td>Complexes conjugués, σ &gt; 0</td><td>oscillations divergentes</td><td>instable</td></tr>
<tr><td>Réel, σ &gt; 0</td><td>exponentielle divergente</td><td>instable</td></tr></tbody></table>
<h3>Influence de la partie réelle : notion de pôle dominant</h3>
<p>Plus un pôle est éloigné de l'axe des imaginaires purs, c'est-à-dire plus sa partie réelle est grande en valeur absolue, plus sa convergence (ou sa divergence) est <b>rapide</b>. Pour σ &lt; 0 : constante de temps <b>τ = 1/|σ|</b> et temps de réponse à 5 % <b>≈ 3/|σ|</b>.</p>
<p>Pour un système stable, l'effet des pôles très éloignés de l'axe imaginaire disparaît bien avant celui des pôles qui en sont plus proches, compte tenu des décroissances exponentielles très différentes. Les pôles les plus proches de l'axe imaginaire sont qualifiés de <b>pôles dominants</b>.</p>
<p>Pour simplifier certaines fonctions de transfert, on pourra <b>négliger</b> des pôles à partie réelle très négative, dont la contribution à la réponse tend pratiquement instantanément vers zéro. Règle pratique (empirique) : un pôle réel est négligeable s'il est <b>au moins 5 à 10 fois</b> plus éloigné de l'axe imaginaire que le pôle dominant ; l'erreur sur le temps de réponse est alors de l'ordre de la dizaine de pourcents au plus.</p>
<h3>Influence de la partie imaginaire</h3>
<p>Plus un couple de pôles complexes est éloigné de l'axe des réels, c'est-à-dire plus sa partie imaginaire ω est grande en valeur absolue, plus la <b>pulsation des oscillations ou pseudo-oscillations</b> est grande (pseudo-période <b>T = 2π/ω</b>). L'enveloppe, elle, ne dépend que de σ.</p>
<div class="analogy"><b>Lien avec le réglage de correcteurs :</b> la compensation du pôle dominant d'un PI (Tᵢ = τ₁) annule le pôle le plus lent du système : c'est précisément le pôle qui limite la rapidité de la boucle. Le second ordre dominant utilisé au cahier des charges suppose que les autres pôles sont négligeables.</div>` });

/* ---------- interface ---------- */
const UI = { cur: 'q1' };
const AS = { key: 'q1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'demarche' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  try { w.mount(root); }
  catch (err) { root.innerHTML = '<p class="verdict no"><b>Erreur d\'affichage.</b> ' + esc(err && err.message || err) + '</p>'; if (window.console) console.error(err); }
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  document.body.classList.toggle('act-open', AS.open && !CS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Quiz (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer au quiz')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    if (!s.shown) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  document.body.classList.toggle('act-open', AS.open && !CS.open);
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : réglage de correcteurs'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Neuf ateliers sur le réglage des correcteurs : démarche, pôles et réponse temporelle, actions P / I / D, correcteur P, PI, avance de phase, mise en œuvre, boucles complémentaires et filtre réjecteur, rédaction type.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut (elle défile sur petit écran), puis déplacez les curseurs.</li><li>Les diagrammes de Bode montrent trois courbes : <b>H non corrigée</b> (gris pointillé), <b>le correcteur C</b> (orange) et <b>la boucle corrigée C·H</b> (bleu). En dB et en degrés, bleu = gris + orange.</li><li>Les boutons de réglage automatique appliquent la méthode du cours ; relisez le calcul affiché.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un quiz avec correction. Sur téléphone, il s\'ouvre en bas de l\'écran.</li><li>Le bouton <b>Cours</b> reprend le cours.</li></ul>' +
    '<h3>Modèle utilisé</h3><p>H(p) = K₀ / ((1 + τ₁p)(1 + τ₂p)) en retour unitaire ; simulation numérique (Runge-Kutta d\'ordre 4).</p><h3>Vos données</h3><p>Les réponses au quiz sont mémorisées dans ce navigateur uniquement.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
