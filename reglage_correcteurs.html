<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-correcteurs-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];


/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmt = (x, d = 2) => { if (!isFinite(x)) return x > 0 ? '∞' : '−∞'; const r = Math.round(x * 10 ** d) / 10 ** d; return String(Object.is(r, -0) ? 0 : r).replace('.', ','); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const PLANT0 = { K0: 1, t1: 1, t2: 0.1 };
const PLANT = Object.assign({}, PLANT0);
const GRID = (() => { const g = [], n = 3000, a = -3, b = 5; for (let i = 0; i <= n; i++) g.push(Math.pow(10, a + (b - a) * i / n)); return g; })();
const dB = m => 20 * Math.log10(Math.max(m, 1e-12));

/* ---------- modèles fréquentiels : système H, correcteur C, boucle ouverte L = C·H ---------- */
function plantFR(w, P) { return [P.K0 / Math.sqrt((1 + w * w * P.t1 * P.t1) * (1 + w * w * P.t2 * P.t2)), -(Math.atan(w * P.t1) + Math.atan(w * P.t2)) * R2D]; }
function ctrlFR(w, c) {
  if (!c || c.type === 'none') return [1, 0];
  if (c.type === 'P') return [c.Kp, 0];
  if (c.type === 'PI') { const x = w * c.Ti; return [c.Kp * Math.sqrt(1 + x * x) / x, Math.atan(x) * R2D - 90]; }
  const x = c.a * c.T * w, y = c.T * w;
  return [c.K * Math.sqrt((1 + x * x) / (1 + y * y)), (Math.atan(x) - Math.atan(y)) * R2D];
}
function loopFR(w, P, c) { const a = plantFR(w, P), b = ctrlFR(w, c); return [a[0] * b[0], a[1] + b[1]]; }
const unitCtrl = type => type === 'P' ? { type: 'P', Kp: 1 } : type === 'PI' ? { type: 'PI', Kp: 1, Ti: 1 } : { type: 'AV', K: 1, a: 1, T: 1 };
const dcGain = (P, c) => { if (c.type === 'PI') return 1; const k = c.type === 'P' ? c.Kp : c.K; const l0 = k * P.K0; return l0 / (1 + l0); };

/* ---------- analyse : pulsation de coupure, marges, bande passante ---------- */
function analyzeFreq(P, c) {
  const G = GRID; let wc = null, M = null;
  let prev = loopFR(G[0], P, c);
  for (let i = 1; i < G.length; i++) {
    const cur = loopFR(G[i], P, c);
    if (prev[0] >= 1 && cur[0] < 1) {
      let lo = G[i - 1], hi = G[i];
      for (let k = 0; k < 50; k++) { const m = Math.sqrt(lo * hi); if (loopFR(m, P, c)[0] >= 1) lo = m; else hi = m; }
      wc = Math.sqrt(lo * hi); M = 180 + loopFR(wc, P, c)[1]; break;
    }
    prev = cur;
  }
  let w180 = null, Mg = Infinity;
  let pp = loopFR(G[0], P, c)[1];
  for (let i = 1; i < G.length; i++) {
    const ph = loopFR(G[i], P, c)[1];
    if (pp > -180 && ph <= -180) {
      let lo = G[i - 1], hi = G[i];
      for (let k = 0; k < 50; k++) { const m = Math.sqrt(lo * hi); if (loopFR(m, P, c)[1] > -180) lo = m; else hi = m; }
      w180 = Math.sqrt(lo * hi); Mg = -dB(loopFR(w180, P, c)[0]); break;
    }

  b[4].textContent = A.unstable ? '—' : fmt(A.D, 1) + ' %';
  b[5].textContent = A.unstable ? '—' : (isFinite(A.tr) ? fmt(A.tr, 3) + ' s' : '> ' + fmt(A.tmax, 1) + ' s');
  b[6].textContent = A.unstable ? '—' : fmt(A.eStat, 2) + ' %';
  const v = verdictFor(A), m = $('#' + px + '-msg'); m.className = 'verdict ' + v[0]; m.innerHTML = v[1];
  return A;
}

/* ================= Atelier 1 : Démarche et cahier des charges ================= */
const Q1 = { z: 0.6, D: 20, tr: 0.5 };
function mountQ1(root) {
  root.innerHTML = '<h2>Proposer une démarche de réglage</h2><p>Régler un correcteur, c\'est choisir ses paramètres pour que le système asservi respecte un <b>cahier des charges</b> : stabilité et amortissement, rapidité, précision. La difficulté est que le cahier des charges est donné en <b>temporel</b> (dépassement, temps de réponse, erreur) alors que le correcteur se règle en <b>fréquentiel</b> (marges, pulsation de coupure). Cet atelier construit le pont entre les deux.</p>' +
    '<div class="flow" aria-label="Démarche en six étapes"><span class="bx">1. Cahier des charges</span><span class="ar">→</span><span class="bx">2. Critères fréquentiels</span><span class="ar">→</span><span class="bx">3. Choix du correcteur</span><span class="ar">→</span><span class="bx">4. Calcul des paramètres</span><span class="ar">→</span><span class="bx">5. Vérification</span><span class="ar">→</span><span class="bx">6. Ajustement</span></div>' +
    '<div class="analogy"><b>Image :</b> régler un correcteur ressemble à régler la suspension d\'une voiture. Trop raide (gain élevé, marge faible) : elle rebondit. Trop souple : elle est lente à revenir. On cherche l\'amortissement qui donne la réponse la plus rapide sans rebond excessif.</div>' +
    '<h3>1. Du temporel au fréquentiel</h3><p>Pour un système du second ordre en boucle fermée (pulsation propre ωₙ, amortissement ζ), tout se calcule. Déplacez le curseur : un petit ζ donne un grand dépassement <b>et</b> une petite marge de phase.</p>' +
    '<div id="q1-z"></div>' + statsHtml([['Amortissement ζ', ''], ['Dépassement D', ''], ['Marge de phase Mφ', ''], ['ω₀dB / ωₙ', ''], ['ωBP / ωₙ', ''], ['ωₙ · tr5 %', '']], 'q1-stats') +
    '<svg id="q1-step" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg><svg id="q1-bode" viewBox="0 0 640 400" style="width:100%;max-width:680px;height:auto"></svg><p class="verdict" id="q1-msg"></p>' +
    '<h3>Correspondances à connaître</h3><div id="q1-tab"></div>' +
    '<h3>2. De votre cahier des charges aux critères</h3><p>Entrez les exigences temporelles : l\'atelier en déduit la marge de phase minimale et les pulsations à viser (second ordre dominant).</p>' +
    '<div class="opts"><label class="fld"><span>Dépassement maximal D (%)</span><input type="text" id="q1-D" class="mono" autocomplete="off"></label><label class="fld"><span>Temps de réponse à 5 % (s)</span><input type="text" id="q1-tr" class="mono" autocomplete="off"></label></div><div class="verdict goal" id="q1-spec" aria-live="polite"></div>' +
    '<h3>3. Quel correcteur pour quel besoin ?</h3><div class="dwrap"><table class="dt"><thead><tr><th>Défaut constaté</th><th>Cause en fréquentiel</th><th>Correcteur adapté</th></tr></thead><tbody>' +
    '<tr><td>Erreur statique non nulle</td><td>Pas d\'intégrateur dans la boucle ouverte</td><td>PI (action intégrale)</td></tr>' +
    '<tr><td>Trop oscillant</td><td>Marge de phase insuffisante en ω₀dB</td><td>P (baisser le gain) ou avance de phase</td></tr>' +
    '<tr><td>Trop lent</td><td>ω₀dB trop basse</td><td>Augmenter le gain, avec avance de phase pour garder la marge</td></tr>' +
    '<tr><td>Pôle dominant gênant</td><td>Phase perdue dès les basses pulsations</td><td>PI avec compensation de pôle (Tᵢ = τ₁)</td></tr></tbody></table></div>';
  const S = Q1;
  const z = slider($('#q1-z'), { name: 'Amortissement ζ', min: 0.1, max: 1.5, step: 0.01, get: () => S.z, set: v => { S.z = v; }, onchange: () => upd() });
  const upd = () => {
    const zz = S.z, wc = so.wc(zz), M = so.M(zz), tn = so.tr5(zz), D = so.D(zz);

    const ts = [], ys = []; const tmax = Math.max(8, Math.min(40, tn * 1.4));

    const m = $('#q1-msg'); m.className = 'verdict ' + (zz < 0.4 ? 'warn' : 'yes');

  const zOfM = M => { let lo = 0.05, hi = 1.5; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (so.M(m) < M) lo = m; else hi = m; } return (lo + hi) / 2; };
  $('#q1-tab').innerHTML = '<div class="dwrap"><table class="dt"><thead><tr><th>Marge de phase</th><th>Amortissement ζ</th><th>Dépassement D</th><th>ωₙ · tr5 %</th></tr></thead><tbody>' + [30, 45, 60, 70].map(M => { const zz = zOfM(M); return '<tr><td>' + M + ' °</td><td class="m">' + fmt(zz, 2) + '</td><td class="m">' + fmt(so.D(zz), 1) + ' %</td><td class="m">' + fmt(so.tr5(zz), 1) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  const spec = () => {
    const D = parseFloat($('#q1-D').value.replace(',', '.')), tr = parseFloat($('#q1-tr').value.replace(',', '.')), el = $('#q1-spec');
    if (!(D > 0.1 && D < 100) || !(tr > 0)) { el.innerHTML = 'Saisissez D entre 0,1 et 100 % et un temps de réponse positif.'; return; }
    S.D = D; S.tr = tr;
    const zz = so.zOfD(D), M = so.M(zz), tn = so.tr5(zz), wn = tn / tr;
    el.innerHTML = '<b>Amortissement :</b> D ≤ ' + fmt(D, 1) + ' % impose ζ ≥ <b>' + fmt(zz, 2) + '</b>, soit une marge de phase <b>Mφ ≥ ' + fmt(M, 0) + ' °</b>.<br><b>Rapidité :</b> avec ce ζ, ωₙ·tr5 % = ' + fmt(tn, 2) + ', donc ωₙ ≥ ' + fmt(wn, 2) + ' rad/s. On vise une <b>pulsation de coupure ω₀dB ≈ ' + fmt(wn * so.wc(zz), 2) + ' rad/s</b> (bande passante ωBP ≈ ' + fmt(wn * so.bp(zz), 2) + ' rad/s).<br><b>Précision :</b> une erreur statique nulle impose au moins un intégrateur dans la boucle ouverte (classe 1).';
  };
  $('#q1-D').value = fmt(S.D, 1).replace(',', '.'); $('#q1-tr').value = String(S.tr);
  $('#q1-D').addEventListener('input', spec); $('#q1-tr').addEventListener('input', spec);
  upd(); spec();
}
WORKSHOPS.push({ id: 'q1', title: 'Démarche', hint: 'Faites le lien entre cahier des charges temporel (dépassement, temps de réponse) et critères fréquentiels (marge de phase, pulsation de coupure).',

/* ================= Atelier 2 : Correcteur proportionnel ================= */
const Q2 = { Kp: 5, Mt: 60 };
function mountQ2(root) {
  root.innerHTML = '<h2>Correcteur proportionnel</h2><p>Le correcteur P multiplie l\'erreur par un gain : <b>C(p) = Kp</b>. Il ne change pas la phase, il ne fait que <b>monter ou descendre la courbe de gain</b>. Régler Kp revient donc à choisir la pulsation où la courbe coupe 0 dB, c\'est-à-dire la marge de phase obtenue.</p>' +
    '<div id="q2-plant"></div><h3>Réglage</h3><div id="q2-sl"></div><div id="q2-sl2"></div><div class="files" style="margin:6px 0"><button class="btn pri" id="q2-apply" type="button">Kp pour la marge de phase visée</button></div><p class="verdict goal" id="q2-calc" aria-live="polite"></p>' + analysisHtml('q2') +
    '<div class="analogy"><b>À retenir :</b> avec un système de classe 0, le correcteur P laisse une erreur statique <b>εs = 1 / (1 + Kp·K₀)</b>. Pour la réduire il faut augmenter Kp, mais cela fait monter ω₀dB et diminuer la marge de phase : P impose un compromis précision / amortissement.</div>';
  const S = Q2;
  const s1 = slider($('#q2-sl'), { name: 'Kp', min: 0.1, max: 200, step: 0.1, dec: 1, get: () => S.Kp, set: v => { S.Kp = v; }, onchange: () => upd() });
  const s2 = slider($('#q2-sl2'), { name: 'Marge de phase visée Mφ', min: 20, max: 85, step: 1, dec: 0, unit: '°', get: () => S.Mt, set: v => { S.Mt = v; }, onchange: () => upd() });
  plantEditor($('#q2-plant'), () => upd());
  const calc = () => {
    const r = designP(PLANT, S.Mt), el = $('#q2-calc');
    if (!r) { el.innerHTML = 'Aucune pulsation ne donne cette marge de phase.'; return null; }
    el.innerHTML = '<b>Démarche :</b> (1) on cherche ω tel que arg H(jω) = −(180 − Mφ) = <b>' + fmt(-(180 - S.Mt), 0) + ' °</b> : ω = <b>' + fmt(r.w, 2) + ' rad/s</b>. (2) À cette pulsation la boucle doit valoir 0 dB : Kp = 1 / |H(jω)| = <b>' + fmt(r.c.Kp, 2) + '</b>. (3) Conséquence : εs = 1 / (1 + Kp K₀) = ' + fmt(100 / (1 + r.c.Kp * PLANT.K0), 1) + ' %.';
    return r;
  };
  const upd = () => { calc(); renderAnalysis('q2', { type: 'P', Kp: S.Kp }); };

  upd();
}
WORKSHOPS.push({ id: 'q2', title: 'Correcteur P', hint: 'Faites varier Kp : la courbe de gain monte ou descend, ω₀dB et la marge de phase changent, mais la phase ne bouge pas.',

/* ================= Atelier 3 : Correcteur PI ================= */
const Q3 = { Kp: 6.7, Ti: 1, Mt: 60 };
function mountQ3(root) {
  root.innerHTML = '<h2>Correcteur proportionnel intégral</h2><p>Le correcteur PI s\'écrit <b>C(p) = Kp (1 + Tᵢ p) / (Tᵢ p)</b>. Il ajoute un intégrateur : l\'erreur statique devient nulle. En contrepartie il retire de la phase aux basses pulsations (−90° à très basse pulsation). Astuce classique : choisir <b>Tᵢ = τ₁</b> pour <b>compenser le pôle dominant</b> du système.</p>' +
    '<div id="q3-plant"></div><h3>Réglage</h3><div id="q3-sl"></div><div id="q3-sl2"></div><div id="q3-sl3"></div><div class="files" style="margin:6px 0"><button class="btn" id="q3-ti" type="button">Tᵢ = τ₁ (compenser le pôle)</button><button class="btn pri" id="q3-apply" type="button">Kp pour la marge de phase visée</button></div><p class="verdict goal" id="q3-calc" aria-live="polite"></p>' + analysisHtml('q3') +
    '<div class="analogy"><b>Pourquoi ça marche :</b> avec Tᵢ = τ₁, le numérateur (1 + Tᵢ p) du correcteur annule le facteur (1 + τ₁ p) du système. Il reste L(p) = Kp·K₀ / (Tᵢ p (1 + τ₂ p)) : un intégrateur et un seul pôle, soit un système du second ordre en boucle fermée, facile à régler par la marge de phase.</div>';
  const S = Q3;
  const sl = [slider($('#q3-sl'), { name: 'Kp', min: 0.1, max: 200, step: 0.1, dec: 1, get: () => S.Kp, set: v => { S.Kp = v; }, onchange: () => upd() }),
    slider($('#q3-sl2'), { name: 'Tᵢ', min: 0.05, max: 10, step: 0.05, dec: 2, unit: 's', get: () => S.Ti, set: v => { S.Ti = v; }, onchange: () => upd() }),
    slider($('#q3-sl3'), { name: 'Marge de phase visée Mφ', min: 20, max: 85, step: 1, dec: 0, unit: '°', get: () => S.Mt, set: v => { S.Mt = v; }, onchange: () => upd() })];
  plantEditor($('#q3-plant'), () => upd());
  const calc = A => {
    const el = $('#q3-calc'), exact = Math.abs(S.Ti - PLANT.t1) / PLANT.t1 < 0.02;
    let t;
    if (exact) {
      const d = designPI(PLANT, S.Mt);
      t = '<b>Pôle compensé</b> (Tᵢ ≈ τ₁ = ' + fmt(PLANT.t1, 2) + ' s). La boucle ouverte devient Kp·K₀ / (Tᵢ p (1 + τ₂ p)), donc Mφ = 90° − arctan(ω₀dB·τ₂). Pour Mφ = ' + fmt(S.Mt, 0) + ' ° : ω₀dB = 1 / (τ₂ tan Mφ) = <b>' + fmt(d.w, 2) + ' rad/s</b> et Kp = Tᵢ ω₀dB √(1 + (ω₀dB τ₂)²) / K₀ = <b>' + fmt(d.c.Kp, 2) + '</b>.';
    } else if (S.Ti > PLANT.t1) t = 'Tᵢ > τ₁ : le pôle dominant n\'est pas compensé, il reste une <b>queue lente</b> dans la réponse (constante de temps de l\'ordre de Tᵢ).';
    else t = 'Tᵢ < τ₁ : le zéro du correcteur est plus rapide que le pôle à compenser. La phase est moins dégradée en basse pulsation, mais le gain augmente et le dépassement croît.';
    if (A && A.wc) t += '<br>Contrôle : Tᵢ·ω₀dB = ' + fmt(S.Ti * A.wc, 1) + ' (la phase perdue par l\'intégrateur à ω₀dB vaut arctan(1 / (Tᵢ ω₀dB)) = ' + fmt(Math.atan(1 / (S.Ti * A.wc)) * R2D, 1) + ' °).';
    el.innerHTML = t;
  };
  const upd = () => { const A = renderAnalysis('q3', { type: 'PI', Kp: S.Kp, Ti: S.Ti }); calc(A); };
  $('#q3-ti').addEventListener('click', () => { S.Ti = PLANT.t1; sl.forEach(x => x.sync()); upd(); });
  $('#q3-apply').addEventListener('click', () => {
    const r = gainForMargin(PLANT, { type: 'PI', Kp: 1, Ti: S.Ti }, S.Mt);
    if (!r) { $('#q3-calc').innerHTML = 'Aucune pulsation ne donne cette marge avec ce Tᵢ : augmentez Tᵢ ou visez une marge plus faible.'; return; }
    S.Kp = r.gain; sl.forEach(x => x.sync()); upd();
  });
  upd();
}
WORKSHOPS.push({ id: 'q3', title: 'Correcteur PI', hint: 'Compensez le pôle dominant (Tᵢ = τ₁), réglez Kp par la marge de phase, et observez l\'erreur statique qui disparaît.',

/* ================= Atelier 4 : Avance de phase ================= */
const Q4 = { K: 16, a: 2.7, T: 0.04, wt: 15, Mt: 60, ok: false };
function mountQ4(root) {
  root.innerHTML = '<h2>Correcteur à avance de phase</h2><p>Le correcteur à avance de phase s\'écrit <b>C(p) = K (1 + a T p) / (1 + T p)</b> avec a &gt; 1. Il ajoute de la <b>phase positive</b> autour de la pulsation ωₘ = 1 / (T√a), sans intégrateur. Il permet de <b>monter ω₀dB</b> (réponse plus rapide) tout en gardant une bonne marge de phase.</p>' +
    '<div id="q4-plant"></div><h3>Démarche pas à pas</h3><div class="opts"></div><div id="q4-t"></div><p class="verdict goal" id="q4-calc" aria-live="polite"></p><div class="files" style="margin:6px 0"><button class="btn pri" id="q4-apply" type="button">Appliquer ce réglage</button></div>' +
    '<h3>Réglage manuel</h3><div id="q4-sl"></div><p class="verdict" id="q4-facts"></p>' + analysisHtml('q4') +
    '<div class="analogy"><b>Limites :</b> le gain en hautes pulsations vaut K·a : une grande avance amplifie les bruits. On limite en pratique a à 10 environ (avance de 55° au plus par cellule). Le correcteur à avance de phase ne corrige pas l\'erreur statique : pour la supprimer, on lui associe un intégrateur.</div>';
  const S = Q4;
  const sl = [];
  const calc = () => designAV(PLANT, S.wt, S.Mt);
  const fill = () => {
    const d = calc(), el = $('#q4-calc');
    let t = '<b>1.</b> À ω₀dB visée = ' + fmt(S.wt, 1) + ' rad/s : |H| = ' + fmt(d.mh, 4) + ' et arg H = ' + fmt(d.ph, 1) + ' °, donc sans correcteur Mφ = 180° + arg H = <b>' + fmt(d.M0, 1) + ' °</b>.<br><b>2.</b> Avance nécessaire : φ = Mφ visée − Mφ actuelle + 5° de sécurité = <b>' + fmt(d.need, 1) + ' °</b>.<br>';
    if (d.need <= 0) t += '<b>3.</b> Aucune avance n\'est nécessaire (a = 1) : il suffit d\'ajuster le gain K = 1 / |H| = ' + fmt(d.c.K, 2) + '.';
    else t += '<b>3.</b> a = (1 + sin φ) / (1 − sin φ) = <b>' + fmt(d.c.a, 2) + '</b>.<br><b>4.</b> On place le maximum de phase en ω₀dB : T = 1 / (ω₀dB √a) = <b>' + fmt(d.c.T, 4) + ' s</b>.<br><b>5.</b> En ωₘ le correcteur apporte un gain K√a : pour que L vaille 0 dB, K = 1 / (√a |H|) = <b>' + fmt(d.c.K, 2) + '</b>.';
    if (d.warn) t += '<br><b>Attention :</b> ' + d.warn;
    el.innerHTML = t; return d;
  };
  const upd = () => {
    fill();
    const A = renderAnalysis('q4', { type: 'AV', K: S.K, a: S.a, T: S.T });
    const phim = Math.asin((S.a - 1) / (S.a + 1)) * R2D, wm = 1 / (S.T * Math.sqrt(S.a));
    const f = $('#q4-facts'); f.className = 'verdict';
    f.innerHTML = 'φmax = arcsin((a − 1) / (a + 1)) = <b>' + fmt(phim, 1) + ' °</b> à ωₘ = 1 / (T√a) = <b>' + fmt(wm, 2) + ' rad/s</b>, où le gain du correcteur vaut K√a = <b>' + fmt(dB(S.K * Math.sqrt(S.a)), 1) + ' dB</b>.' + (A.wc ? ' Écart entre ωₘ et ω₀dB : ' + fmt(Math.abs(Math.log10(wm / A.wc)) * 100 / 1, 0) + ' % d\'une décade.' : '');
  };
  const apply = () => { const d = calc(); Object.assign(S, { K: d.c.K, a: d.c.a, T: d.c.T }); sl.forEach(x => x.sync()); upd(); };
  plantEditor($('#q4-plant'), () => { upd(); });
  const host = $('#q4-t');
  slider(host, { name: 'ω₀dB visée', min: 1, max: 100, step: 1, dec: 0, unit: 'rad/s', get: () => S.wt, set: v => { S.wt = v; }, onchange: () => fill() });
  slider(host, { name: 'Marge de phase visée Mφ', min: 20, max: 85, step: 1, dec: 0, unit: '°', get: () => S.Mt, set: v => { S.Mt = v; }, onchange: () => fill() });
  const mh = $('#q4-sl');
  sl.push(slider(mh, { name: 'K', min: 0.5, max: 300, step: 0.5, dec: 1, get: () => S.K, set: v => { S.K = v; }, onchange: () => upd() }));
  sl.push(slider(mh, { name: 'a', min: 1, max: 20, step: 0.1, dec: 1, get: () => S.a, set: v => { S.a = v; }, onchange: () => upd() }));
  sl.push(slider(mh, { name: 'T', min: 0.002, max: 1, step: 0.002, dec: 3, unit: 's', get: () => S.T, set: v => { S.T = v; }, onchange: () => upd() }));
  $('#q4-apply').addEventListener('click', apply);
  if (!S.ok) { const d = calc(); Object.assign(S, { K: d.c.K, a: d.c.a, T: d.c.T, ok: true }); sl.forEach(x => x.sync()); }
  upd();
}
WORKSHOPS.push({ id: 'q4', title: 'Avance de phase', hint: 'Appliquez la démarche (ω₀dB visée, marge visée, a, T, K), puis comparez avec un réglage manuel de K, a et T.',

  const S = Q5;

    const As = ctrls.map(x => analyze(P, x.c)), tmax = Math.max(...As.map(a => a.tmax));

      const A = A2[i], okD = !A.unstable && ok(A.D, S.D), okT = !A.unstable && ok(A.tr, S.tr), okE = !A.unstable && ok(Math.abs(A.eStat), S.es);

<h3>Les six étapes</h3>
<ol><li><b>Cahier des charges</b> : stabilité (marges), amortissement (dépassement D), rapidité (temps de réponse tr5 %, bande passante), précision (erreur statique).</li>

<li><b>Choix du correcteur</b> : P, PI ou avance de phase, selon l'écart entre le système et les exigences.</li>
<li><b>Calcul des paramètres</b> à partir du Bode de H.</li>
<li><b>Vérification</b> : marges, réponse indicielle, erreur statique.</li>

<table class="ctable"><thead><tr><th>Grandeur</th><th>Définition</th></tr></thead><tbody>

<tr><td>Marge de phase Mφ</td><td>Mφ = 180° + arg L(jω₀dB)</td></tr>
<tr><td>Marge de gain Mg</td><td>Mg = −20 log |L(jω₁₈₀)| où arg L(jω₁₈₀) = −180°</td></tr>

<p><b>C(p) = Kp.</b> Ne change que le gain : la courbe de gain de la boucle ouverte est translatée de 20 log Kp, la phase est inchangée.</p>
<h3>Méthode de réglage par la marge de phase</h3>
<ol><li>Tracer arg H(jω).</li><li>Trouver ω₁ tel que <b>arg H(jω₁) = −180° + Mφ</b>.</li><li>Calculer <b>Kp = 1 / |H(jω₁)|</b> : ω₁ devient la pulsation de coupure.</li></ol>
<p>Pour H = K₀/((1 + τ₁p)(1 + τ₂p)), la phase tend vers −180° : un gain trop grand rend le système instable.</p>
<h3>Limites</h3>
<ul><li>Erreur statique non nulle : ε = 1/(1 + Kp K₀).</li><li>Augmenter Kp réduit ε mais diminue la marge de phase.</li><li>Seul Kp est ajustable : on ne peut pas régler indépendamment précision, rapidité et amortissement.</li></ul>` });
COURSE.push({ id: 'pi', t: 'Correcteur PI et compensation de pôle', h: `
<p><b>C(p) = Kp (1 + Tᵢ p) / (Tᵢ p)</b> = Kp + Kp/(Tᵢ p). Gain en basse fréquence infini (intégrateur), gain Kp au-delà de 1/Tᵢ. Phase : −90° très en dessous de 1/Tᵢ, 0° très au-dessus.</p>
<h3>Compensation du pôle dominant</h3>
<p>Pour H = K₀/((1 + τ₁p)(1 + τ₂p)) avec τ₁ &gt; τ₂, on choisit <b>Tᵢ = τ₁</b>. La boucle ouverte devient :</p>
<p><b>L(p) = Kp K₀ / (τ₁ p (1 + τ₂ p))</b></p>
<p>C'est un système de classe 1 et d'ordre 2 : l'erreur statique est nulle, et le réglage se fait par la marge de phase.</p>
<h3>Calcul de Kp</h3>
<ul><li>Mφ = 90° − arctan(ω₀dB τ₂), donc <b>ω₀dB = 1 / (τ₂ tan Mφ)</b>.</li>
<li>|L(jω₀dB)| = 1 donne <b>Kp = τ₁ ω₀dB √(1 + ω₀dB² τ₂²) / K₀</b>.</li></ul>
<div class="analogy"><b>Remarque :</b> si Tᵢ ≠ τ₁, il reste un pôle non compensé. Avec Tᵢ &gt; τ₁, une queue lente de constante de temps proche de Tᵢ apparaît dans la réponse.</div>
<p>Règle pratique sans modèle : Tᵢ ≥ 5 à 10 fois 1/ω₀dB pour que l'intégrateur coûte moins de 10° de marge de phase.</p>` });
COURSE.push({ id: 'avance', t: 'Correcteur à avance de phase', h: `
<p><b>C(p) = K (1 + aTp) / (1 + Tp)</b>, avec a &gt; 1. Gain K en basse fréquence, K·a en haute fréquence. La phase est positive, maximale en <b>ωm = 1/(T√a)</b> :</p>
<p><b>φmax = arcsin((a − 1)/(a + 1))</b>, et <b>|C(jωm)| = K√a</b>.</p>
<table class="ctable"><thead><tr><th>a</th><th>2</th><th>4</th><th>10</th><th>20</th></tr></thead><tbody><tr><td>φmax</td><td>19,5°</td><td>37°</td><td>55°</td><td>65°</td></tr></tbody></table>
<h3>Méthode de réglage</h3>
<ol><li>Fixer la pulsation de coupure visée ω₀dB (rapidité).</li>
<li>Lire |H| et arg H à cette pulsation : marge actuelle M₀ = 180° + arg H(jω₀dB).</li>
<li>Avance nécessaire : <b>φ = Mφ visée − M₀ + (5° à 10°)</b>.</li>
<li><b>a = (1 + sin φ)/(1 − sin φ)</b>.</li>
<li>Placer ωm = ω₀dB : <b>T = 1/(ω₀dB √a)</b>.</li>
<li>Ajuster le gain pour que |L| = 1 en ω₀dB : <b>K = 1/(√a |H(jω₀dB)|)</b>.</li></ol>
<h3>Limites</h3>
<ul><li>Au-delà de 60° d'avance, il faut deux cellules en série (a est trop grand).</li><li>Le gain en haute fréquence K·a amplifie les bruits.</li><li>Pas d'intégrateur : l'erreur statique n'est pas annulée.</li></ul>` });
COURSE.push({ id: 'bilan', t: 'Choix et mise en œuvre', h: `
<table class="ctable"><thead><tr><th>Correcteur</th><th>Apporte</th><th>Coûte</th></tr></thead><tbody>
<tr><td>P</td><td>Simplicité</td><td>Erreur statique, compromis précision / marge</td></tr>
<tr><td>PI</td><td>Erreur statique nulle</td><td>Retard de phase, rapidité limitée</td></tr>
<tr><td>Avance de phase</td><td>Rapidité et marge de phase</td><td>Pas d'intégrateur, amplification des bruits</td></tr>
</tbody></table>
<h3>Démarche de mise en œuvre</h3>
<ol><li>Traduire le cahier des charges : Mφ minimale, ω₀dB minimale, classe du système.</li>
<li>Si une erreur statique nulle est exigée : PI (compenser le pôle dominant).</li>
<li>Si la phase est insuffisante en ω₀dB visée : avance de phase.</li>
<li>Régler, puis vérifier marges, dépassement, temps de réponse et erreur statique.</li>
<li>Si aucun correcteur seul ne convient : les associer (PI + avance de phase) ou relâcher une exigence, en le justifiant.</li></ol>
<div class="analogy"><b>Piège classique :</b> une marge de phase élevée est bonne pour la stabilité mais ralentit la réponse. Visez la marge strictement nécessaire (45° à 60°), pas davantage.</div>` });
COURSE.push({ id: 'vocabulaire', t: 'Vocabulaire', h: `
<dl>
<dt>Boucle ouverte</dt><dd>L(p) = C(p)·H(p).</dd>
<dt>Pulsation de coupure ω₀dB</dt><dd>Pulsation où le gain de la boucle ouverte vaut 0 dB.</dd>
<dt>Marge de phase</dt><dd>Distance à −180° de la phase en ω₀dB ; mesure l'amortissement.</dd>
<dt>Marge de gain</dt><dd>Gain qu'on peut ajouter avant l'instabilité, mesuré à la pulsation où la phase vaut −180°.</dd>
<dt>Bande passante</dt><dd>Pulsation à −3 dB de la boucle fermée ; mesure la rapidité.</dd>
<dt>Compensation de pôle</dt><dd>Annulation d'un pôle du système par un zéro du correcteur.</dd>
<dt>Avance de phase</dt><dd>Correcteur qui ajoute de la phase positive autour d'une pulsation choisie.</dd>
<dt>Erreur statique</dt><dd>Écart consigne − sortie en régime permanent.</dd>
<dt>Classe</dt><dd>Nombre d'intégrateurs dans la boucle ouverte.</dd>
</dl>` });
/* ---------- interface ---------- */
const UI = { cur: 'q1' };
const AS = { key: 'q1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'demarche' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  try { w.mount(root); }
  catch (err) { root.innerHTML = '<p class="verdict no"><b>Erreur d\'affichage.</b> ' + esc(err && err.message || err) + '</p>'; if (window.console) console.error(err); }
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  document.body.classList.toggle('act-open', AS.open && !CS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Quiz (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer au quiz')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    if (!s.shown) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  document.body.classList.toggle('act-open', AS.open && !CS.open);
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : réglage de correcteurs'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers sur le réglage des correcteurs P, PI et à avance de phase : démarche et cahier des charges, correcteur P, correcteur PI, avance de phase, mise en œuvre et comparaison.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut, puis déplacez les curseurs : le diagramme de Bode, la réponse indicielle et les marges se mettent à jour.</li><li>Les boutons de réglage automatique appliquent la méthode du cours ; relisez le calcul affiché au-dessus.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un quiz avec correction. Sur téléphone, il s\'ouvre en bas de l\'écran : fermez-le pour manipuler l\'atelier.</li><li>Le bouton <b>Cours</b> détaille chaque partie.</li></ul>' +
    '<h3>Modèle utilisé</h3><p>Le système est H(p) = K₀ / ((1 + τ₁p)(1 + τ₂p)) en boucle fermée à retour unitaire. La simulation temporelle est calculée numériquement (Runge-Kutta d\'ordre 4).</p><h3>Vos données</h3><p>Les réponses au quiz sont mémorisées dans ce navigateur uniquement.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
