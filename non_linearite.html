<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}

.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}

.bars{display:flex;align-items:flex-end;gap:4px;height:176px;padding-top:4px}

.bcol{flex:1 1 0;max-width:54px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}

.bcol.scan .b{background:var(--accent);border-color:var(--accent-ink)}

.bcol.pivot .b{background:var(--bad);border-color:#8e1d15}

.bcol.empty .b{background:transparent;border:1px dashed var(--line)}
.leg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 6px}

.leg i.s{background:rgba(30,122,46,.75);border-color:var(--ok)}.leg i.c{background:var(--accent);border-color:var(--accent-ink)}.leg i.k{background:#e8a33a;border-color:var(--warn)}.leg i.m{background:var(--violet);border-color:#52308f}.leg i.p{background:var(--bad);border-color:#8e1d15}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.cell{width:40px;text-align:center}

.cell.scan .v{background:var(--accent);color:#fff;border-color:var(--accent)}

.cmpr em{font-style:normal;font-family:var(--font-mono);text-align:right}
.seqr{display:flex;gap:4px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font:600 12.5px var(--font-mono);background:#fff}
.card.t1{border-color:#2e6da4;color:#1b4a76}.card.t2{border-color:#9a5b00;color:#7a4700}.card.t3{border-color:#7b4fc2;color:#52308f}.card.t4{border-color:#1e7a2e;color:#1e7a2e}.card.t5{border-color:#c0281f;color:#8e1d15}.card.t6{border-color:#33475b;color:#33475b}

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'tp-nonlin-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }

/* ---------- utilitaires SVG ---------- */
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
const NS = 'http://www.w3.org/2000/svg';

/* ======================================================================
   ATELIERS
   ====================================================================== */

const WORKSHOPS = [];

/* ---- Atelier 1 : modélisation linéaire ---- */
const M1 = { id: 'm1', title: 'Modélisation linéaire', hint: 'Identifiez les blocs du moteur à courant continu et le capteur potentiométrique.', 
  mount: mountM1, reset: () => {} };

function mountM1(root) {
  root.innerHTML = '';
  root.append(h('h2', 'Modélisation linéaire du système Maxpid'));
  root.append(h('p', { html: 'Le système Maxpid est un bras motorisé par un <b>moteur à courant continu</b>, une <b>vis à billes</b> et un <b>mécanisme à trois barres</b>. Le modèle linéaire du moteur repose sur cinq équations.' }));
  root.append(h('h3', 'Les cinq équations du moteur à courant continu'));
  const eqs = [
    ['(1)', 'u(t) = e(t) + L·di/dt + R·i(t)', 'Équation électrique de l’induit'],
    ['(2)', 'c<sub>m</sub>(t) = K<sub>c</sub>·i(t)', 'Couple moteur proportionnel au courant'],
    ['(3)', 'e(t) = K<sub>e</sub>·ω<sub>m</sub>(t)', 'Force contre-électromotrice proportionnelle à la vitesse'],
    ['(4)', 'J·dω/dt = c<sub>m</sub>(t) − c<sub>pert</sub> − c<sub>f</sub>(t)', 'Équation mécanique de l’arbre moteur'],
    ['(5)', 'θ<sub>m</sub>(t) = ∫ω<sub>m</sub>(t)·dt', 'Relation cinématique de position']
  ];
  const tbl = h('table', { class: 'ctable' });
  tbl.append(h('thead', null, h('tr', null, ['N°', 'Équation', 'Rôle'].map(t => h('th', null, t)))));
  const tbody = h('tbody');
  eqs.forEach(e => tbody.append(h('tr', null, h('td', null, e[0]), h('td', { class: 'mono', html: e[1] }), h('td', null, e[2]))));
  tbl.append(tbody);
  root.append(tbl);
  root.append(h('h3', 'Schéma-bloc du modèle linéaire'));
  const svg = svgEl('svg', { viewBox: '0 0 720 220', width: '100%', style: 'max-width:720px;display:block;margin:8px auto;border:1px solid var(--line);border-radius:8px;background:#fff' });
  const blocks = [
    { x: 10, y: 90, w: 90, h: 50, t: 'Consigne', sub: 'θ<sub>c</sub>' },
    { x: 130, y: 90, w: 90, h: 50, t: 'Adaptateur', sub: 'IHM' },
    { x: 260, y: 90, w: 90, h: 50, t: 'Correcteur', sub: 'PI' },
    { x: 390, y: 90, w: 110, h: 50, t: 'Moteur CC', sub: '5 équations' },
    { x: 540, y: 90, w: 90, h: 50, t: 'Réducteur', sub: 'vis + bras' }
  ];
  blocks.forEach(b => {
    svg.append(svgEl('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 6, fill: '#f1f3f6', stroke: '#33475b', 'stroke-width': 1.2 }));
    const tx = svgEl('text', { x: b.x + b.w / 2, y: b.y + 22, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: '#111' });
    tx.textContent = b.t; svg.append(tx);
    const ts = svgEl('text', { x: b.x + b.w / 2, y: b.y + 38, 'text-anchor': 'middle', 'font-size': 10.5, fill: '#5a6068' });
    ts.textContent = b.sub.replace(/<[^>]+>/g, ''); svg.append(ts);
  });

  root.append(h('h3', 'Linéarisation sur [40°, 60°]'));

function betaPlotSVG() {
  const W = 560, H = 300, mx = 55, my = 40;
  const p = 4;
  const f = th => (2 * Math.PI / p) * (170 - 10 * Math.sqrt(177 + 112 * Math.cos(th * Math.PI / 180) - 128 * Math.sin(th * Math.PI / 180)));
  const thMin = 10, thMax = 85;
  const pts = [];
  for (let th = thMin; th <= thMax; th += 1) pts.push([th, f(th)]);
  const bMin = Math.min(...pts.map(q => q[1])) - 5, bMax = Math.max(...pts.map(q => q[1])) + 5;
  const x = th => mx + (th - thMin) / (thMax - thMin) * (W - 2 * mx);
  const y = b => H - my - (b - bMin) / (bMax - bMin) * (H - 2 * my);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: 'max-width:560px;display:block;margin:8px auto;border:1px solid var(--line);border-radius:8px;background:#fff' });
  // grille
  for (let th = thMin; th <= thMax; th += 15) {
    svg.append(svgEl('line', { x1: x(th), y1: my, x2: x(th), y2: H - my, stroke: '#e3e7ec', 'stroke-width': 1 }));
    const t = svgEl('text', { x: x(th), y: H - my + 16, 'text-anchor': 'middle', 'font-size': 10.5, fill: '#5a6068' });
    t.textContent = th + '°'; svg.append(t);
  }
  // axes
  svg.append(svgEl('line', { x1: mx, y1: H - my, x2: W - mx + 10, y2: H - my, stroke: '#33475b', 'stroke-width': 1.2 }));
  svg.append(svgEl('line', { x1: mx, y1: my - 5, x2: mx, y2: H - my, stroke: '#33475b', 'stroke-width': 1.2 }));
  const yl = svgEl('text', { x: mx + 4, y: my - 8, 'font-size': 11, fill: '#5a6068' }); yl.textContent = 'β (rad)'; svg.append(yl);
  const xl = svgEl('text', { x: W - mx + 4, y: H - my + 28, 'text-anchor': 'end', 'font-size': 11, fill: '#5a6068' }); xl.textContent = 'θ'; svg.append(xl);
  // courbe
  let d = '';
  pts.forEach((q, i) => { d += (i ? ' L ' : 'M ') + x(q[0]).toFixed(1) + ' ' + y(q[1]).toFixed(1); });
  svg.append(svgEl('path', { d, fill: 'none', stroke: '#2e6da4', 'stroke-width': 2.2 }));
  // zone de linéarisation
  const x40 = x(40), x60 = x(60);
  svg.append(svgEl('rect', { x: x40, y: my, width: x60 - x40, height: H - 2 * my, fill: 'rgba(46,109,164,0.08)', stroke: 'none' }));
  // droite de régression visuelle (pente locale)
  const b40 = f(40), b60 = f(60);
  const slope = (b60 - b40) / (60 - 40);
  const bAt = th => b40 + slope * (th - 40);
  const ld = `M ${x(40)} ${y(bAt(40))} L ${x(60)} ${y(bAt(60))}`;
  svg.append(svgEl('path', { d: ld, fill: 'none', stroke: '#c0281f', 'stroke-width': 2, 'stroke-dasharray': '6 4' }));
  const lt = svgEl('text', { x: x(50), y: y(bAt(50)) - 12, 'text-anchor': 'middle', 'font-size': 10.5, fill: '#c0281f', 'font-weight': 600 });
  lt.textContent = 'linéarisation'; svg.append(lt);
  return svg;
}

function deadzoneSVG() {
  const W = 480, H = 280, mx = 70, my = 40;
  const smax = 20, emax = 5;
  const x = e => mx + (e + emax) / (2 * emax) * (W - 2 * mx);

  svg.append(svgEl('path', { d: `M ${x(-emax)} ${y(-smax)} L ${x(-dead)} ${y(-0.3)} L ${x(dead)} ${y(0.3)} L ${x(emax)} ${y(smax)}`, fill: 'none', stroke: '#2e6da4', 'stroke-width': 2.2 }));

function pumpingSVG() {
  const W = 520, H = 240, mx = 55, my = 40;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: 'max-width:520px;display:block;margin:8px auto;border:1px solid var(--line);border-radius:8px;background:#fff' });
  svg.append(svgEl('line', { x1: mx, y1: H - my, x2: W - mx + 10, y2: H - my, stroke: '#33475b', 'stroke-width': 1.2 }));
  svg.append(svgEl('line', { x1: mx, y1: my - 10, x2: mx, y2: H - my, stroke: '#33475b', 'stroke-width': 1.2 }));
  const xl = svgEl('text', { x: W - mx, y: H - my + 16, 'text-anchor': 'end', 'font-size': 11, fill: '#5a6068' }); xl.textContent = 't'; svg.append(xl);
  const yl = svgEl('text', { x: mx + 4, y: my - 12, 'font-size': 11, fill: '#5a6068' }); yl.textContent = 'θ'; svg.append(yl);
  const thc = H / 2 + 10;
  svg.append(svgEl('line', { x1: mx + 10, y1: thc, x2: W - mx, y2: thc, stroke: '#1e7a2e', 'stroke-width': 1.2, 'stroke-dasharray': '5 3' }));
  const cons = svgEl('text', { x: W - mx - 4, y: thc - 6, 'text-anchor': 'end', 'font-size': 10, fill: '#1e7a2e' }); cons.textContent = 'consigne'; svg.append(cons);
  let d = '';
  for (let i = 0; i <= 300; i++) {
    const t = i / 300 * 6 * Math.PI;
    const decay = Math.exp(-0.08 * i / 300 * 6 * Math.PI);
    const val = thc - 55 * decay * Math.sin(t * 1.6);
    const px = mx + 10 + (W - 2 * mx - 10) * i / 300;
    d += (i ? ' L ' : 'M ') + px.toFixed(1) + ' ' + val.toFixed(1);
  }
  svg.append(svgEl('path', { d, fill: 'none', stroke: '#c0281f', 'stroke-width': 2 }));
  const ttl = svgEl('text', { x: mx + 12, y: my, 'font-size': 11, fill: '#c0281f', 'font-weight': 600 }); ttl.textContent = 'oscillation de pompage (amortie)'; svg.append(ttl);
  return svg;
}

COURSE.push({ id: 'intro', t: 'Limitations des méthodes linéaires', h: `
<p><b>Un système est linéaire</b> s’il est décrit par des équations différentielles linéaires d’ordre fini à coefficients constants. On peut alors appliquer le principe de superposition : la sortie est une combinaison linéaire des réponses aux différentes entrées.</p>
<p>Cette linéarité se traduit par une <b>courbe caractéristique linéaire passant par l’origine</b>. On peut alors associer au système un modèle de connaissance dans le domaine temporel ou de Laplace, et utiliser les méthodes des SLCI.</p>
<h3>En pratique, aucun système n’est complètement linéaire</h3>
<ul>
<li>Certains constituants sont impossibles à modéliser par des modèles linéaires (diode, seuil, saturation…).</li>
<li>Certains phénomènes ne peuvent pas être décrits par des modèles linéaires (adhérence, frottement sec, hystérésis…).</li>
<li>Les méthodes linéaires ne sont donc applicables que dans un <b>domaine de fonctionnement restreint</b>.</li>
</ul>
<div class="retain"><b>À retenir.</b> Un système non linéaire ne peut pas être décrit par des équations différentielles linéaires à coefficients constants. Il n’existe pas de théorie générale : on utilise des méthodes adaptées à chaque classe de comportement.</div>` });

COURSE.push({ id: 'nonlin', t: 'Non-linéarités dans les systèmes asservis', h: `
<p>La caractéristique entrée/sortie d’un système présente fréquemment des distorsions dues aux non-linéarités. On distingue :</p>
<ul>
<li><b>Les non-linéarités continues</b> (courbures) : on mène alors des études locales (linéarisation autour d’un point de fonctionnement).</li>
<li><b>Les non-linéarités discontinues</b> :
  <ul>
    <li>les <b>saturations</b> : au-delà d’une valeur maximale, la sortie ne peut plus augmenter ;</li>
    <li>les <b>seuils</b> : il faut dépasser une valeur minimale pour que la sortie réagisse ;</li>
    <li>les <b>hystérésis</b> : la sortie dépend de l’histoire du système.</li>
  </ul>
</li>
</ul>
<h3>Exemples</h3>
<ul>
<li>Une alimentation, un amplificateur ont nécessairement une tension maximale : c’est une saturation.</li>
<li>Un pont de redressement présente des seuils dus aux diodes.</li>
<li>Le comportement élastique des matériaux, l’électromagnétisme présentent des non-linéarités continues.</li>
</ul>
<div class="retain"><b>À retenir.</b> Les non-linéarités discontinues (saturation, seuil, hystérésis) sont les plus fréquentes dans les asservissements. Elles dégradent les performances et peuvent provoquer des cycles limites.</div>` });

COURSE.push({ id: 'modele', t: 'Modélisation du moteur à courant continu', h: `
<p>Le moteur à courant continu est modélisé par <b>cinq équations</b> dans son régime linéaire :</p>
<div class="formula">(1) u(t) = e(t) + L·di/dt + R·i(t)</div>
<div class="formula">(2) c<sub>m</sub>(t) = K<sub>c</sub>·i(t)</div>
<div class="formula">(3) e(t) = K<sub>e</sub>·ω<sub>m</sub>(t)</div>
<div class="formula">(4) J·dω/dt = c<sub>m</sub>(t) − c<sub>pert</sub> − c<sub>f</sub>(t)</div>
<div class="formula">(5) θ<sub>m</sub>(t) = ∫ω<sub>m</sub>(t)·dt</div>
<h3>Schéma-bloc</h3>
<p>Le schéma-bloc fait apparaître :</p>
<ul>
<li>la <b>chaîne directe</b> : consigne → adaptateur → correcteur → moteur → réducteur → bras ;</li>
<li>la <b>chaîne de retour</b> : capteur potentiométrique + conversion A/N.</li>
</ul>
<p>Dans le modèle Maxpid, le gain du capteur et de la conversion A/N est intégré dans la chaîne directe, ce qui conduit à un <b>retour unitaire</b>.</p>
<div class="retain"><b>À retenir.</b> Le modèle linéaire du moteur CC permet d’appliquer les méthodes des SLCI. Il n’est valable que dans un domaine restreint de fonctionnement.</div>` });

COURSE.push({ id: 'linea', t: 'Linéarisation', h: `
<p>La loi entrée-sortie du mécanisme Maxpid est :</p>
<div class="formula">β = (2π / p) · (170 − 10·√(177 + 112·cos θ − 128·sin θ))</div>
<p>Cette relation n’est <b>pas linéaire</b> : elle contient un cosinus, un sinus et une racine carrée.</p>
<h3>Principe de la linéarisation</h3>
<p>Sur une plage restreinte [40°, 60°], on approche la courbe par une <b>droite de régression</b> :</p>
<div class="formula">y = 107,327·x − 1109,625</div>
<p>Le coefficient directeur vaut 107,327. On en déduit le gain statique équivalent :</p>
<div class="formula">K<sub>es</sub> = Δθ / Δβ = 1 / 107 ≈ 9,35·10<sup>−3</sup></div>
<p>Cette linéarisation permet d’utiliser les outils des SLCI sur la plage de fonctionnement considérée.</p>
<div class="retain"><b>À retenir.</b> La linéarisation consiste à approcher localement une caractéristique non linéaire par une droite. Elle n’est valable que sur une plage restreinte autour du point de fonctionnement.</div>` });

COURSE.push({ id: 'saturation', t: 'La saturation', h: `
<p>La <b>saturation</b> est une non-linéarité discontinue : au-delà d’une valeur maximale, la sortie ne peut plus augmenter.</p>
<h3>Sur le système Maxpid</h3>
<p>La tension d’alimentation du moteur est limitée à <b>21,6 V</b> pendant <b>1,5 s</b>. Pendant cette phase, la vitesse de rotation est constante et la position angulaire évolue linéairement.</p>
<h3>Effet de K<sub>p</sub> sur les performances (modèle linéaire)</h3>

</tbody></table>
<h3>Conséquences</h3>

</ul>
<div class="retain"><b>À retenir.</b> La saturation est une non-linéarité discontinue qui limite la tension de commande. Elle dégrade la rapidité mais pas le régime permanent.</div>` });

COURSE.push({ id: 'seuil', t: 'Seuil et bande morte', h: `
<p>Le <b>seuil</b> et la <b>bande morte</b> sont des non-linéarités discontinues qui modélisent les phénomènes d’adhérence et de frottement.</p>
<h3>Frottement et adhérence</h3>
<ul>
<li>Le <b>frottement</b> s’oppose au mouvement : il peut être linéarisé (frottement visqueux) ou non (frottement sec).</li>
<li>L’<b>adhérence</b> (stiction) bloque le système tant que l’effort n’a pas atteint un seuil : c’est un phénomène non linéaire.</li>
</ul>
<h3>Modélisation</h3>
<ul>
<li>Le bloc <b>seuil</b> modélise l’adhérence seule : une fois le seuil franchi, la courbe redevient linéaire.</li>
<li>Le bloc <b>bande morte</b> modélise l’adhérence et le frottement : le décalage subsiste même en mouvement.</li>
</ul>
<h3>Protocole expérimental</h3>
<ul>
<li>Faire une succession d’essais en boucle ouverte en augmentant l’échelon de consigne jusqu’au début du mouvement.</li>
<li>Ou faire un essai avec une consigne en rampe et relever le courant pour lequel le système se met en mouvement.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le seuil modélise l’adhérence seule ; la bande morte modélise adhérence + frottement. Ces non-linéarités expliquent l’erreur statique et le blocage à faible sollicitation.</div>` });

COURSE.push({ id: 'pi', t: 'Correcteur PI et pompage', h: `
<p>Le correcteur implanté dans la carte de commande est un <b>correcteur proportionnel-intégral</b> :</p>
<div class="formula">C(p) = (2 / 255) · (K<sub>p</sub> + K<sub>I</sub> / (4p))</div>
<h3>Rôle du terme intégral</h3>
<p>L’intégrateur accumule l’erreur : tant que l’erreur n’est pas nulle, sa sortie augmente. Il permet d’annuler l’erreur statique en régime permanent.</p>
<h3>Phénomène de pompage</h3>
<p>Avec K<sub>p</sub> = 50 et K<sub>I</sub> = 10, on observe un <b>pompage</b> : la position angulaire oscille autour de la consigne. Le cycle est le suivant :</p>
<ol>
<li>L’intégrateur charge tant que l’erreur persiste.</li>
<li>Tant que la commande est inférieure au seuil, le moteur ne bouge pas.</li>
<li>La commande franchit le seuil : le moteur démarre brutalement.</li>
<li>Le bras dépasse la consigne ; l’intégrateur se décharge.</li>
<li>La commande redescend sous le seuil ; le moteur s’arrête.</li>
<li>Le cycle recommence.</li>
</ol>
<div class="retain"><b>À retenir.</b> Le correcteur intégral et le seuil ont un rôle conjugué : l’intégrateur pousse la commande jusqu’au seuil, ce qui provoque un cycle limite (pompage).</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>SLCI</dt><dd>Système Linéaire Continu Invariant.</dd>
<dt>Linéarisation</dt><dd>Approximation locale d’une caractéristique non linéaire par une droite.</dd>
<dt>Saturation</dt><dd>Non-linéarité discontinue : la sortie est limitée à une valeur maximale.</dd>
<dt>Seuil</dt><dd>Non-linéarité discontinue : il faut dépasser une valeur minimale pour que la sortie réagisse.</dd>
<dt>Bande morte</dt><dd>Non-linéarité discontinue : zone où la sortie est nulle ou constante.</dd>
<dt>Adhérence (stiction)</dt><dd>Blocage du système tant que l’effort n’a pas atteint un seuil.</dd>
<dt>Cycle limite</dt><dd>Oscillation entretenue due à l’interaction entre une non-linéarité et un correcteur.</dd>
<dt>Pompage</dt><dd>Cycle limite dû à l’interaction entre un correcteur intégral et un seuil.</dd>
<dt>K<sub>es</sub></dt><dd>Gain statique équivalent après linéarisation.</dd>
<dt>Régime permanent</dt><dd>État du système après disparition des transitoires.</dd>
</dl>` });

/* ======================================================================
   INTERFACE
   ====================================================================== */

const UI = { cur: 'm1' };
const AS = { key: 'm1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'intro' };

function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => {
    seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title));
  });
}

function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint;
  root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}

function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}

function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false');
  btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time));
    body.append(h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) {
        b.textContent = 'Confirmer ? Votre travail sera effacé';
        AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500);
        return;
      }
      clearTimeout(AS.arm); AS.arm = null;
      wsById(UI.cur).reset();
      mountWs(); renderAct();
    } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}

function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }

function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false');
  btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Aller à une section', onchange: e => go(e.target.value) }, COURSE.map(s => h('option', { value: s.id, selected: s.id === cur.id }, s.t)));
  const body = h('div', { class: 'cbody' });
  body.append(h('p', { class: 'ckick' }, 'Cours · TP non-linéarités'));
  body.append(h('h2', null, cur.t));
  const content = h('div'); content.innerHTML = cur.h;
  body.append(content);
  const cpn = h('div', { class: 'cpn' });
  if (idx > 0) cpn.append(h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t));
  cpn.append(h('span'));
  if (idx < COURSE.length - 1) cpn.append(h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →'));
  body.append(cpn);
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours'), h('button', { class: 'btn', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Fermer'));
  box.append(top);
  const wrap = h('div', { class: 'cwrap' }, nav, body);
  box.append(sel); box.append(wrap);
}
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });
function openCourse(id) { CS.open = true; CS.id = id; renderCourse(); }

$('#bHelp').addEventListener('click', () => {
  const dlg = $('#dlg'); dlg.hidden = false;
  dlg.innerHTML = '';
  const box = h('div', { class: 'dlgbox' },
    h('header', null, h('b', null, 'Aide'), h('button', { class: 'btn sm', type: 'button', onclick: () => { dlg.hidden = true; } }, 'Fermer')),
    h('div', { class: 'dbody', html: `
      <p><b>TP : prise en compte des non-linéarités</b> — PSI*, sciences industrielles de l’ingénieur.</p>
      <p>Cette page reprend le TP sur le système Maxpid : modélisation linéaire, linéarisation, saturation, seuil et bande morte, correcteur PI et pompage.</p>
      <h3>Navigation</h3>
      <ul>
        <li>Les onglets <b>1 à 5</b> en haut ouvrent les ateliers.</li>
        <li>Le bouton <b>Activité</b> ouvre le panneau de droite avec les consignes et le QCM.</li>
        <li>Le bouton <b>Cours</b> affiche le cours complet avec sommaire.</li>
        <li>Les QCM se corrigent automatiquement et le score s’affiche.</li>
      </ul>
      <h3>Les ateliers</h3>
      <ol>
        <li><b>Modélisation linéaire</b> : les cinq équations du moteur CC, le schéma-bloc.</li>
        <li><b>Linéarisation</b> : la loi β(θ), la régression sur [40°, 60°], K<sub>es</sub>.</li>
        <li><b>Saturation</b> : effet de K<sub>p</sub>, tension maximale, bloc saturation.</li>
        <li><b>Seuil et bande morte</b> : frottement, adhérence, protocole expérimental.</li>
        <li><b>Correcteur PI et pompage</b> : rôle conjugué de l’intégrateur et du seuil.</li>
      </ol>
      <p>Les figures sont des schémas de principe : les valeurs numériques (K<sub>es</sub> ≈ 1/107, U<sub>max</sub> = 21,6 V) sont celles du TP et de son corrigé.</p>` }));
  dlg.append(box);
});

/* ---------- démarrage ---------- */
renderSeg();
mountWs();
renderAct();
</script>
</body>
</html>
