<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Correcteurs numériques — SII CPGE 1re année</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:180px;max-width:100%}
.opts select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0;max-height:340px}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dt thead th{background:var(--panel2);font-weight:600;position:sticky;top:0}
.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.dt tr:last-child td{border-bottom:0}
.plot{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.plot-wrap{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;margin:8px 0}
.plot-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 2px}
.plot-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.recur{background:var(--panel2);border-left:3px solid var(--accent);padding:9px 12px;margin:8px 0;font-family:var(--font-mono);font-size:13.5px;overflow-x:auto;white-space:pre}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .opts input[type=range]{width:150px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
</style></head><body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="12" width="20" height="2" fill="var(--accent)"/><rect x="3" y="6" width="3" height="14" fill="var(--accent)"/><rect x="20" y="6" width="3" height="14" fill="var(--accent)"/><circle cx="9" cy="13" r="2" fill="var(--bad)"/><circle cx="17" cy="13" r="2" fill="var(--ok)"/></svg><span>Correcteurs numériques <small>SII · CPGE 1<sup>re</sup> année</small></span></div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>
  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'sii-num-corr-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const WORKSHOPS = [];

/* ---------- utilitaires ---------- */
const fmt = (v, d) => isFinite(v) ? (+v).toFixed(d == null ? 3 : d).replace('.', ',') : '—';
const SUPD = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺'};
function sup(n) { return String(n).split('').map(c => SUPD[c] || c).join(''); }
function niceStep(range, target) {
  const raw = range / target;
  const exp = Math.floor(Math.log10(raw));
  const base = Math.pow(10, exp);
  const m = raw / base;
  if (m < 1.5) return base;
  if (m < 3.5) return 2 * base;
  if (m < 7.5) return 5 * base;
  return 10 * base;
}
function plot(W, H, xr, yr) {
  const ml = 52, mr = 16, mt = 14, mb = 32;
  const iw = W - ml - mr, ih = H - mt - mb;
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, class: 'plot' });
  svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.display = 'block';
  const toX = x => ml + (x - xr[0]) / (xr[1] - xr[0]) * iw;
  const toY = y => mt + (yr[1] - y) / (yr[1] - yr[0]) * ih;
  const g0 = sv('g'); svg.append(g0);
  const xs = niceStep(xr[1] - xr[0], 6), ys = niceStep(yr[1] - yr[0], 5);
  for (let x = Math.ceil(xr[0] / xs) * xs; x <= xr[1] + 1e-9; x += xs)
    g0.append(sv('line', { x1: toX(x), y1: mt, x2: toX(x), y2: mt + ih, stroke: '#e8ebef', 'stroke-width': 1 }));
  for (let y = Math.ceil(yr[0] / ys) * ys; y <= yr[1] + 1e-9; y += ys)
    g0.append(sv('line', { x1: ml, y1: toY(y), x2: ml + iw, y2: toY(y), stroke: '#e8ebef', 'stroke-width': 1 }));
  if (xr[0] <= 0 && xr[1] >= 0) g0.append(sv('line', { x1: toX(0), y1: mt, x2: toX(0), y2: mt + ih, stroke: '#5a6068', 'stroke-width': 1 }));
  if (yr[0] <= 0 && yr[1] >= 0) g0.append(sv('line', { x1: ml, y1: toY(0), x2: ml + iw, y2: toY(0), stroke: '#5a6068', 'stroke-width': 1 }));
  for (let x = Math.ceil(xr[0] / xs) * xs; x <= xr[1] + 1e-9; x += xs) {
    if (Math.abs(x) < xs * 0.01) continue;
    g0.append(sv('text', { x: toX(x), y: mt + ih + 15, 'text-anchor': 'middle', 'font-size': 11, fill: '#5a6068', 'font-family': 'IBM Plex Mono, monospace' }, String(+x.toFixed(2)).replace('.', ',')));
  }
  for (let y = Math.ceil(yr[0] / ys) * ys; y <= yr[1] + 1e-9; y += ys) {
    if (Math.abs(y) < ys * 0.01) continue;
    g0.append(sv('text', { x: ml - 5, y: toY(y) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#5a6068', 'font-family': 'IBM Plex Mono, monospace' }, String(+y.toFixed(2)).replace('.', ',')));
  }
  g0.append(sv('text', { x: ml + iw, y: mt + ih + 28, 'text-anchor': 'end', 'font-size': 11, fill: '#5a6068' }, 'x'));
  g0.append(sv('text', { x: ml - 30, y: mt + 10, 'font-size': 11, fill: '#5a6068' }, 'y'));
  const pg = sv('g'); svg.append(pg);
  return {
    svg, toX, toY, g: pg, mt, mb, ml, mr, iw, ih, xr, yr,
    band(x1, x2, color) {
      let px1 = Math.max(ml, Math.min(ml + iw, toX(x1)));
      let px2 = Math.max(ml, Math.min(ml + iw, toX(x2)));
      if (px2 < px1) [px1, px2] = [px2, px1];
      if (px2 - px1 < 0.5) return;
      pg.append(sv('rect', { x: px1, y: mt, width: px2 - px1, height: ih, fill: color || 'rgba(46,109,164,0.10)' }));
    },
    curve(f, color, width) {
      let d = '', started = false;
      const N = 240;
      for (let i = 0; i <= N; i++) {
        const x = xr[0] + (xr[1] - xr[0]) * i / N;
        let y = f(x);
        if (!isFinite(y)) { started = false; continue; }
        if (y < yr[0]) y = yr[0]; if (y > yr[1]) y = yr[1];
        d += (started ? 'L' : 'M') + toX(x).toFixed(2) + ' ' + toY(y).toFixed(2) + ' ';
        started = true;
      }
      pg.append(sv('path', { d, fill: 'none', stroke: color || '#2e6da4', 'stroke-width': width || 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    },
    polyline(pts, color, width, dash) {
      const d = pts.filter(p => p).map((p, i) => (i ? 'L' : 'M') + toX(p[0]).toFixed(2) + ' ' + toY(p[1]).toFixed(2)).join(' ');
      pg.append(sv('path', { d, fill: 'none', stroke: color || '#1e7a2e', 'stroke-width': width || 2, 'stroke-dasharray': dash || '' }));
    },
    point(x, y, color, r, shape) {
      if (shape === 'square') {
        pg.append(sv('rect', { x: toX(x) - (r||3), y: toY(y) - (r||3), width: 2*(r||3), height: 2*(r||3), fill: color || '#c0281f', stroke: '#fff', 'stroke-width': 1.2 }));
      } else {
        pg.append(sv('circle', { cx: toX(x), cy: toY(y), r: r || 4.5, fill: color || '#c0281f', stroke: '#fff', 'stroke-width': 1.5 }));
      }
    },
    vline(x, color, dash, width) {
      pg.append(sv('line', { x1: toX(x), y1: mt, x2: toX(x), y2: mt + ih, stroke: color || '#c0281f', 'stroke-width': width || 1.5, 'stroke-dasharray': dash || '4 3' }));
    },
    hline(y, color, dash, width) {
      pg.append(sv('line', { x1: ml, y1: toY(y), x2: ml + iw, y2: toY(y), stroke: color || '#9a5b00', 'stroke-width': width || 1.5, 'stroke-dasharray': dash || '4 3' }));
    },
    seg(x1, y1, x2, y2, color, width, dash) {
      pg.append(sv('line', { x1: toX(x1), y1: toY(y1), x2: toX(x2), y2: toY(y2), stroke: color || '#7b4fc2', 'stroke-width': width || 2, 'stroke-dasharray': dash || '' }));
    },
    text(x, y, str, opts) {
      opts = opts || {};
      pg.append(sv('text', { x: toX(x), y: toY(y), 'text-anchor': opts.anchor || 'middle', 'font-size': opts.size || 11, fill: opts.color || '#111', 'font-family': 'IBM Plex Mono, monospace', 'font-weight': opts.weight || 500 }, str));
    }
  };

const F2 = { Kp: 2, K: 1, tau: 1, Te: 0.05, Tmax: 8 };
function simulateP(Kp, K, tau, Te, Tmax) {
  const N = Math.floor(Tmax / Te);
  const ys = [0];
  let y = 0;
  for (let n = 0; n < N; n++) {
    const e = 1 - y;
    const u = Kp * e;
    y = y + (Te / tau) * (K * u - y);
    ys.push(y);
  }
  return { ys, N, Te };
}
function analyze(ys, Te, r) {
  const final = ys[ys.length - 1];
  const err = Math.abs(r - final);
  let maxY = -Infinity;
  ys.forEach(v => { if (v > maxY) maxY = v; });
  const overshoot = Math.max(0, (maxY - r) / r * 100);
  let settling = -1;
  for (let i = 0; i < ys.length; i++) {
    let ok = true;
    for (let j = i; j < ys.length; j++) { if (Math.abs(ys[j] - r) > 0.02 * r) { ok = false; break; } }
    if (ok) { settling = i * Te; break; }
  }
  return { err, overshoot, settling, final };
}

function simulatePI(Kp, Ki, K, tau, Te, Tmax) {
  const N = Math.floor(Tmax / Te);
  const ys = [0], us = [0], es = [1];
  let y = 0, e_prev = 1, u_prev = 0;
  for (let n = 0; n < N; n++) {
    const e = 1 - y;
    const u = u_prev + Kp * (e - e_prev) + Ki * Te * e;
    y = y + (Te / tau) * (K * u - y);
    ys.push(y); us.push(u); es.push(e);
    e_prev = e; u_prev = u;
  }

}

const F4 = { tau: 0.5, a: 3, K: 1, plantK: 1, plantTau: 1, plantTd: 0.5, Te: 0.05, Tmax: 10 };
function computePACoeffs(tau, a, K, Te) {
  const A = 2 * a * tau / Te;
  const B = 2 * tau / Te;
  const b0 = K * (1 + A) / (1 + B);
  const b1 = K * (1 - A) / (1 + B);
  const a1 = (1 - B) / (1 + B);
  return { b0, b1, a1, A, B };
}
function simulatePAPlant(plantK, plantTau, plantTd, corr, Te, Tmax, mode, KpP) {
  const N = Math.floor(Tmax / Te);
  const delayN = Math.max(0, Math.round(plantTd / Te));
  const uBuf = new Array(N + 1).fill(0);
  const ys = [0];
  let y = 0, e_prev = 0, u_prev = 0;
  for (let n = 0; n < N; n++) {
    const e = 1 - y;
    let u;
    if (mode === 'PA') {
      u = -corr.a1 * u_prev + corr.b0 * e + corr.b1 * e_prev;
    } else {
      u = KpP * e;
    }
    uBuf[n] = u;
    const uDelayed = n >= delayN ? uBuf[n - delayN] : 0;
    y = y + (Te / plantTau) * (plantK * uDelayed - y);
    ys.push(y);
    e_prev = e; u_prev = u;
  }
  return { ys, N, Te };
}
function bodePACorr(corr) {
  // C(z) = (b0 + b1·z⁻¹)/(1 + a1·z⁻¹), z⁻¹ = e^{-jωTe}
  const pts = [];
  const N = 200;
  for (let i = 1; i <= N; i++) {
    const nu = i / N * 0.5;             // f/fe dans ]0, 0.5]
    const omegaTe = 2 * Math.PI * nu;
    const zre = Math.cos(omegaTe), zim = -Math.sin(omegaTe);
    const numRe = corr.b0 + corr.b1 * zre;
    const numIm = corr.b1 * zim;
    const denRe = 1 + corr.a1 * zre;
    const denIm = corr.a1 * zim;
    const denSq = denRe * denRe + denIm * denIm;
    const hRe = (numRe * denRe + numIm * denIm) / denSq;
    const hIm = (numIm * denRe - numRe * denIm) / denSq;
    const mag = Math.sqrt(hRe * hRe + hIm * hIm);
    const phase = Math.atan2(hIm, hRe) * 180 / Math.PI;
    pts.push({ nu, mag, magDB: 20 * Math.log10(mag), phase });
  }
  return pts;
}

    '<p>Le correcteur à avance de phase ajoute de la phase positive autour d\'une fréquence de travail. Il est utilisé pour <b>augmenter la marge de phase</b> et ainsi permettre un gain plus élevé sans déstabiliser.</p>' +
    '<div class="formula">C(p) = K · (1 + a·τ·p) / (1 + τ·p), &nbsp; a &gt; 1</div>' +
    '<div class="opts"><label class="fld"><span>Constante τ = <b id="f4-tau-out"></b> s</span><input type="range" id="f4-tau" min="0.1" max="2" step="0.05" aria-label="tau"></label>' +
    '<label class="fld"><span>Coefficient a = <b id="f4-a-out"></b></span><input type="range" id="f4-a" min="1.2" max="10" step="0.1" aria-label="a"></label>' +
    '<label class="fld"><span>Gain K = <b id="f4-K-out"></b></span><input type="range" id="f4-K" min="0.5" max="3" step="0.1" aria-label="K"></label>' +
    '<label class="fld"><span>Retard système T<sub>d</sub> = <b id="f4-Td-out"></b> s</span><input type="range" id="f4-Td" min="0" max="1.5" step="0.05" aria-label="Td"></label>' +
    '<label class="fld"><span>Constante système τ<sub>s</sub> = <b id="f4-ts-out"></b> s</span><input type="range" id="f4-ts" min="0.3" max="2" step="0.1" aria-label="tau_s"></label></div>' +
    '<div class="plot-wrap"><div class="plot-legend"><span><i style="background:#7b4fc2"></i>phase du correcteur</span></div><div id="f4-bode"></div></div>' +
    '<div class="plot-wrap"><div class="plot-legend"><span><i style="background:#5a6068"></i>consigne</span><span><i style="background:#2e6da4"></i>sortie avec correcteur PA</span><span><i style="background:#c0281f"></i>sortie avec P seul (même gain DC)</span></div><div id="f4-plot"></div></div>' +
    '<div class="verdict" id="f4-msg" aria-live="polite"></div>' +
    '<div id="f4-stats"></div>' +
    recurrenceBlock('Équation de récurrence (Tustin)', 'b<sub>0</sub> = K·(1 + 2aτ/T<sub>e</sub>)/(1 + 2τ/T<sub>e</sub>)\nb<sub>1</sub> = K·(1 − 2aτ/T<sub>e</sub>)/(1 + 2τ/T<sub>e</sub>)\na<sub>1</sub> = (1 − 2τ/T<sub>e</sub>)/(1 + 2τ/T<sub>e</sub>)\n\nu[n] = −a<sub>1</sub>·u[n−1] + b<sub>0</sub>·e[n] + b<sub>1</sub>·e[n−1]') +
    codeBlock(`def correcteur_avance_coeffs(tau, a, K, Te):
    """Coefficients (b0, b1, a1) du correcteur à avance de phase
    C(p) = K·(1 + a·τ·p)/(1 + τ·p), discrétisé par Tustin."""
    A = 2 * a * tau / Te
    B = 2 * tau / Te
    b0 = K * (1 + A) / (1 + B)
    b1 = K * (1 - A) / (1 + B)
    a1 = (1 - B) / (1 + B)
    return b0, b1, a1

def correcteur_avance(e, e_prev, u_prev, b0, b1, a1):
    """Récurrence u[n] = -a1·u[n-1] + b0·e[n] + b1·e[n-1]."""
    return -a1 * u_prev + b0 * e + b1 * e_prev`);
  ['tau','a','K','Td','ts'].forEach(k => {
    const id = '#f4-' + (k === 'ts' ? 'ts' : k);
    $(id).value = F4[k === 'ts' ? 'plantTau' : k === 'Td' ? 'plantTd' : k];
  });
  $('#f4-tau').addEventListener('input', e => { F4.tau = +e.target.value; drawF4(); });
  $('#f4-a').addEventListener('input', e => { F4.a = +e.target.value; drawF4(); });
  $('#f4-K').addEventListener('input', e => { F4.K = +e.target.value; drawF4(); });
  $('#f4-Td').addEventListener('input', e => { F4.plantTd = +e.target.value; drawF4(); });
  $('#f4-ts').addEventListener('input', e => { F4.plantTau = +e.target.value; drawF4(); });
  drawF4();
}
function drawF4() {
  $('#f4-tau-out').textContent = fmt(F4.tau, 2);
  $('#f4-a-out').textContent = fmt(F4.a, 1);
  $('#f4-K-out').textContent = fmt(F4.K, 1);
  $('#f4-Td-out').textContent = fmt(F4.plantTd, 2);
  $('#f4-ts-out').textContent = fmt(F4.plantTau, 2);
  const corr = computePACoeffs(F4.tau, F4.a, F4.K, F4.Te);
  // Bode
  const bode = bodePACorr(corr);
  const phaseMax = Math.max(...bode.map(p => p.phase));
  const phaseMin = Math.min(...bode.map(p => p.phase), 0);
  const P = plot(640, 260, [0, 0.5], [Math.floor(phaseMin / 5) * 5, Math.ceil(phaseMax / 5) * 5 + 2]);
  P.hline(0, '#5a6068', '', 1);
  P.polyline(bode.map(p => [p.nu, p.phase]), '#7b4fc2', 2);
  $('#f4-bode').innerHTML = ''; $('#f4-bode').append(P.svg);
  // Réponse en boucle fermée
  const dcGain = (corr.b0 + corr.b1) / (1 + corr.a1);
  const R_PA = simulatePAPlant(F4.plantK, F4.plantTau, F4.plantTd, corr, F4.Te, F4.Tmax, 'PA');
  const R_P  = simulatePAPlant(F4.plantK, F4.plantTau, F4.plantTd, corr, F4.Te, F4.Tmax, 'P', dcGain);
  const ymax = Math.max(1.1, ...R_PA.ys, ...R_P.ys);
  const P2 = plot(640, 300, [0, F4.Tmax], [0, ymax * 1.08]);
  P2.hline(1, '#5a6068', '6 4', 1.5);
  P2.polyline(R_P.ys.map((v, i) => [i * R_P.Te, v]), '#c0281f', 1.8, '5 3');
  P2.polyline(R_PA.ys.map((v, i) => [i * R_PA.Te, v]), '#2e6da4', 2.2);
  $('#f4-plot').innerHTML = ''; $('#f4-plot').append(P2.svg);
  const A_PA = analyze(R_PA.ys, R_PA.Te, 1);
  const A_P  = analyze(R_P.ys, R_P.Te, 1);
  // fréquence du maximum de phase
  let fMax = 0, phaseMaxVal = -Infinity;
  bode.forEach(p => { if (p.phase > phaseMaxVal) { phaseMaxVal = p.phase; fMax = p.nu; } });
  $('#f4-stats').innerHTML = '';
  $('#f4-stats').append(stats([
    ['a', fmt(F4.a, 2)],
    ['τ', fmt(F4.tau, 2) + ' s'],
    ['Gain DC C(1)', fmt(dcGain, 3)],
    ['Phase max', fmt(phaseMaxVal, 1) + '°'],
    ['f à phase max (f/f<sub>e</sub>)', fmt(fMax, 3)],
    ['Dépassement PA', fmt(A_PA.overshoot, 1) + ' %'],
    ['Dépassement P seul', fmt(A_P.overshoot, 1) + ' %']
  ]));
  const msg = $('#f4-msg');
  if (phaseMaxVal < 10) {
    msg.className = 'verdict warn';
    msg.innerHTML = 'Avec a = ' + fmt(F4.a, 1) + ', l\'avance de phase est faible (' + fmt(phaseMaxVal, 1) + '°). Augmentez a pour obtenir plus de phase.';
  } else if (A_PA.overshoot > A_P.overshoot + 10) {
    msg.className = 'verdict warn';
    msg.innerHTML = 'Le correcteur PA donne ici un dépassement (' + fmt(A_PA.overshoot, 1) + ' %) plus important que le P seul. Ajustez a et τ.';
  } else {
    msg.className = 'verdict yes';
    msg.innerHTML = 'Avance de phase maximale : <b>' + fmt(phaseMaxVal, 1) + '°</b> à f/f<sub>e</sub> ≈ ' + fmt(fMax, 3) + '. Le dépassement passe de ' + fmt(A_P.overshoot, 1) + ' % (P seul) à ' + fmt(A_PA.overshoot, 1) + ' % (PA) : la réponse est plus amortie.';
  }
}

const COURSE = [];
COURSE.push({ id: 'echantillonnage', t: 'Échantillonnage et quantification', h: `
<p>Un <b>signal à temps discret</b> est une suite de valeurs s[0], s[1], s[2], … obtenues en prélevant un signal continu s(t) à des instants régulièrement espacés.</p>
<h3>Échantillonnage</h3>
<div class="formula">s[n] = s(n·T<sub>e</sub>), &nbsp; f<sub>e</sub> = 1/T<sub>e</sub></div>
<p>T<sub>e</sub> est la <b>période d'échantillonnage</b>, f<sub>e</sub> la <b>fréquence d'échantillonnage</b>. Le signal s[n] ne contient plus que les informations prélevées aux instants n·T<sub>e</sub> : entre deux échantillons, on ne sait rien.</p>
<h3>Théorème de Shannon-Nyquist</h3>
<p>Pour pouvoir reconstruire exactement un signal dont le spectre est limité à f<sub>max</sub>, il faut :</p>
<div class="formula">f<sub>e</sub> &gt; 2·f<sub>max</sub> &nbsp;&nbsp;(ou&nbsp;&nbsp; f<sub>max</sub> &lt; f<sub>N</sub> = f<sub>e</sub>/2)</div>
<p>f<sub>N</sub> = f<sub>e</sub>/2 est la <b>fréquence de Nyquist</b>. Si f &gt; f<sub>N</sub>, il y a <b>repliement spectral</b> (aliasing) : le signal échantillonné semble décrire une fréquence f<sub>alias</sub> = |f − k·f<sub>e</sub>| (k entier, f<sub>alias</sub> &lt; f<sub>N</sub>). En pratique, on prend f<sub>e</sub> = 5 à 10 fois f<sub>max</sub> pour avoir de la marge.</p>
<h3>Quantification</h3>
<p>Sur n bits, un signal d'amplitude maximale A est codé sur 2<sup>n</sup> niveaux, avec un pas :</p>
<div class="formula">q = 2A / 2<sup>n</sup></div>
<p>L'erreur de quantification e<sub>q</sub> = s<sub>q</sub>[n] − s[n] est majorée par q/2. Le SNR (rapport signal/bruit) vaut environ :</p>
<div class="formula">SNR ≈ 6,02·n + 1,76 dB</div>
<p>Chaque bit supplémentaire ajoute environ 6 dB de dynamique.</p>
<div class="retain"><b>À retenir.</b> Échantillonnage : f<sub>e</sub> &gt; 2·f<sub>max</sub> (Shannon). Quantification : q = 2A/2<sup>n</sup>, erreur ±q/2, SNR ≈ 6·n dB.</div>` });

COURSE.push({ id: 'proportionnel', t: 'Correcteur proportionnel (P)', h: `
<p>Le correcteur proportionnel est le plus simple : il délivre une action proportionnelle à l'erreur.</p>
<h3>Forme analogique</h3>
<div class="formula">C(p) = K<sub>p</sub></div>
<h3>Forme discrète et équation de récurrence</h3>
<p>La discrétisation est immédiate (le correcteur est statique) :</p>
<div class="formula">C(z) = K<sub>p</sub></div>
<div class="formula">u[n] = K<sub>p</sub> · e[n]</div>
<p>Le correcteur P <b>n'a pas de mémoire</b> : la sortie ne dépend que de l'entrée à l'instant courant.</p>
<h3>Effet en boucle fermée</h3>
<p>Soit un système G(p) = K/(1+τp) en boucle fermée avec un correcteur P. La fonction de transfert en boucle fermée est :</p>
<div class="formula">T(p) = K<sub>p</sub>·K / (1 + K<sub>p</sub>·K + τp)</div>
<p>Pour un échelon, l'<b>erreur statique</b> vaut :</p>
<div class="formula">ε<sub>s</sub> = 1 / (1 + K<sub>p</sub>·K)</div>
<ul>
<li>Augmenter K<sub>p</sub> réduit l'erreur statique et accélère la réponse.</li>
<li>Mais augmenter le gain peut provoquer oscillations et instabilité (sur un système d'ordre ≥ 2).</li>
<li>L'erreur statique ne peut jamais être <b>annulée</b> avec un P seul.</li>
</ul>
<div class="retain"><b>À retenir.</b> P : u[n] = K<sub>p</sub>·e[n], pas de mémoire. Réduit l'erreur statique mais ne l'annule pas ; risque d'instabilité si K<sub>p</sub> trop grand.</div>` });

COURSE.push({ id: 'pi', t: 'Correcteur proportionnel intégral (PI)', h: `
<p>Le correcteur PI ajoute une action intégrale à l'action proportionnelle pour annuler l'erreur statique.</p>
<h3>Forme analogique</h3>
<div class="formula">C(p) = K<sub>p</sub> + K<sub>i</sub>/p &nbsp;&nbsp;(ou&nbsp;&nbsp; K<sub>p</sub>·(1 + 1/(T<sub>i</sub>p)) avec T<sub>i</sub> = K<sub>p</sub>/K<sub>i</sub>)</div>
<h3>Forme position</h3>
<div class="formula">u[n] = K<sub>p</sub>·e[n] + K<sub>i</sub>·T<sub>e</sub>·Σ<sub>k=0</sub><sup>n</sup> e[k]</div>
<h3>Forme vitesse (récurrence)</h3>
<p>On différencie la forme position pour éviter une accumulation explicite :</p>
<div class="formula">u[n] = u[n−1] + K<sub>p</sub>·(e[n] − e[n−1]) + K<sub>i</sub>·T<sub>e</sub>·e[n]</div>
<p>Cette forme est <b>plus robuste numériquement</b> (pas de grande somme) et c'est celle qu'on utilise en pratique.</p>
<h3>Effet</h3>
<ul>
<li>L'intégrateur accumule tant que e ≠ 0 : en régime permanent, il force <b>e → 0</b>, donc l'erreur statique est <b>nulle</b>.</li>
<li>Mais l'intégrateur introduit un déphasage de −90° qui peut réduire la marge de phase et provoquer des oscillations.</li>
<li>Un K<sub>i</sub> trop grand rend la réponse oscillante et lente à stabiliser.</li>
</ul>
<h3>Anti-windup (emballement)</h3>
<p>Si l'actionneur sature (u dépasse u<sub>min</sub> ou u<sub>max</sub>), l'intégrateur continue d'accumuler alors que la sortie ne peut plus suivre. Au retour, la réponse est très dégradée. Deux solutions classiques :</p>
<ul>
<li><b>Clamping</b> : bloquer l'intégrateur quand u est saturé (et que e a le même signe que la saturation).</li>
<li><b>Back-calculation</b> : soustraire la différence (u_saturé − u) au terme intégrateur.</li>
</ul>
<div class="retain"><b>À retenir.</b> PI : annule l'erreur statique. Forme vitesse pour l'implémentation. Attention à l'emballement en saturation.</div>` });

COURSE.push({ id: 'avance', t: 'Correcteur à avance de phase', h: `
<p>Le correcteur à avance de phase ajoute de la phase positive à la boucle ouverte pour augmenter la marge de phase.</p>
<h3>Forme analogique</h3>
<div class="formula">C(p) = K · (1 + a·τ·p) / (1 + τ·p), &nbsp; a &gt; 1</div>
<ul>
<li>Zéro à p = −1/(a·τ) (haute fréquence) ;</li>
<li>pôle à p = −1/τ (basse fréquence) ;</li>
<li>gain DC : C(0) = K ; gain HF : C(∞) = K·a.</li>
</ul>
<p>La phase maximale vaut φ<sub>max</sub> = asin((a−1)/(a+1)), atteinte à ω = 1/(τ·√a).</p>
<h3>Discrétisation par Tustin</h3>
<p>On remplace p par (2/T<sub>e</sub>)(1−z⁻¹)/(1+z⁻¹). Après calcul :</p>
<div class="formula">C(z) = (b<sub>0</sub> + b<sub>1</sub>·z⁻¹) / (1 + a<sub>1</sub>·z⁻¹)</div>
<p>avec :</p>
<div class="formula">
b<sub>0</sub> = K·(1 + 2aτ/T<sub>e</sub>)/(1 + 2τ/T<sub>e</sub>)<br>
b<sub>1</sub> = K·(1 − 2aτ/T<sub>e</sub>)/(1 + 2τ/T<sub>e</sub>)<br>
a<sub>1</sub> = (1 − 2τ/T<sub>e</sub>)/(1 + 2τ/T<sub>e</sub>)
</div>
<h3>Équation de récurrence</h3>
<div class="formula">u[n] = −a<sub>1</sub>·u[n−1] + b<sub>0</sub>·e[n] + b<sub>1</sub>·e[n−1]</div>
<p>Le correcteur a une <b>mémoire</b> : la sortie dépend des entrées et de la sortie précédentes.</p>
<h3>Effet</h3>
<ul>
<li>Ajoute de la phase positive autour de f<sub>c</sub> = 1/(2πτ) : la marge de phase augmente, on peut donc <b>augmenter le gain</b> sans déstabiliser.</li>
<li>Réduit le dépassement en boucle fermée (meilleur amortissement).</li>
<li>Attention : si a est trop grand, le gain HF augmente et le bruit peut être amplifié.</li>
</ul>
<div class="retain"><b>À retenir.</b> PA : u[n] = −a<sub>1</sub>·u[n−1] + b<sub>0</sub>·e[n] + b<sub>1</sub>·e[n−1]. Apporte de la phase positive ; augmente la marge de phase et permet un gain plus élevé.</div>` });

COURSE.push({ id: 'bilan', t: 'Bilan comparatif', h: `
<table class="ctable"><thead><tr><th>Correcteur</th><th>Équation de récurrence</th><th>Mémoire</th><th>Effet principal</th><th>Limite</th></tr></thead><tbody>
<tr><td>P</td><td>u[n] = K<sub>p</sub>·e[n]</td><td>non</td><td>Réduit l'erreur statique, accélère</td><td>Erreur jamais nulle ; instable si gain trop grand</td></tr>
<tr><td>PI</td><td>u[n] = u[n−1] + K<sub>p</sub>·Δe + K<sub>i</sub>T<sub>e</sub>·e[n]</td><td>oui</td><td>Annule l'erreur statique</td><td>Risque d'oscillation, windup en saturation</td></tr>
<tr><td>PA</td><td>u[n] = −a<sub>1</sub>u[n−1] + b<sub>0</sub>e[n] + b<sub>1</sub>e[n−1]</td><td>oui</td><td>Augmente la marge de phase</td><td>Amplifie le bruit HF ; formule plus complexe</td></tr>
</tbody></table>
<h3>Que choisir ?</h3>
<ul>
<li><b>Erreur statique trop grande</b> : ajouter une action intégrale (PI).</li>
<li><b>Système instable ou trop oscillant avec un gain élevé</b> : correcteur à avance de phase.</li>
<li><b>Bruit haute fréquence</b> : filtrer le signal (passe-bas) avant le correcteur, ou ajouter un pôle de filtrage.</li>
<li><b>Performance globale</b> : combiner (PI + avance de phase, par exemple).</li>
</ul>
<div class="retain"><b>À retenir.</b> Un correcteur numérique se modélise toujours par une <b>équation de récurrence</b> u[n] = f(e[n], e[n−1], …, u[n−1], …). Les coefficients dépendent de la fonction de transfert et de la méthode de discrétisation.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Échantillonnage</dt><dd>Prélèvement du signal à intervalles réguliers T<sub>e</sub> ; s[n] = s(n·T<sub>e</sub>).</dd>
<dt>Quantification</dt><dd>Codage de chaque échantillon sur n bits, avec un pas q = 2A/2<sup>n</sup>.</dd>
<dt>Théorème de Shannon</dt><dd>f<sub>e</sub> &gt; 2·f<sub>max</sub> pour reconstruire sans perte un signal à spectre limité.</dd>
<dt>Repliement spectral</dt><dd>Apparition de fausses basses fréquences quand f &gt; f<sub>e</sub>/2.</dd>
<dt>Équation de récurrence</dt><dd>Relation u[n] = f(e[n], e[n−1], …, u[n−1], …) qui définit un correcteur numérique.</dd>
<dt>Correcteur P</dt><dd>u[n] = K<sub>p</sub>·e[n] ; action proportionnelle.</dd>
<dt>Correcteur PI</dt><dd>Ajoute une action intégrale qui annule l'erreur statique.</dd>
<dt>Correcteur à avance de phase</dt><dd>Ajoute de la phase positive pour augmenter la marge de phase.</dd>
<dt>Forme position</dt><dd>u[n] = K<sub>p</sub>·e[n] + K<sub>i</sub>·T<sub>e</sub>·Σ e[k].</dd>
<dt>Forme vitesse</dt><dd>u[n] = u[n−1] + K<sub>p</sub>·Δe + K<sub>i</sub>·T<sub>e</sub>·e[n] ; plus robuste numériquement.</dd>
<dt>Discrétisation</dt><dd>Passage d'une fonction de transfert continue C(p) à une forme en z (Tustin, Euler, etc.).</dd>
<dt>Tustin</dt><dd>Transformation bilinéaire p ≈ (2/T<sub>e</sub>)(1−z⁻¹)/(1+z⁻¹).</dd>
<dt>Erreur statique</dt><dd>Écart entre la consigne et la sortie en régime permanent.</dd>
<dt>Marge de phase</dt><dd>Marge de stabilité d'un système bouclé ; le correcteur PA l'augmente.</dd>
<dt>Windup</dt><dd>Emballement de l'intégrateur quand l'actionneur sature.</dd>
</dl>` });

/* ---------- interface ---------- */
const UI = { cur: 'f1' };
const AS = { key: 'f1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'echantillonnage' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l\'atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l\'atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : correcteurs numériques'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l\'atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Quatre ateliers sur la modélisation des correcteurs numériques du programme SII de CPGE 1<sup>re</sup> année : échantillonnage et quantification, correcteur P, correcteur PI, correcteur à avance de phase.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Réglez les curseurs (f, T<sub>e</sub>, n, K<sub>p</sub>, K<sub>i</sub>, τ, a…) et observez l\'effet en direct.</li><li>L\'équation de récurrence du correcteur est rappelée sous le graphe.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille chaque correcteur.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
