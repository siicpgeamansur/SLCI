<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }

function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmt = (x, d = 2) => { if (!isFinite(x)) return x > 0 ? '∞' : '−∞'; const r = Math.round(x * 10 ** d) / 10 ** d; return String(Object.is(r, -0) ? 0 : r).replace('.', ','); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R2D = 180 / Math.PI;

/* ---------- Fonctions de dessin SVG pour le style "Livre" ---------- */

// Générateur de courbe
function pathFromFn(fn, t0, t1, n, w, h, pad, ymin, ymax) {
  let pts = [];
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * i / n;
    const y = fn(t);
    const px = pad + (t - t0) / (t1 - t0) * (w - 2 * pad);
    const py = h - pad - (clamp(y, ymin, ymax) - ymin) / (ymax - ymin) * (h - 2 * pad);
    pts.push(`${px.toFixed(1)},${py.toFixed(1)}`);
  }
  return 'M' + pts.join(' L');
}

// Mini graphique temporel
function drawMiniGraph(x, y, w, h, fn, color, title, ymin, ymax) {
  const pad = 15;
  let s = `<g transform="translate(${x},${y})">`;
  s += `<rect width="${w}" height="${h}" fill="#fff" stroke="#ccc" stroke-width="1"/>`;
  s += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#333" stroke-width="1"/>`;
  s += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#333" stroke-width="1"/>`;
  // Label axes
  s += `<text x="${w-pad}" y="${h-pad+12}" font-size="10" text-anchor="end" font-family="serif" font-style="italic">t</text>`;
  s += `<text x="${pad-5}" y="${pad+5}" font-size="10" text-anchor="end" font-family="serif" font-style="italic">s(t)</text>`;
  // Title
  if (title) s += `<text x="${pad}" y="${pad-2}" font-size="10" font-family="serif">${title}</text>`;
  // Curve
  const d = pathFromFn(fn, 0, 10, 100, w, h, pad, ymin, ymax);
  s += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/>`;
  // Envelope (optional)
  if (color === '#7b4fc2' || color === '#2e6da4') { // dashed envelope for osc
    let envP = [], envN = [];
    for (let i = 0; i <= 100; i++) {
      const t = 10 * i / 100;
      const env = fn === Math.cos ? 1 : Math.exp(fn(0) === 1 ? 0 : (fn(1)/Math.cos(4)) * t); // hacky but works for the specific fns
      // skip envelope for simplicity unless specifically requested
    }
  }
  s += `</g>`;
  return s;
}

/* ================= Atelier 1 : Le plan complexe illustré ================= */
const Q1 = { mode: 'full' };
function mountQ1(root) {
  root.innerHTML = `
    <div class="textbook-page">
      <h2>2.3 Lieu des pôles dans le plan complexe</h2>
      <p>En étudiant l'influence de la position des pôles dans le plan complexe, on comprend que pour une entrée impulsionnelle, il suffit qu'il y ait un seul pôle à partie réelle positive ou nulle pour que la sortie ne revienne pas à zéro, diverge et que le système soit qualifié d'instable.</p>
      <p>Pour un système stable, on peut remarquer que l'effet des pôles très éloignés de l'axe imaginaire disparaît bien avant celui des pôles qui en sont plus proches, compte tenu des décroissances exponentielles très différentes. Aussi, les pôles des systèmes les plus proches de l'axe imaginaire sont qualifiés de <em>pôles dominants</em>.</p>

      <div class="figure">
        <svg id="q1-main-fig" viewBox="0 0 1000 650" style="width:100%;max-width:900px"></svg>
        <figcaption>FIGURE 2.8 – Influence de la position des pôles dans le plan complexe à une entrée impulsionnelle.</figcaption>
      </div>

      <h3>2.3.1 Influence de la partie réelle - notion de pôle dominant</h3>
      <p>Plus le pôle (p<sub>i</sub> = σ<sub>i</sub> + jω<sub>i</sub>) est éloigné de l'axe des imaginaires purs, c'est-à-dire plus sa partie réelle est grande en valeur absolue, plus sa convergence ou sa divergence est rapide.</p>

      <div class="figure">
        <svg id="q1-re-part" viewBox="0 0 800 300" style="width:100%;max-width:800px"></svg>
        <figcaption>FIGURE 2.9 – Influence de la partie réelle des pôles σ<sub>i</sub> sur la réponse impulsionnelle.</figcaption>
      </div>

      <p>Pour simplifier certaines fonctions de transfert, on pourra <em>négliger</em> des pôles à partie réelle très négative, dont la contribution à la réponse tend pratiquement instantanément vers zéro.</p>

      <h3>2.3.2 Influence de la partie imaginaire</h3>
      <p>Plus un couple de pôles complexes (p<sub>i</sub> = σ<sub>i</sub> + jω<sub>i</sub> et p<sub>i</sub><sup>*</sup> = σ<sub>i</sub> − jω<sub>i</sub>) est éloigné de l'axe des réels, c'est-à-dire plus leur partie imaginaire ω<sub>i</sub> est grande en valeur absolue, plus la pulsation des oscillations ou pseudo-oscillations est grande.</p>

      <div class="figure">
        <svg id="q1-im-part" viewBox="0 0 800 250" style="width:100%;max-width:800px"></svg>
        <figcaption>FIGURE 2.10 – Influence de la partie imaginaire des pôles ω<sub>i</sub>.</figcaption>
      </div>
    </div>
  `;

  drawMainFig();
  drawReFig();
  drawImFig();
}

function drawMainFig() {

  // 1. Central Plane

  // Axes
  s += `<line x1="${cx-w/2-20}" y1="${cy}" x2="${cx+w/2+20}" y2="${cy}" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>`;

  // TR (RHP Complex) -> x:680, y:50, w:220, h:120

  // ML: e^{-2t}

  // BL: cos(4t)
  s += drawMiniGraph(100, 470, 220, 120, t => Math.cos(4*t), '#2e6da4', '', -1, 1);
  // TR: e^{0.2t} cos(4t) (clipped)
  s += drawMiniGraph(680, 50, 220, 120, t => Math.exp(0.2*t)*Math.cos(4*t), '#7b4fc2', '', -1.5, 1.5);
  // MR: e^{0.5t} (clipped)
  s += drawMiniGraph(680, 260, 220, 120, t => Math.exp(0.5*t), '#b06a10', '', 0, 2);
  // BR: step (1)
  s += drawMiniGraph(680, 470, 220, 120, t => t < 0.5 ? 0 : 1, '#6a6a78', '', -0.2, 1.2);

  // 3. Poles on the Central Plane
  const scale = 40; // pixels per unit

  const p5 = { x: cx + 2*scale, y: cy }; // RHP real

  function drawPole(x, y, color) {

  drawLine(p2.x, p2.y, 320, 320);

  drawLine(p4.x, p4.y, 680, 110);
  drawLine(p4.x, 2*cy - p4.y, 680, 110);
  // MR

  svg.innerHTML = s;
}

function drawReFig() {
  const svg = $('#q1-re-part');
  let s = '';
  
  // Left graph (oscillating)
  const L_x = 50, L_y = 50, L_w = 320, L_h = 200;
  s += `<g transform="translate(${L_x},${L_y})">`;
  s += `<line x1="20" y1="${L_h-20}" x2="${L_w-20}" y2="${L_h-20}" stroke="#333" marker-end="url(#arrow)"/>`;
  s += `<line x1="20" y1="${L_h-20}" x2="20" y2="20" stroke="#333" marker-end="url(#arrow)"/>`;
  s += `<text x="10" y="15" font-family="serif" font-size="12" text-anchor="end">s(t)</text>`;
  s += `<text x="${L_w-20}" y="${L_h-5}" font-family="serif" font-size="12" text-anchor="end">t</text>`;
  
  // Three curves with envelopes
  function drawOsc(sigma, color, label, labelY) {
    // Envelope
    let envP = [], envN = [];
    for (let i = 0; i <= 100; i++) {
      const t = 10 * i / 100;
      const y = Math.exp(sigma * t);
      const px = 20 + i / 100 * (L_w - 40);
      const pyP = L_h - 20 - y * 80;
      const pyN = L_h - 20 + y * 80;
      envP.push(`${px},${pyP}`);
      envN.push(`${px},${pyN}`);
    }
    s += `<path d="M${envP.join(' L')}" fill="none" stroke="#ccc" stroke-width="1"/>`;
    s += `<path d="M${envN.join(' L')}" fill="none" stroke="#ccc" stroke-width="1"/>`;
    
    // Oscillation
    let pts = [];
    for (let i = 0; i <= 200; i++) {
      const t = 10 * i / 200;
      const y = Math.exp(sigma * t) * Math.cos(4 * t);
      const px = 20 + i / 200 * (L_w - 40);
      const py = L_h - 20 - y * 80;
      pts.push(`${px},${py}`);
    }
    s += `<path d="M${pts.join(' L')}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    
    // Arrow indicating sigma direction
    s += `<line x1="${L_w-60}" y1="${labelY}" x2="${L_w-30}" y2="${labelY}" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>`;
    s += `<text x="${L_w-65}" y="${labelY+5}" font-family="serif" font-style="italic" font-size="14" fill="${color}">${label}</text>`;
  }
  drawOsc(-0.5, '#2e6da4', 'σi < 0', 40); // stable
  drawOsc(0, '#c0281f', 'σi = 0', 70);    // marginal
  drawOsc(0.2, '#1e7a2e', 'σi > 0', 100); // unstable
  s += `<text x="${L_w/2}" y="${L_h+25}" font-family="serif" font-size="12" text-anchor="middle">(a) Pôles complexes - p<sub>i</sub> = σ<sub>i</sub> + jω<sub>i</sub>.</text>`;
  s += `</g>`;

  // Right graph (pure real)
  const R_x = 420, R_y = 50, R_w = 320, R_h = 200;
  s += `<g transform="translate(${R_x},${R_y})">`;
  s += `<line x1="20" y1="${R_h-20}" x2="${R_w-20}" y2="${R_h-20}" stroke="#333" marker-end="url(#arrow)"/>`;
  s += `<line x1="20" y1="${R_h-20}" x2="20" y2="20" stroke="#333" marker-end="url(#arrow)"/>`;
  s += `<text x="10" y="15" font-family="serif" font-size="12" text-anchor="end">s(t)</text>`;
  s += `<text x="${R_w-20}" y="${R_h-5}" font-family="serif" font-size="12" text-anchor="end">t</text>`;
  
  function drawExp(sigma, color, label, labelY) {
    let pts = [];
    for (let i = 0; i <= 100; i++) {
      const t = 10 * i / 100;
      const y = Math.exp(sigma * t);
      const px = 20 + i / 100 * (R_w - 40);
      const py = R_h - 20 - y * 80;
      pts.push(`${px},${py}`);
    }
    s += `<path d="M${pts.join(' L')}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    s += `<line x1="${R_w-60}" y1="${labelY}" x2="${R_w-30}" y2="${labelY}" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>`;
    s += `<text x="${R_w-65}" y="${labelY+5}" font-family="serif" font-style="italic" font-size="14" fill="${color}">${label}</text>`;
  }
  drawExp(-0.5, '#2e6da4', 'σi < 0', 40);
  drawExp(0, '#c0281f', 'σi = 0', 70);
  drawExp(0.2, '#1e7a2e', 'σi > 0', 100);
  s += `<text x="${R_w/2}" y="${R_h+25}" font-family="serif" font-size="12" text-anchor="middle">(b) Pôles réels purs - p<sub>i</sub> = σ<sub>i</sub>.</text>`;
  s += `</g>`;

  svg.innerHTML = s;
}

function drawImFig() {
  const svg = $('#q1-im-part');
  let s = '';
  
  const w = 220, h = 150;
  const y = 50;
  
  function drawImPlot(x, omega, color) {
    s += `<g transform="translate(${x},${y})">`;
    s += `<line x1="20" y1="${h-20}" x2="${w-20}" y2="${h-20}" stroke="#333" marker-end="url(#arrow)"/>`;
    s += `<line x1="20" y1="${h-20}" x2="20" y2="10" stroke="#333" marker-end="url(#arrow)"/>`;
    
    // Envelope
    let envP = [], envN = [];
    for (let i = 0; i <= 100; i++) {
      const t = 10 * i / 100;
      const env = Math.exp(-0.2 * t);
      const px = 20 + i / 100 * (w - 40);
      const pyP = h - 20 - env * 50;
      const pyN = h - 20 + env * 50;
      envP.push(`${px},${pyP}`);
      envN.push(`${px},${pyN}`);
    }
    s += `<path d="M${envP.join(' L')}" fill="none" stroke="#ccc" stroke-width="1"/>`;
    s += `<path d="M${envN.join(' L')}" fill="none" stroke="#ccc" stroke-width="1"/>`;

    let pts = [];
    for (let i = 0; i <= 200; i++) {
      const t = 10 * i / 200;
      const val = Math.exp(-0.2 * t) * Math.cos(omega * t);
      const px = 20 + i / 200 * (w - 40);
      const py = h - 20 - val * 50;
      pts.push(`${px},${py}`);
    }
    s += `<path d="M${pts.join(' L')}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    
    // Omega arrow
    s += `<line x1="30" y1="${h-60}" x2="60" y2="${h-60}" stroke="#666" marker-end="url(#arrow)"/>`;
    s += `<text x="35" y="${h-65}" font-family="serif" font-style="italic" font-size="14" fill="#666">ω<sub>i</sub></text>`;
    
    s += `</g>`;
  }
  
  drawImPlot(50, 2, '#2e6da4');
  drawImPlot(290, 4, '#2e6da4');
  drawImPlot(530, 8, '#2e6da4');
  
  svg.innerHTML = s;
}

  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : étude des pôles'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, h('div', { class: 'cwrap' }, nav, art));
}

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }

  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
