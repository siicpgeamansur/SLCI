const WORKSHOPS = [];

/*LOGIC-START*/
const R2D = 180 / Math.PI, D2R = Math.PI / 180;

const dB = m => 20 * Math.log10(Math.max(m, 1e-12));

/* ---------- complexes ---------- */
const Cx = {
  add: (a, b) => ({ re: a.re + b.re, im: a.im + b.im }),
  sub: (a, b) => ({ re: a.re - b.re, im: a.im - b.im }),
  mul: (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }),

  abs: a => Math.hypot(a.re, a.im)

/* ---------- polynômes (coefficients du degré le plus haut au plus bas) ---------- */
function polyMulRoot(poly, r) {
  const out = poly.map(() => ({ re: 0, im: 0 }));
  out.push({ re: 0, im: 0 });
  for (let i = 0; i < poly.length; i++) {
    out[i] = Cx.add(out[i], poly[i]);
    out[i + 1] = Cx.sub(out[i + 1], Cx.mul(poly[i], r));

function polyFromRoots(k, roots) {
  let poly = [{ re: k, im: 0 }];

function polyvalC(coef, p) { let r = { re: 0, im: 0 }; for (const c of coef) r = Cx.add(Cx.mul(r, p), { re: c, im: 0 }); return r; }

function rootsOf(coefIn) {
  let c = coefIn.slice();
  while (c.length > 1 && Math.abs(c[0]) < 1e-14) c.shift();
  const n = c.length - 1;

  }

}

/* ---------- fonction de transfert {k, zeros, poles} ---------- */
function mkFT(k, poles, zeros) {

  return '<div class="dwrap"><table class="dt"><thead><tr><th>Pôle(s)</th><th>Nature</th><th>Re</th><th>|Im|</th><th>Stabilité</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}
function zeroTable(ft) {
  if (!ft.zeros.length) return '<p class="small">Aucun zéro.</p>';
  const seen = new Set(), rows = [];
  for (const z of ft.zeros) {
    const key = fmt(z.re, 4) + '|' + fmt(Math.abs(z.im), 4);
    if (seen.has(key)) continue; seen.add(key);
    rows.push('<tr><td class="m">' + pzText(z) + '</td><td>' + (Math.abs(z.im) < 1e-9 ? (Math.abs(z.re) < 1e-9 ? 'zéro à l\'origine' : 'zéro réel') : 'zéros complexes conjugués') + '</td></tr>');
  }
  return '<div class="dwrap"><table class="dt"><thead><tr><th>Zéro(s)</th><th>Nature</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}
function freqRange(ft) {
  const mags = [...ft.poles, ...ft.zeros].map(p => Math.hypot(p.re, p.im)).filter(m => m > 1e-6);
  let lo = mags.length ? Math.min(...mags) : 1, hi = mags.length ? Math.max(...mags) : 10;
  lo = clamp(Math.pow(10, Math.floor(Math.log10(lo)) - 1), 1e-3, 1);
  hi = clamp(Math.pow(10, Math.ceil(Math.log10(hi)) + 1), 10, 1e4);
  return { wmin: lo, wmax: hi };
}
function ftBodeCurve(ft, name, color, dash) {
  return { name: name, color: color, dash: dash, fn: w => [dB(ftMag(ft, w)), ftPhase(ft, w)] };
}
function drawPZ(sel, ft, extra) {
  const svg = $(sel); if (!svg) return;
  pzSvg(svg, Object.assign({ poles: ft.poles, zeros: ft.zeros }, extra || {}));
}
function drawTime(sel, ft, o) {
  const svg = $(sel); if (!svg) return;
  const b = simBounds(ft), tmax = (o && o.tmax) || b.tmax, n = (o && o.n) || b.n;
  const S = simulateStep(ft, tmax, n);
  timeSvg(svg, { tmax: tmax, curves: [{ name: (o && o.name) || 'réponse y(t)', color: '#2e6da4', t: S.t, y: S.y }], cid: 'c' + sel.replace(/[^a-z0-9]/gi, ''), clip: (o && o.clip) });
  return S;
}

function mountQ4(root) {
  root.innerHTML = '<h2>Pôle dominant et ordre supérieur</h2>'

  slider($('#q4-sl'), { name: 'Constante de temps τ₁', min: 0.05, max: 5, step: 0.05, dec: 2, unit: 's', get: () => S.t1, set: v => { S.t1 = v; }, onchange: () => upd() });

    + '<p>Un système linéaire est <b>stable</b> si et seulement si <b>tous ses pôles sont dans le demi-plan gauche</b> (partie réelle strictement négative). Chaque pôle pᵢ contribue à la réponse impulsionnelle par un mode <b>e^(pᵢ t)</b> :</p>'
    + '<ul><li><b>Re(p) &lt; 0</b> : le mode s\'amortit → système stable.</li>'
    + '<li><b>Re(p) = 0</b> : le mode ne s\'amortit pas (constante ou sinusoïde entretenue) → système marginalement stable.</li>'
    + '<li><b>Re(p) &gt; 0</b> : le mode diverge → système instable.</li></ul>'
    + '<p>Déplacez la paire de pôles conjugués : σ = Re(p) règle l\'amortissement (ou la divergence), ω = Im(p) règle la pulsation des oscillations.</p>'
    + '<div id="q5-sl"></div>'
    + '<div class="two"><div><h3>Plan complexe</h3><svg id="q5-map" viewBox="0 0 520 340" style="width:100%;max-width:560px;height:auto"></svg></div>'
    + '<div><h3>Réponse impulsionnelle h(t)</h3><svg id="q5-imp" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg></div></div>'
    + statsHtml([['Pôles', ''], ['σ = Re(p)', ''], ['ω = Im(p)', ''], ['ζ = −σ/|p|', ''], ['Stabilité', ''], ['Mode temporel', '']], 'q5-stats')
    + '<p class="verdict" id="q5-msg"></p>'
    + '<h3>Réponse indicielle</h3><svg id="q5-step" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg>'
    + '<div class="analogy"><b>Attention aux pôles à l\'origine :</b> un pôle simple en 0 donne une réponse en échelon (constante) : c\'est marginal. Deux pôles en 0 (double intégrateur) donnent une réponse en rampe : le système est en réalité <b>instable</b>. De même, une paire de pôles ±jω double (même pulsation, multiplicité 2) donne un mode t·sin(ωt) : instable.</div>';
  const S = Q5;
  slider($('#q5-sl'), { name: 'σ = Re(p)', min: -2, max: 1, step: 0.02, dec: 2, unit: 'rad/s', get: () => S.re, set: v => { S.re = v; }, onchange: () => upd() });
  slider($('#q5-sl'), { name: 'ω = Im(p)', min: 0.5, max: 4, step: 0.05, dec: 2, unit: 'rad/s', get: () => S.im, set: v => { S.im = v; }, onchange: () => upd() });
  const upd = () => {
    const ft = mkFT(1, [{ re: S.re, im: S.im }], []);
    drawPZ('#q5-map', ft);
    const modes = impulseModes(ft);
    const tmax = clamp(6 / Math.max(Math.abs(S.re), 0.05), 1, 40), n = clamp(Math.ceil(tmax * Math.max(Math.abs(S.re), S.im) * 40), 2000, 30000);
    const t = [], y = [], envP = [], envN = [];
    const A = Cx.abs(modes[0].amp);
    for (let i = 0; i <= 400; i++) {
      const tt = tmax * i / 400;
      t.push(tt); y.push(impulseAt(modes, tt));
      const e = 2 * A * Math.exp(S.re * tt);
      envP.push(e); envN.push(-e);
    }
    timeSvg($('#q5-imp'), { tmax: tmax, cid: 'q5i', clip: 8, curves: [
      { name: 'h(t) = Σ Aᵢ e^(pᵢ t)', color: '#2e6da4', t: t, y: y },
      { name: 'enveloppe ±2|A|e^(σt)', color: '#9a5b00', dash: '5 4', t: t, y: envP },
      { color: '#9a5b00', dash: '5 4', t: t, y: envN }
    ] });
    const sim = simulateStep(ft, tmax, n);
    timeSvg($('#q5-step'), { tmax: tmax, cid: 'q5s', clip: 8, curves: [{ name: 'réponse indicielle', color: '#2e6da4', t: sim.t, y: sim.y }] });
    const st = stabilityOf(ft);
    const b2 = $('#q5-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(S.re, 2) + ' ± ' + fmt(S.im, 2) + 'j';
    b2[1].textContent = fmt(S.re, 2) + ' rad/s';
    b2[2].textContent = fmt(S.im, 2) + ' rad/s';
    b2[3].textContent = fmt(Math.sqrt(S.re * S.re + S.im * S.im) > 1e-9 ? -S.re / Math.hypot(S.re, S.im) : 0, 2);
    b2[4].textContent = st.txt;
    b2[5].textContent = S.re < -0.02 ? 'e^(σt)·cos(ωt) amorti' : (Math.abs(S.re) <= 0.02 ? 'cos(ωt) entretenu' : 'e^(σt)·cos(ωt) divergent');
    const m = $('#q5-msg'); m.className = 'verdict ' + st.cls;
    if (S.re < -0.02) m.innerHTML = 'Les pôles sont dans le <b>demi-plan gauche</b> : la réponse impulsionnelle est une sinusoïde amortie, le système est stable. Plus |σ| est grand, plus l\'amortissement est rapide.';
    else if (Math.abs(S.re) <= 0.02) m.innerHTML = 'Les pôles sont <b>sur l\'axe imaginaire</b> : la réponse est une sinusoïde d\'amplitude constante. C\'est le cas limite (oscillateur non amorti).';
    else m.innerHTML = 'Les pôles sont dans le <b>demi-plan droit</b> : la réponse diverge exponentiellement, le système est <b>instable</b>.';
  };
  upd();
}

/* ================= Atelier 6 : lieu des racines ================= */
const Q6 = { K: 4 };
function locusData() {
  const traces = [], Ks = [];
  for (let i = 0; i <= 140; i++) Ks.push(Math.pow(10, -1.5 + 3.4 * i / 140));
  for (const K of Ks) traces.push(rootsOf([1, 4, 3, K]));
  return traces;
}
const LOCUS = locusData();
function mountQ6(root) {
  root.innerHTML = '<h2>Lieu des racines : déplacement des pôles avec le gain</h2>'
    + '<p>On ferme la boucle sur un gain K : la fonction de transfert en boucle fermée est <b>H_BF(p) = K·L(p) / (1 + K·L(p))</b>. Ses pôles sont les solutions de <b>1 + K·L(p) = 0</b>, c\'est-à-dire les racines de <b>D(p) + K·N(p)</b>. Quand K varie de 0 à ∞, les pôles se déplacent dans le plan complexe : c\'est le <b>lieu des racines</b>.</p>'
    + '<p>Exemple : <b>L(p) = 1 / (p(p + 1)(p + 3))</b>, donc D(p) = p³ + 4p² + 3p. Les pôles en boucle fermée sont les racines de <b>p³ + 4p² + 3p + K = 0</b>.</p>'
    + '<div id="q6-sl"></div>'
    + '<div class="two"><div><h3>Lieu des racines</h3><svg id="q6-map" viewBox="0 0 520 340" style="width:100%;max-width:560px;height:auto"></svg></div>'
    + '<div><h3>Réponse indicielle en boucle fermée</h3><svg id="q6-step" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg></div></div>'
    + statsHtml([['Gain K', ''], ['Pôles en BF', ''], ['Stabilité', ''], ['Gain critique K_c', '']], 'q6-stats')
    + '<p class="verdict" id="q6-msg"></p>'
    + '<div class="analogy"><b>Ce qu\'il faut retenir :</b> les branches du lieu partent des <b>pôles en boucle ouverte</b> (K = 0) et aboutissent aux <b>zéros</b> (ou à l\'infini si le système est strictement propre). Le lieu traverse l\'axe imaginaire pour un gain <b>K_c</b> : au-delà, le système devient instable. Ici K_c = 12 (à vérifier par le critère de Routh : p³+4p²+3p+K, ligne s¹ : (12 − K)/4, d\'où K &lt; 12).</div>';
  const S = Q6;
  const logK = () => Math.log10(S.K);
  slider($('#q6-sl'), { name: 'log₁₀(K)', min: -1.5, max: 2, step: 0.01, dec: 2, get: logK, set: v => { S.K = Math.pow(10, v); }, onchange: () => upd() });
  const upd = () => {
    const poles = rootsOf([1, 4, 3, S.K]);
    const ft = mkFT(S.K, poles, []);
    pzSvg($('#q6-map'), { poles: poles, zeros: [], traces: LOCUS });
    const b = simBounds(ft);
    const tmax = clamp(b.tmax, 0.5, 40), n = clamp(b.n, 1500, 30000);
    const sim = simulateStep(ft, tmax, n);
    timeSvg($('#q6-step'), { tmax: tmax, cid: 'q6s', clip: 6, curves: [{ name: 'y(t)', color: '#2e6da4', t: sim.t, y: sim.y }] });
    const st = stabilityOf(ft);
    const b2 = $('#q6-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(S.K, 2);
    b2[1].textContent = poles.map(p => Math.abs(p.im) < 1e-6 ? fmt(p.re, 2) : fmt(p.re, 2) + '±' + fmt(Math.abs(p.im), 2) + 'j').join(' ; ');
    b2[2].textContent = st.txt;
    b2[3].textContent = '12';
    const m = $('#q6-msg'); m.className = 'verdict ' + st.cls;
    if (S.K < 12) {
      const real = poles.filter(p => Math.abs(p.im) < 1e-6);
      m.innerHTML = 'K = ' + fmt(S.K, 2) + ' &lt; 12 : les trois pôles sont dans le demi-plan gauche, le système est stable.' + (real.length === 2 ? ' Deux d\'entre eux sont réels, le troisième est réel aussi : la réponse est apériodique.' : ' Une paire complexe conjuguée donne un régime oscillant amorti.');
    } else {
      m.innerHTML = 'K = ' + fmt(S.K, 2) + ' ≥ 12 : une paire de pôles a franchi l\'axe imaginaire. Le système est <b>instable</b> : la réponse diverge. Il faut réduire le gain.';
    }
  };
  upd();
}

const COURSE = [];
COURSE.push({ id: 'definitions', t: 'Fonction de transfert, pôles et zéros', h: `
<p>Pour un système linéaire à coefficients constants, la fonction de transfert est le rapport des transformées de Laplace de la sortie et de l'entrée, à conditions initiales nulles :</p>
<div class="formula">H(p) = S(p)/E(p) = N(p)/D(p) = K · Π(p − zᵢ) / Π(p − pⱼ)</div>
<p>Les <b>pôles</b> pⱼ sont les racines du dénominateur ; les <b>zéros</b> zᵢ sont les racines du numérateur. Comme H est à coefficients réels, ses pôles et zéros sont soit réels, soit <b>complexes conjugués</b>.</p>
<h3>Trois lectures essentielles</h3>
<table class="ctable"><thead><tr><th>Lecture</th><th>Sur quoi elle agit</th></tr></thead><tbody>
<tr><td>Position des pôles</td><td>Stabilité et régime transitoire (modes e^(pⱼt))</td></tr>
<tr><td>Position des zéros</td><td>Amplitude relative des modes, forme de la réponse, dépassement</td></tr>
<tr><td>Pôles à l'origine</td><td>Classe du système, donc précision (erreur statique nulle dès la classe 1)</td></tr></tbody></table>
<h3>Forme canonique et gain</h3>
<p>On écrit souvent H sous forme canonique : <b>H(p) = K · Π(1 + τᵢ p) / Π(1 + τⱼ p)</b> ou <b>H(p) = K / (p^α Π(1 + τⱼ p))</b>, où α est la classe. Le <b>gain statique</b> est H(0) si la classe est nulle ; il est infini sinon.</p>
<div class="analogy"><b>Piège fréquent :</b> un pôle en −1 et une constante de temps τ = 1 s sont la même information. On écrit indifféremment H = K/(p + 1) ou H = K/(1 + p), mais le pôle est −1 et la constante de temps est +1 s. Ne confondez pas « racine du dénominateur » et « coefficient du dénominateur ».</div>` });
COURSE.push({ id: 'premier-ordre', t: 'Pôle réel : premier ordre', h: `
<p>Un premier ordre s'écrit H(p) = K/(1 + τp). Son unique pôle est <b>p₀ = −1/τ</b>, donc <b>τ = 1/|p₀|</b>.</p>
<h3>Réponse indicielle</h3>
<div class="formula">s(t) = K (1 − e^(−t/τ))</div>
<p>À t = τ, la sortie atteint 63 % de sa valeur finale ; à 3τ, 95 % ; à 5τ, 99 %. Le temps de réponse à 5 % vaut donc approximativement <b>t₅ % ≈ 3τ</b>.</p>
<h3>Diagramme de Bode</h3>
<ul><li>Gain : 20 log K pour ω ≪ 1/τ, puis décroissance de −20 dB/décade.</li>
<li>Phase : 0° pour ω ≪ 1/τ, −45° en ω = 1/τ, −90° pour ω ≫ 1/τ.</li></ul>
<p>La <b>cassure</b> du diagramme asymptotique se produit exactement à ω = 1/τ = |p₀| : la position du pôle se lit directement sur le Bode.</p>
<div class="analogy"><b>Interprétation physique :</b> plus le pôle est loin à gauche de l'axe imaginaire, plus la fuite est rapide et plus le système rejoint vite sa consigne. C'est la <b>distance à l'axe imaginaire</b> qui mesure la rapidité, pas la valeur algébrique brute.</div>` });
COURSE.push({ id: 'second-ordre', t: 'Pôles complexes : second ordre', h: `
<p>Un second ordre normalisé s'écrit <b>H(p) = K ωn² / (p² + 2ζωn p + ωn²)</b> avec ωn &gt; 0 et 0 &lt; ζ &lt; 1. Les pôles sont :</p>
<div class="formula">p₁,₂ = −ζωn ± j ωn √(1 − ζ²)</div>
<h3>Lectures graphiques</h3>
<ul><li><b>Module</b> : |p| = ωn. La distance à l'origine fixe l'échelle de temps.</li>
<li><b>Partie réelle</b> : −ζωn. Elle fixe la vitesse d'amortissement de l'enveloppe.</li>
<li><b>Partie imaginaire</b> : ωn√(1 − ζ²). Elle fixe la <b>pseudo-pulsation</b> des oscillations ; la pseudo-période vaut T = 2π / (ωn√(1 − ζ²)).</li>
<li><b>Angle</b> θ entre le pôle et l'axe réel négatif : <b>ζ = cos θ</b>.</li></ul>
<h3>Réponse indicielle</h3>
<p>Dépassement : <b>D = 100 · exp(−πζ / √(1 − ζ²))</b> (en %). Il ne dépend que de ζ. Temps de réponse à 5 % : <b>t₅ % ≈ 3/(ζωn)</b> pour ζ modéré.</p>
<table class="ctable"><thead><tr><th>ζ</th><th>θ</th><th>D</th></tr></thead><tbody>
<tr><td>0,2</td><td>78°</td><td>53 %</td></tr>
<tr><td>0,4</td><td>66°</td><td>25 %</td></tr>
<tr><td>0,6</td><td>53°</td><td>9,5 %</td></tr>
<tr><td>0,7</td><td>45°</td><td>4,6 %</td></tr></tbody></table>
<div class="analogy"><b>Sur le plan complexe :</b> ζ constant = demi-droites issues de l'origine ; ωn constant = cercles centrés en 0. Le cahier des charges impose souvent une zone (secteur + disque) dans laquelle les pôles doivent se trouver.</div>` });
COURSE.push({ id: 'stabilite', t: 'Stabilité', h: `
<p>Un système linéaire est <b>stable</b> (au sens EBSB) si et seulement si <b>tous ses pôles sont à partie réelle strictement négative</b>.</p>
<h3>Les trois zones du plan complexe</h3>
<table class="ctable"><thead><tr><th>Zone</th><th>Mode temporel</th><th>Comportement</th></tr></thead><tbody>
<tr><td>Re(p) &lt; 0</td><td>e^(−|σ|t)·cos(ωt)</td><td><b>stable</b> : amortissement exponentiel</td></tr>
<tr><td>Re(p) = 0</td><td>constante ou cos(ωt)</td><td><b>marginal</b> : ni amorti ni divergent</td></tr>
<tr><td>Re(p) &gt; 0</td><td>e^(+σt)·cos(ωt)</td><td><b>instable</b> : divergence exponentielle</td></tr></tbody></table>
<h3>Cas particuliers à connaître</h3>
<ul><li>Un pôle simple en 0 (classe 1) donne une réponse en échelon : marginalement stable. C'est le cas d'un intégrateur.</li>
<li>Deux pôles en 0 (classe 2) donnent une réponse en rampe : <b>instable</b>.</li>
<li>Une paire ±jω simple donne une oscillation entretenue : marginal.</li>
<li>Une paire ±jω double donne t·sin(ωt) : <b>instable</b>.</li></ul>
<h3>Conséquences</h3>
<p>La stabilité ne dépend que des pôles : les zéros ne peuvent pas rendre stable un système instable. En revanche, la position des pôles dépend du gain en boucle fermée (voir le lieu des racines).</p>
<div class="analogy"><b>Lien avec les marges :</b> en boucle fermée, les pôles sont les racines de 1 + L(p) = 0. Plus la marge de phase et la marge de gain sont grandes, plus les pôles sont loin de l'axe imaginaire, donc plus le système est stable et bien amorti.</div>` });
COURSE.push({ id: 'dominants', t: 'Pôles dominants et ordre supérieur', h: `
<p>Pour un système d'ordre supérieur, chaque pôle pⱼ engendre un mode e^(pⱼt). Le mode le plus lent est celui dont la partie réelle est la plus proche de zéro : c'est le <b>pôle dominant</b>.</p>
<h3>Règle d'usage</h3>
<p>Si un pôle a un module au moins <b>5 fois</b> supérieur à celui du pôle dominant, il est <b>négligeable</b> : son mode s'éteint très vite et n'affecte pas la réponse au-delà du transitoire court. On peut alors réduire le modèle à un premier ordre (ou à un second ordre avec les pôles complexes dominants).</p>
<h3>Réduction de modèle</h3>
<ul><li>Garder les pôles les plus proches de l'axe imaginaire.</li>
<li>Ajuster le gain pour conserver le gain statique.</li>
<li>Vérifier que la réponse réduite reste proche de l'originale sur l'horizon temporel utile.</li></ul>
<div class="analogy"><b>Attention :</b> un pôle rapide mais un zéro situé au même endroit s'annulent approximativement (compensation). Si le pôle est <b>instable</b>, la compensation n'est jamais exacte en pratique : le pôle instable doit être déplacé par la commande, pas annulé par un zéro.</div>` });
COURSE.push({ id: 'zeros', t: 'Rôle des zéros', h: `
<p>Les zéros ne déterminent pas la stabilité (qui ne dépend que des pôles) mais ils <b>modulent l'amplitude des modes</b> et la <b>forme de la réponse</b>.</p>
<h3>Effets typiques</h3>
<ul><li>Un zéro proche de l'axe imaginaire accentue le mode associé et peut créer un <b>dépassement</b> même si les pôles sont bien amortis.</li>
<li>Un zéro dans le demi-plan droit (<b>non-minimum de phase</b>) provoque une réponse qui commence par partir dans le <b>sens opposé</b> à la consigne.</li>
<li>Un zéro à l'origine correspond à une <b>dérivation</b> : il augmente le gain en haute fréquence, donc la sensibilité aux bruits.</li>
<li>Un zéro peut <b>compenser</b> un pôle (annulation pôle-zéro) : c'est le principe de la compensation de pôle en correcteur PI.</li></ul>
<h3>Lien avec la synthèse des correcteurs</h3>
<p>Le correcteur à avance de phase ajoute un zéro et un pôle, placés de part et d'autre de la bande utile. Le PI ajoute un pôle à l'origine (intégrateur) et un zéro qui compense le pôle dominant. L'emplacement relatif du zéro et du pôle fixe l'effet sur la marge de phase.</p>` });
COURSE.push({ id: 'locus', t: 'Lieu des racines', h: `
<p>On considère une boucle fermée à retour unitaire avec un gain K et une boucle ouverte L(p) = N(p)/D(p). La fonction de transfert en boucle fermée est :</p>
<div class="formula">H_BF(p) = K·L(p) / (1 + K·L(p)) = K·N(p) / (D(p) + K·N(p))</div>
<p>Ses pôles sont les solutions de <b>1 + K·L(p) = 0</b>, c'est-à-dire les racines de <b>D(p) + K·N(p)</b>.</p>
<h3>Propriétés du lieu</h3>
<ul><li><b>Points de départ</b> (K = 0) : les pôles de L, racines de D.</li>
<li><b>Points d'arrivée</b> (K → ∞) : les zéros de L, ou l'infini si le système est strictement propre.</li>
<li>Le nombre de branches est égal au degré du dénominateur.</li>
<li>Le lieu est symétrique par rapport à l'axe réel (coefficients réels).</li>
<li>La <b>condition des modules</b> donne K = −1/L(p) pour un point du lieu ; la <b>condition des arguments</b> donne arg L(p) = −180°.</li></ul>
<h3>Gain critique</h3>
<p>Le lieu traverse l'axe imaginaire pour une valeur particulière K_c : c'est le <b>gain critique</b>. Pour K &lt; K_c, le système est stable ; pour K &gt; K_c, il est instable. On le détermine par le critère de Routh sur D(p) + K·N(p).</p>
<div class="analogy"><b>Lecture pratique :</b> le lieu montre en une figure toute l'influence du gain sur la stabilité et le régime transitoire. On y lit directement la valeur du gain qui rapproche les pôles de l'axe imaginaire (donc le réglage fin de la marge de stabilité).</div>` });
COURSE.push({ id: 'vocabulaire', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Pôle</dt><dd>Racine du dénominateur de la fonction de transfert. Détermine la stabilité et les modes temporels.</dd>
<dt>Zéro</dt><dd>Racine du numérateur. Module l'amplitude des modes.</dd>
<dt>Classe</dt><dd>Nombre de pôles à l'origine (nombre d'intégrateurs).</dd>
<dt>Gain statique</dt><dd>H(0), si la classe est nulle.</dd>
<dt>Pôle dominant</dt><dd>Pôle le plus proche de l'axe imaginaire ; impose la dynamique lente.</dd>
<dt>Pôle rapide</dt><dd>Pôle éloigné de l'axe imaginaire ; son effet est bref, il peut être négligé.</dd>
<dt>Pseudo-pulsation</dt><dd>Partie imaginaire des pôles complexes, ωd = ωn√(1−ζ²).</dd>
<dt>Pseudo-période</dt><dd>Td = 2π/ωd, intervalle entre deux dépassements.</dd>
<dt>Amortissement ζ</dt><dd>ζ = −Re(p)/|p| = cos θ. Règle le dépassement.</dd>
<dt>Marge de stabilité</dt><dd>Distance des pôles à l'axe imaginaire ; reliée aux marges de phase et de gain.</dd>
<dt>Lieu des racines</dt><dd>Courbe décrite par les pôles en boucle fermée quand le gain varie.</dd>
<dt>Gain critique</dt><dd>Gain pour lequel un pôle traverse l'axe imaginaire (limite de stabilité).</dd>
</dl>` });

  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Six ateliers sur l\'étude des pôles d\'une fonction de transfert : vocabulaire, pôle réel, pôles complexes, pôle dominant, stabilité, lieu des racines.</p>' +

    '<h3>Modèle</h3><p>Fonctions de transfert rationnelles à coefficients réels ; pôles et zéros calculés numériquement (méthode de Durand-Kerner).</p><h3>Vos données</h3><p>Les réponses au quiz sont mémorisées dans ce navigateur uniquement.</p>' }));
});
