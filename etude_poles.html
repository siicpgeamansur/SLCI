function toSS(num, den) {
  const n = den.length - 1;

    s += '<line x1="' + x + '" y1="' + y + '" x2="' + (x + 16) + '" y2="' + y + '" stroke="' + o.curves[0].color + '" stroke-width="2"/><text x="' + (x + 21) + '" y="' + (y + 3.5) + '" font-size="10.5" fill="#1f1f28">' + o.curves[0].name + '</text>';
  }
  svg.innerHTML = s;
}

/* ================= Atelier 1 : Plan complexe interactif ================= */
const Q1_POLES = [
  { id: 0, re: -1, im: 0, color: '#6b2b2b', name: 'Pôle réel stable', label: '1' },
  { id: 1, re: -0.5, im: 2, color: '#7b4fc2', name: 'Pôles complexes stables', label: '2' },
  { id: 2, re: 0, im: 2, color: '#2e6da4', name: 'Pôles imaginaires purs', label: '3' },
  { id: 3, re: 1, im: 0, color: '#b06a10', name: 'Pôle réel instable', label: '4' },
  { id: 4, re: 0.5, im: 2, color: '#1e7a2e', name: 'Pôles complexes instables', label: '5' },
  { id: 5, re: 0, im: 0, color: '#6a6a78', name: 'Pôle à l\'origine', label: '6' }
];
const Q1 = { selected: 0, input: 'echelon' };

function getFT(pole) {
  if (pole.im === 0) {
    if (pole.re === 0) return { num: [1], den: [1, 0] };
    const k = -pole.re;
    return { num: [k], den: [1, -pole.re] };
  } else {
    const k = pole.re * pole.re + pole.im * pole.im;
    return { num: [k], den: [1, -2 * pole.re, k] };
  }
}

window.selPole = id => { Q1.selected = id; drawQ1(); };
window.setInput = type => { Q1.input = type; drawQ1(); };

function drawQ1() {
  const pole = Q1_POLES[Q1.selected];
  
  // 1. Plan complexe
  const svgMap = $('#q1-map');
  const cx = 200, cy = 150, scale = 40;
  const X = re => cx + re * scale;
  const Y = im => cy - im * scale;
  
  let s = '';
  // Zone instable
  s += `<rect x="${cx}" y="0" width="${400-cx}" height="300" fill="rgba(192,40,31,.06)" />`;
  // Grille
  for (let i = -4; i <= 4; i++) {
    if (i === 0) continue;
    s += `<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="300" stroke="#eee" />`;
    s += `<line x1="0" y1="${Y(i)}" x2="400" y2="${Y(i)}" stroke="#eee" />`;
  }
  // Axes
  s += `<line x1="0" y1="${cy}" x2="400" y2="${cy}" stroke="#333" stroke-width="1.2" />`;
  s += `<line x1="${cx}" y1="0" x2="${cx}" y2="300" stroke="#333" stroke-width="1.2" />`;
  s += `<text x="390" y="${cy-10}" font-size="12" text-anchor="end">Re</text>`;
  s += `<text x="${cx+10}" y="15" font-size="12">Im</text>`;
  
  // Pôles
  Q1_POLES.forEach(p => {
    const sel = p.id === Q1.selected;
    const r = sel ? 8 : 5;
    const x = X(p.re), y = Y(p.im);
    
    if (p.im !== 0) {
      // Conjugué
      s += `<circle cx="${x}" cy="${Y(-p.im)}" r="${r}" fill="${p.color}" stroke="${sel?'#000':'#fff'}" stroke-width="${sel?2:1}" style="cursor:pointer" onclick="window.selPole(${p.id})" />`;
      s += `<text x="${x+r+3}" y="${Y(-p.im)+4}" font-size="12" font-weight="bold" fill="${p.color}">${p.label}</text>`;
    }
    s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${p.color}" stroke="${sel?'#000':'#fff'}" stroke-width="${sel?2:1}" style="cursor:pointer" onclick="window.selPole(${p.id})" />`;
    s += `<text x="${x+r+3}" y="${y+4}" font-size="12" font-weight="bold" fill="${p.color}">${p.label}</text>`;
  });
  
  svgMap.innerHTML = s;
  
  // 2. Réponse temporelle
  const ft = getFT(pole);
  let tmax = 5;
  if (pole.re < 0) tmax = 6 / Math.abs(pole.re);
  else if (pole.re > 0) tmax = 3 / pole.re;
  else if (pole.im !== 0) tmax = 6 * Math.PI / Math.abs(pole.im);
  else if (pole.re === 0 && pole.im === 0) tmax = 5;
  
  const n = 500;
  const sim = simulateSys(ft.num, ft.den, Q1.input, tmax, n);
  
  const inpNames = { dirac: 'Dirac', echelon: 'Échelon', rampe: 'Rampe' };
  timeSvg($('#q1-time'), {
    tmax: tmax,
    cid: 'q1t',
    curves: [{ name: 'Réponse à un ' + inpNames[Q1.input].toLowerCase(), color: pole.color, t: sim.t, y: sim.y }],
    clip: 15 // clip à 15 pour les divergences
  });
  
  // 3. Mise à jour UI
  document.querySelectorAll('.q1-inp').forEach(btn => {
    btn.classList.toggle('pri', btn.dataset.type === Q1.input);
  });
  document.querySelectorAll('.pole-btn').forEach(el => {
    el.classList.toggle('pri', parseInt(el.dataset.id) === Q1.selected);
  });
  
  const msg = $('#q1-msg');
  let msgTxt = `<b>${pole.name}</b> en p = ${pole.re}`;
  if (pole.im !== 0) msgTxt += ` ± ${Math.abs(pole.im)}j`;
  msgTxt += `<br>Réponse à un ${inpNames[Q1.input].toLowerCase()} : `;
  if (pole.re > 0) msgTxt += `divergence exponentielle (système instable).`;
  else if (pole.re === 0) {
    if (pole.im !== 0) msgTxt += `oscillation entretenue (système marginal).`;
    else {
      if (Q1.input === 'echelon') msgTxt += `constante (échelon).`;
      else if (Q1.input === 'rampe') msgTxt += `rampe.`;
      else msgTxt += `échelon (constante).`;
    }
  } else {
    if (pole.im !== 0) msgTxt += `oscillation amortie (système stable).`;
    else msgTxt += `amortissement exponentiel (système stable).`;
  }
  msg.innerHTML = msgTxt;
}

function mountQ2(root) {

function mountQ3(root) {

  slider($('#q3-sl'), { name: 'Pulsation propre ωn', min: 0.3, max: 10, step: 0.05, dec: 2, unit: 'rad/s', get: () => S.wn, set: v => { S.wn = v; }, onchange: () => upd() });
  const upd = () => {

    b2[3].textContent = fmt(th, 1) + ' °';
    b2[4].textContent = fmt(D, 1) + ' %';
    b2[5].textContent = fmt(Tp, 2) + ' s';
    const m = $('#q3-msg');
    m.className = 'verdict ' + (z < 0.25 ? 'warn' : (z > 0.85 ? 'warn' : 'yes'));
    let txt = 'Les pôles sont à <b>' + fmt(re, 2) + ' ± ' + fmt(im, 2) + 'j</b> : ωn = ' + fmt(wn, 2) + ' rad/s et ζ = cos θ = cos ' + fmt(th, 1) + '° = ' + fmt(z, 2) + '. ';
    if (z < 0.25) txt += 'Zone très peu amortie : dépassement de ' + fmt(D, 0) + ' %, oscillations qui durent longtemps.';
    else if (z > 0.85) txt += 'Zone sur-amortie : pas ou peu de dépassement, mais réponse plus lente que nécessaire.';
    else txt += 'Dépassement de ' + fmt(D, 1) + ' % : c\'est une zone de compromis raisonnable.';
    m.innerHTML = txt;
    const rg = freqRange(ft);
    bodeSvg($('#q3-bode'), { wmin: rg.wmin, wmax: rg.wmax, curves: [ftBodeCurve(ft, 'H(jω)', '#2e6da4')], marks: [{ w: wn, label: 'ωn' }] });
  };
  upd();
}
WORKSHOPS.push({ id: 'q3', title: 'Pôles complexes', hint: 'Déplacez ζ et ωn : les pôles tournent autour de l\'origine (ζ) et s\'en éloignent (ωn). L\'angle θ vérifie ζ = cos θ.',

/* ================= Atelier 4 : pôle dominant ================= */
const Q4 = { t1: 1, t2: 0.1 };
function mountQ4(root) {
  root.innerHTML = '<h2>Pôle dominant et ordre supérieur</h2>'
    + '<p>Pour <b>H(p) = 1 / ((1 + τ₁p)(1 + τ₂p))</b>, les pôles sont <b>p₁ = −1/τ₁</b> et <b>p₂ = −1/τ₂</b>. Le mode associé à un pôle s\'amortit comme <b>e^(p t)</b> : il est d\'autant plus lent que le pôle est proche de l\'axe imaginaire. Le pôle <b>le plus proche de l\'axe imaginaire</b> est le <b>pôle dominant</b> : c\'est lui qui impose la dynamique de la réponse.</p>'
    + '<div id="q4-sl"></div>'
    + '<div class="two"><div><h3>Plan complexe</h3><svg id="q4-map" viewBox="0 0 520 340" style="width:100%;max-width:560px;height:auto"></svg></div>'
    + '<div><h3>Réponse indicielle</h3><svg id="q4-step" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg></div></div>'
    + statsHtml([['Pôle p₁', ''], ['Pôle p₂', ''], ['Rapport |p₂/p₁|', ''], ['Pôle dominant', ''], ['Temps à 95 % (exact)', ''], ['Temps à 95 % (1er ordre)', '']], 'q4-stats')
    + '<p class="verdict" id="q4-msg"></p>'
    + '<div class="analogy"><b>Règle d\'usage :</b> si |p₂| ≥ 5|p₁|, le pôle p₂ est négligeable : H se comporte comme un premier ordre de constante de temps τ₁. Si les deux pôles sont proches, on ne peut pas simplifier : les deux modes comptent. La réduction de modèle ne s\'applique qu\'aux pôles <b>lents</b> ; les pôles rapides (grand |Re|) disparaissent dans le régime transitoire court.</div>';
  const S = Q4;
  slider($('#q4-sl'), { name: 'Constante de temps τ₁', min: 0.05, max: 5, step: 0.05, dec: 2, unit: 's', get: () => S.t1, set: v => { S.t1 = v; }, onchange: () => upd() });
  slider($('#q4-sl'), { name: 'Constante de temps τ₂', min: 0.02, max: 3, step: 0.01, dec: 2, unit: 's', get: () => S.t2, set: v => { S.t2 = v; }, onchange: () => upd() });
  const upd = () => {
    const p1 = -1 / S.t1, p2 = -1 / S.t2;
    const ft = mkFT(1, [{ re: p1, im: 0 }, { re: p2, im: 0 }], []);
    drawPZ('#q4-map', ft);
    const tmax = clamp(8 * Math.max(S.t1, S.t2), 0.3, 120);
    const n = clamp(Math.ceil(tmax * Math.max(1 / S.t1, 1 / S.t2) * 25), 1500, 30000);
    const exact = simulateStep(ft, tmax, n);
    const approx = simulateStep(mkFT(1, [{ re: Math.max(p1, p2), im: 0 }], []), tmax, n);
    timeSvg($('#q4-step'), { tmax: tmax, cid: 'q4s', curves: [
      { name: 'système exact (2 pôles)', color: '#2e6da4', t: exact.t, y: exact.y },
      { name: 'approximation 1er ordre (pôle dominant)', color: '#e08a00', dash: '6 4', t: approx.t, y: approx.y }
    ] });
    const dom = Math.max(p1, p2), ratio = Math.max(Math.abs(p1), Math.abs(p2)) / Math.min(Math.abs(p1), Math.abs(p2));
    const b2 = $('#q4-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(p1, 3) + ' rad/s';
    b2[1].textContent = fmt(p2, 3) + ' rad/s';
    b2[2].textContent = fmt(ratio, 2);
    b2[3].textContent = 'p = ' + fmt(dom, 3);
    b2[4].textContent = t95(exact) + ' s';
    b2[5].textContent = t95(approx) + ' s';
    const m = $('#q4-msg');
    m.className = 'verdict ' + (ratio >= 5 ? 'yes' : (ratio < 2 ? 'warn' : ''));
    if (ratio >= 5) m.innerHTML = 'Le pôle <b>' + fmt(dom, 2) + ' rad/s</b> est dominant (|p₂/p₁| = ' + fmt(ratio, 1) + ' ≥ 5) : le pôle rapide n\'agit que pendant le régime transitoire court. L\'approximation du premier ordre est excellente à 5 %.';
    else if (ratio < 2) m.innerHTML = 'Les deux pôles sont <b>trop proches</b> (rapport ' + fmt(ratio, 2) + ') : aucun ne domine. L\'approximation du premier ordre est grossière, il faut garder les deux modes.';
    else m.innerHTML = 'Le pôle <b>' + fmt(dom, 2) + ' rad/s</b> domine, mais le pôle rapide en ' + fmt(dom === p1 ? p2 : p1, 2) + ' rad/s est encore visible en début de réponse. La réduction est acceptable en première approximation, à vérifier.';
  };
  const t95 = S => {
    const yf = S.y[S.y.length - 1];
    for (let i = S.y.length - 1; i >= 0; i--) if (Math.abs(S.y[i] - yf) > 0.05 * Math.abs(yf)) return fmt(S.t[Math.min(i + 1, S.t.length - 1)], 2);
    return '0';
  };
  upd();
}

/* ================= Atelier 5 : stabilité ================= */
const Q5 = { re: -0.8, im: 3 };
function mountQ5(root) {
  root.innerHTML = '<h2>Stabilité : position des pôles dans le plan complexe</h2>'
    + '<p>Un système linéaire est <b>stable</b> si et seulement si <b>tous ses pôles sont dans le demi-plan gauche</b> (partie réelle strictement négative). Chaque pôle pᵢ contribue à la réponse impulsionnelle par un mode <b>e^(pᵢ t)</b> :</p>'
    + '<ul><li><b>Re(p) &lt; 0</b> : le mode s\'amortit → système stable.</li>'
    + '<li><b>Re(p) = 0</b> : le mode ne s\'amortit pas (constante ou sinusoïde entretenue) → système marginalement stable.</li>'
    + '<li><b>Re(p) &gt; 0</b> : le mode diverge → système instable.</li></ul>'
    + '<p>Déplacez la paire de pôles conjugués : σ = Re(p) règle l\'amortissement (ou la divergence), ω = Im(p) règle la pulsation des oscillations.</p>'
    + '<div id="q5-sl"></div>'
    + '<div class="two"><div><h3>Plan complexe</h3><svg id="q5-map" viewBox="0 0 520 340" style="width:100%;max-width:560px;height:auto"></svg></div>'
    + '<div><h3>Réponse impulsionnelle h(t)</h3><svg id="q5-imp" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg></div></div>'
    + statsHtml([['Pôles', ''], ['σ = Re(p)', ''], ['ω = Im(p)', ''], ['ζ = −σ/|p|', ''], ['Stabilité', ''], ['Mode temporel', '']], 'q5-stats')
    + '<p class="verdict" id="q5-msg"></p>'
    + '<h3>Réponse indicielle</h3><svg id="q5-step" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg>'
    + '<div class="analogy"><b>Attention aux pôles à l\'origine :</b> un pôle simple en 0 donne une réponse en échelon (constante) : c\'est marginal. Deux pôles en 0 (double intégrateur) donnent une réponse en rampe : le système est en réalité <b>instable</b>. De même, une paire de pôles ±jω double (même pulsation, multiplicité 2) donne un mode t·sin(ωt) : instable.</div>';
  const S = Q5;
  slider($('#q5-sl'), { name: 'σ = Re(p)', min: -2, max: 1, step: 0.02, dec: 2, unit: 'rad/s', get: () => S.re, set: v => { S.re = v; }, onchange: () => upd() });
  slider($('#q5-sl'), { name: 'ω = Im(p)', min: 0.5, max: 4, step: 0.05, dec: 2, unit: 'rad/s', get: () => S.im, set: v => { S.im = v; }, onchange: () => upd() });
  const upd = () => {
    const ft = mkFT(1, [{ re: S.re, im: S.im }], []);
    drawPZ('#q5-map', ft);
    const modes = impulseModes(ft);
    const tmax = clamp(6 / Math.max(Math.abs(S.re), 0.05), 1, 40), n = clamp(Math.ceil(tmax * Math.max(Math.abs(S.re), S.im) * 40), 2000, 30000);
    const t = [], y = [], envP = [], envN = [];
    const A = Cx.abs(modes[0].amp);
    for (let i = 0; i <= 400; i++) {
      const tt = tmax * i / 400;
      t.push(tt); y.push(impulseAt(modes, tt));
      const e = 2 * A * Math.exp(S.re * tt);
      envP.push(e); envN.push(-e);
    }
    timeSvg($('#q5-imp'), { tmax: tmax, cid: 'q5i', clip: 8, curves: [
      { name: 'h(t) = Σ Aᵢ e^(pᵢ t)', color: '#2e6da4', t: t, y: y },
      { name: 'enveloppe ±2|A|e^(σt)', color: '#9a5b00', dash: '5 4', t: t, y: envP },
      { color: '#9a5b00', dash: '5 4', t: t, y: envN }
    ] });
    const sim = simulateStep(ft, tmax, n);
    timeSvg($('#q5-step'), { tmax: tmax, cid: 'q5s', clip: 8, curves: [{ name: 'réponse indicielle', color: '#2e6da4', t: sim.t, y: sim.y }] });
    const st = stabilityOf(ft);
    const b2 = $('#q5-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(S.re, 2) + ' ± ' + fmt(S.im, 2) + 'j';
    b2[1].textContent = fmt(S.re, 2) + ' rad/s';
    b2[2].textContent = fmt(S.im, 2) + ' rad/s';
    b2[3].textContent = fmt(Math.sqrt(S.re * S.re + S.im * S.im) > 1e-9 ? -S.re / Math.hypot(S.re, S.im) : 0, 2);
    b2[4].textContent = st.txt;
    b2[5].textContent = S.re < -0.02 ? 'e^(σt)·cos(ωt) amorti' : (Math.abs(S.re) <= 0.02 ? 'cos(ωt) entretenu' : 'e^(σt)·cos(ωt) divergent');
    const m = $('#q5-msg'); m.className = 'verdict ' + st.cls;
    if (S.re < -0.02) m.innerHTML = 'Les pôles sont dans le <b>demi-plan gauche</b> : la réponse impulsionnelle est une sinusoïde amortie, le système est stable. Plus |σ| est grand, plus l\'amortissement est rapide.';
    else if (Math.abs(S.re) <= 0.02) m.innerHTML = 'Les pôles sont <b>sur l\'axe imaginaire</b> : la réponse est une sinusoïde d\'amplitude constante. C\'est le cas limite (oscillateur non amorti).';
    else m.innerHTML = 'Les pôles sont dans le <b>demi-plan droit</b> : la réponse diverge exponentiellement, le système est <b>instable</b>.';
  };
  upd();
}

/* ================= Atelier 6 : lieu des racines ================= */
const Q6 = { K: 4 };
function locusData() {
  const traces = [], Ks = [];
  for (let i = 0; i <= 140; i++) Ks.push(Math.pow(10, -1.5 + 3.4 * i / 140));
  for (const K of Ks) traces.push(rootsOf([1, 4, 3, K]));
  return traces;
}
const LOCUS = locusData();
function mountQ6(root) {
  root.innerHTML = '<h2>Lieu des racines : déplacement des pôles avec le gain</h2>'
    + '<p>On ferme la boucle sur un gain K : la fonction de transfert en boucle fermée est <b>H_BF(p) = K·L(p) / (1 + K·L(p))</b>. Ses pôles sont les solutions de <b>1 + K·L(p) = 0</b>, c\'est-à-dire les racines de <b>D(p) + K·N(p)</b>. Quand K varie de 0 à ∞, les pôles se déplacent dans le plan complexe : c\'est le <b>lieu des racines</b>.</p>'
    + '<p>Exemple : <b>L(p) = 1 / (p(p + 1)(p + 3))</b>, donc D(p) = p³ + 4p² + 3p. Les pôles en boucle fermée sont les racines de <b>p³ + 4p² + 3p + K = 0</b>.</p>'
    + '<div id="q6-sl"></div>'
    + '<div class="two"><div><h3>Lieu des racines</h3><svg id="q6-map" viewBox="0 0 520 340" style="width:100%;max-width:560px;height:auto"></svg></div>'
    + '<div><h3>Réponse indicielle en boucle fermée</h3><svg id="q6-step" viewBox="0 0 640 250" style="width:100%;max-width:680px;height:auto"></svg></div></div>'
    + statsHtml([['Gain K', ''], ['Pôles en BF', ''], ['Stabilité', ''], ['Gain critique K_c', '']], 'q6-stats')
    + '<p class="verdict" id="q6-msg"></p>'
    + '<div class="analogy"><b>Ce qu\'il faut retenir :</b> les branches du lieu partent des <b>pôles en boucle ouverte</b> (K = 0) et aboutissent aux <b>zéros</b> (ou à l\'infini si le système est strictement propre). Le lieu traverse l\'axe imaginaire pour un gain <b>K_c</b> : au-delà, le système devient instable. Ici K_c = 12 (à vérifier par le critère de Routh : p³+4p²+3p+K, ligne s¹ : (12 − K)/4, d\'où K &lt; 12).</div>';
  const S = Q6;
  const logK = () => Math.log10(S.K);
  slider($('#q6-sl'), { name: 'log₁₀(K)', min: -1.5, max: 2, step: 0.01, dec: 2, get: logK, set: v => { S.K = Math.pow(10, v); }, onchange: () => upd() });
  const upd = () => {
    const poles = rootsOf([1, 4, 3, S.K]);
    const ft = mkFT(S.K, poles, []);
    pzSvg($('#q6-map'), { poles: poles, zeros: [], traces: LOCUS });
    const b = simBounds(ft);
    const tmax = clamp(b.tmax, 0.5, 40), n = clamp(b.n, 1500, 30000);
    const sim = simulateStep(ft, tmax, n);
    timeSvg($('#q6-step'), { tmax: tmax, cid: 'q6s', clip: 6, curves: [{ name: 'y(t)', color: '#2e6da4', t: sim.t, y: sim.y }] });
    const st = stabilityOf(ft);
    const b2 = $('#q6-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(S.K, 2);
    b2[1].textContent = poles.map(p => Math.abs(p.im) < 1e-6 ? fmt(p.re, 2) : fmt(p.re, 2) + '±' + fmt(Math.abs(p.im), 2) + 'j').join(' ; ');
    b2[2].textContent = st.txt;
    b2[3].textContent = '12';
    const m = $('#q6-msg'); m.className = 'verdict ' + st.cls;
    if (S.K < 12) {
      const real = poles.filter(p => Math.abs(p.im) < 1e-6);
      m.innerHTML = 'K = ' + fmt(S.K, 2) + ' &lt; 12 : les trois pôles sont dans le demi-plan gauche, le système est stable.' + (real.length === 2 ? ' Deux d\'entre eux sont réels, le troisième est réel aussi : la réponse est apériodique.' : ' Une paire complexe conjuguée donne un régime oscillant amorti.');
    } else {
      m.innerHTML = 'K = ' + fmt(S.K, 2) + ' ≥ 12 : une paire de pôles a franchi l\'axe imaginaire. Le système est <b>instable</b> : la réponse diverge. Il faut réduire le gain.';
    }
  };
  upd();
}
