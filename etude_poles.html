function getFTFromPole(pole) {
  if (pole.im === 0) {
    if (pole.re === 0) return mkFT(1, [{re: 0, im: 0}]);
    const k = -pole.re;
    return mkFT(k, [{re: pole.re, im: 0}]);
  } else {
    const k = pole.re * pole.re + pole.im * pole.im;
    return mkFT(k, [{re: pole.re, im: pole.im}]);
  }
}

window.selPole = id => { Q1.selected = id; drawQ1(); };
window.setInput = type => { Q1.input = type; drawQ1(); };

function drawQ1() {
  const pole = Q1_POLES[Q1.selected];
  const svgMap = $('#q1-map');
  const cx = 260, cy = 150, sx = 130, sy = 55;
  const X = re => cx + re * sx;

    s += `<text x="${X(v)}" y="${cy + 14}" font-size="10" text-anchor="middle" fill="#6a6a78">${(v < 0 ? '−' : '') + String(Math.abs(v)).replace('.', ',')}</text>`;
  }

  }

  s += `<line x1="${cx}" y1="0" x2="${cx}" y2="300" stroke="#333" stroke-width="1.2" />`;
  s += `<text x="512" y="${cy - 10}" font-size="12" text-anchor="end">Re</text>`;
  s += `<text x="${cx + 10}" y="15" font-size="12">Im</text>`;
  Q1_POLES.forEach(p => {
    const sel = p.id === Q1.selected;
    const r = sel ? 8 : 5;
    const x = X(p.re), y = Y(p.im);
    if (p.im !== 0) {
      s += `<circle cx="${x}" cy="${Y(-p.im)}" r="${r}" fill="${p.color}" stroke="${sel ? '#000' : '#fff'}" stroke-width="${sel ? 2 : 1}" style="cursor:pointer" onclick="window.selPole(${p.id})" />`;

  if (pole.re < 0) tmax = 6 / Math.abs(pole.re);

  else if (pole.im !== 0) tmax = 6 * Math.PI / Math.abs(pole.im);
  else if (pole.re === 0 && pole.im === 0) tmax = 5;
  
  let sim;
  if (Q1.input === 'dirac') {
    const modes = impulseModes(ft);
    const t = [], y = [];

  } else {

  }
  
  const inpNames = { dirac: 'Dirac', echelon: 'Échelon', rampe: 'Rampe' };
  timeSvg($('#q1-time'), {
    tmax: tmax,

    curves: [{ name: 'Réponse à ' + ({ dirac: 'un Dirac', echelon: 'un échelon', rampe: 'une rampe' })[Q1.input], color: pole.color, t: sim.t, y: sim.y }],

  const pick = (a, b, c) => ({ dirac: a, echelon: b, rampe: c })[inp];
  if (pole.re > 0) {
    msgTxt += pole.im !== 0 ? "oscillations d'amplitude croissante (système instable)." : 'divergence exponentielle (système instable).';
  } else if (pole.re === 0 && pole.im !== 0) {
    msgTxt += pick("oscillation non amortie qui ne s'éteint jamais (système marginal).",
      'oscillation non amortie autour de la valeur 1 (système marginal).',
      'rampe superposée à une oscillation non amortie (système marginal).');
  } else if (pole.re === 0) {
    msgTxt += pick('échelon : la sortie reste constante, elle ne revient pas à zéro (intégrateur).',
      'rampe : la sortie croît sans limite (intégrateur).',
      'parabole y = t²/2 : la sortie croît sans limite.');
  } else if (pole.im !== 0) {
    msgTxt += pick('oscillations amorties qui tendent vers 0 (système stable).',
      'oscillations amorties autour de la valeur finale 1 (système stable).',
      "oscillations amorties autour d'une droite de pente 1 (système stable).");
  } else {
    msgTxt += pick('décroissance exponentielle vers 0 (système stable).',
      'montée exponentielle vers la valeur finale 1 (système stable).',
      'tend vers une droite de pente 1, avec un retard constant (système stable).');
  }
  msg.innerHTML = msgTxt;
}

    + '<p>Un second ordre normalisé s\'écrit <b>H(p) = ωn² / (p² + 2ζωn p + ωn²)</b>. Ses pôles sont <b>p = −ζωn ± jωn√(1 − ζ²)</b> (pour ζ &lt; 1). On en déduit deux lectures graphiques :</p>'
    + '<ul><li><b>ωn = |p|</b> : la distance du pôle à l\'origine fixe l\'échelle de temps. Les pôles de même ωn forment un <b>cercle centré à l\'origine</b> (arcs gris).</li>'
    + '<li><b>ζ = −Re(p)/|p| = cos θ</b>, où θ est l\'angle entre le pôle et l\'axe réel négatif. Plus le pôle est proche de l\'axe imaginaire, plus ζ est petit, plus ça oscille. Les pôles de même ζ forment une <b>demi-droite issue de l\'origine</b> (rayons gris) : ζ = 0 sur l\'axe imaginaire, ζ = 1 sur l\'axe réel négatif. Voir le cours.</li></ul>'
    + '<div id="q3-sl"></div>'
    + '<div class="two"><div><h3>Plan complexe</h3><svg id="q3-map" viewBox="0 0 520 340" style="width:100%;height:auto"></svg></div>'
    + '<div><h3>Réponse indicielle</h3><svg id="q3-step" viewBox="0 0 640 250" style="width:100%;height:auto"></svg></div></div>'
    + statsHtml([['Pôles', ''], ['ωn = |p|', ''], ['ζ = cos θ', ''], ['θ', ''], ['Dépassement D', ''], ['Pseudo-période', '']], 'q3-stats')
    + '<p class="verdict" id="q3-msg"></p>'
    + '<div class="two"><div><h3>Diagramme de Bode</h3><svg id="q3-bode" viewBox="0 0 640 400" style="width:100%;height:auto"></svg></div>'
    + '<div class="analogy" style="align-self:center"><b>Zone de bon amortissement :</b> un dépassement de 10 à 20 % correspond à ζ ≈ 0,45 à 0,6, c\'est-à-dire un angle θ ≈ 55° à 63°. Un ζ = 0,7 (θ = 45°) donne la réponse la plus rapide sans dépassement notable. ζ → 0 : les pôles se rapprochent de l\'axe imaginaire, la réponse oscille de plus en plus longtemps.</div></div>';
  const S = Q3;
  slider($('#q3-sl'), { name: 'Amortissement ζ', min: 0.05, max: 1.2, step: 0.01, dec: 2, get: () => S.zeta, set: v => { S.zeta = v; }, onchange: () => upd() });
  slider($('#q3-sl'), { name: 'Pulsation propre ωn', min: 0.3, max: 10, step: 0.05, dec: 2, unit: 'rad/s', get: () => S.wn, set: v => { S.wn = v; }, onchange: () => upd() });
  lslider($('#q3-sl'), { name: 'Échelle de temps (durée)', min: 0.2, max: 60, dec: 2, unit: 's', get: () => S.tmax, set: v => { S.tmax = v; }, onchange: () => upd() });
  lslider($('#q3-sl'), { name: 'Échelle des ordonnées (max)', min: 0.5, max: 5, dec: 2, get: () => S.ymax, set: v => { S.ymax = v; }, onchange: () => upd() });
  const upd = () => {
    const z = Math.min(S.zeta, 0.999), wn = S.wn;
    const re = -z * wn, im = wn * Math.sqrt(1 - z * z);
    const ft = mkFT(wn * wn, [{ re: re, im: im }], []);
    pzSvg($('#q3-map'), { poles: ft.poles, zeros: [], fixed: fixedView(S.R), iso: { zetas: [0.1, 0.3, 0.5, 0.7, 0.9], step: isoStep(S.R), maxR: S.R, cur: { zeta: z, wn: wn } } });
    const tmax = S.tmax, n = clamp(Math.ceil(tmax * Math.max(wn, 1) * 40), 1500, 40000);
    const sim = simulateStep(ft, tmax, n);
    timeSvg($('#q3-step'), { tmax: tmax, ymin: -0.05 * S.ymax, ymax: S.ymax, cid: 'q3s', curves: [{ name: 'y(t)', color: '#2e6da4', t: sim.t, y: sim.y }] });
    const D = Math.exp(-Math.PI * z / Math.sqrt(1 - z * z)) * 100;
    const Tp = 2 * Math.PI / (wn * Math.sqrt(1 - z * z));
    const th = Math.acos(z) * R2D;
    const b2 = $('#q3-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(re, 2) + ' ± ' + fmt(im, 2) + 'j';
    b2[1].textContent = fmt(wn, 2) + ' rad/s';
    b2[2].textContent = fmt(z, 2);
    b2[3].textContent = fmt(th, 1) + ' °';
    b2[4].textContent = fmt(D, 1) + ' %';
    b2[5].textContent = fmt(Tp, 2) + ' s';
    const m = $('#q3-msg');
    m.className = 'verdict ' + (z < 0.25 ? 'warn' : (z > 0.85 ? 'warn' : 'yes'));
    let txt = 'Les pôles sont à <b>' + fmt(re, 2) + ' ± ' + fmt(im, 2) + 'j</b> : ωn = ' + fmt(wn, 2) + ' rad/s et ζ = cos θ = cos ' + fmt(th, 1) + '° = ' + fmt(z, 2) + '. ';
    if (z < 0.25) txt += 'Zone très peu amortie : dépassement de ' + fmt(D, 0) + ' %, oscillations qui durent longtemps.';
    else if (z > 0.85) txt += 'Zone sur-amortie : pas ou peu de dépassement, mais réponse plus lente que nécessaire.';
    else txt += 'Dépassement de ' + fmt(D, 1) + ' % : c\'est une zone de compromis raisonnable.';
    m.innerHTML = txt;
    bodeSvg($('#q3-bode'), { wmin: 0.03, wmax: 300, curves: [ftBodeCurve(ft, 'H(jω)', '#2e6da4')], marks: [{ w: wn, label: 'ωn' }] });
  };
  upd();
}
WORKSHOPS.push({ id: 'q3', title: 'Pôles complexes', hint: 'Déplacez ζ et ωn : le pôle tourne sur un cercle d\'ωn constant quand ζ varie, et glisse sur une demi-droite de ζ constant quand ωn varie (lignes grises). Voir le cours.',

/* ================= Atelier 4 : pôle dominant ================= */
const Q4 = { t1: 1, t2: 0.1, R: 12.3, tmax: 8, ymax: 1.41 };
function mountQ4(root) {
  root.innerHTML = '<h2>Pôle dominant et ordre supérieur</h2>'
    + '<p>Pour <b>H(p) = 1 / ((1 + τ₁p)(1 + τ₂p))</b>, les pôles sont <b>p₁ = −1/τ₁</b> et <b>p₂ = −1/τ₂</b>. Le mode associé à un pôle s\'amortit comme <b>e^(p t)</b> : il est d\'autant plus lent que le pôle est proche de l\'axe imaginaire. Le pôle <b>le plus proche de l\'axe imaginaire</b> est le <b>pôle dominant</b> : c\'est lui qui impose la dynamique de la réponse.</p>'
    + '<div id="q4-sl"></div>'
    + '<div class="two"><div><h3>Plan complexe</h3><svg id="q4-map" viewBox="0 0 520 340" style="width:100%;height:auto"></svg></div>'
    + '<div><h3>Réponse indicielle</h3><svg id="q4-step" viewBox="0 0 640 250" style="width:100%;height:auto"></svg></div></div>'
    + statsHtml([['Pôle p₁', ''], ['Pôle p₂', ''], ['Rapport |p₂/p₁|', ''], ['Pôle dominant', ''], ['Temps à 95 % (exact)', ''], ['Temps à 95 % (1er ordre)', '']], 'q4-stats')
    + '<p class="verdict" id="q4-msg"></p>'
    + '<div class="analogy"><b>Légende :</b> bleu = système exact ; rouge et jaune = réponse du premier ordre de chacun des deux pôles (gain statique 1), de la même couleur que sa croix dans le plan complexe. Le trait <b>épais et plein</b> (étiquette « dominant » sur le plan) est le pôle dominant : sa réponse du premier ordre est l\'approximation du système exact.<br><b>Règle d\'usage :</b> si |p₂| ≥ 5|p₁|, le pôle p₂ est négligeable : H se comporte comme un premier ordre de constante de temps τ₁. Si les deux pôles sont proches, on ne peut pas simplifier : les deux modes comptent. La réduction de modèle ne s\'applique qu\'aux pôles <b>lents</b> ; les pôles rapides (grand |Re|) disparaissent dans le régime transitoire court.</div>';
  const S = Q4;
  slider($('#q4-sl'), { name: 'Constante de temps τ₁', min: 0.09, max: 5, step: 0.01, dec: 2, unit: 's', get: () => S.t1, set: v => { S.t1 = v; }, onchange: () => upd() });
  slider($('#q4-sl'), { name: 'Constante de temps τ₂', min: 0.09, max: 3, step: 0.01, dec: 2, unit: 's', get: () => S.t2, set: v => { S.t2 = v; }, onchange: () => upd() });
  lslider($('#q4-sl'), { name: 'Échelle de temps (durée)', min: 0.5, max: 100, dec: 2, unit: 's', get: () => S.tmax, set: v => { S.tmax = v; }, onchange: () => upd() });
  const upd = () => {
    const p1 = -1 / S.t1, p2 = -1 / S.t2;
    const ft = mkFT(p1 * p2, [{ re: p1, im: 0 }, { re: p2, im: 0 }], []);
    const pd = Math.max(p1, p2);
    const ftA = mkFT(-pd, [{ re: pd, im: 0 }], []);
    const C1 = '#d62828', C2 = '#d9a300';
    const dom1 = p1 >= p2 - 1e-9, dom2 = p2 >= p1 - 1e-9;
    drawPZ('#q4-map', ft, { fixed: fixedView(S.R), poleColors: [C1, C2], poleWidths: [dom1 ? 4.2 : 2.2, dom2 ? 4.2 : 2.2], poleSizes: [dom1 ? 8 : 5.5, dom2 ? 8 : 5.5], poleLabels: [dom1 ? 'p₁ dominant' : 'p₁', dom2 ? 'p₂ dominant' : 'p₂'] });
    const tmax = S.tmax, wf = Math.max(1 / S.t1, 1 / S.t2);
    const n = clamp(Math.ceil(tmax * wf * 25), 1500, 40000);
    const exact = simulateStep(ft, tmax, n);
    const y1 = simulateStep(mkFT(-p1, [{ re: p1, im: 0 }], []), tmax, n);
    const y2 = simulateStep(mkFT(-p2, [{ re: p2, im: 0 }], []), tmax, n);
    const tS = 12 * Math.max(S.t1, S.t2), nS = clamp(Math.ceil(tS * wf * 25), 1500, 40000);
    const exactS = simulateStep(ft, tS, nS), approxS = simulateStep(ftA, tS, nS);
    timeSvg($('#q4-step'), { tmax: tmax, ymin: -0.05 * S.ymax, ymax: S.ymax, cid: 'q4s', curves: [
      { name: 'système exact (2 pôles)', color: '#2e6da4', width: 2.2, t: exact.t, y: exact.y },
      { name: '1er ordre de p₁' + (dom1 ? ' (dominant)' : ''), color: C1, width: dom1 ? 3.8 : 1.8, dash: dom1 ? undefined : '6 4', t: y1.t, y: y1.y },
      { name: '1er ordre de p₂' + (dom2 ? ' (dominant)' : ''), color: C2, width: dom2 ? 3.8 : 1.8, dash: dom2 ? undefined : '6 4', t: y2.t, y: y2.y }
    ] });
    const dom = Math.max(p1, p2), ratio = Math.max(Math.abs(p1), Math.abs(p2)) / Math.min(Math.abs(p1), Math.abs(p2));
    const b2 = $('#q4-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(p1, 3) + ' rad/s';
    b2[1].textContent = fmt(p2, 3) + ' rad/s';
    b2[2].textContent = fmt(ratio, 2);
    b2[3].textContent = 'p = ' + fmt(dom, 3);
    b2[4].textContent = t95(exactS) + ' s';
    b2[5].textContent = t95(approxS) + ' s';
    const m = $('#q4-msg');
    m.className = 'verdict ' + (ratio >= 5 ? 'yes' : (ratio < 2 ? 'warn' : ''));
    if (ratio >= 5) m.innerHTML = 'Le pôle <b>' + fmt(dom, 2) + ' rad/s</b> est dominant (|p₂/p₁| = ' + fmt(ratio, 1) + ' ≥ 5) : le pôle rapide n\'agit que pendant le régime transitoire court. L\'approximation du premier ordre est excellente à 5 %.';
    else if (ratio < 2) m.innerHTML = 'Les deux pôles sont <b>trop proches</b> (rapport ' + fmt(ratio, 2) + ') : aucun ne domine. L\'approximation du premier ordre est grossière, il faut garder les deux modes.';
    else m.innerHTML = 'Le pôle <b>' + fmt(dom, 2) + ' rad/s</b> domine, mais le pôle rapide en ' + fmt(dom === p1 ? p2 : p1, 2) + ' rad/s est encore visible en début de réponse. La réduction est acceptable en première approximation, à vérifier.';
  };
  const t95 = S => {
    const yf = S.y[S.y.length - 1];
    for (let i = S.y.length - 1; i >= 0; i--) if (Math.abs(S.y[i] - yf) > 0.05 * Math.abs(yf)) return fmt(S.t[Math.min(i + 1, S.t.length - 1)], 2);
    return '0';
  };
  upd();
}

/* ================= Atelier 5 : stabilité ================= */
const Q5 = { re: -0.8, im: 3, input: 'echelon' };
function mountQ5(root) {
  const INP = { dirac: 'Dirac', echelon: 'Échelon', rampe: 'Rampe' };
  root.innerHTML = '<h2>Stabilité : position des pôles dans le plan complexe</h2>'
    + '<p>Un système linéaire est <b>stable</b> si et seulement si <b>tous ses pôles sont dans le demi-plan gauche</b> (partie réelle strictement négative). Chaque pôle pᵢ contribue à la réponse impulsionnelle par un mode <b>e^(pᵢ t)</b> :</p>'
    + '<ul><li><b>Re(p) &lt; 0</b> : le mode s\'amortit → système stable.</li>'
    + '<li><b>Re(p) = 0</b> : le mode ne s\'amortit pas (constante ou sinusoïde entretenue) → système marginalement stable.</li>'
    + '<li><b>Re(p) &gt; 0</b> : le mode diverge → système instable.</li></ul>'
    + '<p>Déplacez la paire de pôles conjugués : σ = Re(p) règle l\'amortissement (ou la divergence), ω = Im(p) règle la pulsation des oscillations. Le plan complexe garde une échelle fixe (volontairement dézoomée) pour que le déplacement des pôles reste lisible, même dans les cas extrêmes. La fonction de transfert est normalisée : H(p) = |p|² / ((p − p₀)(p − p₀*)), de gain statique 1.</p>'
    + '<div class="opts"><div class="fld"><span>Type de réponse temporelle</span><div class="seg" id="q5-in">'
    + Object.keys(INP).map(k => '<button type="button" data-v="' + k + '" aria-pressed="' + (Q5.input === k ? 'true' : 'false') + '">' + INP[k] + '</button>').join('')
    + '</div></div></div>'
    + '<div id="q5-sl"></div>'
    + '<div class="two"><div><h3>Plan complexe</h3><svg id="q5-map" viewBox="0 0 520 340" style="width:100%;height:auto"></svg></div>'
    + '<div><h3 id="q5-title">Réponse</h3><svg id="q5-resp" viewBox="0 0 640 250" style="width:100%;height:auto"></svg></div></div>'
    + statsHtml([['Pôles', ''], ['σ = Re(p)', ''], ['ω = Im(p)', ''], ['ζ = −σ/|p|', ''], ['Stabilité', ''], ['Mode temporel', '']], 'q5-stats')
    + '<p class="verdict" id="q5-msg"></p>'
    + '<div class="analogy"><b>Attention aux pôles à l\'origine :</b> un pôle simple en 0 donne une réponse en échelon (constante) : c\'est marginal. Deux pôles en 0 (double intégrateur) donnent une réponse en rampe : le système est en réalité <b>instable</b>. De même, une paire de pôles ±jω double (même pulsation, multiplicité 2) donne un mode t·sin(ωt) : instable.</div>';
  const S = Q5;
  slider($('#q5-sl'), { name: 'σ = Re(p)', min: -6, max: 3, step: 0.05, dec: 2, unit: 'rad/s', get: () => S.re, set: v => { S.re = v; }, onchange: () => upd() });
  slider($('#q5-sl'), { name: 'ω = Im(p)', min: 0.2, max: 6, step: 0.05, dec: 2, unit: 'rad/s', get: () => S.im, set: v => { S.im = v; }, onchange: () => upd() });
  const upd = () => {
    const ft = mkFT(S.re * S.re + S.im * S.im, [{ re: S.re, im: S.im }], []);
    drawPZ('#q5-map', ft, { fixed: { reMin: -14, reMax: 7, imMax: 7.5 } });
    const tmax = clamp(6 / Math.max(Math.abs(S.re), 0.05), 1, 40), n = clamp(Math.ceil(tmax * Math.max(Math.abs(S.re), S.im) * 40), 2000, 30000);
    let curves, clip;
    if (S.input === 'dirac') {
      const modes = impulseModes(ft), t = [], y = [], envP = [], envN = [];
      const A = Cx.abs(modes[0].amp);
      for (let i = 0; i <= 400; i++) {
        const tt = tmax * i / 400;
        t.push(tt); y.push(impulseAt(modes, tt));
        const e = 2 * A * Math.exp(S.re * tt);
        envP.push(e); envN.push(-e);
      }
      curves = [
        { name: 'h(t) = Σ Aᵢ e^(pᵢ t)', color: '#2e6da4', t: t, y: y },
        { name: 'enveloppe ±2|A|e^(σt)', color: '#9a5b00', dash: '5 4', t: t, y: envP },
        { color: '#9a5b00', dash: '5 4', t: t, y: envN }
      ];
      clip = 40;
    } else {
      const sim = simulateStep(ft, tmax, n, S.input);
      curves = [{ name: S.input === 'echelon' ? 'réponse indicielle' : 'réponse à la rampe', color: '#2e6da4', t: sim.t, y: sim.y }];
      clip = S.input === 'rampe' ? Math.max(8, tmax * 1.1) : 8;
    }
    $('#q5-title').textContent = { dirac: 'Réponse impulsionnelle h(t)', echelon: 'Réponse indicielle', rampe: 'Réponse à une rampe' }[S.input];
    timeSvg($('#q5-resp'), { tmax: tmax, cid: 'q5r', clip: clip, curves: curves });
    const st = stabilityOf(ft);
    const b2 = $('#q5-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(S.re, 2) + ' ± ' + fmt(S.im, 2) + 'j';
    b2[1].textContent = fmt(S.re, 2) + ' rad/s';
    b2[2].textContent = fmt(S.im, 2) + ' rad/s';
    b2[3].textContent = fmt(Math.sqrt(S.re * S.re + S.im * S.im) > 1e-9 ? -S.re / Math.hypot(S.re, S.im) : 0, 2);
    b2[4].textContent = st.txt;
    b2[5].textContent = S.re < -0.02 ? 'e^(σt)·cos(ωt) amorti' : (Math.abs(S.re) <= 0.02 ? 'cos(ωt) entretenu' : 'e^(σt)·cos(ωt) divergent');
    const m = $('#q5-msg'); m.className = 'verdict ' + st.cls;
    if (S.re < -0.02) m.innerHTML = 'Les pôles sont dans le <b>demi-plan gauche</b> : la réponse impulsionnelle est une sinusoïde amortie, le système est stable. Plus |σ| est grand, plus l\'amortissement est rapide.';
    else if (Math.abs(S.re) <= 0.02) m.innerHTML = 'Les pôles sont <b>sur l\'axe imaginaire</b> : la réponse est une sinusoïde d\'amplitude constante. C\'est le cas limite (oscillateur non amorti).';
    else m.innerHTML = 'Les pôles sont dans le <b>demi-plan droit</b> : la réponse diverge exponentiellement, le système est <b>instable</b>.';
  };
  $('#q5-in').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    S.input = b.dataset.v;
    $('#q5-in').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    upd();
  });
  upd();
}
WORKSHOPS.push({ id: 'q5', title: 'Stabilité', hint: 'Faites glisser la paire de pôles de part et d\'autre de l\'axe imaginaire et choisissez le type de réponse : Dirac, échelon ou rampe.',

/* ================= Atelier 6 : lieu des racines ================= */
const Q6 = { K: 4, tmax: 15, ymax: 2 };
function locusData() {
  const traces = [], Ks = [];
  for (let i = 0; i <= 140; i++) Ks.push(Math.pow(10, -1.5 + 3.4 * i / 140));
  for (const K of Ks) traces.push(rootsOf([1, 4, 3, K]));
  return traces;
}
const LOCUS = locusData();
function mountQ6(root) {
  root.innerHTML = '<h2>Lieu des racines : déplacement des pôles avec le gain</h2>'
    + '<p>On ferme la boucle sur un gain K : la fonction de transfert en boucle fermée est <b>H_BF(p) = K·L(p) / (1 + K·L(p))</b>. Ses pôles sont les solutions de <b>1 + K·L(p) = 0</b>, c\'est-à-dire les racines de <b>D(p) + K·N(p)</b>. Quand K varie de 0 à ∞, les pôles se déplacent dans le plan complexe : c\'est le <b>lieu des racines</b>.</p>'
    + '<h3>Schéma bloc et notations</h3>' + blockDiagramSvg() + blockDefsHtml()
    + '<p>Exemple : <b>L(p) = 1 / (p(p + 1)(p + 3))</b>, donc N(p) = 1 et D(p) = p(p + 1)(p + 3) = p³ + 4p² + 3p. Les pôles en boucle fermée sont les racines de <b>D(p) + K·N(p) = p³ + 4p² + 3p + K = 0</b>.</p>'
    + '<div id="q6-sl"></div>'
    + '<div class="two"><div><h3>Lieu des racines</h3><svg id="q6-map" viewBox="0 0 520 340" style="width:100%;height:auto"></svg></div>'
    + '<div><h3>Réponse indicielle en boucle fermée</h3><svg id="q6-step" viewBox="0 0 640 250" style="width:100%;height:auto"></svg></div></div>'
    + statsHtml([['Gain K', ''], ['Pôles en BF', ''], ['Stabilité', ''], ['Gain critique K_c', '']], 'q6-stats')
    + '<p class="verdict" id="q6-msg"></p>'
    + '<div class="analogy"><b>Ce qu\'il faut retenir :</b> les branches du lieu partent des <b>pôles en boucle ouverte</b> (K = 0) et aboutissent aux <b>zéros</b> (ou à l\'infini si le système est strictement propre). Le lieu traverse l\'axe imaginaire pour un gain <b>K_c</b> : au-delà, le système devient instable. Ici K_c = 12 (à vérifier par le critère de Routh : p³+4p²+3p+K, ligne s¹ : (12 − K)/4, d\'où K &lt; 12).</div>';
  const S = Q6;
  const logK = () => Math.log10(S.K);
  slider($('#q6-sl'), { name: 'log₁₀(K)', min: -1.5, max: 2, step: 0.01, dec: 2, get: logK, set: v => { S.K = Math.pow(10, v); }, onchange: () => upd() });
  lslider($('#q6-sl'), { name: 'Échelle de temps (durée)', min: 0.5, max: 200, dec: 2, unit: 's', get: () => S.tmax, set: v => { S.tmax = v; }, onchange: () => upd() });
  lslider($('#q6-sl'), { name: 'Échelle des ordonnées (max)', min: 0.2, max: 20, dec: 2, get: () => S.ymax, set: v => { S.ymax = v; }, onchange: () => upd() });

<p>Pour un système linéaire à coefficients constants, la fonction de transfert est le rapport des transformées de Laplace de la sortie et de l'entrée, à conditions initiales nulles :</p>

<p>Chaque pôle p donne un mode e<sup>pt</sup> dans la réponse. Plus un pôle est proche de l'axe imaginaire, plus son mode s'éteint lentement. Le <b>pôle dominant</b> est le pôle (ou la paire de pôles) le plus proche de l'axe imaginaire : c'est lui qui impose la durée du régime transitoire.</p>

<p>Les zéros n'influencent pas la stabilité. Ils ne compensent pas non plus de façon fiable un pôle instable : une simplification pôle-zéro instable laisse un mode divergent caché.</p>

<p>Un système linéaire obéit au principe de superposition. Si H(p) = H₁(p) + H₂(p) + … , alors la réponse de H à une entrée donnée est la somme des réponses de chaque H<sub>i</sub> à cette même entrée.</p>

<p>Passer d'une entrée à la suivante revient à ajouter un pôle à l'origine dans Y(p), donc à intégrer la réponse.</p>
<h3>Ce que la somme hérite des pôles</h3>
<ul>
<li>Les pôles de la somme sont la réunion des pôles des H<sub>i</sub> : la somme est stable seulement si <b>chaque</b> H<sub>i</sub> est stable.</li>
<li>Le mode le plus lent (pôle le plus proche de l'axe imaginaire) fixe la durée du régime transitoire de la somme.</li>
<li>Un pôle double ajoute un mode t·e<sup>pt</sup> en plus de e<sup>pt</sup>.</li>
<li>Les gains statiques s'additionnent : deux fonctions de gain statique 1 donnent une somme de gain statique 2.</li>
</ul>
<p>L'atelier 7 permet de placer les pôles et de visualiser chaque réponse et leur somme.</p>` }

/* ---------- interface ---------- */
const UI = { cur: 'q1' };
const AS = { key: 'q1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };

function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');

  catch (err) { root.innerHTML = '<p class="verdict no"><b>Erreur d\'affichage.</b> ' + esc(err && err.message || err) + '</p>'; if (window.console) console.error(err); }

function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }

}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  document.body.classList.toggle('act-open', AS.open && !CS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag; box.innerHTML = '';
  const a = ACT[AS.key];
  if (!a) {
    box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, '—'), h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer')),
      h('div', { class: 'pbody' }, h('p', { class: 'small' }, 'Pas d\u2019activité associée à cet atelier pour le moment.')));
    return;
  }
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Quiz (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));

    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer au quiz')));
  } else {
    const s = actState(), show = s.checked || s.shown;

      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);

    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    if (!s.shown) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);

$('#bAct').addEventListener('click', () => { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); });
