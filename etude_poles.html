<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');

}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-poles-v7' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmt = (x, d = 2) => { if (!isFinite(x)) return x > 0 ? '∞' : '−∞'; const r = Math.round(x * 10 ** d) / 10 ** d; return String(Object.is(r, -0) ? 0 : r).replace('.', ','); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R2D = 180 / Math.PI;

/* ---------- Complexes & Polynômes ---------- */
const Cx = {
  add: (a, b) => ({ re: a.re + b.re, im: a.im + b.im }),
  sub: (a, b) => ({ re: a.re - b.re, im: a.im - b.im }),
  mul: (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }),
  div: (a, b) => { const d = b.re * b.re + b.im * b.im || 1e-30; return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d }; },
  abs: a => Math.hypot(a.re, a.im)
};
function polyMulRoot(poly, r) {
  const out = poly.map(() => ({ re: 0, im: 0 }));
  out.push({ re: 0, im: 0 });
  for (let i = 0; i < poly.length; i++) {
    out[i] = Cx.add(out[i], poly[i]);
    out[i + 1] = Cx.sub(out[i + 1], Cx.mul(poly[i], r));

}
function polyFromRoots(k, roots) {
  let poly = [{ re: k, im: 0 }];
  for (const r of roots) poly = polyMulRoot(poly, r);
  return poly.map(c => c.re);
}
function polyvalC(coef, p) { let r = { re: 0, im: 0 }; for (const c of coef) r = Cx.add(Cx.mul(r, p), { re: c, im: 0 }); return r; }
function deriv(coef) { const n = coef.length - 1, out = []; for (let i = 0; i < n; i++) out.push(coef[i] * (n - i)); return out.length ? out : [0]; }

/* ---------- Fonction de transfert ---------- */
function mkFT(k, poles, zeros) {
  const ens = arr => { const out = []; for (const r of arr) { out.push({ re: r.re, im: r.im }); if (Math.abs(r.im) > 1e-12) out.push({ re: r.re, im: -r.im }); } return out; };

  let rhp = 0, imag = 0, origin = 0;
  for (const p of ft.poles) { if (p.re > 1e-9) rhp++; else if (Math.abs(p.re) <= 1e-9) { imag++; if (Math.abs(p.im) < 1e-9) origin++; } }
  if (rhp > 0) return { txt: 'instable', cls: 'no', why: 'au moins un pôle à partie réelle strictement positive' };
  if (origin >= 2) return { txt: 'instable', cls: 'no', why: 'pôle multiple à l\'origine (réponse en t·e⁰ᵗ)' };
  if (imag > 0) return { txt: 'marginalement stable', cls: 'warn', why: 'pôle(s) sur l\'axe imaginaire : réponse qui ne s\'amortit pas' };
  return { txt: 'stable', cls: 'yes', why: 'tous les pôles ont une partie réelle strictement négative' };
}

/* ---------- Simulation (Espace d'état + RK4) ---------- */
function toSS(ft) {
  const { num, den } = ftPoly(ft);

function getFTFromPole(pole) {
  if (pole.im === 0) {
    if (pole.re === 0) return mkFT(1, [{re: 0, im: 0}]);
    const k = -pole.re;
    return mkFT(k, [{re: pole.re, im: 0}]);

    const k = pole.re * pole.re + pole.im * pole.im;
    return mkFT(k, [{re: pole.re, im: pole.im}]);
  }
}

window.selPole = id => { Q1.selected = id; drawQ1(); };
window.setInput = type => { Q1.input = type; drawQ1(); };

function drawQ1() {
  const pole = Q1_POLES[Q1.selected];
  const svgMap = $('#q1-map');
  
  const allPoles = [];
  Q1_POLES.forEach(p => {
    allPoles.push({re: p.re, im: p.im, color: p.color});
    if (p.im !== 0) allPoles.push({re: p.re, im: -p.im, color: p.color});
  });
  
  pzSvg(svgMap, {
    poles: allPoles,
    zeros: [],
    fixedBounds: { reMin: -4, reMax: 3, imMin: -3.5, imMax: 3.5 },
    highlight: [{re: pole.re, im: pole.im}, ...(pole.im !== 0 ? [{re: pole.re, im: -pole.im}] : [])]
  });
  
  const ft = getFTFromPole(pole);
  let tmax = 5;
  if (pole.re < 0) tmax = 6 / Math.abs(pole.re);
  else if (pole.re > 0) tmax = 3 / pole.re;
  else if (pole.im !== 0) tmax = 6 * Math.PI / Math.abs(pole.im);
  else if (pole.re === 0 && pole.im === 0) tmax = 5;
  
  let sim;
  if (Q1.input === 'dirac') {
    const modes = impulseModes(ft);
    const t = [], y = [];
    for(let i=0; i<=400; i++) {
      const tt = tmax * i / 400;
      t.push(tt);
      y.push(impulseAt(modes, tt));
    }
    sim = { t, y };
  } else {
    sim = simulateStep(ft, tmax, 400, Q1.input);
  }
  
  const inpNames = { dirac: 'Dirac', echelon: 'Échelon', rampe: 'Rampe' };
  timeSvg($('#q1-time'), {
    tmax: tmax,
    cid: 'q1t',
    curves: [{ name: 'Réponse à un ' + inpNames[Q1.input].toLowerCase(), color: pole.color, t: sim.t, y: sim.y }],
    clip: 15
  });
  
  document.querySelectorAll('.q1-inp').forEach(btn => {
    btn.classList.toggle('pri', btn.dataset.type === Q1.input);
  });
  document.querySelectorAll('.pole-btn').forEach(el => {
    el.classList.toggle('pri', parseInt(el.dataset.id) === Q1.selected);
  });
  
  const msg = $('#q1-msg');
  let msgTxt = `<b>${pole.name}</b> en p = ${pole.re}`;
  if (pole.im !== 0) msgTxt += ` ± ${Math.abs(pole.im)}j`;
  msgTxt += `<br>Réponse à un ${inpNames[Q1.input].toLowerCase()} : `;
  if (pole.re > 0) msgTxt += `divergence exponentielle (système instable).`;
  else if (pole.re === 0) {
    if (pole.im !== 0) msgTxt += `oscillation entretenue (système marginal).`;
    else {
      if (Q1.input === 'echelon') msgTxt += `constante (échelon).`;
      else if (Q1.input === 'rampe') msgTxt += `rampe.`;
      else msgTxt += `échelon (constante).`;
    }
  } else {
    if (pole.im !== 0) msgTxt += `oscillation amortie (système stable).`;
    else msgTxt += `amortissement exponentiel (système stable).`;
  }
  msg.innerHTML = msgTxt;
}

const Q4 = { t1: 1, t2: 0.1 };
function mountQ4(root) {
  root.innerHTML = '<h2>Pôle dominant et ordre supérieur</h2>'
    + '<p>Pour <b>H(p) = 1 / ((1 + τ₁p)(1 + τ₂p))</b>, les pôles sont <b>p₁ = −1/τ₁</b> et <b>p₂ = −1/τ₂</b>. Le mode associé à un pôle s\'amortit comme <b>e^(p t)</b> : il est d\'autant plus lent que le pôle est proche de l\'axe imaginaire. Le pôle <b>le plus proche de l\'axe imaginaire</b> est le <b>pôle dominant</b> : c\'est lui qui impose la dynamique de la réponse.</p>'
    + '<div id="q4-sl"></div>'
    + '<div class="two"><div><h3>Plan complexe</h3><svg id="q4-map" viewBox="0 0 520 340" style="width:100%;height:auto"></svg></div>'
    + '<div><h3>Réponse indicielle</h3><svg id="q4-step" viewBox="0 0 640 340" style="width:100%;height:auto"></svg></div></div>'
    + statsHtml([['Pôle p₁', ''], ['Pôle p₂', ''], ['Rapport |p₂/p₁|', ''], ['Pôle dominant', ''], ['Temps à 95 % (exact)', ''], ['Temps à 95 % (1er ordre)', '']], 'q4-stats')
    + '<p class="verdict" id="q4-msg"></p>'
    + '<div class="analogy"><b>Règle d\'usage :</b> si |p₂| ≥ 5|p₁|, le pôle p₂ est négligeable : H se comporte comme un premier ordre de constante de temps τ₁. Si les deux pôles sont proches, on ne peut pas simplifier : les deux modes comptent. La réduction de modèle ne s\'applique qu\'aux pôles <b>lents</b> ; les pôles rapides (grand |Re|) disparaissent dans le régime transitoire court.</div>';
  const S = Q4;
  slider($('#q4-sl'), { name: 'Constante de temps τ₁', min: 0.05, max: 5, step: 0.05, dec: 2, unit: 's', get: () => S.t1, set: v => { S.t1 = v; }, onchange: () => upd() });
  slider($('#q4-sl'), { name: 'Constante de temps τ₂', min: 0.02, max: 3, step: 0.01, dec: 2, unit: 's', get: () => S.t2, set: v => { S.t2 = v; }, onchange: () => upd() });
  const upd = () => {
    const p1 = -1 / S.t1, p2 = -1 / S.t2;
    const ftExact = mkFT(1 / (S.t1 * S.t2), [{ re: p1, im: 0 }, { re: p2, im: 0 }], []);
    const pDom = Math.max(p1, p2);
    const ftApprox = mkFT(-pDom, [{ re: pDom, im: 0 }], []);
    
    drawPZ('#q4-map', ftExact, { fixedBounds: { reMin: -55, reMax: 2, imMin: -10, imMax: 10 } });
    
    const tmax = clamp(8 * Math.max(S.t1, S.t2), 0.3, 120);
    const n = clamp(Math.ceil(tmax * Math.max(1 / S.t1, 1 / S.t2) * 25), 1500, 30000);
    const exact = simulateStep(ftExact, tmax, n);
    const approx = simulateStep(ftApprox, tmax, n);
    timeSvg($('#q4-step'), { tmax: tmax, cid: 'q4s', curves: [
      { name: 'système exact (2 pôles)', color: '#2e6da4', t: exact.t, y: exact.y },
      { name: 'approximation 1er ordre (pôle dominant)', color: '#e08a00', dash: '6 4', t: approx.t, y: approx.y }
    ] });
    const dom = pDom, ratio = Math.max(Math.abs(p1), Math.abs(p2)) / Math.min(Math.abs(p1), Math.abs(p2));
    const b2 = $('#q4-stats').querySelectorAll('.stat b');
    b2[0].textContent = fmt(p1, 3) + ' rad/s';
    b2[1].textContent = fmt(p2, 3) + ' rad/s';
    b2[2].textContent = fmt(ratio, 2);
    b2[3].textContent = 'p = ' + fmt(dom, 3);
    b2[4].textContent = t95(exact) + ' s';
    b2[5].textContent = t95(approx) + ' s';
    const m = $('#q4-msg');
    m.className = 'verdict ' + (ratio >= 5 ? 'yes' : (ratio < 2 ? 'warn' : ''));
    if (ratio >= 5) m.innerHTML = 'Le pôle <b>' + fmt(dom, 2) + ' rad/s</b> est dominant (|p₂/p₁| = ' + fmt(ratio, 1) + ' ≥ 5) : le pôle rapide n\'agit que pendant le régime transitoire court. L\'approximation du premier ordre est excellente à 5 %.';
    else if (ratio < 2) m.innerHTML = 'Les deux pôles sont <b>trop proches</b> (rapport ' + fmt(ratio, 2) + ') : aucun ne domine. L\'approximation du premier ordre est grossière, il faut garder les deux modes.';
    else m.innerHTML = 'Le pôle <b>' + fmt(dom, 2) + ' rad/s</b> domine, mais le pôle rapide en ' + fmt(dom === p1 ? p2 : p1, 2) + ' rad/s est encore visible en début de réponse. La réduction est acceptable en première approximation, à vérifier.';
  };
  const t95 = S => {
    const yf = S.y[S.y.length - 1];
    for (let i = S.y.length - 1; i >= 0; i--) if (Math.abs(S.y[i] - yf) > 0.05 * Math.abs(yf)) return fmt(S.t[Math.min(i + 1, S.t.length - 1)], 2);
    return '0';
  };
  upd();
}

/* ================= Atelier 5 : stabilité ================= */
const Q5 = { re: -0.8, im: 3 };
function mountQ5(root) {
  root.innerHTML = '<h2>Stabilité : position des pôles dans le plan complexe</h2>'

    + '<p class="verdict" id="q5-msg"></p>'

    const ys = niceStep(rg, 5);
    for (let v = Math.ceil(ymin / ys) * ys; v <= ymax + 1e-9; v += ys) {
      const z = Math.abs(v) < ys * 1e-6;
      s += '<line x1="' + L + '" y1="' + Y(v) + '" x2="' + (W - Rr) + '" y2="' + Y(v) + '" style="stroke:' + (z ? 'var(--muted)' : 'var(--line)') + ';stroke-width:' + (z ? 1.1 : .7) + '"/>';
      s += '<text class="tick" x="' + (L - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end" style="fill:var(--muted);font:10px var(--font-mono);">' + fmt(z ? 0 : v, 3) + '</text>';
    }
    const xs = niceStep(tmax, 6);
    for (let t = 0; t <= tmax + 1e-9; t += xs) {
      s += '<line x1="' + X(t) + '" y1="' + T + '" x2="' + X(t) + '" y2="' + (H - B) + '" style="stroke:var(--line);stroke-width:.5"/>';
      s += '<text class="tick" x="' + X(t) + '" y="' + (H - B + 14) + '" text-anchor="middle" style="fill:var(--muted);font:10px var(--font-mono);">' + fmt(t, 2) + '</text>';
    }
    s += '<rect x="' + L + '" y="' + T + '" width="' + (W - L - Rr) + '" height="' + (H - B - T) + '" style="fill:none;stroke:var(--muted)"/>';
    s += '<text class="axl" x="' + ((L + W - Rr) / 2) + '" y="' + (H - 6) + '" text-anchor="middle" style="fill:var(--muted);font:11px var(--font-ui);">temps (s)</text>';

    if (S.input === 'echelon') s += '<polyline fill="none" style="stroke:var(--muted);stroke-width:1.2" stroke-dasharray="5 4" points="' + X(0) + ',' + Y(0) + ' ' + X(0) + ',' + Y(1) + ' ' + X(tmax) + ',' + Y(1) + '"/>';
    if (S.input === 'rampe') s += '<polyline fill="none" style="stroke:var(--muted);stroke-width:1.2" stroke-dasharray="5 4" points="' + X(0) + ',' + Y(0) + ' ' + X(tmax) + ',' + Y(tmax) + '"/>';
    if (S.input === 'dirac') s += '<line x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(0) + '" y2="' + T + '" style="stroke:var(--muted);stroke-width:1.5" stroke-dasharray="4 3"/>';
    const poly = (arr, style) => '<polyline fill="none" style="' + style + '" stroke-linejoin="round" points="' + arr.map((v, i) => X(ts[i]).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ') + '"/>';
    if (S.indiv) act.forEach((t, i) => { s += poly(resp[i].y, 'stroke:var(--c' + t.c + ');stroke-width:1.6;opacity:.85') });

      { q: 'La somme d\'un système stable et d\'un système instable est :', o: ['stable', 'instable', 'marginale', 'cela dépend du gain'], a: 1, w: 'Le pôle instable de l\'un des systèmes rend la somme instable.' },
      { q: 'Le pôle dominant de la somme est :', o: ['toujours le pôle de plus grande partie réelle', 'toujours le pôle de plus petite partie réelle', 'le pôle le plus proche de l\'axe imaginaire parmi tous ceux des composants', 'le pôle à l\'origine'], a: 2, w: 'C\'est le pôle dont le mode s\'amortit le plus lentement.' }
    ]
  }
};

/* ---------- cours ---------- */
const COURSE = [
  { id: 'definitions', t: 'Fonction de transfert, pôles et zéros', h: `
<p>Pour un système linéaire à coefficients constants, la fonction de transfert est le rapport des transformées de Laplace de la sortie et de l'entrée, à conditions initiales nulles :</p>
<div class="formula">H(p) = S(p)/E(p) = N(p)/D(p) = K · Π(p − zᵢ) / Π(p − pⱼ)</div>
<p>Les <b>pôles</b> pⱼ sont les racines du dénominateur ; les <b>zéros</b> zᵢ sont les racines du numérateur. Comme H est à coefficients réels, ses pôles et zéros sont soit réels, soit <b>complexes conjugués</b>.</p>
<h3>Trois lectures essentielles</h3>
<table class="ctable"><thead><tr><th>Lecture</th><th>Sur quoi elle agit</th></tr></thead><tbody>
<tr><td>Position des pôles</td><td>Stabilité et régime transitoire (modes e^(pⱼt))</td></tr>
<tr><td>Position des zéros</td><td>Amplitude relative des modes, forme de la réponse, dépassement</td></tr>
<tr><td>Pôles à l'origine</td><td>Classe du système, donc précision (erreur statique nulle dès la classe 1)</td></tr></tbody></table>` },
  { id: 'premier-ordre', t: 'Pôle réel et premier ordre', h: `
<p>Un système du premier ordre s'écrit H(p) = K/(1 + τp). Son unique pôle est <b>p₀ = −1/τ</b>. La constante de temps est donc <b>τ = 1/|p₀|</b>.</p>
<p>La réponse à un échelon est s(t) = K(1 − e^(−t/τ)). À t = τ, elle atteint 63 % ; à t = 3τ, 95 %. Plus le pôle est <b>éloigné de l'axe imaginaire</b> (|p₀| grand), plus le système est <b>rapide</b>.</p>` },
  { id: 'second-ordre', t: 'Pôles complexes et second ordre', h: `
<p>Un second ordre s'écrit H(p) = ωn² / (p² + 2ζωn p + ωn²). Ses pôles sont <b>p = −ζωn ± jωn√(1 − ζ²)</b>. On peut les lire dans le plan complexe :</p>
<ul>
<li><b>ωn = |p|</b> : c'est la distance à l'origine. À ωn constant, les pôles se déplacent sur un <b>arc de cercle</b> centré sur l'origine.</li>
<li><b>ζ = cos θ</b> : c'est l'angle par rapport à l'axe réel négatif. À ζ constant, les pôles se déplacent sur une <b>demi-droite</b> issue de l'origine.</li>
</ul>
<p>Le dépassement ne dépend que de ζ : D = 100·exp(−πζ/√(1−ζ²)). Plus ζ est petit, plus la réponse oscille.</p>` },
  { id: 'dominants', t: 'Pôles dominants', h: `
<p>Lorsqu'un système possède plusieurs pôles, le mode associé à chaque pôle s'amortit comme e^(pᵢt). Le pôle <b>le plus proche de l'axe imaginaire</b> est le <b>pôle dominant</b> : son mode s'amortit le plus lentement et impose la dynamique globale.</p>
<p>Si un pôle est au moins <b>5 fois plus éloigné</b> de l'axe imaginaire que le pôle dominant, il est négligeable et on peut simplifier la fonction de transfert.</p>` },
  { id: 'stabilite', t: 'Stabilité', h: `
<p>Un système est stable si et seulement si tous ses pôles ont une partie réelle strictement négative. Les pôles imaginaires purs donnent des oscillations entretenues (marginal), et les pôles à partie réelle positive divergent (instable).</p>
<h3>Cas particuliers</h3>
<ul>
<li>Un pôle simple à l'origine : réponse en échelon (marginal).</li>
<li>Deux pôles à l'origine : réponse en rampe (instable).</li>
<li>Paire ±jω simple : oscillateur non amorti (marginal).</li>
<li>Paire ±jω double : instable.</li>
</ul>` },
  { id: 'somme', t: 'Somme de réponses', h: `
<p>Le système étant linéaire, la réponse totale à une entrée donnée est la <b>somme</b> des réponses de chaque fonction de transfert élémentaire.</p>
<p>Pour visualiser cela, l'onglet 6 permet de placer des pôles : chaque pôle génère une fonction de transfert de gain statique 1. La réponse résultante est la somme de toutes ces contributions.</p>` }
];

/* ---------- interface ---------- */
const UI = { cur: 'q1' };
const AS = { key: 'q1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'definitions' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  try { w.mount(root); }
  catch (err) { root.innerHTML = '<p class="verdict no"><b>Erreur d\'affichage.</b> ' + esc(err && err.message || err) + '</p>'; if (window.console) console.error(err); }
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  document.body.classList.toggle('act-open', AS.open && !CS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag; box.innerHTML = '';
  const a = ACT[AS.key];
  if (!a) { box.innerHTML = '<p class="small" style="padding:12px">Pas d\'activité pour cet atelier.</p>'; return; }
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Quiz (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer au quiz')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    if (!s.shown) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
$('#bAct').addEventListener('click', () => { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); });

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  document.body.classList.toggle('act-open', AS.open && !CS.open);
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : étude des pôles'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, h('div', { class: 'cwrap' }, nav, art));
}
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cette page vous permet d\'étudier l\'influence de la position des pôles sur le comportement temporel d\'un système.</p><ul><li>Dans l\'onglet 1, cliquez sur un pôle du plan complexe pour voir sa réponse à un Dirac, un échelon ou une rampe.</li><li>Les onglets suivants vous permettent d\'explorer des cas particuliers : premier ordre, second ordre, pôle dominant, stabilité, et somme de réponses.</li></ul>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
