<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Performances des SLCI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--bar:#eee;--panel:#fff;--panel2:#f1f3f6;--line:#b9bfc7;--fg:#111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#fff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--bar);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;margin-left:auto}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;color:inherit;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 16px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;color:inherit;font-family:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{display:flex;gap:14px;align-items:flex-start;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px;max-width:1500px;margin:0 auto}
#stage{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#hint{padding:7px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#ws{padding:16px 18px 28px}
#ws h2{font-size:23px;margin:0 0 8px}#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#act{width:clamp(300px,26vw,390px);flex:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;max-height:calc(100vh - 110px);overflow:hidden}
#act .phead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
#act .phead b{font-size:15px}
#act .phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#act .pbody{padding:12px 14px;font-size:13.5px;overflow:auto;flex:1;min-height:0}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex:none;background:var(--panel)}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted);font-family:inherit}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 11px;margin:0 0 10px}
.notation{background:#f1f3f6;border-left:3px solid var(--muted);border-radius:6px;padding:8px 10px;margin:0 0 10px;font-size:12.5px;line-height:1.5}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px;font-size:13.5px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:10px 0}
.defi p{margin:6px 0}.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;font-size:13.5px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
.verdict{border-radius:8px;padding:9px 12px;margin:12px 0 6px;font-size:13.8px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.13);border-color:var(--ok)}
.verdict.no{background:rgba(192,40,31,.12);border-color:var(--bad)}
.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.alert{background:#fff5d6;border:1px solid var(--warn);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:12px 0}
.alert h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
.alert p{margin:4px 0;font-size:13.5px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.ctrl{display:flex;gap:6px 20px;flex-wrap:wrap;align-items:flex-end;margin:8px 0 2px}
.ctrl .fld{margin:0;min-width:150px}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.ctrl input[type=range]{width:180px;max-width:100%}
.blk{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 10px;margin:10px 0}
.blk svg{display:block;max-width:100%;height:auto}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.small{font-size:12.5px;color:var(--muted);margin:0 0 9px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 12px;font-size:13px;cursor:pointer;color:inherit;font-family:inherit}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:14px;font-family:'IBM Plex Mono',monospace;overflow-wrap:anywhere}
.plotbox{border:1px solid var(--line);border-radius:10px;background:#fff;margin:10px 0;padding:4px 4px 2px;overflow:hidden}
.plotbox canvas{display:block;width:100%}
.plotbox .ptitle{font-size:12px;color:var(--muted);margin:3px 9px}
.pleg{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 2px 8px}
.pleg i{display:inline-block;width:18px;height:0;border-top:3px solid #888;vertical-align:middle;margin-right:5px}
.pleg i.d{border-top-style:dashed}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 16px;align-items:start}
.two>*{min-width:0}
table.err{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0 12px}
table.err th,table.err td{border:1px solid var(--line);padding:7px 9px;text-align:center;vertical-align:middle}
table.err th{background:var(--panel2);font-weight:600;font-size:12.5px;line-height:1.3}
table.err td.lbl{font-weight:600;background:var(--panel2);font-family:'IBM Plex Mono',monospace}
table.err td.inf{color:var(--bad);font-weight:600}
table.err td.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;box-shadow:inset 0 0 0 2px var(--accent)}
table.err .num{display:block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent-ink);font-weight:700;margin-top:3px}
table.kv{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
table.kv td,table.kv th{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left}
table.kv th{background:var(--panel2);font-weight:600}
table.kv td.m{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
table.kv tr.hl td{background:var(--accent-soft)}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(680px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}
.dlgbox p,.dlgbox li{font-size:13.5px}
#course{background:var(--bg);min-height:100vh}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{display:flex;gap:28px;padding-block:14px;max-width:1200px;margin:0 auto}
.ctoc{flex:none;width:250px;position:sticky;top:60px;align-self:flex-start;max-height:calc(100vh - 80px);overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px;color:inherit;font-family:inherit}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.cbody{flex:1;min-width:0;max-width:860px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}
.gloss dt{font-weight:600}.gloss dd{margin:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.92em;line-height:1.25}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.math i,.formula i,.mi{font-family:'Times New Roman',serif;font-style:italic;font-size:1.06em}
#boot{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
@media (max-width:900px){.work{flex-direction:column}#act{width:100%;max-height:none}.ctrl .fld{min-width:140px;flex:1 1 140px}.ctrl input[type=range]{width:100%}#ws{padding:14px 12px 24px}.ctoc{display:none}.ctoc-sel{display:block}.cwrap{flex-direction:column;padding-top:8px}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}}
</style>
</head>
<body>

<div id="boot">Chargement…</div>

<header class="band"><div class="inner row">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M2 20 L8 20 L8 9 L14 9 L14 20 L19 20 L19 5 L24 5" fill="none" stroke="#2e6da4" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="8" cy="9" r="2.1" fill="#c0281f"/><circle cx="19" cy="5" r="2.1" fill="#9a5b00"/>
    </svg>
    <span>Performances des SLCI <small>Précision · Rapidité · Stabilité</small></span>
  </div>
  <div class="files">
    <button class="btn" id="bAct" type="button">Activité</button>
    <button class="btn" id="bCourse" type="button">Cours</button>
    <button class="btn" id="bHelp" type="button">Aide</button>
  </div>
</div></header>

<div class="band" id="modes"><div class="inner row"><div class="seg" id="tabs" role="tablist"></div></div></div>

<main class="work" id="work">
  <section id="stage">
    <div id="hint"></div>
    <div id="ws"></div>
  </section>
  <aside id="act" hidden></aside>
</main>

<section id="course" hidden></section>
<div id="dlg" hidden></div>

<script>
(function(){
'use strict';

/* Affiche les erreurs à l'écran pour diagnostiquer les pages blanches */
window.addEventListener('error', function(e){
  var boot=document.getElementById('boot');
  if (boot) boot.style.display='none';
  var d=document.getElementById('dlg');
  if (d){d.hidden=false;d.innerHTML='<div class="dlgbox"><header><b>Erreur JavaScript</b></header><div class="dbody"><p style="color:#c0281f"><b>'+e.message+'</b></p><p>Fichier : '+e.filename+'<br>Ligne : '+e.lineno+' , colonne : '+e.colno+'</p><pre style="white-space:pre-wrap;font-size:11px;max-height:200px;overflow:auto">'+(e.error&&e.error.stack?e.error.stack:'(pas de pile)')+'</pre><p>Copie ce message pour diagnostic.</p></div></div>';}
});

var $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs){
  var el=document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v=attrs[k];
    if (v===false||v==null) continue;
    if (k==='class') el.className=v;
    else if (k==='html') el.innerHTML=v;
    else if (k.charAt(0)==='o'&&k.charAt(1)==='n') el.addEventListener(k.substr(2),v);
    else if (v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for (var i=2;i<arguments.length;i++){
    var kids=arguments[i];
    if (!kids) continue;
    if (!kids.nodeType&&kids.constructor===Array){
      for (var j=0;j<kids.length;j++){
        var c=kids[j];
        if (c==null||c===false) continue;
        el.appendChild(c.nodeType?c:document.createTextNode(c));
      }
    } else if (kids.nodeType){ el.appendChild(kids); }
    else { el.appendChild(document.createTextNode(kids)); }
  }
  return el;
}
function isSmall(){try{return window.matchMedia('(max-width:900px)').matches;}catch(e){return false;}}
var KEYS={act:'slci-v4'};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function nf(v,d){d=d==null?2:d;var s=(+v).toFixed(d);if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,'');if(s==='-0')s='0';return s.replace('.',',');}
function nfs(v,d){if(v===Infinity)return '∞';if(v===-Infinity)return '−∞';if(!isFinite(v)||isNaN(v))return '—';return nf(v,d==null?2:d);}
var PI=Math.PI, SQ=Math.sqrt;
function fr(a,b){return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';}

/* ====== polynômes ====== */
function pmul(a,b){var r=new Array(a.length+b.length-1);for(var i=0;i<r.length;i++)r[i]=0;for(i=0;i<a.length;i++)for(var j=0;j<b.length;j++)r[i+j]+=a[i]*b[j];return r;}
function padd(a,b){var n=Math.max(a.length,b.length),r=new Array(n);for(var i=0;i<n;i++)r[i]=0;for(i=0;i<a.length;i++)r[n-a.length+i]+=a[i];for(i=0;i<b.length;i++)r[n-b.length+i]+=b[i];return r;}
function pevalC(p,re,im){var sr=0,si=0;for(var i=0;i<p.length;i++){var c=p[i];var nr=sr*re-si*im+c;var ni=sr*im+si*re;sr=nr;si=ni;}return [sr,si];}

function tf2ss(num,den){
  var d0=den[0]||1;
  var n1=num.map(function(v){return v/d0;});
  var d1=den.map(function(v){return v/d0;});
  var D=0;
  if (n1.length===d1.length){D=n1[0];n1=n1.map(function(v,i){return v-D*d1[i];}).slice(1);}
  var n=d1.length-1;
  while(n1.length<n)n1.unshift(0);
  if (n1.length>n)n1=n1.slice(n1.length-n);
  var A=[],B=new Array(n),C=n1.slice().reverse();
  for (var i=0;i<n;i++){var row=new Array(n);for(var jj=0;jj<n;jj++)row[jj]=0;if(i<n-1)row[i+1]=1;A.push(row);B[i]=0;}
  for (var jj2=0;jj2<n;jj2++)A[n-1][jj2]=-d1[n-jj2];
  B[n-1]=1;
  return {n:n,A:A,B:B,C:C,D:D};
}
function simulateSS(ss,uf,tmax,N,x0){
  var n=ss.n,A=ss.A,B=ss.B,C=ss.C,D=ss.D;
  var x=x0?x0.slice():new Array(n);
  for(var i=0;i<n;i++)if(x[i]==null)x[i]=0;
  var dt=tmax/N, out=[];
  function f(xx,u){var dx=new Array(n);for(var i=0;i<n;i++){var s=B[i]*u;for(var j=0;j<n;j++)s+=A[i][j]*xx[j];dx[i]=s;}return dx;}
  for (var k=0;k<=N;k++){
    var t=k*dt, y=D*uf(t);
    for (var i2=0;i2<n;i2++)y+=C[i2]*x[i2];
    out.push([t,y]);
    var k1=f(x,uf(t));
    var x2=new Array(n);for(var a=0;a<n;a++)x2[a]=x[a]+dt/2*k1[a];
    var k2=f(x2,uf(t+dt/2));
    var x3=new Array(n);for(var b=0;b<n;b++)x3[b]=x[b]+dt/2*k2[b];
    var k3=f(x3,uf(t+dt/2));
    var x4=new Array(n);for(var c=0;c<n;c++)x4[c]=x[c]+dt*k3[c];
    var k4=f(x4,uf(t+dt));
    for(var d=0;d<n;d++)x[d]=x[d]+dt/6*(k1[d]+2*k2[d]+2*k3[d]+k4[d]);
    if (!isFinite(x[0]))break;
  }
  return out;
}
function roots(p){
  var q=p.slice();
  while(q.length>1&&Math.abs(q[0])<1e-12)q.shift();
  var n=q.length-1;if(n<1)return [];
  var a=q.map(function(v){return v/q[0];});
  var z=[];for(var i=0;i<n;i++){var ang=2*PI*i/n+0.4;z.push({re:0.9*Math.cos(ang),im:0.9*Math.sin(ang)});}
  for (var it=0;it<300;it++){
    var mx=0, nz=[];
    for (var i2=0;i2<n;i2++){
      var zi=z[i2], sr=0, si=0;
      for (var ci=0;ci<a.length;ci++){var c=a[ci];var nr=sr*zi.re-si*zi.im+c;var ni=sr*zi.im+si*zi.re;sr=nr;si=ni;}
      var dr=1, di=0;
      for (var j=0;j<n;j++){if(j===i2)continue;var ar=zi.re-z[j].re,ai=zi.im-z[j].im;var nr2=dr*ar-di*ai;var ni2=dr*ai+di*ar;dr=nr2;di=ni2;}
      var dd=dr*dr+di*di;
      if (dd<1e-300){nz.push(zi);continue;}
      var qr=(sr*dr+si*di)/dd, qi=(si*dr-sr*di)/dd;
      var mag=Math.sqrt(qr*qr+qi*qi);
      if (mag>mx)mx=mag;
      nz.push({re:zi.re-qr,im:zi.im-qi});
    }
    z=nz;if(mx<1e-11)break;
  }
  return z;
}

/* ====== état ====== */
var SYS={
  plant:{classe:0, forme:'A', K:2, T:0.5, m:0.5, w0:2},
  corr:{type:'P', Kp:2, Ti:1, Td:0.2},
  input:'echelon', amp:1, pert:0
};
var TABS=[
  {id:'precision',t:'Précision',hint:'K_BO du tableau = gain de la FTBO L(p)=C(p)·G(p), pas Kp.'},
  {id:'rapidite',t:'Rapidité',hint:'Rapidité = réponse à un échelon (réponse indicielle).'},

function model(){
  var P=SYS.plant, C=SYS.corr;
  var Ng=[P.K], Dg;
  if (P.forme==='A')Dg=[P.T,1];
  else Dg=[1/(P.w0*P.w0),2*P.m/P.w0,1];
  for (var i=0;i<P.classe;i++)Dg=pmul(Dg,[1,0]);
  var Nc, Dc;
  if (C.type==='P'){Nc=[C.Kp];Dc=[1];}
  else if (C.type==='PI'){Nc=[C.Kp*C.Ti,C.Kp];Dc=[C.Ti,0];}
  else {var td=Math.max(C.Td/10,1e-6);
    Nc=[C.Kp*(C.Ti*td+C.Ti*C.Td),C.Kp*(C.Ti+td),C.Kp];
    Dc=[C.Ti*td,C.Ti,0];}
  var Ln=pmul(Nc,Ng), Ld=pmul(Dc,Dg);

  for (var j=Ld.length-1;j>=0;j--){if(Math.abs(Ld[j])<1e-12)cls++;else break;}

  var LdIdx=Ld.length-cls-1;

  var K_BO=Math.abs(LdLast)<1e-15?Infinity:LnLast/LdLast;
  var poles=roots(Pn);
  var stable=poles.length>0&&poles.every(function(z){return z.re<-1e-9;});
  var alpha1=C.type==='P'?0:1;
  var K1=C.type==='P'?C.Kp:(C.Ti>1e-12?C.Kp/C.Ti:Infinity);
  return {
    Ng:Ng,Dg:Dg,Nc:Nc,Dc:Dc,Ln:Ln,Ld:Ld,Pn:Pn,cls:cls,K_BO:K_BO,
    T1n:Ln,T1d:Pn,T2n:pmul(Ng,Dc),T2d:Pn,poles:poles,stable:stable,
    alpha1:alpha1,K1:K1,K2:P.K,alpha2:P.classe

}
function timeFrame(M){

    if (pos.length)tmax=5/Math.max.apply(null,pos.map(function(z){return z.re;}));

function metrics(ys){
  var n=ys.length, yss=ys[n-1][1];
  if (!isFinite(yss)||Math.abs(yss)<1e-9)return {yss:yss,t5:NaN,tr:NaN,D:NaN,tp:NaN,ymax:NaN};
  var ymax=-Infinity, tp=0;

  var D=(ymax-yss)/Math.abs(yss)*100;
  var t5=NaN;
  for (var i2=n-1;i2>=0;i2--){
    if (Math.abs(ys[i2][1]-yss)>0.05*Math.abs(yss)){t5=(i2<n-1?ys[i2+1][0]:ys[i2][0]);break;}
  }
  var t10=NaN, t90=NaN;
  for (var i3=0;i3<n;i3++){
    if (isNaN(t10)&&ys[i3][1]>=0.1*yss)t10=ys[i3][0];
    if (isNaN(t90)&&ys[i3][1]>=0.9*yss)t90=ys[i3][0];

function bode(M){
  var wmin=0.02,wmax=3000,N=700,pts=[];
  var prev=null, off=0;
  for (var i=0;i<=N;i++){
    var w=wmin*Math.pow(wmax/wmin,i/N);
    var r1=pevalC(M.Ln,0,w), r2=pevalC(M.Ld,0,w);
    var nr=r1[0],ni=r1[1],dr=r2[0],di=r2[1];
    var den=dr*dr+di*di;
    var lr=0,li=0;
    if (den>1e-300){lr=(nr*dr+ni*di)/den;li=(ni*dr-nr*di)/den;}
    var mag=20*Math.log10(Math.max(1e-15,Math.sqrt(lr*lr+li*li)));
    var ph=Math.atan2(li,lr)*180/PI;
    if (prev!==null){while(ph+off-prev>180)off-=360;while(ph+off-prev<-180)off+=360;}
    ph+=off;prev=ph;
    pts.push({w:w,lw:Math.log10(w),mag:mag,ph:ph});
  }
  return pts;
}
function marginsOf(pts){
  var wc=NaN,pm=NaN,w180=NaN,gm=NaN;
  for (var i=0;i<pts.length-1;i++){
    var a=pts[i],b=pts[i+1];
    if (isNaN(wc)&&a.mag>=0&&b.mag<0){
      var u=a.mag/(a.mag-b.mag);
      wc=a.w*Math.pow(b.w/a.w,u);
      pm=180+(a.ph+(b.ph-a.ph)*u);
    }
    if (isNaN(w180)&&a.ph>=-180&&b.ph<-180){
      var u2=(a.ph+180)/(a.ph-b.ph);
      w180=a.w*Math.pow(b.w/a.w,u2);
      gm=-(a.mag+(b.mag-a.mag)*u2);
    }
  }
  return {wc:wc,pm:pm,w180:w180,gm:gm};
}
function tfMag(num,den,w){
  var r1=pevalC(num,0,w), r2=pevalC(den,0,w);
  var nr=r1[0],ni=r1[1],dr=r2[0],di=r2[1];
  var dn=dr*dr+di*di;

function closedLoopBandwidth(M){
  var T0=tfMag(M.Ln,M.Pn,0);
  if (!isFinite(T0)||T0<1e-12)return NaN;
  var target=T0/Math.SQRT2;
  var N=600,wmin=1e-3,wmax=1e4;
  var prevW=wmin, prevMag=tfMag(M.Ln,M.Pn,wmin);
  for (var i=1;i<=N;i++){
    var w=wmin*Math.pow(wmax/wmin,i/N);
    var mag=tfMag(M.Ln,M.Pn,w);
    if (prevMag>=target&&mag<target){
      var u=(prevMag-target)/(prevMag-mag);
      return prevW*Math.pow(w/prevW,u);
    }
    prevW=w;prevMag=mag;
  }
  return NaN;
}

function Plot(host,o){

  host.appendChild(cv);

  P.X=function(x){return P.o.ml+(x-P.o.xmin)/(P.o.xmax-P.o.xmin)*(P.W-P.o.ml-P.o.mr);};
  P.Y=function(y){return P.H-P.o.mb-(y-P.o.ymin)/(P.o.ymax-P.o.ymin)*(P.H-P.o.mt-P.o.mb);};
  P.set=function(a){for(var k in a)P.o[k]=a[k];P.redraw();};

    if (cv.width===Math.round(w*d)&&P.H===hh)return;

    P.W=w;P.H=hh;P.redraw();
  };
  P.line=function(pts,c,w,dash){
    if (!pts||pts.length<2)return;
    ctx.save();ctx.strokeStyle=c||COL.ink;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);
    ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
    var started=false;
    for (var i=0;i<pts.length;i++){
      var p=pts[i];
      if (!isFinite(p[0])||!isFinite(p[1])){started=false;continue;}
      var x=P.X(p[0]),y=P.Y(p[1]);
      if (!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
    }

  P.dot=function(x,y,c,r){

    ctx.fillStyle=c||COL.red;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();
  };

    if (!isFinite(x)||!isFinite(y))return;
    ctx.save();ctx.fillStyle=c||COL.ink;ctx.font=(size||12)+'px "IBM Plex Sans", system-ui, sans-serif';
    ctx.textAlign=al||'left';ctx.textBaseline='middle';

    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.font='11.5px "IBM Plex Sans", system-ui, sans-serif';ctx.fillStyle=COL.axis;ctx.strokeStyle=COL.grid;ctx.lineWidth=1;
    var nx=Math.floor((o.xmax-o.xmin)/o.xt+1e-9), ny=Math.floor((o.ymax-o.ymin)/o.yt+1e-9);
    for (var i=0;i<=nx;i++){
      var x=o.xmin+i*o.xt, px=Math.round(P.X(x))+.5;
      if (o.grid){ctx.beginPath();ctx.moveTo(px,o.mt);ctx.lineTo(px,H-o.mb);ctx.stroke();}
      ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(o.fx?o.fx(x):nf(x,2),px,H-o.mb+5);
    }
    for (var i2=0;i2<=ny;i2++){
      var y=o.ymin+i2*o.yt, py=Math.round(P.Y(y))+.5;
      if (o.grid){ctx.beginPath();ctx.moveTo(o.ml,py);ctx.lineTo(W-o.mr,py);ctx.stroke();}

      ctx.fillText(o.fy?o.fy(y):nf(y,2),o.ml-6,py);

function tReduitOf(xi){
  if (xi<=0)return NaN;
  var dt=0.005,tmax=80,lastOut=0;
  for (var t=0;t<=tmax;t+=dt){
    var s;
    if (xi<1-1e-6){var wd=Math.sqrt(1-xi*xi);s=1-Math.exp(-xi*t)*(Math.cos(wd*t)+xi/wd*Math.sin(wd*t));}
    else if (xi<=1+1e-6){s=1-(1+t)*Math.exp(-t);}
    else {var r=Math.sqrt(xi*xi-1),p1=-xi+r,p2=-xi-r;s=1-(p1*Math.exp(p2*t)-p2*Math.exp(p1*t))/(p1-p2);}
    if (Math.abs(s-1)>0.05)lastOut=t;
  }
  var t5=lastOut+dt;
  var wref=xi<1?Math.sqrt(1-xi*xi):1;
  return t5*wref;
}
function abaqueSVG(){
  var W=580,H=340,pad={l:55,r:25,t:22,b:48};
  var N=80,pts=[];
  for (var i=0;i<=N;i++){
    var lx=-1+2*i/N;
    var xi=Math.pow(10,lx);
    var tr=tReduitOf(xi);
    if (!isFinite(tr)||tr<=0)continue;
    pts.push({xi:xi,lx:lx,tr:tr,ltr:Math.log10(tr)});
  }
  var ltrmin=0,ltrmax=2;
  var X=function(lx){return pad.l+(lx+1)/2*(W-pad.l-pad.r);};
  var Y=function(ltr){return H-pad.b-(ltr-ltrmin)/(ltrmax-ltrmin)*(H-pad.t-pad.b);};

  for (var i2=0;i2<=4;i2++){

    svg+='<text x="'+(pad.l-5)+'" y="'+(Y(i3)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#5a6068">'+(i3===0?'1':i3===1?'10':'100')+'</text>';

  svg+='<line x1="'+pad.l+'" y1="'+(H-pad.b)+'" x2="'+(W-pad.r)+'" y2="'+(H-pad.b)+'" stroke="#5a6068" stroke-width="1.4"/>';
  svg+='<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(H-pad.b)+'" stroke="#5a6068" stroke-width="1.4"/>';
  var path='';

    var p=pts[i4];
    path+=(i4===0?'M':' L')+X(p.lx).toFixed(1)+','+Y(Math.min(p.ltr,ltrmax)).toFixed(1);
  }
  svg+='<path d="'+path+'" fill="none" stroke="#2e6da4" stroke-width="2.4"/>';
  var m1xi=0.69,m2xi=1;

  var mx1=X(Math.log10(m1xi)),my1=Y(Math.min(Math.log10(m1tr),ltrmax));
  var mx2=X(Math.log10(m2xi)),my2=Y(Math.min(Math.log10(m2tr),ltrmax));
  svg+='<line x1="'+mx1.toFixed(1)+'" y1="'+my1.toFixed(1)+'" x2="'+mx1.toFixed(1)+'" y2="'+(H-pad.b)+'" stroke="#1e7a2e" stroke-width="1.2" stroke-dasharray="3,3"/>';
  svg+='<line x1="'+pad.l+'" y1="'+my1.toFixed(1)+'" x2="'+mx1.toFixed(1)+'" y2="'+my1.toFixed(1)+'" stroke="#1e7a2e" stroke-width="1.2" stroke-dasharray="3,3"/>';
  svg+='<circle cx="'+mx1.toFixed(1)+'" cy="'+my1.toFixed(1)+'" r="5" fill="#1e7a2e" stroke="#fff" stroke-width="2"/>';
  svg+='<text x="'+(mx1+8).toFixed(1)+'" y="'+(my1-8).toFixed(1)+'" font-size="11.5" fill="#1e7a2e" font-weight="600">ξ = 0,69 → t_red ≈ '+nf(m1tr,1)+'</text>';
  svg+='<line x1="'+mx2.toFixed(1)+'" y1="'+my2.toFixed(1)+'" x2="'+mx2.toFixed(1)+'" y2="'+(H-pad.b)+'" stroke="#d98a12" stroke-width="1.2" stroke-dasharray="3,3"/>';
  svg+='<line x1="'+pad.l+'" y1="'+my2.toFixed(1)+'" x2="'+mx2.toFixed(1)+'" y2="'+my2.toFixed(1)+'" stroke="#d98a12" stroke-width="1.2" stroke-dasharray="3,3"/>';

  svg+='</svg>';
  return svg;
}
function bodeMargesSVG(){
  var K=10, Ts=[1,0.1,0.05];
  var wmin=0.1,wmax=200,N=250,pts=[];
  var phPrev=null,off=0;
  for (var i=0;i<=N;i++){
    var w=wmin*Math.pow(wmax/wmin,i/N);
    var magF=K, phRad=0;
    for (var ti=0;ti<Ts.length;ti++){var T=Ts[ti];magF/=Math.sqrt(1+(T*w)*(T*w));phRad-=Math.atan(T*w);}
    var phDeg=phRad*180/PI;
    if (phPrev!==null){while(phDeg+off-phPrev>180)off-=360;while(phDeg+off-phPrev<-180)off+=360;}
    phDeg+=off;phPrev=phDeg;
    pts.push({w:w,lw:Math.log10(w),magDB:20*Math.log10(magF),phDeg:phDeg});
  }
  var wc=NaN,pm=NaN,w180=NaN,gm=NaN;
  for (var i2=0;i2<N;i2++){
    if (isNaN(wc)&&pts[i2].magDB>=0&&pts[i2+1].magDB<0){
      var u=pts[i2].magDB/(pts[i2].magDB-pts[i2+1].magDB);
      wc=pts[i2].w*Math.pow(pts[i2+1].w/pts[i2].w,u);
      pm=180+pts[i2].phDeg+(pts[i2+1].phDeg-pts[i2].phDeg)*u;
    }
    if (isNaN(w180)&&pts[i2].phDeg>=-180&&pts[i2+1].phDeg<-180){
      var u2=(pts[i2].phDeg+180)/(pts[i2].phDeg-pts[i2+1].phDeg);
      w180=pts[i2].w*Math.pow(pts[i2+1].w/pts[i2].w,u2);
      gm=-(pts[i2].magDB+(pts[i2+1].magDB-pts[i2].magDB)*u2);
    }
  }
  var W=580, pad={l:55,r:25,t:15,b:25};
  var Hg=180, Hp=150, yoffP=Hg+30, totalH=400;
  var lwmin=Math.log10(wmin), lwmax=Math.log10(wmax);
  var X=function(lw){return pad.l+(lw-lwmin)/(lwmax-lwmin)*(W-pad.l-pad.r);};
  var dBmin=-50, dBmax=30;
  var Yg=function(dB){return pad.t+(dBmax-dB)/(dBmax-dBmin)*(Hg-pad.t-pad.b);};
  var phmin=-270, phmax=10;
  var Yp=function(ph){return yoffP+pad.t+(phmax-ph)/(phmax-phmin)*(Hp-pad.t-pad.b);};
  var svg='<svg viewBox="0 0 '+W+' '+totalH+'" style="width:100%;max-width:640px;height:auto;display:block;margin:8px auto" role="img" aria-label="Bode avec marges">';
  svg+='<rect width="'+W+'" height="'+totalH+'" fill="#fff"/>';
  for (var lx=0;lx<=Math.log10(wmax);lx+=1){
    svg+='<line x1="'+X(lx).toFixed(1)+'" y1="'+pad.t+'" x2="'+X(lx).toFixed(1)+'" y2="'+(Hg-pad.b)+'" stroke="#e4e7ec" stroke-width="1"/>';
    svg+='<text x="'+X(lx).toFixed(1)+'" y="'+(Hg-pad.b+13)+'" text-anchor="middle" font-size="10" fill="#5a6068">'+nf(Math.pow(10,lx),0)+'</text>';
  }
  var dBVals=[20,0,-20,-40];
  for (var dvi=0;dvi<dBVals.length;dvi++){
    var dB=dBVals[dvi];
    svg+='<line x1="'+pad.l+'" y1="'+Yg(dB).toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+Yg(dB).toFixed(1)+'" stroke="#e4e7ec" stroke-width="1"/>';
    svg+='<text x="'+(pad.l-5)+'" y="'+(Yg(dB)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#5a6068">'+dB+'</text>';
  }
  svg+='<line x1="'+pad.l+'" y1="'+(Hg-pad.b)+'" x2="'+(W-pad.r)+'" y2="'+(Hg-pad.b)+'" stroke="#5a6068" stroke-width="1.2"/>';

  svg+='<line x1="'+pad.l+'" y1="'+Yg(0).toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+Yg(0).toFixed(1)+'" stroke="#1e7a2e" stroke-width="1.5" stroke-dasharray="6,4"/>';
  svg+='<text x="'+(W-pad.r-4)+'" y="'+(Yg(0)-4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#1e7a2e">0 dB</text>';
  var pathG='';
  for (var pi=0;pi<pts.length;pi++){
    var p=pts[pi];
    pathG+=(pi===0?'M':' L')+X(p.lw).toFixed(1)+','+Yg(clamp(p.magDB,dBmin,dBmax)).toFixed(1);
  }
  svg+='<path d="'+pathG+'" fill="none" stroke="#2e6da4" stroke-width="2.2"/>';
  if (isFinite(w180)&&isFinite(gm)){
    var xw=X(Math.log10(w180)),y0=Yg(0),y180=Yg(clamp(-gm,dBmin,dBmax));
    svg+='<line x1="'+xw.toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+xw.toFixed(1)+'" y2="'+y180.toFixed(1)+'" stroke="#7b4fc2" stroke-width="1.8"/>';
    svg+='<polygon points="'+(xw-4).toFixed(1)+','+(y0+6).toFixed(1)+' '+(xw+4).toFixed(1)+','+(y0+6).toFixed(1)+' '+xw.toFixed(1)+','+(y0+1).toFixed(1)+'" fill="#7b4fc2"/>';

    svg+='<text x="'+(xw+8).toFixed(1)+'" y="'+((y0+y180)/2).toFixed(1)+'" font-size="11" fill="#7b4fc2" font-weight="600">MG = '+nf(gm,1)+' dB</text>';
  }
  if (isFinite(wc)){
    svg+='<line x1="'+X(Math.log10(wc)).toFixed(1)+'" y1="'+pad.t+'" x2="'+X(Math.log10(wc)).toFixed(1)+'" y2="'+(Hg-pad.b)+'" stroke="#c0281f" stroke-width="1.2" stroke-dasharray="3,3"/>';
    svg+='<circle cx="'+X(Math.log10(wc)).toFixed(1)+'" cy="'+Yg(0).toFixed(1)+'" r="4" fill="#c0281f" stroke="#fff" stroke-width="1.5"/>';
    svg+='<text x="'+(X(Math.log10(wc))+4).toFixed(1)+'" y="'+(Yg(0)-5).toFixed(1)+'" font-size="10.5" fill="#c0281f">ωc = '+nf(wc,1)+'</text>';
  }
  svg+='<text x="'+((pad.l+W-pad.r)/2).toFixed(1)+'" y="'+(Hg-4)+'" text-anchor="middle" font-size="11" fill="#111">|L(jω)| (dB)</text>';
  svg+='<rect x="0" y="'+(yoffP-8)+'" width="'+W+'" height="'+(Hp+20)+'" fill="#fff"/>';
  for (var lx2=0;lx2<=Math.log10(wmax);lx2+=1){

  }
  svg+='<line x1="'+pad.l+'" y1="'+(yoffP+Hp-pad.b)+'" x2="'+(W-pad.r)+'" y2="'+(yoffP+Hp-pad.b)+'" stroke="#5a6068" stroke-width="1.2"/>';

  svg+='<line x1="'+pad.l+'" y1="'+Yp(-180).toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+Yp(-180).toFixed(1)+'" stroke="#1e7a2e" stroke-width="1.5" stroke-dasharray="6,4"/>';
  svg+='<text x="'+(W-pad.r-4)+'" y="'+(Yp(-180)-4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#1e7a2e">-180°</text>';
  var pathP='';
  for (var pi2=0;pi2<pts.length;pi2++){

  }
  svg+='<path d="'+pathP+'" fill="none" stroke="#2e6da4" stroke-width="2.2"/>';

        r4.appendChild(sld({label:SYS.input==='parabole'?'a (e(t)=a·t²/2)':'amplitude a',min:0.1,max:5,step:0.1,val:SYS.amp,d:1,on:function(v){SYS.amp=v;onChange();}}));

        r4.appendChild(h('div',{class:'fld'},h('span',null,'Perturbation pert(t)'),
          chips([[0,'Aucune'],[1,'Échelon']],SYS.pert>0?1:0,function(v){SYS.pert=v?1:0;build();onChange();},'Perturbation')));
        if (SYS.pert>0)
          r4.appendChild(sld({label:'amplitude pert',min:0.1,max:5,step:0.1,val:SYS.pert,d:1,on:function(v){SYS.pert=v;onChange();}}));
      }
      host.appendChild(r4);
    }
  }
  build();
  return host;
}

/* ====== PRÉCISION ====== */
function cellVal(M,c,col){
  var K=M.K_BO, a=SYS.amp;
  if (col===0)return c===0?a/(1+K):0;
  if (col===1)return c===0?Infinity:(c===1?a/K:0);
  if (col===2)return c<2?Infinity:(c===2?a/K:0);
  return 0;
}
function fmtVal(v){
  if (!isFinite(v))return '∞';
  if (Math.abs(v)<1e-12)return '0';
  return nf(v,3);
}
function errTable(M){
  var curCol=SYS.input==='echelon'?0:SYS.input==='rampe'?1:SYS.input==='parabole'?2:-1;
  var dispCls=Math.min(M.cls,2);
  var txt=[['a/(1+K_BO)','∞','∞'],['0','a/K_BO','∞'],['0','0','a/K_BO']];
  var rows=[0,1,2].map(function(c){
    var tds=[h('td',{class:'lbl'},String(c))];
    for (var col=0;col<3;col++){
      var on=(c===dispCls&&col===curCol);
      var v=cellVal(M,c,col);
      var showNum=(c===M.cls);
      tds.push(h('td',{class:(on?'on ':'')+(isFinite(v)?'':'inf')},
        txt[c][col],
        showNum?h('span',{class:'num'},'= '+fmtVal(v)):null));
    }
    return h('tr',null,tds);
  });
  var tbl=h('table',{class:'err'},
    h('thead',null,h('tr',null,
      h('th',null,'Classe α de la FTBO'),
      h('th',null,'Échelon (ampl. a) — écart de position'),
      h('th',null,'Rampe (pente a) — écart de traînage'),
      h('th',null,'Parabole (coef. a/2) — écart d’accélération'))),
    h('tbody',null,rows));
  var wrap=h('div',null,tbl);
  if (M.cls>2)wrap.appendChild(h('p',{class:'small'},'L(p) possède '+M.cls+' intégrateurs : tous les écarts sont nuls.'));
  return wrap;
}
function kboExpr(){
  var P=SYS.plant, C=SYS.corr;
  var K=nf(P.K,2), Kp=nf(C.Kp,2), Ti=nf(C.Ti,2);
  if (C.type==='P'){
    if (P.classe===0)return 'K_BO = Kp · K = '+Kp+' × '+K+' = '+nf(P.K*C.Kp,3);
    return 'K_BO = Kp · K = '+Kp+' × '+K+' = '+nf(P.K*C.Kp,3);
  }
  return 'K_BO = (Kp · K) / Ti = ('+Kp+' × '+K+') / '+Ti+' = '+nf(P.K*C.Kp/C.Ti,3);
}
function mkAnalysis(M){
  var mg=marginsOf(bode(M));
  var bp=closedLoopBandwidth(M);
  return h('div',{class:'blk'},
    h('h3',{style:'margin-top:0'},'Analyse du modèle — L(p) = C(p)·G(p)'),
    h('table',{class:'kv'},h('tbody',null,
      h('tr',null,h('td',null,'Classe α de la FTBO'),h('td',{class:'m'},String(M.cls))),
      h('tr',{class:'hl'},h('td',null,'Gain K_BO de la FTBO'),h('td',{class:'m'},isFinite(M.K_BO)?nf(M.K_BO,3):'∞')),
      h('tr',null,h('td',null,'Écart de position a/(1+K_BO)'),h('td',{class:'m'},M.cls===0?nf(SYS.amp/(1+M.K_BO),3):'0')),
      h('tr',null,h('td',null,'Écart de traînage a/K_BO'),h('td',{class:'m'},M.cls===0?'∞':(M.cls===1?nf(SYS.amp/M.K_BO,3):'0'))),
      h('tr',null,h('td',null,'Bande passante à −3 dB'),h('td',{class:'m'},isFinite(bp)?nf(bp,2)+' rad/s':'—')),
      h('tr',{class:'hl'},h('td',null,'Stabilité boucle fermée'),h('td',{class:'m'},M.stable?'stable':'instable')),
      h('tr',null,h('td',null,'Marge de phase Mφ'),h('td',{class:'m'},isFinite(mg.pm)?nf(mg.pm,1)+' °':'—')),
      h('tr',null,h('td',null,'Marge de gain MG'),h('td',{class:'m'},isFinite(mg.gm)?nf(mg.gm,1)+' dB':'∞'))
    ))
  );
}
function mountPrecision(root){
  root.appendChild(h('h2',null,'Précision des systèmes asservis'));
  root.appendChild(h('p',{html:'La <b>précision</b> mesure l’<b>écart ε(∞)</b> entre consigne et sortie en régime permanent. On note <i>G(p)</i> le système, <i>C(p)</i> le correcteur et <i>L(p)=C(p)·G(p)</i> la FTBO. L’écart dépend de la <b>classe α de L(p)</b> et du type d’entrée.'}));
  var dg=h('div');root.appendChild(dg);
  root.appendChild(mkControls(function(){draw();}));
  var pb=plotBox('Réponse s(t) et consigne e(t)',{h:310,yl:'s(t)'});
  var pe=plotBox('Écart ε(t) = e(t) − s(t)',{h:185,yl:'ε(t)'});
  root.appendChild(pb.box);root.appendChild(pe.box);
  root.appendChild(pleg([[COL.slate,'consigne','d'],[COL.blue,'sortie'],[COL.green,'régime permanent','d'],[COL.orange,'début pert(t)','d'],[COL.red,'écart ε(t)']]));
  var res=h('div');root.appendChild(res);
  var ana=h('div');root.appendChild(ana);

  function draw(){
    var M=model();
    dg.innerHTML=diagSVG(M);
    var tf=simTimeframe(M);
    var R=computeResponse(M,tf);
    var tmax=tf.tmax, td=tf.td, hasPert=tf.hasPert;
    var eS=eSignal;
    var yFinalSS=R.y[R.y.length-1][1];
    var yInitSS=yFinalSS;
    if (hasPert&&td>0){
      var dt=tmax/900;
      var iTd=Math.max(0,Math.round(td/dt)-8);
      yInitSS=R.y[iTd][1];
    }
    var yAll=R.y.map(function(p){return p[1];}).filter(isFinite);
    var eAll=R.y.map(function(p){return eS(p[0])-p[1];}).filter(isFinite);
    var ylo=Math.min.apply(null,[0].concat(yAll));
    var yhi=Math.max.apply(null,[SYS.amp*1.02].concat(yAll));
    var elo=Math.min.apply(null,[0].concat(eAll));
    var ehi=Math.max.apply(null,[0.01].concat(eAll));
    pb.P.set(Object.assign(xAxis(tmax),yAxisFor(ylo,yhi)));
    pe.P.set(Object.assign(xAxis(tmax),yAxisFor(elo,ehi)));

    pb.P.draw=function(P){
      P.fn(eS,COL.slate,2,[6,4],0,tmax);
      P.seg(0,yFinalSS,tmax,yFinalSS,COL.green,1.3,[5,4]);
      P.line(R.y1,COL.blue,2.6);
      if (R.y2)P.line(R.y2,COL.violet,1.8,[4,3]);
      P.line(R.y,COL.ink,2.6);
      P.dot(tmax,yFinalSS,COL.green,4.5);
      if (hasPert){
        P.seg(td,P.o.ymin,td,P.o.ymax,COL.orange,1.4,[4,3]);
        P.txt('pert(t) démarre',td,P.o.ymax,COL.orange,'left',11.5,6,10);
      }
    };
    pe.P.draw=function(P){
      P.seg(0,0,tmax,0,COL.soft,1);
      P.line(R.y.map(function(p){return [p[0],eS(p[0])-p[1]];}),COL.red,2.4);
      if (hasPert)P.seg(td,P.o.ymin,td,P.o.ymax,COL.orange,1.4,[4,3]);
    };
    pb.P.redraw();pe.P.redraw();

    res.innerHTML='';
    var statData=[
      ['Classe α de la FTBO',String(M.cls)],
      ['Gain K_BO = lim p^α·FTBO',isFinite(M.K_BO)?nf(M.K_BO,3):'∞'],
      ['Amplitude a',nf(SYS.amp,2)]
    ];
    if (hasPert){
      var eI=SYS.amp-yInitSS,eF=SYS.amp-yFinalSS;
      statData.push(['Écart avant pert',nf(eI,3)],['Écart après pert',nf(eF,3)],['Variation',nf(eF-eI,3)]);
    } else {
      statData.push(
        ['Écart de position (échelon)',M.cls===0?nf(SYS.amp/(1+M.K_BO),3):'0'],
        ['Écart de traînage (rampe)',M.cls===0?'∞':(M.cls===1?nf(SYS.amp/M.K_BO,3):'0')],
        ['Écart d’accélération (parabole)',M.cls<2?'∞':(M.cls===2?nf(SYS.amp/M.K_BO,3):'0')]
      );
    }
    res.appendChild(stats(statData));

    res.appendChild(h('div',{class:'alert'},
      h('h3',null,'⚠ Le gain du tableau est le gain de la FTBO, pas celui du correcteur'),
      h('p',{html:'Dans le tableau, <b>K_BO</b> désigne le gain de la <b>FTBO</b> L(p) = C(p)·G(p). Ce n’est <b>pas</b> Kp.'}),
      h('div',{class:'mono',style:'background:#fff;padding:8px 10px;border-radius:6px;margin-top:6px;font-size:12.5px;color:#111'},
        'L(p) = K_BO · (1+…) / (p^α · (1+…))',h('br'),
        'K_BO = lim_{p→0} p^α · L(p) = '+nf(M.K_BO,3)),
      h('p',{style:'margin-top:8px',html:'<b>Votre modèle :</b> '+kboExpr()+'.'})
    ));

    res.appendChild(h('h3',null,'Tableau des écarts en poursuite (sans perturbation)'));
    res.appendChild(errTable(M));

    if (hasPert){
      var d=SYS.pert, errPert;
      if (M.alpha1===0)errPert=M.alpha2===0?d*M.K2/(1+M.K1*M.K2):d/M.K1;
      else errPert=0;
      var eI2=SYS.amp-yInitSS,eF2=SYS.amp-yFinalSS;
      res.appendChild(h('div',{class:'blk',style:'border-left:4px solid var(--violet)'},
        h('h3',{style:'margin-top:0'},'Écart dû à la perturbation en échelon'),
        h('p',{html:'pert(t) = pert·u(t − t_pert) démarre à <b>t_pert = '+nf(td,2)+' s</b>. Amplitude <b>pert = '+nf(d,2)+'</b>. F₁ = C(p), F₂ = G(p).'}),
        h('table',{class:'kv'},h('tbody',null,
          h('tr',null,h('td',null,'α₁ (classe de C)'),h('td',{class:'m'},String(M.alpha1)+' ('+SYS.corr.type+')')),
          h('tr',null,h('td',null,'K₁'),h('td',{class:'m'},isFinite(M.K1)?nf(M.K1,3):'∞')),
          h('tr',null,h('td',null,'α₂ (classe de G)'),h('td',{class:'m'},String(M.alpha2))),
          h('tr',null,h('td',null,'K₂'),h('td',{class:'m'},nf(M.K2,3))),
          h('tr',{class:'hl'},h('td',null,'Écart dû à pert seul'),h('td',{class:'m'},nf(errPert,3)))
        )),
        h('p',{style:'margin-top:6px;font-size:12.5px',html:M.alpha1===0?'α₁=0 : l’écart dû à pert vaut '+nf(errPert,3)+'. Un correcteur intégral le rejetterait.':'α₁≥1 : l’intégrateur rejette l’échelon de perturbation.'})));
    }

    var v=[];
    if (M.cls===0)v.push('L(p) est de <b>classe 0</b> : l’échelon laisse un écart <b>a/(1+K_BO) = '+nf(SYS.amp/(1+M.K_BO),3)+'</b>.');
    else if (M.cls===1)v.push('L(p) est de <b>classe 1</b> : écart de position nul, écart de traînage <b>a/K_BO = '+nf(SYS.amp/M.K_BO,3)+'</b>.');
    else v.push('L(p) est de <b>classe '+M.cls+'</b> : écarts nuls.');
    if (!M.stable)v.push('<b>Attention :</b> la boucle fermée est instable.');
    res.appendChild(verdict(v.join(' '),M.stable?'yes':'no'));

    ana.innerHTML='';ana.appendChild(mkAnalysis(M));
  }
  draw();
}

/* ====== RAPIDITÉ ====== */
function mountRapidite(root){
  root.appendChild(h('h2',null,'Rapidité — réponse indicielle'));
  root.appendChild(h('p',{html:'La rapidité se mesure classiquement sur la <b>réponse à un échelon</b>. Fréquentiellement, c’est la <b>bande passante à −3 dB</b>.'}));
  var dg=h('div');root.appendChild(dg);
  root.appendChild(mkControls(function(){draw();},{input:false,pert:false}));
  var p1=plotBox('Réponse indicielle (échelon unitaire)',{h:300,yl:'s(t)'});
  var p2=plotBox('t₅% en fonction du gain Kp',{h:300,xl:'Kp',yl:'t₅% (s)'});
  root.appendChild(h('div',{class:'two'},p1.box,p2.box));
  root.appendChild(pleg([[COL.slate,'consigne','d'],[COL.blue,'sortie'],[COL.orange,'bande ±5 %','d'],[COL.violet,'t₅%'],[COL.red,'point courant']]));
  var res=h('div');root.appendChild(res);

  function draw(){
    var M=model();
    dg.innerHTML=diagSVG(M);
    var tm=timeFrame(M);
    var R=simulateSS(tf2ss(M.T1n,M.T1d),function(){return 1;},tm,900);
    var met=metrics(R);
    var ys=R.map(function(p){return p[1];}).filter(isFinite);
    p1.P.set(Object.assign(xAxis(tm),yAxisFor(Math.min(0,Math.min.apply(null,ys)),Math.max(1.02,Math.max.apply(null,ys)))));
    p1.P.draw=function(P){
      P.seg(0,1,tm,1,COL.slate,1.8,[6,4]);
      P.seg(0,1.05,tm,1.05,COL.orange,1.2,[3,3]);
      P.seg(0,0.95,tm,0.95,COL.orange,1.2,[3,3]);
      P.line(R,COL.blue,2.8);
      if (isFinite(met.t5)){
        P.seg(met.t5,0,met.t5,1.05,COL.violet,1.4,[4,3]);
        P.dot(met.t5,R[Math.min(R.length-1,Math.round(met.t5/(tm/900)))][1],COL.violet,5);
        P.txt('t₅% = '+nf(met.t5,2)+' s',met.t5,0,COL.violet,'left',12,6,-10);
      }
    };
    p1.P.redraw();
    var kp0=SYS.corr.Kp,KMAX=20,NPT=28,sweep=[],ymaxS=0;
    for (var i=0;i<=NPT;i++){
      var kp=0.1+(KMAX-0.1)*i/NPT;
      SYS.corr.Kp=kp;
      var Mi=model();
      if (!Mi.stable){sweep.push([kp,NaN]);continue;}
      var tmi=timeFrame(Mi);
      var Ri=simulateSS(tf2ss(Mi.T1n,Mi.T1d),function(){return 1;},tmi,300);
      var mi=metrics(Ri);
      var val=(isFinite(mi.t5)&&mi.t5>0)?mi.t5:NaN;
      if (isFinite(val))ymaxS=Math.max(ymaxS,val);
      sweep.push([kp,val]);
    }
    SYS.corr.Kp=kp0;
    var yTop=ymaxS>0?Math.min(ymaxS,50)*1.15:5;
    p2.P.set({xmin:0,xmax:KMAX,xt:niceStep(KMAX,6),ymin:0,ymax:yTop,yt:niceStep(yTop,5),fx:function(v){return nf(v,1);},fy:function(v){return nf(v,2);}});
    p2.P.draw=function(P){
      P.line(sweep.filter(function(p){return isFinite(p[1]);}),COL.blue,2.6);
      var cur=sweep.reduce(function(a,p){return Math.abs(p[0]-kp0)<Math.abs(a[0]-kp0)?p:a;},sweep[0]);
      if (isFinite(cur[1]))P.dot(cur[0],cur[1],COL.red,6);
      P.seg(kp0,0,kp0,yTop,COL.red,1.1,[3,3]);
    };
    p2.P.redraw();
    var mm=marginsOf(bode(M));
    var bp=closedLoopBandwidth(M);
    res.innerHTML='';
    res.appendChild(stats([
      ['Gain statique',nfs(met.yss,3)],
      ['Temps de montée 10→90 %',isFinite(met.tr)?nf(met.tr,2)+' s':'—'],
      ['Temps de réponse à 5 %',isFinite(met.t5)?nf(met.t5,2)+' s':'—'],
      ['Dépassement D %',isFinite(met.D)?nf(met.D,1)+' %':'—'],
      ['Bande passante à −3 dB',isFinite(bp)?nf(bp,2)+' rad/s':'—'],
      ['Marge de phase',nf(mm.pm,1)+' °']
    ]));
    var txt;
    if (!M.stable)txt='Boucle fermée instable : t₅% non défini.';
    else if (!isFinite(met.t5))txt='Réponse non mesurable.';
    else txt='Avec Kp = '+nf(kp0,1)+', t₅% = <b>'+nf(met.t5,2)+' s</b>, bande passante à −3 dB = <b>'+nf(bp,2)+' rad/s</b>.';
    res.appendChild(verdict(txt,M.stable?'yes':'no'));
  }
  draw();
}

        P.txt('Mφ = '+nf(mg.pm,1)+'°',Math.log10(mg.wc),phc,COL.red,'left',11.5,7,-9);

      if (isFinite(mg.w180))P.seg(Math.log10(mg.w180),phR.ymin,Math.log10(mg.w180),phR.ymax,COL.violet,1.2,[4,3]);
    };
    p4.P.redraw();
    res.innerHTML='';
    res.appendChild(stats([
      ['Boucle fermée',M.stable?'STABLE':'INSTABLE'],
      ['Pôles à partie réelle > 0',String(pr.filter(function(z){return z.re>1e-9;}).length)],
      ['Marge de phase Mφ',isFinite(mg.pm)?nf(mg.pm,1)+' °':'—'],
      ['Marge de gain MG',isFinite(mg.gm)?nf(mg.gm,1)+' dB':'∞'],
      ['Pulsation de coupure ωc',isFinite(mg.wc)?nf(mg.wc,2)+' rad/s':'—'],
      ['Pulsation à −180° ω₁₈₀',isFinite(mg.w180)?nf(mg.w180,2)+' rad/s':'—']
    ]));
    res.appendChild(h('div',{class:'blk',style:'font-size:13px'},h('b',null,'Cibles : '),'M_G entre 8 et 12 dB, M_φ entre 45° et 60°.'));
    var txt;
    if (M.stable){
      var okG=!isFinite(mg.gm)||mg.gm>=8;
      var okP=!isFinite(mg.pm)||mg.pm>=45;
      txt='Boucle fermée <b>stable</b>. '+(okG&&okP?'Marges dans les cibles.':'Marges en dessous des cibles.');
    } else txt='Boucle fermée <b>instable</b> : '+pr.filter(function(z){return z.re>1e-9;}).length+' pôle(s) à partie réelle positive.';
    res.appendChild(verdict(txt,M.stable?'yes':'no'));
    ana.innerHTML='';ana.appendChild(mkAnalysis(M));
  }
  draw();
}

function actScore(a){
  var s=actState();
  var n=0;
  for (var i=0;i<a.qcm.length;i++)if(s.a[i]===a.qcm[i].a)n++;

function renderAct(){
  var box=$('#act'), btn=$('#bAct');
  btn.setAttribute('aria-pressed',AS.open?'true':'false');
  if (AS.open)btn.classList.add('pri');else btn.classList.remove('pri');
  box.hidden=!AS.open;
  if (!AS.open){box.innerHTML='';return;}
  var a=ACT[AS.key];
  box.innerHTML='';
  var nq=a.qcm.length;
  box.appendChild(h('div',{class:'phead'},
    h('b',null,'Activité'),
    h('span',{class:'sub'},a.title),
    h('button',{class:'btn sm',type:'button',onclick:function(){AS.open=false;renderAct();}},'Fermer')));
  var tabSteps=h('button',{type:'button',class:'',role:'tab','aria-selected':AS.tab==='steps'?'true':'false',onclick:function(){AS.tab='steps';renderAct();}},'Consignes');
  var tabQcm=h('button',{type:'button',role:'tab','aria-selected':AS.tab==='qcm'?'true':'false',onclick:function(){AS.tab='qcm';renderAct();}},'Questions ('+nq+')');
  if (AS.tab==='steps')tabSteps.setAttribute('aria-selected','true');
  else tabQcm.setAttribute('aria-selected','true');
  box.appendChild(h('div',{class:'tabs',role:'tablist'},tabSteps,tabQcm));
  var body=h('div',{class:'pbody'});
  if (AS.tab==='steps'){
    body.appendChild(h('p',{class:'small'},a.level+' · environ '+a.time));
    if (a.notation)body.appendChild(h('div',{class:'notation',html:a.notation}));
    body.appendChild(h('div',{class:'goal'},h('b',null,'Objectif. '),a.goal));
    body.appendChild(h('ol',{class:'steps'},a.steps.map(function(s){return h('li',{html:s});})));
    body.appendChild(h('div',{class:'defi'},
      h('b',null,'Défi'),
      h('p',{html:a.defi.q}),
      h('details',null,h('summary',null,'Voir la réponse'),h('p',{html:a.defi.a}))));
    if (a.course)body.appendChild(h('p',null,h('button',{class:'btn',type:'button',onclick:function(){openCourse(a.course);}},'Voir le cours')));
    body.appendChild(h('p',null,h('button',{class:'btn pri',type:'button',onclick:function(){AS.tab='qcm';renderAct();}},'Passer aux questions')));
  } else {
    var s=actState(), show=s.checked||s.shown;
    for (var i=0;i<a.qcm.length;i++){
      (function(i){
        var q=a.qcm[i];
        var fs=h('fieldset',{class:'q'},h('legend',null,(i+1)+'. '+q.q));
        for (var j=0;j<q.o.length;j++){
          (function(j){
            var good=show&&j===q.a;
            var bad=s.checked&&!s.shown&&s.a[i]===j&&j!==q.a;
            var inp=h('input',{type:'radio',name:'q'+i});
            inp.checked=show&&s.shown?j===q.a:s.a[i]===j;
            inp.disabled=!!show;
            inp.addEventListener('change',function(){s.a[i]=j;actSave();renderAct();});
            var cls='opt';
            if (good)cls+=' good';
            if (bad)cls+=' bad';
            fs.appendChild(h('label',{class:cls},inp,h('span',null,q.o[j]+(good?'  ✓':'')+(bad?'  ✗':''))));
          })(j);
        }
        if (show){
          var miss=s.a[i]==null&&!s.shown;
          fs.appendChild(h('p',{class:'why'},(miss?'Sans réponse. ':'')+q.w));
        }
        body.appendChild(fs);
      })(i);
    }
    var done=0;
    for (var k in s.a)if(s.a[k]!=null)done++;
    body.appendChild(h('p',{class:'small'},s.shown?'Réponses affichées.':s.checked?'':done+' réponse(s) sur '+nq+'.'));
    if (s.checked&&!s.shown)body.appendChild(h('p',{class:'score'},'Score : '+actScore(a)+' / '+nq));
    var row=h('div',{class:'files'});
    if (!show)row.appendChild(h('button',{class:'btn pri',type:'button',onclick:function(){s.checked=true;actSave();renderAct();}},'Corriger'));
    row.appendChild(h('button',{class:'btn',type:'button',onclick:function(){s.shown=true;actSave();renderAct();}},'Afficher les réponses'));
    if (show)row.appendChild(h('button',{class:'btn',type:'button',onclick:function(){AS.st[AS.key]={a:{},checked:false,shown:false};actSave();renderAct();}},'Recommencer'));
    body.appendChild(row);
  }
  box.appendChild(body);
}

  if (idx>0)cpn.appendChild(h('button',{class:'btn',type:'button',onclick:function(){CS.id=COURSE[idx-1].id;renderCourse();}},'← '+COURSE[idx-1].t));
  else cpn.appendChild(h('span'));
  if (idx<COURSE.length-1)cpn.appendChild(h('button',{class:'btn pri',type:'button',onclick:function(){CS.id=COURSE[idx+1].id;renderCourse();}},COURSE[idx+1].t+' →'));
  else cpn.appendChild(h('span'));
  art.appendChild(cpn);
  var top=h('div',{class:'ctop'},
    h('b',null,'Cours : performances des SLCI'),
    h('button',{class:'btn pri sm',type:'button',onclick:function(){CS.open=false;renderCourse();}},'Retour'));
  box.appendChild(top);
  box.appendChild(sel);
  box.appendChild(h('div',{class:'cwrap'},nav,art));
  box.scrollTop=0;
}
function openCourse(id){if(id)CS.id=id;CS.open=true;renderCourse();}

/* ====== aide ====== */
function closeDlg(){var d=$('#dlg');d.hidden=true;d.innerHTML='';}
function openDlg(title,body){
  var d=$('#dlg');d.innerHTML='';d.hidden=false;
  d.appendChild(h('div',{class:'dlgbox',role:'dialog'},
    h('header',null,h('b',null,title),h('button',{class:'btn sm',type:'button',onclick:closeDlg},'Fermer')),
    h('div',{class:'dbody'},body)));
  d.onclick=function(ev){if(ev.target===d)closeDlg();};
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#dlg').hidden)closeDlg();});
$('#bHelp').addEventListener('click',function(){
  openDlg('Aide',h('div',{html:
    '<p>Page interactive sur les <b>performances des SLCI</b> : Précision (écarts, K_BO), Rapidité (t₅%, bande passante), Stabilité (pôles BF, marges).</p>'
    +'<h3>Notations</h3>'
    +'<p><b>G(p)</b> : système ; <b>C(p)</b> : correcteur ; <b>L(p) = C(p)·G(p)</b> : FTBO ; <b>T(p)</b> : FTBF.</p>'
    +'<h3>Point clé</h3>'
    +'<p>Dans le tableau des écarts, <b>K_BO = lim<sub>p→0</sub> p<sup>α</sup>·L(p)</b> est le gain de la FTBO. Ce n’est PAS Kp.</p>'
    +'<h3>Perturbation</h3>'
    +'<p>pert(t) démarre en régime permanent pour que son effet soit visible.</p>'}));
});

/* ====== rendu ====== */
function renderTabs(){
  var seg=$('#tabs');seg.innerHTML='';
  TABS.forEach(function(t){
    var b=h('button',{type:'button',role:'tab','aria-pressed':t.id===CUR?'true':'false',onclick:function(){
      CUR=t.id;AS.key=t.id;AS.tab='steps';
      render();
    }},t.t);
    seg.appendChild(b);
  });
}
function render(){
  renderTabs();
  var hint=$('#hint');
  for (var i=0;i<TABS.length;i++)if(TABS[i].id===CUR)hint.textContent=TABS[i].hint;
  var root=$('#ws');root.innerHTML='';
  if (CUR==='precision')mountPrecision(root);
  else if (CUR==='rapidite')mountRapidite(root);
  else mountStabilite(root);
  renderAct();
}

$('#bAct').addEventListener('click',function(){
  if (CS.open){CS.open=false;renderCourse();}
  AS.open=!AS.open;
  renderAct();
});
$('#bCourse').addEventListener('click',function(){
  CS.open=!CS.open;
  renderCourse();
});

/* ====== démarrage ====== */
try{
  AS.open=!isSmall();
  AS.key=CUR;
  render();
  var boot=document.getElementById('boot');
  if (boot)boot.style.display='none';
}catch(e){
  var boot2=document.getElementById('boot');
  if (boot2){
    boot2.innerHTML='<div style="padding:20px;max-width:600px;background:#fff5d6;border:2px solid #c00;border-radius:8px;font-family:monospace;font-size:13px;line-height:1.5"><b>Erreur au démarrage :</b><br><br>'+e.message+'<br><br><pre style="white-space:pre-wrap;font-size:11px;max-height:200px;overflow:auto">'+(e.stack||'')+'</pre><br><b>Copie ce message pour diagnostic.</b></div>';
    boot2.style.background='#f8f8f8';
  }
  throw e;
}
})();
</script>
