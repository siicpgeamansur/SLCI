  for (const p of RM.data) {
    sx1 += p.x1; sx2 += p.x2; sy += p.y;
    sx1x1 += p.x1*p.x1; sx2x2 += p.x2*p.x2; sx1x2 += p.x1*p.x2;
    sx1y += p.x1*p.y; sx2y += p.x2*p.y;
  }
  const A = [[n, sx1, sx2],[sx1, sx1x1, sx1x2],[sx2, sx1x2, sx2x2]];
  const B = [sy, sx1y, sx2y];
  const M = A.map((row, i) => [...row, B[i]]);
  for (let i = 0; i < 3; i++) {
    let maxRow = i;
    for (let k = i+1; k < 3; k++) if (Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
    [M[i], M[maxRow]] = [M[maxRow], M[i]];
    for (let k = i+1; k < 3; k++) {
      const f = M[k][i] / M[i][i];
      for (let j = i; j < 4; j++) M[k][j] -= f * M[i][j];
    }
  }
  const x = [0,0,0];
  for (let i = 2; i >= 0; i--) {
    let v = M[i][3];
    for (let j = i+1; j < 3; j++) v -= M[i][j] * x[j];
    x[i] = v / M[i][i];
  }
  return { b: x[0], a1: x[1], a2: x[2] };
}

function mountKNN(root) {
  root.innerHTML = '<h2>4. Méthode des k plus proches voisins</h2>'
    + '<p>Le k-NN est <b>supervisé</b> et <b>non paramétrique</b>. Classez un nouveau point par vote majoritaire de ses k voisins.</p>'
    + '<p>Cliquez sur le graphique pour déplacer le point à classer.</p>'
    + '<div class="opts"><label class="fld"><span>k = <b id="knn-k-out">3</b></span><input type="range" id="knn-k" min="1" max="9" step="2" value="3"></label></div>'
    + '<canvas class="viz" id="knn-canvas"></canvas>'
    + '<div class="verdict" id="knn-msg"></div>';
  const canvas = $('#knn-canvas');
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const pad = 20;
    const x = (e.clientX - r.left - pad) / (r.width - 2 * pad);
    const y = 1 - (e.clientY - r.top - pad) / (r.height - 2 * pad);
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    KNN.q = { x, y };
    drawKNN();
  });
  $('#knn-k').addEventListener('input', e => { KNN.k = +e.target.value; $('#knn-k-out').textContent = KNN.k; drawKNN(); });
  $('#knn-k').value = KNN.k;
  $('#knn-k-out').textContent = KNN.k;
  drawKNN();
}
function drawKNN() {
  const canvas = $('#knn-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pad = 20;
  const px = x => pad + x * (W - 2 * pad);
  const py = y => H - pad - y * (H - 2 * pad);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath(); ctx.moveTo(pad + i / 10 * (W - 2 * pad), pad); ctx.lineTo(pad + i / 10 * (W - 2 * pad), H - pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, pad + i / 10 * (H - 2 * pad)); ctx.lineTo(W - pad, pad + i / 10 * (H - 2 * pad)); ctx.stroke();
  }
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, H - pad); ctx.lineTo(pad, pad); ctx.stroke();

  const qx = px(KNN.q.x), qy = py(KNN.q.y);
  const ds = KNN.pts.map(p => ({ p, d: Math.hypot(px(p.x) - qx, py(p.y) - qy) }));
  ds.sort((A, B) => A.d - B.d);
  const neigh = ds.slice(0, KNN.k);
  if (neigh.length) {
    const r = neigh[neigh.length - 1].d;
    ctx.beginPath(); ctx.arc(qx, qy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#2e6da4'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = 'rgba(46,109,164,.06)'; ctx.fill();
  }
  KNN.pts.forEach(p => {
    const x = px(p.x), y = py(p.y);
    const isN = neigh.some(n => n.p === p);
    if (p.c === 'A') {
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fillStyle = isN ? '#c0281f' : 'rgba(192,40,31,.55)'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 6.5, y + 5); ctx.lineTo(x - 6.5, y + 5); ctx.closePath();
      ctx.fillStyle = isN ? '#1e7a2e' : 'rgba(30,122,46,.55)'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });
  ctx.fillStyle = '#f4c430'; ctx.strokeStyle = '#9a5b00'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(qx, qy, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.font = 'bold 13px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', qx, qy + 1);

  const aC = neigh.filter(n => n.p.c === 'A').length;
  const bC = neigh.length - aC;
  let pred = aC > bC ? 'A' : bC > aC ? 'B' : neigh[0].p.c;
  const msg = $('#knn-msg');
  if (msg) {
    msg.className = 'verdict';
    msg.innerHTML = 'Parmi les <b>k = ' + KNN.k + '</b> voisins : <b>' + aC + '</b> de classe A, <b>' + bC + '</b> de classe B → classe prédite : <b>' +
      (pred === 'A' ? 'A (rouge)' : 'B (vert)') + '</b>' + (aC === bC ? ' (égalité : on prend la classe du plus proche)' : '') + '.';
  }
}

    + '<p>Trois descentes depuis a = 0,5 (à b = 1,4 fixe), avec trois valeurs de α : minuscules, adaptés, alternants.</p>'
    + '<canvas class="viz" id="reg-multi" style="height:360px;cursor:default"></canvas>';

  ['a', 'b', 'alpha'].forEach(k => {
    $('#reg-' + k).addEventListener('input', e => {
      REG[k] = +e.target.value;
      if (k === 'a' || k === 'b') REG.path = [{ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) }];
      regUpdate();
    });
  });
  $('#reg-step1').addEventListener('click', () => regStep(1));
  $('#reg-step50').addEventListener('click', () => regStep(50));
  $('#reg-step200').addEventListener('click', () => regStep(200));
  $('#reg-reset').addEventListener('click', () => {
    REG.a = REG_INIT.a; REG.b = REG_INIT.b;
    REG.path = [{ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) }];
    regUpdate();
  });

  $('#reg-3d-step1').addEventListener('click', () => { reg3dStep(1); });
  $('#reg-3d-step10').addEventListener('click', () => { reg3dStep(10); });
  $('#reg-3d-step100').addEventListener('click', () => { reg3dStep(100); });
  $('#reg-3d-reset').addEventListener('click', () => {
    REG.a = REG_INIT.a; REG.b = REG_INIT.b;
    REG.path = [{ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) }];
    regUpdate(); drawReg3D();
  });

  const c3d = $('#reg-3d');
  const onDown = e => {
    REG.view.dragging = { x: e.clientX, y: e.clientY, theta: REG.view.theta, phi: REG.view.phi };
    const cv = $('#reg-3d'); if (cv) cv.style.cursor = 'grabbing';
  };
  const onMove = e => {
    if (!REG.view.dragging) return;
    const dx = e.clientX - REG.view.dragging.x;
    const dy = e.clientY - REG.view.dragging.y;
    REG.view.theta = REG.view.dragging.theta + dx * 0.01;
    REG.view.phi = Math.max(0.1, Math.min(Math.PI / 2.2, REG.view.dragging.phi - dy * 0.01));
    drawReg3D();
  };
  const onUp = () => {
    if (REG.view.dragging) { REG.view.dragging = null; const cv = $('#reg-3d'); if (cv) cv.style.cursor = 'grab'; }
  };
  c3d.addEventListener('mousedown', onDown);
  c3d.addEventListener('touchstart', e => { if (e.touches[0]) onDown(e.touches[0]); }, { passive: true });
  c3d.addEventListener('touchmove', e => { if (e.touches[0]) onMove(e.touches[0]); }, { passive: true });
  c3d.addEventListener('touchend', onUp);
  if (!REG.view.windowBound) {
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    REG.view.windowBound = true;
  }

  if (!REG.path || REG.path.length === 0) REG.path = [{ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) }];
  regUpdate();
}

function regUpdate() {
  if (!$('#reg-a')) return;
  $('#reg-a').value = REG.a; $('#reg-b').value = REG.b; $('#reg-alpha').value = REG.alpha;
  $('#reg-a-out').textContent = REG.a.toFixed(2);
  $('#reg-b-out').textContent = REG.b.toFixed(2);
  $('#reg-alpha-out').textContent = REG.alpha.toFixed(3);
  drawReg(); drawReg3D(); drawReg2D(); drawRegMultiAlpha();

  const mse = Jcost(REG.a, REG.b);
  const stats = $('#reg-stats'); stats.innerHTML = '';
  stats.append(
    h('div', { class: 'stat' }, h('span', null, 'pente a'), h('b', null, REG.a.toFixed(3))),
    h('div', { class: 'stat' }, h('span', null, 'biais b'), h('b', null, REG.b.toFixed(3))),
    h('div', { class: 'stat' }, h('span', null, 'MSE = J(a,b)'), h('b', null, mse.toFixed(4))));

  const stats3d = $('#reg-3d-stats'); stats3d.innerHTML = '';
  stats3d.append(
    h('div', { class: 'stat' }, h('span', null, 'itération'), h('b', null, String(REG.path.length - 1))),
    h('div', { class: 'stat' }, h('span', null, 'a courant'), h('b', null, REG.a.toFixed(3))),
    h('div', { class: 'stat' }, h('span', null, 'b courant'), h('b', null, REG.b.toFixed(3))),
    h('div', { class: 'stat' }, h('span', null, 'J(a,b)'), h('b', null, Jcost(REG.a, REG.b).toFixed(4))));
}

function regStep(steps) {
  if (!REG.path || REG.path.length === 0) REG.path = [{ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) }];
  for (let s = 0; s < steps; s++) {
    const g = gradJ(REG.a, REG.b);
    REG.a -= REG.alpha * g.ga;
    REG.b -= REG.alpha * g.gb;
    if (!isFinite(REG.a) || !isFinite(REG.b) || Math.abs(REG.a) > 50 || Math.abs(REG.b) > 50) {
      const m = $('#reg-msg'); if (m) { m.className = 'verdict no'; m.textContent = 'Divergence : α est trop grand.'; }
      break;
    }
    REG.path.push({ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) });
    if (REG.path.length > 300) REG.path.shift();
  }
  REG.a = Math.max(-1, Math.min(3, REG.a));
  REG.b = Math.max(-2, Math.min(12, REG.b));
  regUpdate();
  const m = $('#reg-msg');
  if (m) {
    const mse = Jcost(REG.a, REG.b);
    m.className = 'verdict' + (mse < 0.3 ? ' yes' : '');
    m.textContent = steps + ' pas effectué(s). MSE = ' + mse.toFixed(4) + (mse < 0.3 ? '. Proche du minimum !' : '. Continuez pour approcher le minimum.');
  }
}

function reg3dStep(steps) {
  if (!REG.path || REG.path.length === 0) REG.path = [{ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) }];
  for (let s = 0; s < steps; s++) {
    const g = gradJ(REG.a, REG.b);
    REG.a -= REG.alpha * g.ga;
    REG.b -= REG.alpha * g.gb;
    if (!isFinite(REG.a) || !isFinite(REG.b)) break;
    REG.path.push({ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) });
    if (REG.path.length > 300) REG.path.shift();
  }
  regUpdate();
}

function drawReg() {
  const canvas = $('#reg-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pad = 36;
  const xmin = 0, xmax = 10, ymin = 0, ymax = 12;
  const px = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);
  const py = y => H - pad - (y - ymin) / (ymax - ymin) * (H - 2 * pad);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo(px(i), pad); ctx.lineTo(px(i), H - pad); ctx.stroke(); }
  for (let j = 1; j < 12; j++) { ctx.beginPath(); ctx.moveTo(pad, py(j)); ctx.lineTo(W - pad, py(j)); ctx.stroke(); }
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad, py(0)); ctx.lineTo(W - pad, py(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px(0), pad); ctx.lineTo(px(0), H - pad); ctx.stroke();
  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  for (let i = 1; i <= 9; i++) ctx.fillText(String(i), px(i), H - pad + 15);
  ctx.textAlign = 'right';
  for (let j = 2; j <= 10; j += 2) ctx.fillText(String(j), pad - 5, py(j) + 4);
  REG.pts.forEach(p => {
    ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 5, 0, Math.PI * 2);
    ctx.fillStyle = '#2e6da4'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
  const y0 = REG.a * xmin + REG.b, y1 = REG.a * xmax + REG.b;
  ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(px(xmin), py(y0)); ctx.lineTo(px(xmax), py(y1)); ctx.stroke();
  ctx.fillStyle = '#c0281f'; ctx.textAlign = 'left'; ctx.font = 'bold 13px "IBM Plex Mono", monospace';
  ctx.fillText('f(x) = ' + REG.a.toFixed(2) + '·x + ' + REG.b.toFixed(2), pad + 6, pad + 14);
}

/* ====== Surface de coût J(a,b) : rendu 3D lissé + axes gradués ====== */
function drawReg3D() {
  const canvas = $('#reg-3d'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);

  const aMin = 0, aMax = 2, bMin = -1, bMax = 4;
  const N = 32;
  const grid = [];
  let jMax = 1e-6;
  for (let i = 0; i <= N; i++) {
    const row = [];
    for (let j = 0; j <= N; j++) {
      const a = aMin + (aMax - aMin) * i / N;
      const b = bMin + (bMax - bMin) * j / N;
      const J = Jcost(a, b);
      row.push({ a, b, J });
      if (J > jMax) jMax = J;
    }
    grid.push(row);
  }

  const th = REG.view.theta, ph = REG.view.phi;
  const ct = Math.cos(th), st = Math.sin(th);
  const cp = Math.cos(ph), sp = Math.sin(ph);
  const scale = Math.min(W * 0.40, H * 0.28);
  const cx = W * 0.5, cy = H * 0.57;

  function P(a, b, J) {
    const X = ((a - aMin) / (aMax - aMin)) * 2 - 1;
    const Y = ((b - bMin) / (bMax - bMin)) * 2 - 1;
    const Z = Math.sqrt(Math.max(0, J) / jMax) * 1.4;
    return {
      sx: cx + (X * ct - Y * st) * scale,
      sy: cy - (Z * cp - (X * st + Y * ct) * sp) * scale,
      depth: Z * sp + (X * st + Y * ct) * cp,
      X, Y, Z
    };
  }

  // Lumière (coordonnées monde normalisées)
  const L = [-0.42, -0.48, 0.77];
  const Ln = Math.hypot(L[0], L[1], L[2]);
  L[0] /= Ln; L[1] /= Ln; L[2] /= Ln;

  const quads = [];
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const g00 = grid[i][j], g10 = grid[i + 1][j], g11 = grid[i + 1][j + 1], g01 = grid[i][j + 1];
      const p00 = P(g00.a, g00.b, g00.J);
      const p10 = P(g10.a, g10.b, g10.J);
      const p11 = P(g11.a, g11.b, g11.J);
      const p01 = P(g01.a, g01.b, g01.J);
      const t1x = p10.X - p00.X, t1y = p10.Y - p00.Y, t1z = p10.Z - p00.Z;
      const t2x = p01.X - p00.X, t2y = p01.Y - p00.Y, t2z = p01.Z - p00.Z;
      const nx = t1y * t2z - t1z * t2y;
      const ny = t1z * t2x - t1x * t2z;
      const nz = t1x * t2y - t1y * t2x;
      const nl = Math.hypot(nx, ny, nz) || 1;
      const lam = Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2]) / nl);
      const avgJ = (g00.J + g10.J + g11.J + g01.J) / 4;
      const t = Math.sqrt(Math.max(0, avgJ) / jMax);
      const hue = 205 - 175 * t;
      const lig = 34 + 24 * lam;
      quads.push({
        pts: [p00, p10, p11, p01],
        depth: (p00.depth + p10.depth + p11.depth + p01.depth) / 4,
        fill: 'hsl(' + hue.toFixed(0) + ',62%,' + lig.toFixed(0) + '%)'
      });
    }
  }
  quads.sort((A, B) => B.depth - A.depth);
  for (const q of quads) {
    ctx.fillStyle = q.fill;
    ctx.strokeStyle = q.fill;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(q.pts[0].sx, q.pts[0].sy);
    ctx.lineTo(q.pts[1].sx, q.pts[1].sy);
    ctx.lineTo(q.pts[2].sx, q.pts[2].sy);
    ctx.lineTo(q.pts[3].sx, q.pts[3].sy);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  /* ---- Axes gradués ---- */
  const padA = 0.10, padB = 0.22;
  const a0 = aMin - padA, b0 = bMin - padB;
  const origin = P(a0, b0, 0);
  const aEnd = P(aMax, b0, 0);
  const bEnd = P(a0, bMax, 0);
  const jEnd = P(a0, b0, jMax);

  ctx.strokeStyle = '#3f4750'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(origin.sx, origin.sy); ctx.lineTo(aEnd.sx, aEnd.sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(origin.sx, origin.sy); ctx.lineTo(bEnd.sx, bEnd.sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(origin.sx, origin.sy); ctx.lineTo(jEnd.sx, jEnd.sy); ctx.stroke();

  function sdir(p1, p2) {
    const dx = p2.sx - p1.sx, dy = p2.sy - p1.sy, l = Math.hypot(dx, dy) || 1;
    return { dx: dx / l, dy: dy / l };
  }
  const labels = [];
  // a
  const dA = sdir(P(aMin, b0, 0), P(aMin, b0 - 0.6, 0));
  [0, 0.5, 1, 1.5, 2].forEach(v => {
    const q = P(v, b0, 0);
    ctx.strokeStyle = '#3f4750'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(q.sx, q.sy); ctx.lineTo(q.sx + dA.dx * 5, q.sy + dA.dy * 5); ctx.stroke();
    labels.push({ x: q.sx + dA.dx * 15, y: q.sy + dA.dy * 15, text: String(v).replace('.', ','), font: '10.5px' });
  });
  // b
  const dB = sdir(P(a0, bMin, 0), P(a0 - 0.25, bMin, 0));
  [-1, 0, 1, 2, 3, 4].forEach(v => {
    const q = P(a0, v, 0);
    ctx.strokeStyle = '#3f4750'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(q.sx, q.sy); ctx.lineTo(q.sx + dB.dx * 5, q.sy + dB.dy * 5); ctx.stroke();
    labels.push({ x: q.sx + dB.dx * 15, y: q.sy + dB.dy * 15, text: String(v).replace('.', ','), font: '10.5px' });
  });
  // J (graduations en valeurs réelles, positions en √J)
  const dJ = sdir(P(a0, b0, jMax * 0.5), P(a0 - 0.25, b0, jMax * 0.5));
  [1, 4, 9, 16, 25].forEach(v => {
    const q = P(a0, b0, v);
    ctx.strokeStyle = '#3f4750'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(q.sx, q.sy); ctx.lineTo(q.sx + dJ.dx * 5, q.sy + dJ.dy * 5); ctx.stroke();
    labels.push({ x: q.sx + dJ.dx * 15, y: q.sy + dJ.dy * 15, text: String(v), font: '10.5px' });
  });
  // Titres d'axes
  const dAt = sdir(P(aMax, b0, 0), P(aMax + 0.3, b0, 0));
  labels.push({ x: aEnd.sx + dAt.dx * 20, y: aEnd.sy + dAt.dy * 20, text: 'a', font: 'bold 13px' });
  const dBt = sdir(P(a0, bMax, 0), P(a0, bMax + 0.5, 0));
  labels.push({ x: bEnd.sx + dBt.dx * 20, y: bEnd.sy + dBt.dy * 20, text: 'b', font: 'bold 13px' });
  const dJt = sdir(P(a0, b0, jMax), P(a0 - 0.3, b0, jMax));
  labels.push({ x: jEnd.sx + dJt.dx * 20, y: jEnd.sy + dJt.dy * 20 - 4, text: 'J', font: 'bold 13px' });

  /* ---- Chemin de descente ---- */
  if (REG.path && REG.path.length > 0) {
    ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    REG.path.forEach((p, i) => {
      const q = P(p.a, p.b, p.J);
      if (i === 0) ctx.moveTo(q.sx, q.sy); else ctx.lineTo(q.sx, q.sy);
    });
    ctx.stroke();
    const p0 = REG.path[0], q0 = P(p0.a, p0.b, p0.J);
    ctx.beginPath(); ctx.arc(q0.sx, q0.sy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#9a5b00'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
    const pL = REG.path[REG.path.length - 1], qL = P(pL.a, pL.b, pL.J);
    ctx.beginPath(); ctx.arc(qL.sx, qL.sy, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#1e7a2e'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
  }

  /* ---- Étiquettes (par-dessus) ---- */
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3c434b';
  labels.forEach(l => {
    ctx.font = l.font + ' "IBM Plex Sans", sans-serif';
    ctx.fillText(l.text, l.x, l.y);
  });
}

function drawReg2D() {
  const canvas = $('#reg-2d'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);

  const aMin = 0, aMax = 2, bFix = REG.b;
  const N = 80;
  const samples = [];
  let jMax = 0.01;
  for (let i = 0; i <= N; i++) {
    const a = aMin + (aMax - aMin) * i / N;
    const J = Jcost(a, bFix);
    samples.push({ a, J });
    if (J > jMax) jMax = J;
  }
  const jCap = Math.min(jMax, 0.6);
  const pad = 44;
  const px = a => pad + (a - aMin) / (aMax - aMin) * (W - 2 * pad);
  const py = J => H - pad - Math.min(J, jCap) / jCap * (H - 2 * pad);

  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const x = pad + (W - 2 * pad) * i / 5;
    ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, H - pad); ctx.stroke();
    const y = pad + (H - 2 * pad) * i / 5;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
  }
  ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.stroke();
  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  for (let i = 0; i <= 5; i++) {
    const a = aMin + (aMax - aMin) * i / 5;
    ctx.fillText(a.toFixed(1), pad + (W - 2 * pad) * i / 5, H - pad + 15);
  }
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const J = jCap * i / 4;
    ctx.fillText(J.toFixed(2), pad - 5, H - pad - (H - 2 * pad) * i / 4 + 4);
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#111';
  ctx.fillText('a', W - pad + 15, H - pad + 5);
  ctx.textAlign = 'left';
  ctx.fillText('J(a) à b = ' + bFix.toFixed(2), pad, pad - 12);

  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  samples.forEach((s, i) => {
    const x = px(s.a), y = py(s.J);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  const sumX2 = REG.pts.reduce((s, p) => s + p.x * p.x, 0);
  const sumX = REG.pts.reduce((s, p) => s + p.x, 0);
  const sumXY = REG.pts.reduce((s, p) => s + p.x * p.y, 0);
  const aStar = (sumXY - bFix * sumX) / sumX2;
  if (aStar >= aMin && aStar <= aMax) {
    ctx.strokeStyle = 'rgba(30,122,46,0.5)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(px(aStar), pad); ctx.lineTo(px(aStar), H - pad); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(px(aStar), py(Jcost(aStar, bFix)), 5, 0, Math.PI * 2);
    ctx.fillStyle = '#1e7a2e'; ctx.fill();
    ctx.fillStyle = '#1e7a2e';
    ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('a* = ' + aStar.toFixed(2), px(aStar), pad + 15);
  }

  const iterA = [REG.a];
  let cur = REG.a;
  for (let k = 0; k < 12; k++) {
    const g = (1 / REG.pts.length) * REG.pts.reduce((s, p) => s + p.x * (cur * p.x + bFix - p.y), 0);
    cur = cur - REG.alpha * g;
    if (Math.abs(cur) > 10) break;
    iterA.push(cur);
  }
  ctx.strokeStyle = 'rgba(192,40,31,0.7)'; ctx.lineWidth = 1.8;
  iterA.forEach((a, i) => {
    if (i === 0) return;
    const x0 = px(iterA[i - 1]), y0 = py(Jcost(iterA[i - 1], bFix));
    const x1 = px(a), y1 = py(Jcost(a, bFix));
    if (x1 < pad - 20 || x1 > W - pad + 20) return;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    const ang = Math.atan2(y1 - y0, x1 - x0);
    const hs = 7;
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x1 - hs * Math.cos(ang - 0.4), y1 - hs * Math.sin(ang - 0.4));
    ctx.moveTo(x1, y1); ctx.lineTo(x1 - hs * Math.cos(ang + 0.4), y1 - hs * Math.sin(ang + 0.4));
    ctx.stroke();
  });
  iterA.forEach((a, i) => {
    if (Math.abs(a) > 10) return;
    const x = px(a), y = py(Jcost(a, bFix));
    if (x < pad || x > W - pad) return;
    ctx.beginPath();
    ctx.arc(x, y, i === 0 ? 6 : 4, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? '#9a5b00' : '#c0281f';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
  if (iterA.length > 1 && Math.abs(iterA[0]) < 10) {
    ctx.fillStyle = '#9a5b00'; ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    if (px(iterA[0]) > pad && px(iterA[0]) < W - pad) {
      ctx.fillText('a₀ = ' + iterA[0].toFixed(2), px(iterA[0]), py(Jcost(iterA[0], bFix)) - 14);
    }
  }
}

function drawRegMultiAlpha() {
  const canvas = $('#reg-multi'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);

  const alphas = [
    { value: 0.001, label: 'α = 0,001 — sauts minuscules, convergence très lente', color: '#2e6da4' },
    { value: 0.02, label: 'α = 0,02 — sauts adaptés, convergence rapide et stable', color: '#1e7a2e' },
    { value: 0.062, label: 'α = 0,062 — sauts qui alternent de part et d\'autre du minimum', color: '#c0281f' }
  ];
  const aMin = 0, aMax = 2, bFix = 1.4;
  const N = 80;
  const samples = [];
  let jMax = 0.01;
  for (let i = 0; i <= N; i++) {
    const a = aMin + (aMax - aMin) * i / N;
    const J = Jcost(a, bFix);
    samples.push({ a, J });
    if (J > jMax) jMax = J;
  }
  const jCap = Math.min(jMax, 0.3);
  const rowH = H / alphas.length;
  const padX = 50, padTop = 22, padBot = 30;

  const sumX2 = REG.pts.reduce((s, p) => s + p.x * p.x, 0);
  const sumX = REG.pts.reduce((s, p) => s + p.x, 0);
  const sumXY = REG.pts.reduce((s, p) => s + p.x * p.y, 0);
  const aStar = (sumXY - bFix * sumX) / sumX2;

  alphas.forEach((alpha, k) => {
    const top = k * rowH + padTop / 2;
    const bot = (k + 1) * rowH - padBot / 2;
    const innerW = W - 2 * padX;
    const innerH = bot - top;
    const px = a => padX + (a - aMin) / (aMax - aMin) * innerW;
    const py = J => bot - Math.min(J, jCap) / jCap * innerH;

    ctx.fillStyle = '#111';
    ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(alpha.label, 8, top + 10);

    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padX, bot); ctx.lineTo(W - padX, bot); ctx.stroke();

    ctx.strokeStyle = alpha.color; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4;
    ctx.beginPath();
    samples.forEach((s, i) => {
      const x = px(s.a), y = py(s.J);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (aStar >= aMin && aStar <= aMax) {
      ctx.strokeStyle = 'rgba(30,122,46,0.4)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px(aStar), top); ctx.lineTo(px(aStar), bot); ctx.stroke();
      ctx.setLineDash([]);
    }

    const iterA = [0.5];
    let cur = 0.5;
    for (let i = 0; i < 12; i++) {
      const g = (1 / REG.pts.length) * REG.pts.reduce((s, p) => s + p.x * (cur * p.x + bFix - p.y), 0);
      cur = cur - alpha.value * g;
      iterA.push(cur);
      if (Math.abs(cur) > 5) break;
    }

    ctx.strokeStyle = alpha.color; ctx.lineWidth = 1.5;
    iterA.forEach((a, i) => {
      if (i === 0) return;
      const x0 = px(iterA[i - 1]), y0 = py(Jcost(iterA[i - 1], bFix));
      const x1 = px(a), y1 = py(Jcost(a, bFix));
      if (x1 < padX - 20 || x1 > W - padX + 20) return;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    });

    iterA.forEach((a, i) => {
      const x = px(a), y = py(Jcost(a, bFix));
      if (x < padX - 5 || x > W - padX + 5) return;
      ctx.beginPath();
      ctx.arc(x, y, i === 0 ? 5 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = i === 0 ? '#9a5b00' : alpha.color;
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    });

    ctx.fillStyle = '#111';
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'right';
    const lastA = iterA[iterA.length - 1];
    const iterLabel = Math.abs(lastA) > 5 ? 'divergence' : lastA.toFixed(3);
    ctx.fillText('a₁₂ = ' + iterLabel, W - 8, top + 10);
  });
}

function bindRM3D() {
  const c = $('#rm-3d'); if (!c) return;
  const onDown = e => {
    RMV.dragging = { x: e.clientX, y: e.clientY, th: RMV.theta, ph: RMV.phi };
    const cv = $('#rm-3d'); if (cv) cv.style.cursor = 'grabbing';
  };
  const onMove = e => {
    if (!RMV.dragging) return;
    RMV.theta = RMV.dragging.th + (e.clientX - RMV.dragging.x) * 0.01;
    RMV.phi = Math.max(0.15, Math.min(1.0, RMV.dragging.ph - (e.clientY - RMV.dragging.y) * 0.01));
    drawRM3D();
  };
  const onUp = () => {
    if (!RMV.dragging) return;
    RMV.dragging = null;
    const cv = $('#rm-3d'); if (cv) cv.style.cursor = 'grab';
  };
  c.addEventListener('mousedown', onDown);
  c.addEventListener('touchstart', e => { if (e.touches[0]) onDown(e.touches[0]); }, { passive: true });
  c.addEventListener('touchmove', e => { if (e.touches[0]) onMove(e.touches[0]); }, { passive: true });
  c.addEventListener('touchend', onUp);
  if (!RMV.bound) {
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    RMV.bound = true;
  }
}

function drawRM3D() {
  const canvas = $('#rm-3d'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);

  const x1max = 160, x2max = 6, ymax = 500;
  const th = RMV.theta, ph = RMV.phi;
  const ct = Math.cos(th), st = Math.sin(th);
  const cp = Math.cos(ph), sp = Math.sin(ph);
  const scale = Math.min(W * 0.36, H * 0.28);
  const cx = W * 0.5, cy = H * 0.60;

  function P(x1, x2, y) {
    const X = (x1 / x1max) * 2 - 1;
    const Y = (x2 / x2max) * 2 - 1;
    const Z = (y / ymax) * 1.5;
    return {
      sx: cx + (X * ct - Y * st) * scale,
      sy: cy - (Z * cp - (X * st + Y * ct) * sp) * scale,
      depth: Z * sp + (X * st + Y * ct) * cp
    };
  }
  const clampY = y => Math.max(0, Math.min(ymax, y));

  // Sol
  const O = P(0, 0, 0), X1 = P(x1max, 0, 0), X2 = P(0, x2max, 0), X12 = P(x1max, x2max, 0);
  ctx.fillStyle = 'rgba(90,96,104,0.05)';
  ctx.strokeStyle = 'rgba(90,96,104,0.30)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(O.sx, O.sy); ctx.lineTo(X1.sx, X1.sy); ctx.lineTo(X12.sx, X12.sy); ctx.lineTo(X2.sx, X2.sy); ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Axes
  const Yt = P(0, 0, ymax);
  ctx.strokeStyle = '#3f4750'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(O.sx, O.sy); ctx.lineTo(X1.sx, X1.sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(O.sx, O.sy); ctx.lineTo(X2.sx, X2.sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(O.sx, O.sy); ctx.lineTo(Yt.sx, Yt.sy); ctx.stroke();

  // Plan d'ajustement
  const GX = 6, GY = 4;
  const cells = [];
  for (let i = 0; i < GX; i++) {
    for (let j = 0; j < GY; j++) {
      const x1a = (i / GX) * x1max, x1b = ((i + 1) / GX) * x1max;
      const x2a = (j / GY) * x2max, x2b = ((j + 1) / GY) * x2max;
      const q00 = P(x1a, x2a, clampY(rmPredict(RM.a1, RM.a2, RM.b, x1a, x2a)));
      const q10 = P(x1b, x2a, clampY(rmPredict(RM.a1, RM.a2, RM.b, x1b, x2a)));
      const q11 = P(x1b, x2b, clampY(rmPredict(RM.a1, RM.a2, RM.b, x1b, x2b)));
      const q01 = P(x1a, x2b, clampY(rmPredict(RM.a1, RM.a2, RM.b, x1a, x2b)));
      cells.push({ pts: [q00, q10, q11, q01], depth: (q00.depth + q10.depth + q11.depth + q01.depth) / 4 });
    }
  }
  cells.sort((A, B) => B.depth - A.depth);
  for (const c of cells) {
    ctx.fillStyle = 'rgba(46,109,164,0.10)';
    ctx.strokeStyle = 'rgba(46,109,164,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(c.pts[0].sx, c.pts[0].sy);
    for (let k = 1; k < 4; k++) ctx.lineTo(c.pts[k].sx, c.pts[k].sy);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // Résidus
  ctx.setLineDash([3, 3]); ctx.lineWidth = 1.3; ctx.strokeStyle = 'rgba(192,40,31,0.60)';
  RM.data.forEach(p => {
    const yh = clampY(rmPredict(RM.a1, RM.a2, RM.b, p.x1, p.x2));
    const a = P(p.x1, p.x2, p.y), b2 = P(p.x1, p.x2, yh);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b2.sx, b2.sy); ctx.stroke();
  });
  ctx.setLineDash([]);

  // Points de données
  const pts = RM.data.map(p => ({ p, q: P(p.x1, p.x2, p.y) }));
  pts.sort((A, B) => B.q.depth - A.q.depth);
  for (const { q } of pts) {
    ctx.beginPath(); ctx.arc(q.sx, q.sy, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#2e6da4'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
  }

  // Nouvel appartement
  const ynew = rmPredict(RM.a1, RM.a2, RM.b, RM.x1new, RM.x2new);
  if (ynew >= 0 && ynew <= ymax) {
    const q = P(RM.x1new, RM.x2new, ynew);
    ctx.beginPath(); ctx.arc(q.sx, q.sy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#e8a33d'; ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#111'; ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('nouvel appartement', q.sx + 11, q.sy);
  }

  // Labels d'axes
  function sdir(p1, p2) {
    const dx = p2.sx - p1.sx, dy = p2.sy - p1.sy, l = Math.hypot(dx, dy) || 1;
    return { dx: dx / l, dy: dy / l };
  }
  const out1 = sdir(O, P(0, -1, 0));
  const out2 = sdir(O, P(-30, 0, 0));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3c434b';
  ctx.font = '10.5px "IBM Plex Sans", sans-serif';
  [[80, '80'], [160, '160']].forEach(([v, t]) => {
    const q = P(v, 0, 0);
    ctx.fillText(t, q.sx + out1.dx * 13, q.sy + out1.dy * 13);
  });
  [[3, '3'], [6, '6']].forEach(([v, t]) => {
    const q = P(0, v, 0);
    ctx.fillText(t, q.sx + out2.dx * 13, q.sy + out2.dy * 13);
  });
  [[250, '250'], [500, '500']].forEach(([v, t]) => {
    const q = P(0, 0, v);
    ctx.fillText(t, q.sx + out2.dx * 15, q.sy + out2.dy * 15);
  });

  const d1 = sdir(X1, P(x1max + 30, 0, 0));
  const d2 = sdir(X2, P(0, x2max + 1.2, 0));
  const dy = sdir(Yt, P(-30, 0, ymax));
  ctx.fillStyle = '#111'; ctx.font = 'bold 12px "IBM Plex Sans", sans-serif';
  ctx.fillText('x₁ (m²)', X1.sx + d1.dx * 24, X1.sy + d1.dy * 24);
  ctx.fillText('x₂ (nb)', X2.sx + d2.dx * 24, X2.sy + d2.dy * 24);
  ctx.fillText('prix (k€)', Yt.sx + dy.dx * 24, Yt.sy + dy.dy * 24);
}

    + '<label class="fld"><span>x₂ = <b id="perc-x2-out">0.80</b></span><input type="range" id="perc-x2" min="-2" max="2" step="0.1" value="0.8"></label>'
    + '<h3>Poids et biais</h3>'
    + '<label class="fld"><span>w₁ = <b id="perc-w1-out">0.00</b></span><input type="range" id="perc-w1" min="-3" max="3" step="0.1" value="0"></label>'
    + '<label class="fld"><span>w₂ = <b id="perc-w2-out">1.00</b></span><input type="range" id="perc-w2" min="-3" max="3" step="0.1" value="1"></label>'
    + '<label class="fld"><span>b = <b id="perc-b-out">0.00</b></span><input type="range" id="perc-b" min="-3" max="3" step="0.1" value="0"></label>'
    + '<h3>Fonction d\'activation</h3>'
    + '<div id="perc-act"></div>'
    + '</div>'
    + '</div>'
    + '<h3>Calcul en cours</h3>'
    + '<div id="perc-compute" class="dwrap"></div>'
    + '<div class="gstats" id="perc-stats"></div>'
    + '<div class="verdict" id="perc-msg"></div>';
  ['x1', 'x2', 'w1', 'w2', 'b'].forEach(k => {
    $('#perc-' + k).addEventListener('input', e => {
      PERC[k] = +e.target.value;
      drawPerc();
    });
  });
  const acts = ['sigmoid', 'tanh', 'relu', 'step'];
  $('#perc-act').appendChild(h('div', { class: 'chips' }, acts.map(a => h('button', {
    type: 'button', class: 'chip' + (PERC.act === a ? ' on' : ''),
    onclick: () => { PERC.act = a; drawPerc(); }
  }, a))));
  drawPerc();
}

function drawPerc() {
  ['x1', 'x2', 'w1', 'w2', 'b'].forEach(k => {
    const el = $('#perc-' + k); if (el) el.value = PERC[k];
    const out = $('#perc-' + k + '-out'); if (out) out.textContent = PERC[k].toFixed(2);
  });
  const ab = $('#perc-act'); if (ab) {
    ab.innerHTML = '';
    ['sigmoid', 'tanh', 'relu', 'step'].forEach(a => {
      ab.appendChild(h('button', {
        type: 'button', class: 'chip' + (PERC.act === a ? ' on' : ''),
        onclick: () => { PERC.act = a; drawPerc(); }
      }, a));
    });
  }
  const canvas = $('#perc-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const xmin = -2, xmax = 2, ymin = -2, ymax = 2;
  const pad = 30;
  const sx = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);
  const sy = y => H - pad - (y - ymin) / (ymax - ymin) * (H - 2 * pad);

  const step = 4;
  for (let py = 0; py < H; py += step) {
    for (let px = 0; px < W; px += step) {
      if (px < pad || px > W - pad || py < pad || py > H - pad) continue;
      const x1 = xmin + (px - pad) / (W - 2 * pad) * (xmax - xmin);
      const x2 = ymax - (py - pad) / (H - 2 * pad) * (ymax - ymin);
      const z = PERC.w1 * x1 + PERC.w2 * x2 + PERC.b;
      const out = ACTS[PERC.act](z);
      ctx.fillStyle = out > 0.5 ? 'rgba(30,122,46,0.10)' : 'rgba(192,40,31,0.08)';
      ctx.fillRect(px, py, step, step);
    }
  }
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, sy(0)); ctx.lineTo(W - pad, sy(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx(0), pad); ctx.lineTo(sx(0), H - pad); ctx.stroke();
  if (Math.abs(PERC.w2) > 1e-6) {
    const xa = xmin, ya = -(PERC.w1 * xa + PERC.b) / PERC.w2;
    const xb = xmax, yb = -(PERC.w1 * xb + PERC.b) / PERC.w2;
    ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(sx(xa), sy(ya)); ctx.lineTo(sx(xb), sy(yb)); ctx.stroke();
  }
  PERC.samples.forEach(s => {
    const x = sx(s.x1), y = sy(s.x2);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = s.y === 1 ? '#1e7a2e' : '#c0281f';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  });
  const cx = sx(PERC.x1), cy = sy(PERC.x2);
  ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2);
  ctx.fillStyle = '#f4c430'; ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();

  const z = PERC.w1 * PERC.x1 + PERC.w2 * PERC.x2 + PERC.b;
  const output = ACTS[PERC.act](z);
  const predClass = output > 0.5 ? 1 : 0;
  const comp = $('#perc-compute');
  if (comp) {
    comp.innerHTML = '<table class="dt"><tbody>'
      + '<tr><td>z = w₁·x₁ + w₂·x₂ + b</td><td class="m">= ' + PERC.w1.toFixed(2) + '·' + PERC.x1.toFixed(2) + ' + ' + PERC.w2.toFixed(2) + '·' + PERC.x2.toFixed(2) + ' + ' + PERC.b.toFixed(2) + '</td><td class="m"><b>' + z.toFixed(3) + '</b></td></tr>'
      + '<tr><td>y = φ(z)</td><td class="m">φ = ' + PERC.act + '</td><td class="m"><b>' + output.toFixed(3) + '</b></td></tr>'
      + '<tr><td>Classe prédite</td><td class="m">' + (output > 0.5 ? 'y > 0,5' : 'y ≤ 0,5') + '</td><td class="m"><b>' + predClass + '</b></td></tr>'
      + '</tbody></table>';
  }
  let correct = 0;
  PERC.samples.forEach(s => {
    const zz = PERC.w1 * s.x1 + PERC.w2 * s.x2 + PERC.b;
    const o = ACTS[PERC.act](zz);
    if ((o > 0.5 ? 1 : 0) === s.y) correct++;
  });
  const acc = correct / PERC.samples.length * 100;
  const stats = $('#perc-stats');
  if (stats) {
    stats.innerHTML = '';
    stats.append(
      h('div', { class: 'stat' }, h('span', null, 'z'), h('b', null, z.toFixed(3))),
      h('div', { class: 'stat' }, h('span', null, 'y = φ(z)'), h('b', null, output.toFixed(3))),
      h('div', { class: 'stat' }, h('span', null, 'précision'), h('b', null, acc.toFixed(0) + ' %')));
  }
  const msg = $('#perc-msg');
  if (msg) {
    if (acc === 100) { msg.className = 'verdict yes'; msg.textContent = 'Parfait ! Tous les points sont classés correctement.'; }
    else if (acc >= 70) { msg.className = 'verdict warn'; msg.textContent = 'Bien, mais pas parfait. Ajustez w₁, w₂ ou b pour séparer tous les points.'; }
    else { msg.className = 'verdict'; msg.textContent = 'Ajustez w₁, w₂ et b pour déplacer la frontière et séparer les points (classe 1 en haut à droite, classe 0 en bas à gauche).'; }
  }
}

/* ============ ATELIER 8 : RÉSEAU MULTICOUCHE ============ */
function mountMLP(root) {
  root.innerHTML = '<h2>8. Réseau multicouche : le problème XOR</h2>'
    + '<p>Un perceptron simple ne peut séparer que des données <b>linéairement séparables</b>. Le problème <b>XOR</b> ne l\'est pas : aucune droite ne sépare (0,0) et (1,1) de (0,1) et (1,0).</p>'
    + '<p>Un réseau à <b>une couche cachée</b> de deux neurones y arrive. Réglez les seuils c₁ et c₂ des neurones cachés.</p>'
    + '<div class="reg-grid">'
    + '<canvas class="viz" id="mlp-canvas" style="height:340px;cursor:default"></canvas>'
    + '<div>'
    + '<h3>Neurones cachés</h3>'
    + '<p><code>h₁ = σ(k·(x₁ + x₂ − c₁))</code></p>'
    + '<label class="fld"><span>c₁ = <b id="mlp-c1-out">0.80</b></span><input type="range" id="mlp-c1" min="-1" max="2" step="0.1" value="0.8"></label>'
    + '<p><code>h₂ = σ(k·(x₁ + x₂ − c₂))</code></p>'
    + '<label class="fld"><span>c₂ = <b id="mlp-c2-out">0.80</b></span><input type="range" id="mlp-c2" min="-1" max="2" step="0.1" value="0.8"></label>'
    + '<p><code>y = σ(K·(h₁ − h₂ − 0,4))</code> avec k = 5, K = 10.</p>'
    + '<div id="mlp-msg" class="verdict"></div>'
    + '</div>'
    + '</div>'
    + '<h3>Classification des quatre points XOR</h3>'
    + '<div id="mlp-table"></div>'
    + '<h3>Fonctions d\'activation usuelles</h3>'
    + '<canvas class="viz" id="mlp-acts" style="height:220px;cursor:default"></canvas>';
  ['c1', 'c2'].forEach(k => {
    $('#mlp-' + k).addEventListener('input', e => {
      MLP[k] = +e.target.value;
      drawMLP();
    });
  });
  drawMLP(); drawActs();
}

function mlpPredict(x1, x2) {
  const k = MLP.k, K = MLP.K;
  const h1 = 1 / (1 + Math.exp(-k * (x1 + x2 - MLP.c1)));
  const h2 = 1 / (1 + Math.exp(-k * (x1 + x2 - MLP.c2)));
  return { h1, h2, y: 1 / (1 + Math.exp(-K * (h1 - h2 - 0.4))) };
}

function drawMLP() {
  $('#mlp-c1').value = MLP.c1; $('#mlp-c2').value = MLP.c2;
  $('#mlp-c1-out').textContent = MLP.c1.toFixed(2);
  $('#mlp-c2-out').textContent = MLP.c2.toFixed(2);
  const canvas = $('#mlp-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const xmin = -0.5, xmax = 1.5, pad = 30;
  const sx = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);
  const sy = y => H - pad - (y - xmin) / (xmax - xmin) * (H - 2 * pad);

  const step = 5;
  for (let py = 0; py < H; py += step) {
    for (let px = 0; px < W; px += step) {
      if (px < pad || px > W - pad || py < pad || py > H - pad) continue;
      const x1 = xmin + (px - pad) / (W - 2 * pad) * (xmax - xmin);
      const x2 = xmax - (py - pad) / (H - 2 * pad) * (xmax - xmin);
      const { y } = mlpPredict(x1, x2);
      ctx.fillStyle = y > 0.5 ? 'rgba(30,122,46,0.10)' : 'rgba(192,40,31,0.08)';
      ctx.fillRect(px, py, step, step);
    }
  }

  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.stroke();
  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  for (let i = 0; i <= 2; i++) {
    const v = xmin + i;
    ctx.fillText(String(v), pad + (W - 2 * pad) * i / 2, H - pad + 15);
    ctx.textAlign = 'right';
    ctx.fillText(String(v), pad - 5, H - pad - (H - 2 * pad) * i / 2 + 4);
    ctx.textAlign = 'center';
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#111';
  ctx.fillText('x₁', W - pad + 15, H - pad + 5);
  ctx.textAlign = 'left';
  ctx.fillText('x₂', pad - 30, pad - 5);

  MLP.points.forEach(p => {
    const x = sx(p.x1), y = sy(p.x2);
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.fillStyle = p.y === 1 ? '#1e7a2e' : '#c0281f'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(p.y), x, y + 1);
  });

  const tb = $('#mlp-table');
  if (tb) {
    let correct = 0;
    const tbody = h('tbody');
    MLP.points.forEach(p => {
      const r = mlpPredict(p.x1, p.x2);
      const pred = r.y > 0.5 ? 1 : 0;
      const ok = pred === p.y;
      if (ok) correct++;
      tbody.append(h('tr', null,
        h('td', { class: 'm' }, '(' + p.x1 + ', ' + p.x2 + ')'),
        h('td', { class: 'm' }, r.h1.toFixed(3)),
        h('td', { class: 'm' }, r.h2.toFixed(3)),
        h('td', { class: 'm' }, r.y.toFixed(3)),
        h('td', { class: 'm' }, String(pred)),
        h('td', { class: 'm' }, String(p.y)),
        h('td', null, ok ? '✓' : '✗')));
    });
    tb.innerHTML = '';
    tb.append(h('div', { class: 'dwrap' }, h('table', { class: 'dt' },
      h('thead', null, h('tr', null, ['Point', 'h₁', 'h₂', 'y', 'Prédit', 'Attendu', ''].map(t => h('th', null, t)))),
      tbody)));
    const acc = correct / 4 * 100;
    const m = $('#mlp-msg');
    if (m) {
      if (acc === 100) { m.className = 'verdict yes'; m.innerHTML = '<b>100 %</b> — c\'est la solution du XOR ! Les deux neurones cachés ont des seuils différents.'; }
      else { m.className = 'verdict warn'; m.innerHTML = 'Précision : <b>' + acc + ' %</b>. Essayez c₁ ≈ 0,5 et c₂ ≈ 1,5 pour séparer correctement les quatre points.'; }
    }
  }
}

function drawActs() {
  const canvas = $('#mlp-acts'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  const pad = 24;
  const xmin = -5, xmax = 5;
  const sx = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);
  const sy = y => H - pad - (y + 1.5) / 2.5 * (H - 2 * pad);
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, sy(0)); ctx.lineTo(W - pad, sy(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx(0), pad); ctx.lineTo(sx(0), H - pad); ctx.stroke();
  const fns = [
    { name: 'Sigmoïde', f: z => 1 / (1 + Math.exp(-z)), color: '#2e6da4' },
    { name: 'Tanh', f: z => Math.tanh(z), color: '#1e7a2e' },
    { name: 'ReLU', f: z => Math.max(0, z), color: '#c0281f' }
  ];
  fns.forEach((fn, idx) => {
    ctx.strokeStyle = fn.color; ctx.lineWidth = 2.2;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 100; i++) {
      const x = xmin + (xmax - xmin) * i / 100;
      const y = fn.f(x);
      const px = sx(x), py = sy(y);
      if (first) { ctx.moveTo(px, py); first = false; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.fillStyle = fn.color;
    ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(fn.name, 8 + idx * 100, pad + 12);
  });
}

function mountDemarche(root) {
  root.innerHTML = '<h2>9. Démarche de résolution</h2>'
    + '<p>Face à un problème d\'ingénierie, on <b>décompose</b> le problème complexe en sous-problèmes simples, on <b>choisit</b> l\'algorithme adapté (k-NN, régression multiple, réseau de neurones), puis on mène les phases d\'<b>apprentissage</b> et d\'<b>inférence</b>.</p>'
    + '<h3>Partie A. Type et algorithme</h3>'
    + '<p>Pour chaque scénario, indiquez s\'il s\'agit de <b>classification</b> ou de <b>régression</b>, puis l\'algorithme recommandé.</p>'
    + '<div id="dem-a"></div>'
    + '<h3>Partie B. Phase d\'apprentissage ou d\'inférence</h3>'
    + '<p>Classez chaque action dans la phase correspondante.</p>'
    + '<div id="dem-b"></div>'
    + '<div class="files" style="margin-top:8px"><button class="btn pri" id="dem-check" type="button">Vérifier</button><button class="btn" id="dem-reset" type="button">Recommencer</button></div>'
    + '<div class="verdict" id="dem-msg"></div>'
    + '<div class="retain"><b>À retenir.</b> La démarche est toujours la même : <b>décomposer</b> → <b>choisir l\'algorithme</b> → <b>entraîner</b> (apprentissage) → <b>inférer</b> (prédire). Le choix de l\'algorithme dépend du type de sortie (classe / valeur) et de la nature du problème (linéaire / non linéaire).</div>';
  renderDem();
  $('#dem-check').addEventListener('click', () => { DEM.checked = true; DEM.checkedPhase = true; renderDem(); });
  $('#dem-reset').addEventListener('click', () => { DEM.assign = {}; DEM.assignPhase = {}; DEM.checked = false; DEM.checkedPhase = false; renderDem(); });
}

function renderDem() {
  const a = $('#dem-a'); if (!a) return;
  a.innerHTML = '';
  DEM.scenarios.forEach((sc, i) => {
    const assign = DEM.assign[i] || {};
    const fb = h('div', { class: 'fb' });
    if (DEM.checked) {
      const okType = assign.type === sc.type;
      const okAlgo = assign.algo === sc.algo;
      const ok = okType && okAlgo;
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      fb.innerHTML = (ok ? '✓ ' : '✗ Type : <b>' + DEM.choices[sc.type] + '</b>, algorithme : <b>' + DEM.choices.algo[sc.algo] + '</b>. ') + sc.why;
    }
    const chipsType = h('div', { class: 'chips' }, ['reg', 'cla'].map(c => h('button', {
      type: 'button', class: 'chip' + (assign.type === c ? ' on' : ''),
      onclick: () => { if (DEM.checked) return; assign.type = assign.type === c ? null : c; DEM.assign[i] = assign; renderDem(); }
    }, DEM.choices[c])));
    const chipsAlgo = h('div', { class: 'chips' }, ['regmulti', 'knn', 'mlp'].map(c => h('button', {
      type: 'button', class: 'chip' + (assign.algo === c ? ' on' : ''),
      onclick: () => { if (DEM.checked) return; assign.algo = assign.algo === c ? null : c; DEM.assign[i] = assign; renderDem(); }
    }, DEM.choices.algo[c])));
    a.append(h('div', { class: 'task-row' }, h('div', null, h('b', null, (i + 1) + '. ' + sc.t), h('div', { style: 'margin-top:4px' }, chipsType, chipsAlgo), fb)));
  });

  const b = $('#dem-b'); if (!b) return;
  b.innerHTML = '';
  DEM.phases.forEach((ph, i) => {
    const assign = DEM.assignPhase[i];
    const fb = h('div', { class: 'fb' });
    if (DEM.checkedPhase) {
      const ok = assign === ph.a;
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      fb.textContent = ok ? '✓' : '✗ Bonne réponse : ' + (ph.a === 'app' ? 'apprentissage' : 'inférence') + '.';
    }
    const chips = h('div', { class: 'chips' }, [
      { v: 'app', l: 'Apprentissage' },
      { v: 'inf', l: 'Inférence' }
    ].map(c => h('button', {
      type: 'button', class: 'chip' + (assign === c.v ? ' on' : ''),
      onclick: () => { if (DEM.checkedPhase) return; DEM.assignPhase[i] = assign === c.v ? null : c.v; renderDem(); }
    }, c.l)));
    b.append(h('div', { class: 'task-row' }, h('div', null, h('span', null, (i + 1) + '. ' + ph.t), fb), chips));
  });

  const msg = $('#dem-msg');
  if (msg && DEM.checked) {
    let ok = 0;
    DEM.scenarios.forEach((sc, i) => { const a = DEM.assign[i] || {}; if (a.type === sc.type && a.algo === sc.algo) ok++; });
    DEM.phases.forEach((ph, i) => { if (DEM.assignPhase[i] === ph.a) ok++; });
    const total = DEM.scenarios.length + DEM.phases.length;
    msg.className = 'verdict ' + (ok === total ? 'yes' : 'warn');
    msg.textContent = 'Score : ' + ok + ' / ' + total + '.';
  } else if (msg) {
    msg.className = 'verdict';
    const done = Object.keys(DEM.assign).length + Object.keys(DEM.assignPhase).length;
    msg.textContent = done + ' réponse(s).';
  }
}

COURSE.push({ id: 'knn', t: 'Méthode des k plus proches voisins', h: `
<p>Algorithme <b>supervisé</b> et <b>non paramétrique</b> (memory-based) : on classe un nouvel élément par vote majoritaire de ses k voisins.</p>

<div class="formula">d<sub>euclidienne</sub>(M, N) = √( (x<sub>2N</sub> − x<sub>2M</sub>)² + (x<sub>1N</sub> − x<sub>1M</sub>)² )</div>

<div class="formula">d<sub>Tchebychev</sub>(M, N) = max( |x<sub>2N</sub> − x<sub>2M</sub>|, |x<sub>1N</sub> − x<sub>1M</sub>| )</div>

COURSE.push({ id: 'regression', t: 'Régression linéaire', h: `
<h3>Modèle monovariable</h3>
<div class="formula">f(x) = a·x + b</div>
<p><b>a</b> = poids (pente), <b>b</b> = biais (ordonnée à l'origine).</p>
<h3>Modèle multivariable</h3>
<p>Avec plusieurs variables explicatives :</p>
<div class="formula">f(x₁, …, x<sub>m</sub>) = a₁·x₁ + … + a<sub>m</sub>·x<sub>m</sub> + b</div>
<p>Chaque coefficient aᵢ mesure le poids de la variable xᵢ. La résolution se fait par <b>équations normales</b> (solution analytique) ou par <b>descente de gradient</b>.</p>
<h3>Fonction coût</h3>
<div class="formula">J(a, b) = (1 / 2n) · Σ (a·x<sub>i</sub> + b − y<sub>i</sub>)²</div>
<p>Cette fonction est <b>convexe</b> : un seul minimum global. Visuellement, c'est une <b>cuvette</b> (paraboloïde) — pas plusieurs cuvettes : le nombre de points ne change que la courbure.</p>
<h3>Descente de gradient</h3>
<div class="formula">a ← a − α · ∂J/∂a &nbsp;&nbsp; b ← b − α · ∂J/∂b</div>
<div class="formula">∂J/∂a = (1/n) · Σ x<sub>i</sub>·(a·x<sub>i</sub> + b − y<sub>i</sub>) &nbsp;&nbsp; ∂J/∂b = (1/n) · Σ (a·x<sub>i</sub> + b − y<sub>i</sub>)</div>
<h3>Rôle de α</h3>
<ul>
<li>α trop petit → convergence très lente</li>
<li>α trop grand → sauts qui alternent, voire divergence</li>
<li>Ordre de grandeur usuel : 0,001 dans les cas réels</li>
</ul>
<h3>Scikit-learn</h3>
<pre class="code">from sklearn.linear_model import LinearRegression, SGDRegressor

model = LinearRegression()  # moindres carrés (multivariable)
# ou SGDRegressor(max_iter=10000, eta0=0.001) pour la descente

model.fit(X_train, y_train)
model.score(X_test, y_test)
predictions = model.predict(X_new)</pre>
<div class="retain"><b>À retenir.</b> Modèle paramétrique, coût convexe, α contrôle la vitesse et la stabilité de la descente. La version multivariable généralise la version monovariable.</div>
` });
COURSE.push({ id: 'reseau', t: 'Réseaux de neurones', h: `
<h3>Le perceptron</h3>

<p>Un neurone calcule une <b>somme pondérée</b> (linéaire), ajoute un <b>biais</b>, puis applique une <b>fonction d'activation</b> (non linéaire).</p>

  COURSE.push({ id: 'backprop', t: 'Rétro-propagation', h: `
<h3>Principe</h3>
<p>Pour entraîner un réseau multicouche, on répète 4 étapes :</p>
<ol>
<li><b>Forward propagation</b> : on fait circuler les données de la couche d'entrée vers la sortie.</li>
<li><b>Fonction coût</b> : on calcule l'erreur E entre la sortie produite et la sortie attendue (ex. E = (y − ŷ)²).</li>
<li><b>Back-propagation</b> : on calcule ∂E/∂wⱼ pour chaque poids en remontant de la sortie vers l'entrée (règle de composition des dérivées).</li>
<li><b>Descente de gradient</b> : on met à jour wⱼ ← wⱼ − α·∂E/∂wⱼ, puis on recommence à l'étape 1.</li>
</ol>
<h3>Chaîne de gradients</h3>
<div class="formula">∂E/∂wⱼ = ∂E/∂ŷ · ∂ŷ/∂h · ∂h/∂f · ∂f/∂wⱼ</div>
<p>Pour une sigmoïde : σ'(z) = σ(z)·(1 − σ(z)).</p>
<h3>Exercice type</h3>
<p>Réseau : 2 entrées (1, x), 2 neurones cachés (σ), 1 sortie identité. Pour (x, y) = (2, 1) et α = 0,1 :</p>
<pre class="code">f11 = w₁ + w₂·x = −1,5   h11 = σ(−1,5) = 0,1824
f12 = w₃·x + w₄ = 1,0     h12 = σ(1,0) = 0,7311
f21 = w₅ + w₆·h11 + w₇·h12 = 0,4513 = ŷ

Δw₁ = α(y−ŷ)·w₆·h11(1−h11)      = 0,0082
Δw₂ = α(y−ŷ)·w₆·h11(1−h11)·x    = 0,0164
Δw₃ = α(y−ŷ)·w₇·h12(1−h12)·x    = −0,0108 (corrigé)
Δw₄ = α(y−ŷ)·w₇·h12(1−h12)      = −0,0216 (corrigé)
Δw₅ = α(y−ŷ)                    = 0,0549
Δw₆ = α(y−ŷ)·h11                = 0,0100
Δw₇ = α(y−ŷ)·h12                = 0,0401</pre>
<div class="retain"><b>À retenir.</b> Forward → coût → back-propagation → gradient descent. La formule Δwⱼ = α(y−ŷ)∂ŷ/∂wⱼ s'applique couche par couche en partant de la sortie.</div>
` });
COURSE.push({ id: 'concours', t: 'Exemples de concours', h: `
<h3>CCINP SI PSI 2025 — friction</h3>
<p>Régression non linéaire (force en fonction de la vitesse) par <code>MLPRegressor(hidden_layer_sizes=(600,50))</code>. R² = 0,98 (train) et 0,97 (test) ⇒ très bon modèle, pas de surapprentissage. 1481 mesures, 200 pour le test.</p>
<h3>CCINP SI PSI 2025 — λ(θb)</h3>
<p>Régression linéaire univariée par <code>LinearRegression</code>. Avantage sur la linéarisation : modèle global valable sur toute la plage. Limite sur [5°, 30°] : la dérivée dλ/dθb varie fortement, le modèle linéaire est moins précis aux basses températures. Kcc = coefficient directeur a.</p>
<h3>CCINP TSI SI 2025 — substrats</h3>
<p>Classification (sortie qualitative A/B). Matrice de confusion : A est plus sensible (81,4 %) et plus précis (52,1 %) que B (5,1 % / 17,7 %). L'algorithme identifie bien A mais confond B avec A.</p>
<div class="retain"><b>À retenir.</b> Les concours testent la capacité à identifier le type d'IA (régression/classification, supervisé, algorithme), à lire du code Scikit-Learn, à calculer les indicateurs et à critiquer un choix de modèle.</div>
` });

/* ============ UI ============ */
const UI = { cur: 'types' };
const AS = { key: 'types', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'intro' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', {
    type: 'button', role: 'tab',
    'aria-pressed': w.id === UI.cur ? 'true' : 'false',
    'aria-selected': w.id === UI.cur ? 'true' : 'false',
    onclick: () => gotoWs(w.id)
  }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab;
  const keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'QCM (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time));
    body.append(h('div', { class: 'goal', html: '<b>Objectif.</b> ' + a.goal }));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) {
        b.textContent = 'Confirmer ? Votre travail sera effacé';
        AS.arm = setTimeout(() => { b.textContent = 'Recommencer l\'atelier'; AS.arm = null; }, 3500);
        return;
      }
      clearTimeout(AS.arm); AS.arm = null;
      wsById(UI.cur).reset(); mountWs(); renderAct();
    } }, 'Recommencer l\'atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a;
        const bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: (show && s.shown ? j === q.a : s.a[i] === j), disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) {
        const miss = s.a[i] == null && !s.shown;
        fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w }));
      }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', {
    type: 'button', class: s.id === cur.id ? 'on' : '',
    'aria-current': s.id === cur.id ? 'true' : 'false',
    onclick: () => go(s.id)
  }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : intelligence artificielle'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l\'atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title },
    h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')),
    h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p><b>Onze ateliers interactifs</b> couvrant le programme officiel de SII CPGE :</p>' +
    '<ul><li>1. Types d\'apprentissage</li>' +
    '<li>2. Représentation des données</li>' +
    '<li>3. Évaluation (binaire + <b>multi-classes CCINP TSI 2025</b>)</li>' +
    '<li>4. k plus proches voisins</li>' +
    '<li>5. Régression linéaire monovariable</li>' +
    '<li>6. Régression linéaire multiple</li>' +
    '<li>7. Perceptron interactif</li>' +
    '<li>8. Réseau multicouche (XOR)</li>' +
    '<li>9. Démarche de résolution</li>' +
    '<li>10. <b>Exemples de concours</b> (CCINP SI PSI 2025, CCINP TSI SI 2025)</li>' +
    '<li>11. <b>Rétro-propagation</b> (exercices corrigés)</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (UI.cur === 'knn') drawKNN();
    else if (UI.cur === 'reg') { drawReg(); drawReg3D(); drawReg2D(); drawRegMultiAlpha(); }
    else if (UI.cur === 'regmulti') drawRM3D();
    else if (UI.cur === 'perc') drawPerc();
    else if (UI.cur === 'mlp') { drawMLP(); drawActs(); }
  }, 120);
});

(function init() {
  AS.open = !isSmall();
  renderSeg();
  mountWs();
  renderAct();
  renderCourse();
})();
</script>
</body>
