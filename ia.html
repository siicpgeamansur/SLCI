<style>
*{box-sizing:border-box}
[hidden]{display:none!important}

.cm th,.cm td{border:1px solid var(--line);padding:8px 14px;text-align:center}

.task-row:last-child{border-bottom:0}
.task-row .chips{margin:0}
.fb{font-size:12.5px;color:var(--muted);margin-top:2px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .task-row{grid-template-columns:1fr}
  canvas.viz{height:280px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-ia-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const WORKSHOPS = [];

/* ===================================================================
   DONNÉES PARTAGÉES
   =================================================================== */
const TASKS = [
  { t: "Détecter une transaction bancaire frauduleuse", ans: "sup", sub: "classification",
    why: "On dispose d'exemples étiquetés « fraude / non fraude » : tâche de classification." },
  { t: "Prédire le prix de vente d'un appartement", ans: "sup", sub: "régression",
    why: "On connaît les prix passés (y) et les caractéristiques (X) : on prédit une valeur continue." },
  { t: "Segmenter une clientèle en groupes homogènes", ans: "non", sub: "clustering",
    why: "Aucune étiquette : la machine regroupe elle-même des clients similaires (marketing)." },
  { t: "Recommander un film à un utilisateur", ans: "non", sub: "filtrage collaboratif",
    why: "Le modèle s'appuie sur les comportements implicites d'utilisateurs similaires (Netflix)." },
  { t: "Faire atterrir un drone autonome sur sa cible", ans: "renf", sub: "renforcement",
    why: "L'agent apprend par essais-erreurs, récompensé quand il atteint son objectif." },
  { t: "Classer automatiquement des emails en spam / non spam", ans: "sup", sub: "classification",
    why: "On dispose d'emails étiquetés : classification binaire supervisée." },
  { t: "Prédire la probabilité qu'une machine tombe en panne", ans: "sup", sub: "régression",
    why: "On prédit un pourcentage (valeur continue) à partir d'historiques étiquetés." }
];
const ANS_LABEL = { sup: 'Supervisé', non: 'Non supervisé', renf: 'Renforcement' };
const SUB_LABEL = { classification: 'classification', régression: 'régression', clustering: 'clustering', 'filtrage collaboratif': 'filtrage collaboratif', renforcement: 'renforcement' };

const DATA_COLS = [
  { name: 'Surface (m²)', vals: [124, 339, 179, 186, 180, 82, 125], ans: 'qc' },
  { name: 'Chambres', vals: [3, 5, 3, 3, 3, 2, 2], ans: 'qd' },
  { name: 'Qualité', vals: [3, 5, 4, 5, 5, 2, 4], ans: 'ql' },
  { name: 'Prix (€)', vals: [313000, 238400, 342000, 420000, 550000, 490000, 335000], ans: 'qc', target: true }
];
const TYPE_LABEL = { qc: 'Quantitative continue', qd: 'Quantitative discrète', ql: 'Qualitative' };

const KNN = {
  pts: [
    { x: 0.12, y: 0.82, c: 'A' }, { x: 0.20, y: 0.75, c: 'A' }, { x: 0.15, y: 0.68, c: 'A' },
    { x: 0.28, y: 0.88, c: 'A' }, { x: 0.25, y: 0.62, c: 'A' }, { x: 0.32, y: 0.78, c: 'A' },
    { x: 0.10, y: 0.72, c: 'A' }, { x: 0.22, y: 0.85, c: 'A' }, { x: 0.40, y: 0.65, c: 'A' },
    { x: 0.72, y: 0.22, c: 'B' }, { x: 0.80, y: 0.30, c: 'B' }, { x: 0.68, y: 0.18, c: 'B' },
    { x: 0.85, y: 0.35, c: 'B' }, { x: 0.75, y: 0.15, c: 'B' }, { x: 0.90, y: 0.28, c: 'B' },

  ],

};
const REG = {
  pts: [
    { x: 1, y: 2.1 }, { x: 2, y: 3.5 }, { x: 3, y: 4.2 }, { x: 4, y: 5.8 },

};
const CM = { tn: 50, fp: 5, fn: 10, tp: 35, ctx: 'fraude' };
const GT = { assign: { '0': null, '1': null, '2': null, '3': null, '4': null, '5': null, '6': null }, checked: false };
const DT = { choices: ['qc', 'qd', 'ql', 'qc'], checked: false };

/* ===================================================================
   ATELIER 1 : TYPES D'APPRENTISSAGE
   =================================================================== */
function mountTypes(root) {
  root.innerHTML = '<h2>1. Types d\'apprentissage</h2>'
    + '<p>Le <b>machine learning</b> apprend seul à partir d\'un jeu de données. On distingue trois grandes familles : <b>supervisé</b> (les réponses attendues sont connues), <b>non supervisé</b> (aucune étiquette) et <b>par renforcement</b> (l\'agent apprend par essais-erreurs en maximisant une récompense).</p>'
    + '<p>Attribuez à chaque tâche le type d\'apprentissage qui lui correspond, puis cliquez sur <b>Vérifier</b>.</p>'
    + '<div id="gt-rows" class="dwrap" style="border:0"></div>'
    + '<div class="files" style="margin-top:8px"><button class="btn pri" id="gt-check" type="button">Vérifier</button><button class="btn" id="gt-reset" type="button">Recommencer</button></div>'
    + '<div class="verdict" id="gt-msg" aria-live="polite"></div>';
  renderGT();
  $('#gt-check').addEventListener('click', () => { GT.checked = true; renderGT(); });
  $('#gt-reset').addEventListener('click', () => { for (const k in GT.assign) GT.assign[k] = null; GT.checked = false; renderGT(); });
}
function renderGT() {
  const box = $('#gt-rows'); if (!box) return;
  box.innerHTML = '';
  TASKS.forEach((task, i) => {
    const fb = h('div', { class: 'fb' });
    if (GT.checked) {
      const ok = GT.assign[i] === task.ans;
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      fb.innerHTML = (ok ? '✓ ' : '✗ Bonne réponse : <b>' + ANS_LABEL[task.ans] + '</b> (' + task.sub + '). ') + task.why;
    }
    const chips = h('div', { class: 'chips' });
    ['sup', 'non', 'renf'].forEach(c => {
      chips.append(h('button', {

function mountKNN(root) {
  root.innerHTML = '<h2>4. Méthode des k plus proches voisins</h2>'
    + '<p>Le k-NN est un algorithme <b>supervisé</b> et <b>non paramétrique</b> : pour classer un nouvel élément, on regarde ses <b>k</b> voisins les plus proches dans l\'échantillon d\'entraînement et on lui attribue la classe majoritaire.</p>'
    + '<p>Cliquez sur le graphique pour placer le point à classer. Ajustez <b>k</b> avec le curseur.</p>'
    + '<div class="opts"><label class="fld"><span>k = <b id="knn-k-out">3</b></span><input type="range" id="knn-k" min="1" max="9" step="2" value="3"></label></div>'
    + '<canvas class="viz" id="knn-canvas"></canvas>'
    + '<div class="leg" style="margin-top:8px"><span><span class="chip" style="background:rgba(192,40,31,.2);border-color:#c0281f;cursor:default">●</span> Classe A (étoiles rouges)</span><span><span class="chip" style="background:rgba(30,122,46,.2);border-color:#1e7a2e;cursor:default">▲</span> Classe B (triangles verts)</span><span><span class="chip" style="background:#f4c430;border-color:#9a5b00;cursor:default">?</span> Point à classer</span></div>'
    + '<div class="verdict" id="knn-msg" aria-live="polite"></div>';
  const canvas = $('#knn-canvas');
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const pad = 20;
    const x = (e.clientX - r.left - pad) / (r.width - 2 * pad);
    const y = 1 - (e.clientY - r.top - pad) / (r.height - 2 * pad);
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    KNN.q = { x, y };
    drawKNN();
  });
  $('#knn-k').addEventListener('input', e => {
    KNN.k = +e.target.value;
    $('#knn-k-out').textContent = KNN.k;
    drawKNN();
  });
  $('#knn-k').value = KNN.k;
  $('#knn-k-out').textContent = KNN.k;
  drawKNN();
}
function drawKNN() {
  const canvas = $('#knn-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const pad = 20;
  const px = x => pad + x * (W - 2 * pad);
  const py = y => H - pad - y * (H - 2 * pad);

  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath(); ctx.moveTo(pad + i / 10 * (W - 2 * pad), pad); ctx.lineTo(pad + i / 10 * (W - 2 * pad), H - pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, pad + i / 10 * (H - 2 * pad)); ctx.lineTo(W - pad, pad + i / 10 * (H - 2 * pad)); ctx.stroke();
  }
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, H - pad); ctx.lineTo(pad, pad); ctx.stroke();

  // calcul des distances en pixels (ce qu'on voit)
  const qx = px(KNN.q.x), qy = py(KNN.q.y);
  const ds = KNN.pts.map(p => ({ p, d: Math.hypot(px(p.x) - qx, py(p.y) - qy) }));
  ds.sort((A, B) => A.d - B.d);
  const neigh = ds.slice(0, KNN.k);

  // cercle des k plus proches
  if (neigh.length) {
    const r = neigh[neigh.length - 1].d;
    ctx.beginPath();
    ctx.arc(qx, qy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#2e6da4'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(46,109,164,.06)'; ctx.fill();
  }

  // points d'entraînement
  KNN.pts.forEach(p => {
    const x = px(p.x), y = py(p.y);
    const isNeighbor = neigh.some(n => n.p === p);
    if (p.c === 'A') {
      // étoile simplifiée : cercle rouge
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fillStyle = isNeighbor ? '#c0281f' : 'rgba(192,40,31,.55)';
      ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      // triangle vert
      ctx.beginPath();
      ctx.moveTo(x, y - 7); ctx.lineTo(x + 6.5, y + 5); ctx.lineTo(x - 6.5, y + 5); ctx.closePath();
      ctx.fillStyle = isNeighbor ? '#1e7a2e' : 'rgba(30,122,46,.55)';
      ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });

  // point à classer
  ctx.fillStyle = '#f4c430';
  ctx.strokeStyle = '#9a5b00'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(qx, qy, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.font = 'bold 13px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', qx, qy + 1);

  // décision
  const aCount = neigh.filter(n => n.p.c === 'A').length;
  const bCount = neigh.length - aCount;
  let pred;
  if (aCount > bCount) pred = 'A';
  else if (bCount > aCount) pred = 'B';
  else pred = neigh[0].p.c;
  const msg = $('#knn-msg');
  if (msg) {
    msg.className = 'verdict';
    msg.innerHTML = 'Parmi les <b>k = ' + KNN.k + '</b> plus proches voisins : <b>' + aCount + '</b> de classe A, <b>' + bCount + '</b> de classe B → classe prédite : <b>' +
      (pred === 'A' ? 'A (rouge)' : 'B (vert)') + '</b>' + (aCount === bCount ? ' (égalité : on prend la classe du plus proche)' : '') + '.';
  }
}
WORKSHOPS.push({ id: 'knn', title: 'k plus proches voisins', hint: 'Placer un point et observer la décision majoritaire des k voisins.', mount: mountKNN, reset: () => { KNN.q = { x: 0.45, y: 0.60 }; KNN.k = 3; } });

function mountReg(root) {
  root.innerHTML = '<h2>5. Régression linéaire univariée</h2>'
    + '<p>On cherche la droite <b>f(x) = a·x + b</b> qui ajuste au mieux un nuage de points. La qualité de l\'ajustement est mesurée par l\'<b>erreur quadratique moyenne</b> :</p>'
    + '<div class="formula">J(a, b) = (1 / 2n) · Σ (b + a·x<sub>i</sub> − y<sub>i</sub>)²</div>'
    + '<p>Réglez <b>a</b> et <b>b</b> manuellement, puis lancez la <b>descente de gradient</b> : à chaque pas, a et b sont mis à jour en sens inverse du gradient de J.</p>'
    + '<div class="opts">'
    + '<label class="fld"><span>pente a = <b id="reg-a-out">0.50</b></span><input type="range" id="reg-a" min="-1" max="3" step="0.05" value="0.5"></label>'
    + '<label class="fld"><span>ordonnée b = <b id="reg-b-out">3.50</b></span><input type="range" id="reg-b" min="-2" max="12" step="0.1" value="3.5"></label>'
    + '<label class="fld"><span>pas α = <b id="reg-alpha-out">0.040</b></span><input type="range" id="reg-alpha" min="0.001" max="0.06" step="0.001" value="0.04"></label>'
    + '</div>'
    + '<canvas class="viz" id="reg-canvas"></canvas>'
    + '<div class="gstats" id="reg-stats"></div>'
    + '<div class="files" style="margin-top:6px">'
    + '<button class="btn" id="reg-step1" type="button">1 pas</button>'
    + '<button class="btn" id="reg-step50" type="button">50 pas</button>'
    + '<button class="btn pri" id="reg-step200" type="button">200 pas</button>'
    + '<button class="btn" id="reg-reset" type="button">Réinitialiser</button>'
    + '</div>'
    + '<div class="verdict" id="reg-msg" aria-live="polite"></div>';
  $('#reg-a').addEventListener('input', e => { REG.a = +e.target.value; regUpdate(); });
  $('#reg-b').addEventListener('input', e => { REG.b = +e.target.value; regUpdate(); });
  $('#reg-alpha').addEventListener('input', e => { REG.alpha = +e.target.value; regUpdate(); });
  $('#reg-step1').addEventListener('click', () => regStep(1));
  $('#reg-step50').addEventListener('click', () => regStep(50));
  $('#reg-step200').addEventListener('click', () => regStep(200));
  $('#reg-reset').addEventListener('click', () => { REG.a = 0.5; REG.b = 3.5; regUpdate(); });
  regUpdate();
}
function regUpdate() {
  const aEl = $('#reg-a'), bEl = $('#reg-b'), alEl = $('#reg-alpha');
  if (!aEl) return;
  aEl.value = REG.a; bEl.value = REG.b; alEl.value = REG.alpha;
  $('#reg-a-out').textContent = REG.a.toFixed(2);
  $('#reg-b-out').textContent = REG.b.toFixed(2);
  $('#reg-alpha-out').textContent = REG.alpha.toFixed(3);
  const n = REG.pts.length;
  let mse = 0;
  REG.pts.forEach(p => { const e = REG.a * p.x + REG.b - p.y; mse += e * e; });
  mse /= n;
  $('#reg-stats').innerHTML = '';
  $('#reg-stats').append(
    h('div', { class: 'stat' }, h('span', null, 'pente a'), h('b', null, REG.a.toFixed(3))),
    h('div', { class: 'stat' }, h('span', null, 'biais b'), h('b', null, REG.b.toFixed(3))),
    h('div', { class: 'stat' }, h('span', null, 'MSE'), h('b', null, mse.toFixed(3)))
  );
  drawReg();
}
function regStep(steps) {
  const n = REG.pts.length;
  for (let s = 0; s < steps; s++) {
    let ga = 0, gb = 0;
    REG.pts.forEach(p => { const e = REG.a * p.x + REG.b - p.y; ga += e * p.x; gb += e; });
    ga /= n; gb /= n;
    REG.a -= REG.alpha * ga;
    REG.b -= REG.alpha * gb;
    if (!isFinite(REG.a) || !isFinite(REG.b) || Math.abs(REG.a) > 1000 || Math.abs(REG.b) > 1000) {
      const m = $('#reg-msg'); if (m) { m.className = 'verdict no'; m.textContent = 'Divergence : α est trop grand. Réduisez le pas d\'apprentissage.'; }
      return;
    }
  }
  // clamp pour rester dans les bornes des sliders
  REG.a = Math.max(-1, Math.min(3, REG.a));
  REG.b = Math.max(-2, Math.min(12, REG.b));
  regUpdate();
  const m = $('#reg-msg');
  if (m) {
    const n2 = REG.pts.length;
    let mse = 0;
    REG.pts.forEach(p => { const e = REG.a * p.x + REG.b - p.y; mse += e * e; });
    mse /= n2;
    m.className = 'verdict' + (mse < 0.5 ? ' yes' : '');
    m.textContent = steps + ' pas effectué(s). MSE = ' + mse.toFixed(3) + (mse < 0.5 ? '. Convergence atteinte.' : '. Continuez : la descente approche du minimum.');
  }
}
function drawReg() {
  const canvas = $('#reg-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const pad = 36;
  const xmin = 0, xmax = 10, ymin = 0, ymax = 12;
  const px = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);
  const py = y => H - pad - (y - ymin) / (ymax - ymin) * (H - 2 * pad);

  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) { const x = px(i); ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, H - pad); ctx.stroke(); }
  for (let j = 1; j < 12; j++) { const y = py(j); ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }

  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad, py(0)); ctx.lineTo(W - pad, py(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px(0), pad); ctx.lineTo(px(0), H - pad); ctx.stroke();

  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  for (let i = 1; i <= 9; i++) ctx.fillText(String(i), px(i), H - pad + 15);
  ctx.textAlign = 'right';
  for (let j = 2; j <= 10; j += 2) ctx.fillText(String(j), pad - 5, py(j) + 4);

  // points
  REG.pts.forEach(p => {
    ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 5, 0, Math.PI * 2);
    ctx.fillStyle = '#2e6da4'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });

  // droite
  const x0 = xmin, x1 = xmax;
  const y0 = REG.a * x0 + REG.b, y1 = REG.a * x1 + REG.b;
  ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 2.2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(px(x0), py(y0)); ctx.lineTo(px(x1), py(y1)); ctx.stroke();

  // équation
  ctx.fillStyle = '#c0281f'; ctx.textAlign = 'left'; ctx.font = 'bold 13px "IBM Plex Mono", monospace';
  ctx.fillText('f(x) = ' + REG.a.toFixed(2) + '·x + ' + REG.b.toFixed(2), pad + 6, pad + 14);
}

<p>Dans un monde où les données numériques jouent un rôle de premier plan, les technologies d'<b>intelligence artificielle</b> déterminent notre capacité à organiser, interpréter et exploiter les données. L'IA désigne l'ensemble des techniques permettant de « simuler l'intelligence humaine » : traitement du langage, des images, robotique, santé, transport, sécurité…</p>
<h3>Un essor lié aux données</h3>
<p>L'essor actuel de l'IA est lié à l'<b>explosion des données</b> accessibles et des capacités de traitement à partir des années 2000. Mais l'IA au sens moderne remonte aux travaux de <b>Turing</b> dans les années 1950 sur la formalisation du calcul.</p>

<p>Le schéma général du <b>machine learning</b> distingue :</p>

` });
COURSE.push({ id: 'apprentissage', t: 'Apprentissage supervisé et non supervisé', h: `
<p>Le <b>machine learning</b> est un modèle d'IA qui apprend seul à partir d'un jeu de données. Son intérêt : exploiter des volumes de données inenvisageables jusqu'alors (images médicales, segmentation client, prédiction de panne…).</p>
<h3>Apprentissage supervisé</h3>
<p>La machine connaît déjà les <b>réponses attendues</b> : elle travaille sur des <b>données étiquetées</b>. On distingue deux types de tâches :</p>
<ul>
<li><b>Classification</b> : attribuer une classe à un objet (fraude / non fraude, panne / pas de panne…).</li>
<li><b>Régression</b> : prédire une valeur numérique (un prix, une probabilité…).</li>
</ul>
<h3>Apprentissage non supervisé</h3>
<p>Les réponses ne sont pas disponibles dans le jeu de données : l'algorithme travaille sur des <b>données non étiquetées</b> et crée ses propres regroupements.</p>
<ul>
<li><b>Clustering</b> : grouper des objets en classes homogènes (segmentation marketing…).</li>
<li><b>Filtrage collaboratif</b> : recommander des contenus à partir des comportements d'utilisateurs similaires (Netflix, Spotify…).</li>
</ul>
<h3>Apprentissage par renforcement</h3>
<p>Un <b>agent autonome</b> réalise des actions dans un environnement. S'il atteint l'objectif fixé par le développeur, il reçoit une <b>récompense</b>. Il élabore lui-même une stratégie par essais-erreurs. Exemple : un drone qui apprend à livrer un colis en un temps limité.</p>
<h3>Biais et surapprentissage</h3>
<p>Un jeu d'entraînement <b>biaisé</b> conduit à des décisions biaisées : le logiciel de recrutement d'Amazon défavorisait les femmes parce que les données historiques l'étaient. Un modèle en <b>surapprentissage</b> (overfitting) apprend un modèle trop ajusté à l'échantillon et classifie mal les nouvelles données.</p>
<div class="retain"><b>À retenir.</b> Supervisé = étiquettes ; non supervisé = regroupements ; renforcement = essais-erreurs récompensés.</div>
` });
COURSE.push({ id: 'donnees', t: 'Représentation des données', h: `
<h3>Types de données</h3>
<p><b>Données quantitatives</b> — elles représentent une mesure :</p>
<ul>

COURSE.push({ id: 'etapes', t: 'Étapes d\'un algorithme', h: `
<p>Tous les algorithmes d'apprentissage automatique fonctionnent en plusieurs temps :</p>
<ol>
<li><b>Collecte et mise en forme</b> des données (nettoyage, codage, normalisation).</li>
<li><b>Séparation</b> en deux jeux : un jeu d'<b>entraînement</b> (≈ 80 %) et un jeu de <b>test</b> (≈ 20 %). Dans le cas supervisé, on dispose de la sortie attendue pour les deux.</li>
<li><b>Phase d'apprentissage</b> : la machine apprend un modèle prédictif sur le jeu d'entraînement.</li>
<li><b>Phase d'évaluation</b> : on mesure la performance du modèle sur le jeu de test.</li>
<li><b>Phase d'inférence</b> (ou déploiement) : le modèle entraîné est utilisé pour prédire sur de nouvelles données.</li>
</ol>
<div class="retain"><b>À retenir.</b> Le jeu de test ne doit <b>jamais</b> être utilisé pendant l'apprentissage : c'est ce qui garantit une évaluation honnête.</div>
` });

<p>La diagonale correspond aux bonnes prédictions, le hors-diagonale aux erreurs.</p>
<h3>Indicateurs</h3>
<table class="ctable"><thead><tr><th>Indicateur</th><th>Formule</th><th>Interprétation</th></tr></thead><tbody>
<tr><td>Sensibilité (rappel)</td><td>TP / (TP + FN)</td><td>Proportion de positifs correctement détectés</td></tr>
<tr><td>Spécificité</td><td>TN / (TN + FP)</td><td>Proportion de négatifs correctement détectés</td></tr>
<tr><td>Précision (accuracy)</td><td>(TP + TN) / total</td><td>Proportion de prédictions correctes</td></tr>
</tbody></table>
<h3>Comment choisir ?</h3>
<ul>
<li><b>Banque / fraude</b> : on veut FN = 0 → privilégier la <b>sensibilité</b>.</li>
<li><b>Filtre anti-spam</b> : on veut FP = 0 → privilégier la <b>spécificité</b>.</li>
</ul>
<h3>Régression : le RMSE</h3>
<p>Pour un modèle de régression, compter les erreurs n'a pas de sens. On utilise la racine de l'erreur quadratique moyenne :</p>
<div class="formula">RMSE = √( (1/n) · Σ<sub>i</sub> (y<sub>i</sub> − f(x<sub>i</sub>))² )</div>
<div class="retain"><b>À retenir.</b> Le bon indicateur dépend de ce qui coûte le plus cher : laisser passer un positif (FN) ou déclencher une fausse alerte (FP).</div>
` });
COURSE.push({ id: 'knn', t: 'Méthode des k plus proches voisins', h: `
<p>La méthode des <b>k plus proches voisins</b> (k-NN) est un algorithme <b>supervisé</b> qui classifie (ou prédit une valeur) en fonction de la classe majoritaire (ou de la moyenne) de ses k voisins les plus proches.</p>
<h3>Principe</h3>
<ol>
<li>On considère une population dont on connaît la classe et les caractéristiques.</li>
<li>On introduit un nouvel élément dont on ne connaît que les caractéristiques.</li>
<li>Ayant choisi une distance, on identifie les k voisins les plus proches.</li>
<li>On attribue la classe majoritaire parmi ces voisins.</li>
</ol>
<p>Le k-NN est <b>non paramétrique</b> : il ne construit pas de modèle statistique, il garde en mémoire l'échantillon d'entraînement (memory-based).</p>
<h3>Choix de k</h3>
<ul>
<li>Règle d'usage : <b>k &lt; √n</b> où n est le nombre de données étiquetées.</li>
<li>On peut aussi tracer la courbe du taux d'erreur en fonction de k (sur le jeu de test) et choisir le k qui le minimise.</li>
</ul>
<h3>Distances</h3>
<p>Pour deux points M et N de coordonnées (x<sub>1M</sub>, x<sub>2M</sub>) et (x<sub>1N</sub>, x<sub>2N</sub>) :</p>
<div class="formula">d<sub>euclidienne</sub>(M, N) = √( (x<sub>2N</sub> − x<sub>2M</sub>)² + (x<sub>1N</sub> − x<sub>1M</sub>)² )</div>
<div class="formula">d<sub>Manhattan</sub>(M, N) = |x<sub>2N</sub> − x<sub>2M</sub>| + |x<sub>1N</sub> − x<sub>1M</sub>|</div>
<div class="formula">d<sub>Tchebychev</sub>(M, N) = max( |x<sub>2N</sub> − x<sub>2M</sub>|, |x<sub>1N</sub> − x<sub>1M</sub>| )</div>
<p>On choisit la distance selon les données : euclidienne pour des variables quantitatives de même type, Manhattan pour des types différents. Avant de calculer, il est souvent utile de <b>normaliser</b> les attributs.</p>
<h3>Implémentation avec Scikit-learn</h3>
<pre class="code">from sklearn.neighbors import KNeighborsClassifier
from sklearn.model_selection import train_test_split

model = KNeighborsClassifier(n_neighbors=5)
X_train, X_test, y_train, y_test = train_test_split(X, y)
model.fit(X_train, y_train)
model.score(X_test, y_test)

predictions = model.predict(X_new)</pre>
<div class="retain"><b>À retenir.</b> k-NN : simple, memory-based, lent à la prédiction (il faut parcourir toutes les données). Choisir k &lt; √n et une distance adaptée.</div>
` });
COURSE.push({ id: 'regression', t: 'Régression linéaire', h: `
<h3>Modèle univarié</h3>
<p>On cherche à prédire une valeur continue y à partir d'une variable x : c'est un problème de <b>régression</b>. Le modèle s'écrit :</p>
<div class="formula">f(x) = a·x + b</div>
<p>où <b>a</b> est le <b>poids</b> du modèle (il pondère les variations de x) et <b>b</b> le <b>biais</b> (il ne dépend pas des entrées).</p>
<h3>Fonction coût</h3>
<p>On mesure l'écart entre la prédiction et la valeur réelle par l'<b>erreur quadratique</b> :</p>
<div class="formula">J(a, b) = (1 / 2n) · Σ<sub>i</sub> ( b + a·x<sup>(i)</sup> − y<sup>(i)</sup> )²</div>
<p>Cette fonction est <b>convexe</b> : elle admet un unique minimum global. Trouver le meilleur couple (a, b) revient à minimiser J.</p>
<h3>Descente de gradient</h3>
<p>On met à jour les paramètres itérativement, dans la direction opposée au gradient :</p>
<div class="formula">a ← a − α · ∂J/∂a &nbsp;&nbsp;&nbsp; b ← b − α · ∂J/∂b</div>
<p>avec les dérivées partielles :</p>
<div class="formula">∂J/∂a = (1/n) · Σ x<sup>(i)</sup> · (b + a·x<sup>(i)</sup> − y<sup>(i)</sup>)</div>
<div class="formula">∂J/∂b = (1/n) · Σ (b + a·x<sup>(i)</sup> − y<sup>(i)</sup>)</div>
<h3>Rôle de l'hyperparamètre α</h3>
<ul>
<li><b>α trop petit</b> : la convergence est très lente.</li>
<li><b>α trop grand</b> : l'algorithme peut osciller voire diverger.</li>
<li>Un bon α est souvent de l'ordre de 0,001 (dans les cas réels) ; il est déterminé par essais.</li>
</ul>
<h3>Écriture matricielle (multivarié)</h3>
<p>Pour un problème à d variables, on pose X avec une colonne de 1 (pour le biais) et θ le vecteur des paramètres :</p>
<div class="formula">F = X·θ &nbsp;&nbsp; J(θ) = (1/2n)·Σ (X·θ − y)² &nbsp;&nbsp; ∂J/∂θ = (1/n)·X<sup>T</sup>·(X·θ − y)</div>
<div class="formula">θ ← θ − α · ∂J/∂θ</div>
<h3>Implémentation avec Scikit-learn</h3>
<pre class="code">from sklearn.linear_model import LinearRegression, SGDRegressor
from sklearn.model_selection import train_test_split

# méthode des moindres carrés
model = LinearRegression()
# ou méthode itérative (descente de gradient)
model = SGDRegressor(max_iter=10000, eta0=0.001)

X_train, X_test, y_train, y_test = train_test_split(X, y)
model.fit(X_train, y_train)
model.score(X_test, y_test)
predictions = model.predict(X_new)</pre>
<div class="retain"><b>À retenir.</b> Régression linéaire : modèle paramétrique (a, b), fonction coût convexe, minimisation par descente de gradient. α contrôle la vitesse et la stabilité.</div>
` });
COURSE.push({ id: 'reseau', t: 'Réseaux de neurones', h: `
<p>Les <b>réseaux de neurones</b> sont des modèles plus complexes que les autres : ils représentent des fonctions mathématiques à plusieurs millions de coefficients. Ils permettent la reconnaissance d'objets, l'analyse de sentiments, le traitement du langage naturel, la création artistique… au prix d'un dataset beaucoup plus grand, d'un temps d'apprentissage plus long et d'une plus grande puissance de calcul.</p>
<h3>Le perceptron</h3>
<p>Un neurone artificiel (perceptron) calcule en deux étapes :</p>
<ol>
<li>une <b>somme pondérée</b> des entrées : z<sub>j</sub> = Σ w<sub>ji</sub> · x<sub>i</sub> + w<sub>j0</sub> (calcul linéaire) ;</li>
<li>l'application d'une <b>fonction d'activation</b> non linéaire : y<sub>j</sub> = φ(z<sub>j</sub>).</li>
</ol>
<p>Le coefficient w<sub>j0</sub> est le <b>biais</b> du neurone.</p>
<h3>Fonctions d'activation courantes</h3>
<table class="ctable"><thead><tr><th>Nom</th><th>Formule</th><th>Propriété</th></tr></thead><tbody>
<tr><td>Sigmoïde</td><td>g(z) = 1 / (1 + e<sup>−z</sup>)</td><td>Retourne une valeur entre 0 et 1 (probabilité) ; classification binaire</td></tr>
<tr><td>Tangente hyperbolique</td><td>g(z) = (e<sup>z</sup> − e<sup>−z</sup>) / (e<sup>z</sup> + e<sup>−z</sup>)</td><td>Retourne une valeur entre −1 et 1</td></tr>
<tr><td>ReLU</td><td>g(z) = max(0, z)</td><td>La plus simple ; à utiliser en couches intermédiaires</td></tr>
</tbody></table>
<h3>Réseau à plusieurs neurones</h3>
<ul>
<li>Les neurones sont regroupés en <b>couches</b> : les neurones d'une même couche ne sont pas connectés entre eux.</li>
<li>Toutes les sorties d'une couche sont connectées aux entrées de la couche suivante.</li>
</ul>
<p>Pour chaque neurone, on calcule la somme pondérée des signaux arrivants, on ajoute le biais, puis on applique la fonction d'activation.</p>
<h3>Apprentissage par rétro-propagation</h3>
<p>On évalue l'erreur commise sur une propagation, on évalue l'impact de chaque poids sur cette erreur, puis on met à jour les poids un à un en partant de la fin. C'est la <b>rétro-propagation du gradient</b>, couplée à la descente de gradient.</p>
<h3>Choix du réseau</h3>
<p>Choisir le bon nombre de neurones et de couches demande de l'expérience. En général, <b>deux couches suffisent</b>, et dépasser 6 à 10 couches entraîne souvent du <b>surapprentissage</b>.</p>
<h3>Scikit-learn</h3>
<pre class="code">from sklearn.neural_network import MLPClassifier

NN = MLPClassifier(activation='logistic', solver='sgd', max_iter=10)
NN.fit(X_train, y_train)
NN.score(X_test, y_test)
predictions = NN.predict(X_new)</pre>
<div class="retain"><b>À retenir.</b> Réseau = couches de perceptrons, fonction d'activation non linéaire, apprentissage par rétro-propagation. Puissant mais coûteux en données et en calcul.</div>
` });

<dl class="gloss">
<dt>Intelligence artificielle</dt><dd>Ensemble des techniques permettant de simuler l'intelligence humaine.</dd>

<dt>Apprentissage non supervisé</dt><dd>Apprentissage à partir de données non étiquetées (la machine crée ses propres regroupements).</dd>
<dt>Apprentissage par renforcement</dt><dd>Un agent apprend par essais-erreurs en maximisant une récompense.</dd>
<dt>Classification</dt><dd>Prédire une classe (catégorie).</dd>
<dt>Régression</dt><dd>Prédire une valeur numérique continue.</dd>
<dt>Clustering</dt><dd>Regrouper des objets en classes homogènes sans étiquettes.</dd>
<dt>Biais</dt><dd>Paramètre qui ne dépend pas des entrées (b dans f(x) = a·x + b) ; ou biais d'un jeu de données.</dd>
<dt>Surapprentissage (overfitting)</dt><dd>Modèle trop ajusté à l'échantillon d'entraînement, qui classifie mal les nouvelles données.</dd>

<dt>Sensibilité (rappel)</dt><dd>TP / (TP + FN) : proportion de positifs correctement détectés.</dd>
<dt>Spécificité</dt><dd>TN / (TN + FP) : proportion de négatifs correctement détectés.</dd>
<dt>Précision (accuracy)</dt><dd>(TP + TN) / total : proportion de prédictions correctes.</dd>
<dt>RMSE</dt><dd>Racine de l'erreur quadratique moyenne, pour évaluer un modèle de régression.</dd>
<dt>Fonction coût</dt><dd>Mesure de l'erreur globale d'un modèle ; on cherche à la minimiser.</dd>
<dt>Descente de gradient</dt><dd>Algorithme itératif de minimisation de la fonction coût.</dd>
<dt>Hyperparamètre</dt><dd>Paramètre fixé avant l'apprentissage (α, k, nombre de couches…).</dd>
<dt>Perceptron</dt><dd>Neurone artificiel : somme pondérée des entrées + fonction d'activation.</dd>
<dt>Rétro-propagation</dt><dd>Algorithme de mise à jour des poids d'un réseau de neurones en remontant depuis la sortie.</dd>

</dl>

    if (UI.cur === 'knn') drawKNN();

});

  mountWs();

  renderCourse();
})();
