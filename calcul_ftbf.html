<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Schémas-blocs : FTBF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --canvas:#ffffff;--cable:#000000;--node-fill:#dfe7f0;--node-stroke:#33475b;--screen:#8ec1e6;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.run{background:var(--run);color:#fff;border-color:var(--run)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.del{color:var(--bad)}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"],.seg button.active{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#palette{flex:none;width:106px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:500;font-size:11.5px;min-width:90px;text-align:center;line-height:1.2}
.tool svg{width:34px;height:34px;overflow:visible;flex:none}
.tool:hover{border-color:var(--accent)}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sep{height:1px;background:var(--line);flex:none;margin:2px 0}
.ic-body{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1.6;stroke-linejoin:round}
.ic-screen{fill:var(--screen);stroke:var(--node-stroke);stroke-width:1.4}
.ic-acc{stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
#svg{display:block;width:1400px;height:900px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#zoombar{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:6;user-select:none}
#zoombar button{width:30px;height:30px;border:0;background:transparent;border-radius:5px;cursor:pointer;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
#zoombar button:hover{background:var(--panel2);color:var(--accent)}
#zoomLbl{display:flex;align-items:center;justify-content:center;padding:0 6px;font-size:12px;color:var(--muted);min-width:46px;font-variant-numeric:tabular-nums;cursor:pointer}
#zoomLbl:hover{color:var(--accent)}
.node{cursor:grab}
.mode-link .node{cursor:crosshair}
.blk{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:2;stroke-linejoin:round}
.blk.io{fill:var(--screen)}
.blk.src{stroke:var(--accent);stroke-width:4}
.nlabel{font:600 12.5px var(--font-ui);fill:var(--fg)}
.tlabel{font:500 10.5px var(--font-ui);fill:var(--muted)}
.bexpr{font:500 12px var(--font-mono);fill:var(--fg)}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
.marquee{fill:rgba(46,109,164,.10);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3;pointer-events:none}
.cab{stroke:var(--cable);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.cab-halo{fill:none;stroke:#ffffff;stroke-width:5.5;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.cab.on{stroke:var(--accent);stroke-width:3.6}
.arr{fill:var(--cable)}.arr.on{fill:var(--accent)}
.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.port{fill:#fff;stroke:var(--node-stroke);stroke-width:1.6;transition:stroke .1s,stroke-width .1s}
.mode-link .port{stroke:var(--accent);stroke-width:2.2;cursor:crosshair}
.mode-link .port:hover{stroke-width:3.4}
.ph{fill:transparent;stroke:none}
.sgn{font:700 15px var(--font-ui);fill:var(--fg)}
.dot{fill:var(--cable)}
#panel{flex:none;width:360px;max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0}
#panel.wide{width:clamp(400px,42vw,640px)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.bad{border-color:var(--bad)!important;background:rgba(192,40,31,.07)!important}
.grp{border:1px solid var(--line);border-radius:8px;padding:10px 10px 2px;margin-bottom:10px}
.grp>h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prm{display:grid;grid-template-columns:1.1fr 1fr;gap:6px;margin-bottom:8px}
.prm .pl{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.small{font-size:12.5px;color:var(--muted);margin:0 0 9px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:7px}
.hform{font:500 13px var(--font-mono);background:var(--panel2);border-radius:6px;padding:6px 9px;margin:0 0 10px;word-break:break-word}
.errbox{border:1px solid var(--bad);background:rgba(192,40,31,.08);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.errbox ul{margin:6px 0 0;padding-left:20px}
.warnbox{border:1px solid #d9a21b;background:rgba(224,160,40,.14);border-radius:8px;padding:6px 12px;margin:8px 0;font-size:13px}
.fbox{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 14px;margin:6px 0 10px;font:16px/2.1 var(--font-ui);overflow-x:auto;background:var(--panel)}
.fbox .lhs{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .25em;line-height:1.5}
.fr>span{white-space:nowrap;padding:0 .3em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding-bottom:.12em}
.fr>span:last-child{padding-top:.12em}
.fr .fr{font-size:.88em}
.seg2{display:flex;gap:14px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;overflow:hidden}
.card h4{margin:0;padding:5px 10px;font-size:12px;background:var(--panel2);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;padding:8px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--font-mono);font-size:12.5px;word-break:break-word}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font:600 12.5px var(--font-ui)}
.badge.stable{background:rgba(30,122,46,.15);color:var(--ok)}.badge.marginal{background:rgba(224,160,40,.2);color:var(--warn)}.badge.unstable{background:rgba(192,40,31,.14);color:var(--bad)}
details.mason{border:1px dashed var(--accent);border-radius:8px;padding:6px 10px;margin:0 0 10px}
details.mason summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
details.mason p,details.mason li{font-size:13px;margin:4px 0}
details.mason ul{padding-left:18px;margin:4px 0}
.mono-s{font-family:var(--font-mono);font-size:12.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(680px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
.dlgbox code{font-family:var(--font-mono);background:var(--panel2);padding:0 4px;border-radius:4px;font-size:12.5px}
.dlgbox table{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%}
.dlgbox td,.dlgbox th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.dlgbox th{background:var(--panel2)}
.exrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.exrow p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
@media (max-width:820px){
  .work{flex-direction:column;gap:8px}
  #palette{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;flex:none}
  .sep{width:1px;height:auto;margin:0 2px}
  .tool{min-width:78px}
  #panel,#panel.wide{position:fixed;left:0;right:0;bottom:0;width:auto;height:66%;max-height:none;border-radius:14px 14px 0 0;z-index:30;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
}
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;font-size:16px;overflow-x:auto;line-height:2}
.cwarn{border:1px solid #d9a21b;background:rgba(224,160,40,.14);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.cbody details{border:1px dashed var(--accent);border-radius:8px;padding:6px 10px;margin:8px 0 12px}
.cbody details summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
.cbody .ex{border:1px solid var(--line);border-radius:8px;padding:4px 14px 8px;margin:10px 0}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
@media (max-width:820px){.ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}}
@media (prefers-reduced-motion:no-preference){.tool,.btn{transition:border-color .12s,background .12s}}
</style></head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand"><svg width="28" height="26" viewBox="0 0 28 26" aria-hidden="true"><rect x="2" y="7" width="9" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="17" y="7" width="9" height="12" rx="2" fill="none" stroke="#2e6da4" stroke-width="1.6"/><path d="M11 13h6m-3-3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Atelier Schémas-blocs <small>FTBF</small></span></div>
    <div class="files">
      <button class="btn run" id="bCalc" type="button">Calculer la FTBF</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bEx" type="button">Exemples</button>
      <button class="btn" id="bClear" type="button">Effacer</button>
      <button class="btn" id="bPanel" type="button" aria-pressed="true">Panneau</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <main class="inner work" id="work">
    <nav id="palette" aria-label="Palette de blocs"></nav>
    <section id="stage">
      <div id="hint"></div>
      <div id="scroller"><svg id="svg" width="1400" height="900" viewBox="0 0 1400 900" preserveAspectRatio="xMinYMin meet" role="application" aria-label="Zone de travail du schéma-blocs"></svg></div>
      <div id="zoombar" role="toolbar" aria-label="Zoom et vue">
        <button type="button" id="bZoomOut" title="Zoom arrière (Ctrl −)">−</button>
        <span id="zoomLbl" aria-live="polite" title="Cliquer pour réinitialiser à 100 %">100 %</span>
        <button type="button" id="bZoomIn" title="Zoom avant (Ctrl +)">+</button>
        <button type="button" id="bZoomFit" title="Ajuster à la vue (Ctrl 0)">⛶</button>
      </div>
    </section>
    <aside id="panel" aria-label="Propriétés et résultat"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
window.addEventListener('error', function (ev) {
  try {
    var t = document.getElementById('toast');
    if (t) {
      t.textContent = '⚠ Erreur JavaScript : ' + (ev.message || 'inconnue');
      t.hidden = false;
      t.style.background = '#c0281f';
      t.style.color = '#fff';
    }
    if (window.console) console.error('Erreur JS :', ev.message, (ev.filename || '') + ':' + (ev.lineno || ''));
  } catch (_) {}
});
</script>

<script>
'use strict';
/*MATH-START*/
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '+': '' };
const sup = n => String(n).split('').map(c => SUP[c] != null ? SUP[c] : c).join('');
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function kparse(k) { const o = Object.create(null); if (k) for (const t of k.split('*')) { const i = t.lastIndexOf('^'); o[t.slice(0, i)] = +t.slice(i + 1); } return o; }
function kstr(o) { return Object.keys(o).filter(n => o[n] > 0).sort().map(n => n + '^' + o[n]).join('*'); }
function mulKey(a, b) { if (!a) return b; if (!b) return a; const o = kparse(a), q = kparse(b); for (const n in q) o[n] = (o[n] || 0) + q[n]; return kstr(o); }
const PLY = {
  c: n => n ? new Map([['', n]]) : new Map(),
  v: n => new Map([[n + '^1', 1]]),
  add(a, b) { const r = new Map(a); for (const [k, c] of b) { const n = (r.get(k) || 0) + c; if (n) r.set(k, n); else r.delete(k); } return r; },
  neg(a) { const r = new Map(); for (const [k, c] of a) r.set(k, -c); return r; },
  mul(a, b) { const r = new Map(); for (const [ka, ca] of a) for (const [kb, cb] of b) { const k = mulKey(ka, kb), n = (r.get(k) || 0) + ca * cb; if (n) r.set(k, n); else r.delete(k); } return r; }
};
const V = n => PLY.v(n), C = n => PLY.c(n), PP = PLY.v('p');
const A = (...x) => x.reduce((a, b) => PLY.add(a, b));
const M = (...x) => x.reduce((a, b) => PLY.mul(a, b));

function cancelCommon(Aa, Bb) {
  if (!Aa.size || !Bb.size) return { n: Aa, d: Bb };
  let g = null, ig = 0, intOk = true;
  for (const m of [Aa, Bb]) for (const [k, c] of m) {
    const o = kparse(k);
    if (g === null) g = o; else for (const n in g) g[n] = Math.min(g[n], o[n] || 0);
    if (Number.isInteger(c)) ig = gcd(ig, Math.abs(c)); else intOk = false;
  }
  if (!intOk || ig === 0) ig = 1;
  const div = m => { const r = new Map(); for (const [k, c] of m) { const o = kparse(k); for (const n in g) o[n] -= g[n]; r.set(kstr(o), c / ig); } return r; };
  let n = div(Aa), d = div(Bb);
  if (d.size === 1 && [...d.values()][0] < 0) { n = PLY.neg(n); d = PLY.neg(d); }
  return { n, d };
}
function toArr(P) {
  const arr = [];
  for (const [k, c] of P) { const o = kparse(k), e = o.p || 0; delete o.p; if (!arr[e]) arr[e] = new Map(); arr[e].set(kstr(o), c); }

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEY = 'atelier-ftbf-v1';
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }

const S = { blocks: [], links: [], nid: 1, nl: 1, sel: null, tool: 'sel', linkFrom: null, tab: 'props', panel: !isSmall(), calc: false, form: 'nc', vals: 'sym' };
const VIEW = { z: 1 };
let undoStack = [], redoStack = [];
let drag = null, mouse = null;
const pointers = new Map();
let pinch = null;

const blk = id => S.blocks.find(b => b.id === id);
function save() { lsSet(KEY, { blocks: S.blocks, links: S.links, nid: S.nid, nl: S.nl, form: S.form, vals: S.vals }); }

function historySnap() { return JSON.stringify({ blocks: S.blocks, links: S.links, nid: S.nid, nl: S.nl }); }
function pushUndo() {
  const s = historySnap();
  if (undoStack[undoStack.length - 1] === s) return;
  undoStack.push(s);
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
}
function doUndo() {
  if (!undoStack.length) return;
  redoStack.push(historySnap());
  const s = JSON.parse(undoStack.pop());
  S.blocks = s.blocks; S.links = s.links; S.nid = s.nid; S.nl = s.nl;
  S.sel = null; S.linkFrom = null;
  save(); draw(); renderPanel(); updHint();
  toast('Annulé');
}
function doRedo() {
  if (!redoStack.length) return;
  undoStack.push(historySnap());
  const s = JSON.parse(redoStack.pop());
  S.blocks = s.blocks; S.links = s.links; S.nid = s.nid; S.nl = s.nl;
  S.sel = null; S.linkFrom = null;
  save(); draw(); renderPanel(); updHint();
  toast('Rétabli');
}

/* ---------- géométrie ---------- */
const exprText = b => TYPES[b.type].expr ? TYPES[b.type].expr(b.p.map(q => q.sym)) : '';
function geo(b) {
  if (b.type === 'sum') return { w: 48, h: 48, ins: [{ x: 0, y: 24, side: 'l' }, { x: 24, y: 48, side: 'b' }], out: { x: 48, y: 24 } };
  if (b.type === 'in') return { w: 84, h: 44, ins: [], out: { x: 84, y: 22 } };
  if (b.type === 'out') return { w: 84, h: 44, ins: [{ x: 0, y: 22, side: 'l' }], out: null };
  const w = Math.max(124, Math.round(exprText(b).length * 7.3 + 26));
  return { w, h: 64, ins: [{ x: 0, y: 32, side: 'l' }], out: { x: w, y: 32 } };
}
function rotateSide(side, deg) {
  const order = ['r', 'b', 'l', 't'];
  const i = order.indexOf(side);
  if (i < 0) return side;
  const steps = ((Math.round((deg || 0) / 90) % 4) + 4) % 4;
  return order[(i + steps) % 4];
}
function sideDir(side) {
  return { r: { x: 1, y: 0 }, l: { x: -1, y: 0 }, t: { x: 0, y: -1 }, b: { x: 0, y: 1 } }[side] || { x: 1, y: 0 };
}
function portWorld(b, which) {
  const g = geo(b);
  let lx, ly, side;
  if (which === 'out') { if (!g.out) return null; lx = g.out.x; ly = g.out.y; side = 'r'; }
  else { const p = g.ins[which]; if (!p) return null; lx = p.x; ly = p.y; side = p.side; }
  const rot = (b.rot || 0) * Math.PI / 180;
  const cx = g.w / 2, cy = g.h / 2;
  const rx = (lx - cx) * Math.cos(rot) - (ly - cy) * Math.sin(rot) + cx;
  const ry = (lx - cx) * Math.sin(rot) + (ly - cy) * Math.cos(rot) + cy;
  return { x: b.x + rx, y: b.y + ry, side: rotateSide(side, b.rot || 0) };
}
function blockBBox(b) {
  const g = geo(b);
  if (!b.rot) return { x1: b.x, y1: b.y, x2: b.x + g.w, y2: b.y + g.h };
  const cx = b.x + g.w / 2, cy = b.y + g.h / 2;
  const rot = b.rot * Math.PI / 180, cos = Math.cos(rot), sin = Math.sin(rot);
  const corners = [[-g.w / 2, -g.h / 2], [g.w / 2, -g.h / 2], [g.w / 2, g.h / 2], [-g.w / 2, g.h / 2]];
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const [x, y] of corners) {
    const rx = x * cos - y * sin + cx, ry = x * sin + y * cos + cy;
    minx = Math.min(minx, rx); maxx = Math.max(maxx, rx);
    miny = Math.min(miny, ry); maxy = Math.max(maxy, ry);
  }
  return { x1: minx, y1: miny, x2: maxx, y2: maxy };
}

/* ---------- routage des liaisons ---------- */
let feedbackRanks = new Map();
function computeFeedbackRanks() {
  feedbackRanks = new Map();
  const fb = [];
  S.links.forEach(l => {
    const a = blk(l.from), b = blk(l.to);
    if (!a || !b) return;
    const pa = portWorld(a, 'out'), pb = portWorld(b, l.port);
    if (!pa || !pb) return;
    const dirA = sideDir(pa.side);
    if (pb.x < pa.x - 40 && dirA.x >= 0) {
      fb.push({ l, maxX: Math.max(pa.x, pb.x), minX: Math.min(pa.x, pb.x) });
    }
  });
  fb.sort((a, b) => b.maxX - a.maxX || a.minX - b.minX);
  fb.forEach((f, i) => feedbackRanks.set(f.l.id, i));
}
function route(p1, d1, p2, d2, rank) {
  rank = rank || 0;
  const stub = 22;
  const isFeedback = d1.x > 0 && p2.x < p1.x - 40;

  if (isFeedback) {
    const minX = Math.min(p1.x, p2.x);
    const maxX = Math.max(p1.x, p2.x);
    const routeBelow = (d2.y > 0) || (p2.y >= p1.y - 40);
    let detourY;
    if (routeBelow) {
      detourY = Math.max(p1.y, p2.y) + 50;
      S.blocks.forEach(b => {
        const bb = blockBBox(b);
        if (bb.x2 > minX - 40 && bb.x1 < maxX + 40) detourY = Math.max(detourY, bb.y2 + 30);
      });
      detourY = Math.min(detourY + rank * 16, 880);
    } else {
      detourY = Math.min(p1.y, p2.y) - 50;
      S.blocks.forEach(b => {
        const bb = blockBBox(b);
        if (bb.x2 > minX - 40 && bb.x1 < maxX + 40) detourY = Math.min(detourY, bb.y1 - 30);
      });
      detourY = Math.max(detourY - rank * 16, 20);
    }
    const pts = [p1, { x: p1.x + stub, y: p1.y }, { x: p1.x + stub, y: detourY }];
    if (d2.y !== 0) {
      pts.push({ x: p2.x, y: detourY });
    } else {
      const ax = p2.x + (d2.x < 0 ? -stub : stub);
      pts.push({ x: ax, y: detourY }, { x: ax, y: p2.y });
    }
    pts.push(p2);
    return pts.map(p => [p.x, p.y]);
  }

  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const st = Math.min(28, Math.max(14, dist / 4));
  const s1 = { x: p1.x + d1.x * st, y: p1.y + d1.y * st };
  const s2 = { x: p2.x + d2.x * st, y: p2.y + d2.y * st };
  const pts = [p1, s1];
  const h1 = d1.x !== 0, h2 = d2.x !== 0;
  if (h1 && h2) {
    if (Math.abs(s1.y - s2.y) < 1) pts.push(s2);
    else { const mx = (s1.x + s2.x) / 2; pts.push({ x: mx, y: s1.y }, { x: mx, y: s2.y }, s2); }
  } else if (!h1 && !h2) {
    if (Math.abs(s1.x - s2.x) < 1) pts.push(s2);
    else { const my = (s1.y + s2.y) / 2; pts.push({ x: s1.x, y: my }, { x: s2.x, y: my }, s2); }
  } else if (h1 && !h2) pts.push({ x: s2.x, y: s1.y }, s2);
  else pts.push({ x: s1.x, y: s2.y }, s2);
  pts.push(p2);
  return pts.map(p => [p.x, p.y]);
}
function linkPts(l) {
  const a = blk(l.from), b = blk(l.to);
  if (!a || !b) return null;
  const pa = portWorld(a, 'out'), pb = portWorld(b, l.port);
  if (!pa || !pb) return null;
  const rank = feedbackRanks.get(l.id) || 0;
  return route(pa, sideDir(pa.side), pb, sideDir(pb.side), rank);
}
function bText(b, attrs, ...kids) {
  const rot = b.rot || 0;
  if (rot) { const x = attrs.x, y = attrs.y; return sv('text', { ...attrs, transform: `rotate(${-rot},${x},${y})` }, ...kids); }
  return sv('text', attrs, ...kids);
}

/* ---------- dessin ---------- */
function draw() {
  computeFeedbackRanks();
  const svg = $('#svg'); svg.replaceChildren();
  svg.classList.toggle('mode-link', S.tool === 'link');
  svg.append(sv('defs', null, sv('pattern', { id: 'dots', width: 20, height: 20, patternUnits: 'userSpaceOnUse' }, sv('circle', { cx: 1, cy: 1, r: 1, fill: '#d5dae0' }))));
  svg.append(sv('rect', { width: 1400, height: 900, fill: 'url(#dots)' }));
  const fan = {};
  S.links.forEach(l => { fan[l.from] = (fan[l.from] || 0) + 1; });
  S.links.forEach(l => {
    const pts = linkPts(l); if (!pts) return;
    const on = S.sel && S.sel.t === 'l' && S.sel.id === l.id, ps = pts.map(p => p.join(',')).join(' ');
    const g = sv('g', { 'data-l': l.id });
    g.append(
      sv('polyline', { class: 'hit', points: ps }),
      sv('polyline', { class: 'cab-halo', points: ps }),
      sv('polyline', { class: 'cab' + (on ? ' on' : ''), points: ps })
    );
    const [x0, y0] = pts[pts.length - 2], [x1, y1] = pts[pts.length - 1];
    const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0), px = -dy, py = dx;
    g.append(sv('polygon', { class: 'arr' + (on ? ' on' : ''), points: `${x1},${y1} ${x1 - 12 * dx + 6 * px},${y1 - 12 * dy + 6 * py} ${x1 - 12 * dx - 6 * px},${y1 - 12 * dy - 6 * py}` }));
    if (fan[l.from] > 1) g.append(sv('circle', { class: 'dot', cx: pts[0][0], cy: pts[0][1], r: 4.5 }));
    svg.append(g);
  });
  S.blocks.forEach(b => {
    const g = geo(b), rot = b.rot || 0;
    const tf = rot ? `translate(${b.x},${b.y}) rotate(${rot},${g.w / 2},${g.h / 2})` : `translate(${b.x},${b.y})`;
    const n = sv('g', { class: 'node', 'data-b': b.id, transform: tf });
    const src = S.linkFrom === b.id;
    if (b.type === 'sum') {
      n.append(sv('circle', { class: 'blk' + (src ? ' src' : ''), cx: 24, cy: 24, r: 22 }));
      n.append(bText(b, { class: 'nlabel', x: 24, y: 29, 'text-anchor': 'middle', style: 'font-size:16px' }, 'Σ'));
      n.append(bText(b, { class: 'sgn', x: -12, y: 18 }, (b.signs[0] < 0 ? '−' : '+')));
      n.append(bText(b, { class: 'sgn', x: 31, y: 63 }, (b.signs[1] < 0 ? '−' : '+')));
      n.append(bText(b, { class: 'nlabel', x: 24, y: -6, 'text-anchor': 'middle' }, b.name));
    } else if (b.type === 'in' || b.type === 'out') {
      n.append(sv('rect', { class: 'blk io' + (src ? ' src' : ''), width: g.w, height: g.h, rx: 22 }));
      n.append(bText(b, { class: 'nlabel', x: g.w / 2, y: g.h / 2 + 5, 'text-anchor': 'middle', style: 'font-size:14px' }, b.type === 'in' ? 'E(p)' : 'S(p)'));
    } else {
      n.append(sv('rect', { class: 'blk' + (src ? ' src' : ''), width: g.w, height: g.h, rx: 8 }));
      n.append(bText(b, { class: 'tlabel', x: g.w / 2, y: 20, 'text-anchor': 'middle' }, TYPES[b.type].label));
      n.append(bText(b, { class: 'bexpr', x: g.w / 2, y: 45, 'text-anchor': 'middle' }, exprText(b)));
      n.append(bText(b, { class: 'nlabel', x: 0, y: -6 }, b.name));
    }
    g.ins.forEach((p, i) => {
      n.append(sv('circle', { class: 'port', cx: p.x, cy: p.y, r: 4 }));
      n.append(sv('circle', { class: 'ph', cx: p.x, cy: p.y, r: 11, 'data-port': i }));
    });
    if (g.out) n.append(sv('circle', { class: 'port', cx: g.out.x, cy: g.out.y, r: 4 }));
    if (S.sel && S.sel.t === 'b' && S.sel.ids.has(b.id)) n.append(sv('rect', { class: 'selbox', x: -6, y: -6, width: g.w + 12, height: g.h + 12, rx: 10 }));
    svg.append(n);
  });
  if (S.linkFrom) {
    const b = blk(S.linkFrom), g = b && geo(b);
    if (g && g.out) {
      const pw = portWorld(b, 'out');
      const m = mouse || { x: pw.x + 40, y: pw.y };
      svg.append(sv('line', { id: 'rb', x1: pw.x, y1: pw.y, x2: m.x, y2: m.y, stroke: 'var(--accent)', 'stroke-width': 2.4, 'stroke-dasharray': '6 4', 'pointer-events': 'none' }));
    }
  }
  if (drag && drag.type === 'marquee') {
    const x = Math.min(drag.startX, drag.curX), y = Math.min(drag.startY, drag.curY);
    const w = Math.abs(drag.curX - drag.startX), hh = Math.abs(drag.curY - drag.startY);
    if (w + hh > 2) svg.append(sv('rect', { class: 'marquee', x, y, width: w, height: hh }));
  }
}

function svgPt(e) {
  const svg = $('#svg'), r = svg.getBoundingClientRect();
  const sx = 1400 / r.width, sy = 900 / r.height;
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}
const snap = v => Math.round(v / 10) * 10;

function select(sel) {
  if (sel && sel.t === 'b' && !(sel.ids instanceof Set)) sel = { t: 'b', ids: new Set([sel.id]) };
  S.sel = sel;
  if (sel) S.tab = 'props';
  draw(); renderPanel();
}
function updHint() {
  let t;
  if (S.tool === 'link') t = S.linkFrom ? `Source : ${blk(S.linkFrom) ? blk(S.linkFrom).name : ''}. Cliquez maintenant le bloc destinataire (Échap pour annuler).` : 'Relier : cliquez d’abord le bloc source, puis le bloc destinataire.';
  else t = 'Glissez un bloc pour le déplacer. Cliquez-glissez dans le vide pour sélectionner plusieurs blocs (Maj pour ajouter). Sur mobile : glissez dans le vide pour déplacer la vue, pincez à 2 doigts pour zoomer. Ctrl+Z / Ctrl+Y : annuler / rétablir.';
  $('#hint').textContent = t;
}

function linkClick(b, portHit) {
  if (!S.linkFrom) {
    if (!geo(b).out) { toast('S(p) n’a pas de sortie à relier.'); return; }
    S.linkFrom = b.id; updHint(); draw(); return;
  }
  const src = blk(S.linkFrom);
  if (b.id === src.id) { S.linkFrom = null; updHint(); draw(); return; }
  const g = geo(b); if (!g.ins.length) { toast('E(p) ne reçoit aucun signal.'); return; }
  let port = portHit != null ? portHit : g.ins.findIndex((_, i) => !S.links.some(l => l.to === b.id && l.port === i));
  if (port < 0) port = 0;
  pushUndo();
  S.links = S.links.filter(l => !(l.to === b.id && l.port === port));
  S.links.push({ id: S.nl++, from: src.id, to: b.id, port });
  if (b.type === 'sum') toast(`${src.name} → ${b.name} : ${portName(b, port)}.`);
  S.linkFrom = null; save(); updHint(); draw(); renderPanel();
}

function setZoom(z, clientX, clientY) {
  z = Math.max(0.2, Math.min(3, z));
  const sc = $('#scroller'), svg = $('#svg');
  const scr = sc.getBoundingClientRect();
  const ax = clientX != null ? clientX : scr.left + sc.clientWidth / 2;
  const ay = clientY != null ? clientY : scr.top + sc.clientHeight / 2;
  const vx = ax - scr.left, vy = ay - scr.top;
  const wx = (sc.scrollLeft + vx) / VIEW.z;
  const wy = (sc.scrollTop + vy) / VIEW.z;
  VIEW.z = z;
  svg.style.width = (1400 * z) + 'px';
  svg.style.height = (900 * z) + 'px';
  sc.scrollLeft = wx * z - vx;
  sc.scrollTop = wy * z - vy;
  $('#zoomLbl').textContent = Math.round(z * 100) + ' %';
}
function fitView() {
  const sc = $('#scroller'), svg = $('#svg');
  if (!S.blocks.length) {
    VIEW.z = 1; svg.style.width = '1400px'; svg.style.height = '900px';
    sc.scrollLeft = 0; sc.scrollTop = 0;
    $('#zoomLbl').textContent = '100 %'; return;
  }
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  S.blocks.forEach(b => { const bb = blockBBox(b); minx = Math.min(minx, bb.x1); miny = Math.min(miny, bb.y1); maxx = Math.max(maxx, bb.x2); maxy = Math.max(maxy, bb.y2); });
  S.links.forEach(l => {
    const pts = linkPts(l); if (!pts) return;
    pts.forEach(([px, py]) => { minx = Math.min(minx, px); maxx = Math.max(maxx, px); miny = Math.min(miny, py); maxy = Math.max(maxy, py); });
  });
  const pad = 40;
  const w = maxx - minx + 2 * pad, hh = maxy - miny + 2 * pad;
  let z = Math.min(sc.clientWidth / w, sc.clientHeight / hh);
  z = Math.max(0.2, Math.min(2, z));
  VIEW.z = z;
  svg.style.width = (1400 * z) + 'px';
  svg.style.height = (900 * z) + 'px';
  sc.scrollLeft = (minx - pad) * z;
  sc.scrollTop = (miny - pad) * z;
  $('#zoomLbl').textContent = Math.round(z * 100) + ' %';
}
$('#bZoomIn').addEventListener('click', () => setZoom(VIEW.z * 1.2));
$('#bZoomOut').addEventListener('click', () => setZoom(VIEW.z / 1.2));
$('#bZoomFit').addEventListener('click', fitView);
$('#zoomLbl').addEventListener('click', () => setZoom(1));
$('#stage').addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(VIEW.z * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }
}, { passive: false });

function pinchStart() {
  if (pointers.size < 2) return;
  const [p1, p2] = [...pointers.values()];
  const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const sc = $('#scroller');
  const r = sc.getBoundingClientRect();
  pinch = { startDist: Math.max(dist, 1), startZoom: VIEW.z, contentX: (sc.scrollLeft + (midX - r.left)) / VIEW.z, contentY: (sc.scrollTop + (midY - r.top)) / VIEW.z };
}
function pinchMove() {
  if (!pinch || pointers.size < 2) return;
  const [p1, p2] = [...pointers.values()];
  const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const z = Math.max(0.2, Math.min(3, pinch.startZoom * dist / pinch.startDist));
  const sc = $('#scroller'), svg = $('#svg');
  const r = sc.getBoundingClientRect();
  VIEW.z = z;
  svg.style.width = (1400 * z) + 'px';
  svg.style.height = (900 * z) + 'px';
  sc.scrollLeft = pinch.contentX * z - (midX - r.left);
  sc.scrollTop = pinch.contentY * z - (midY - r.top);
  $('#zoomLbl').textContent = Math.round(z * 100) + ' %';
}

$('#svg').addEventListener('contextmenu', e => e.preventDefault());

$('#svg').addEventListener('pointerdown', e => {
  if (e.button === 1) {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const sc = $('#scroller'), sx = sc.scrollLeft, sy = sc.scrollTop;
    const onMove = ev => { sc.scrollLeft = sx - (ev.clientX - startX); sc.scrollTop = sy - (ev.clientY - startY); };
    const onUp = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
    return;
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
  if (pointers.size >= 2) { drag = null; pinchStart(); e.preventDefault(); return; }
  const t = e.target;
  const bl = t.closest('[data-b]'), lk = t.closest('[data-l]');
  if (S.tool === 'link') {
    if (bl) { const ph = t.getAttribute && t.getAttribute('data-port'); linkClick(blk(+bl.getAttribute('data-b')), ph != null ? +ph : null); e.preventDefault(); return; }
    if (S.linkFrom) { S.linkFrom = null; updHint(); draw(); e.preventDefault(); return; }
  }
  if (bl) {
    const b = blk(+bl.getAttribute('data-b'));
    const pt = svgPt(e);
    if (e.shiftKey) {
      const ids = new Set(S.sel && S.sel.t === 'b' ? S.sel.ids : []);
      if (ids.has(b.id)) ids.delete(b.id); else ids.add(b.id);
      select({ t: 'b', ids });
    } else {
      const ids = (S.sel && S.sel.t === 'b' && S.sel.ids.has(b.id)) ? S.sel.ids : new Set([b.id]);
      select({ t: 'b', ids });
      const startPositions = new Map();
      ids.forEach(id => { const bb = blk(id); if (bb) startPositions.set(id, { x: bb.x, y: bb.y }); });

const F = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const COURSE = [];
COURSE.push({ id: 'vocab', t: 'Vocabulaire des schémas-blocs', h: `
<p>Un système asservi se représente par un <b>schéma-blocs</b> : chaque bloc contient une fonction de transfert H(p) = ${F('S(p)', 'E(p)')}, et les flèches portent les signaux.</p>
<table class="ctable"><thead><tr><th>Élément</th><th>Rôle</th></tr></thead><tbody>
<tr><td>Bloc</td><td>Multiplie le signal entrant par sa fonction de transfert.</td></tr>
<tr><td>Comparateur (sommateur)</td><td>Additionne ou soustrait des signaux.</td></tr>
<tr><td>Chaîne directe</td><td>Chemin de E vers S. Sa fonction de transfert est notée G(p).</td></tr>
<tr><td>Chaîne de retour</td><td>Chemin qui ramène la sortie vers le comparateur. Notée H(p).</td></tr>
<tr><td>FTBO</td><td>Fonction de transfert en boucle ouverte. Pour une boucle simple, T<sub>BO</sub> = G·H.</td></tr>
<tr><td>FTBF</td><td>Fonction de transfert en boucle fermée : T(p) = ${F('S(p)', 'E(p)')}.</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> FTBO = produit des gains de la boucle ouverte. FTBF = rapport S/E avec la boucle fermée.</div>` });
COURSE.push({ id: 'algebre', t: 'Algèbre des blocs', h: `
<table class="ctable"><thead><tr><th>Association</th><th>Fonction de transfert équivalente</th></tr></thead><tbody>
<tr><td>Série</td><td>H₁·H₂</td></tr>
<tr><td>Parallèle</td><td>H₁ + H₂ (ou H₁ − H₂)</td></tr>
<tr><td>Boucle fermée</td><td>Formule de Black</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Série : on multiplie. Parallèle : on additionne. Boucle : on applique Black.</div>` });
COURSE.push({ id: 'black', t: 'La formule de Black', h: `
<p>Pour une boucle unique (chaîne directe G, chaîne de retour H) :</p>
<div class="formula">T(p) = ${F('G', '1 + G·H')}</div>
<div class="retain"><b>À retenir.</b> T = ${F('G', '1 + G·H')} (retour négatif), ${F('G', '1 − G·H')} (retour positif).</div>` });

<div class="formula">T(p) = ${F('Σ<sub>k</sub> P<sub>k</sub>·Δ<sub>k</sub>', 'Δ')}</div>
<div class="formula">Δ = 1 − ΣL<sub>i</sub> + ΣL<sub>i</sub>L<sub>j</sub> − …</div>
<div class="retain"><b>À retenir.</b> T = ${F('ΣP<sub>k</sub>Δ<sub>k</sub>', 'Δ')} avec Δ = 1 − ΣL + ΣLL − …</div>` });
COURSE.push({ id: 'lien', t: 'Black et Mason : le lien', h: `
<p>Black est le cas particulier de Mason avec un seul chemin et une seule boucle.</p>` });

<div class="formula">T(p) = ${F('K·(1 + b₁p + b₂p² + …)', 'p<sup>α</sup>·(1 + a₁p + a₂p² + …)')}</div>` });
COURSE.push({ id: 'atelier', t: 'Utiliser l’atelier', h: `
<h3>Souris</h3>
<ul>
<li>Glisser un bloc pour le déplacer ; glisser dans le vide pour un rectangle de sélection.</li>
<li>Maj + clic ajoute/retire un bloc de la sélection.</li>
<li>Ctrl + molette : zoom. Bouton du milieu + glisser : pan.</li>

<h3>Tactile</h3>
<ul>
<li>Glisser dans le vide à <b>1 doigt</b> : déplacer la vue.</li>

<h3>Liaisons de retour</h3>
