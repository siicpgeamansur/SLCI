<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Schémas-blocs : FTBF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --canvas:#ffffff;--cable:#000000;--node-fill:#dfe7f0;--node-stroke:#33475b;--screen:#8ec1e6;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.run{background:var(--run);color:#fff;border-color:var(--run)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.del{color:var(--bad)}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#palette{flex:none;width:106px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:500;font-size:11.5px;min-width:90px;text-align:center;line-height:1.2}
.tool svg{width:34px;height:34px;overflow:visible;flex:none}
.tool:hover{border-color:var(--accent)}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sep{height:1px;background:var(--line);flex:none;margin:2px 0}
.ic-body{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1.6;stroke-linejoin:round}
.ic-screen{fill:var(--screen);stroke:var(--node-stroke);stroke-width:1.4}
.ic-acc{stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
#svg{display:block;width:1400px;height:900px;touch-action:none;user-select:none;-webkit-user-select:none}
.node{cursor:grab}
.mode-link .node{cursor:crosshair}
.blk{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:2;stroke-linejoin:round}
.blk.io{fill:var(--screen)}
.blk.src{stroke:var(--accent);stroke-width:4}
.nlabel{font:600 12.5px var(--font-ui);fill:var(--fg)}
.tlabel{font:500 10.5px var(--font-ui);fill:var(--muted)}
.bexpr{font:500 12px var(--font-mono);fill:var(--fg)}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.cab{stroke:var(--cable);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.cab.on{stroke:var(--accent);stroke-width:3.6}
.arr{fill:var(--cable)}.arr.on{fill:var(--accent)}
.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.port{fill:#fff;stroke:var(--node-stroke);stroke-width:1.6}
.mode-link .port{stroke:var(--accent);stroke-width:2.2}
.ph{fill:transparent;stroke:none}
.sgn{font:700 15px var(--font-ui);fill:var(--fg)}
.dot{fill:var(--cable)}
#panel{flex:none;width:360px;max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0}
#panel.wide{width:clamp(400px,42vw,640px)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.bad{border-color:var(--bad)!important;background:rgba(192,40,31,.07)!important}
.grp{border:1px solid var(--line);border-radius:8px;padding:10px 10px 2px;margin-bottom:10px}
.grp>h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prm{display:grid;grid-template-columns:1.1fr 1fr;gap:6px;margin-bottom:8px}
.prm .pl{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.small{font-size:12.5px;color:var(--muted);margin:0 0 9px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:7px}
.hform{font:500 13px var(--font-mono);background:var(--panel2);border-radius:6px;padding:6px 9px;margin:0 0 10px;word-break:break-word}
.errbox{border:1px solid var(--bad);background:rgba(192,40,31,.08);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.errbox ul{margin:6px 0 0;padding-left:20px}
.warnbox{border:1px solid #d9a21b;background:rgba(224,160,40,.14);border-radius:8px;padding:6px 12px;margin:8px 0;font-size:13px}
.fbox{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 14px;margin:6px 0 10px;font:16px/2.1 var(--font-ui);overflow-x:auto;background:var(--panel)}
.fbox .lhs{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .25em;line-height:1.5}
.fr>span{white-space:nowrap;padding:0 .3em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding-bottom:.12em}
.fr>span:last-child{padding-top:.12em}
.fr .fr{font-size:.88em}
.seg2{display:flex;gap:14px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;overflow:hidden}
.card h4{margin:0;padding:5px 10px;font-size:12px;background:var(--panel2);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;padding:8px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--font-mono);font-size:12.5px;word-break:break-word}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font:600 12.5px var(--font-ui)}
.badge.stable{background:rgba(30,122,46,.15);color:var(--ok)}.badge.marginal{background:rgba(224,160,40,.2);color:var(--warn)}.badge.unstable{background:rgba(192,40,31,.14);color:var(--bad)}
details.mason{border:1px dashed var(--accent);border-radius:8px;padding:6px 10px;margin:0 0 10px}
details.mason summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
details.mason p,details.mason li{font-size:13px;margin:4px 0}
details.mason ul{padding-left:18px;margin:4px 0}
.mono-s{font-family:var(--font-mono);font-size:12.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(680px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
.dlgbox code{font-family:var(--font-mono);background:var(--panel2);padding:0 4px;border-radius:4px;font-size:12.5px}
.dlgbox table{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%}
.dlgbox td,.dlgbox th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.dlgbox th{background:var(--panel2)}
.exrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.exrow p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
@media (max-width:820px){
  .work{flex-direction:column;gap:8px}
  #palette{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;flex:none}
  .sep{width:1px;height:auto;margin:0 2px}
  .tool{min-width:78px}
  #panel,#panel.wide{position:fixed;left:0;right:0;bottom:0;width:auto;height:66%;max-height:none;border-radius:14px 14px 0 0;z-index:30;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
}
/* ---- cours ---- */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;font-size:16px;overflow-x:auto;line-height:2}
.cwarn{border:1px solid #d9a21b;background:rgba(224,160,40,.14);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.cbody details{border:1px dashed var(--accent);border-radius:8px;padding:6px 10px;margin:8px 0 12px}
.cbody details summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
.cbody .ex{border:1px solid var(--line);border-radius:8px;padding:4px 14px 8px;margin:10px 0}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
@media (max-width:820px){.ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}}
@media (prefers-reduced-motion:no-preference){.tool,.btn{transition:border-color .12s,background .12s}}
</style></head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand"><svg width="28" height="26" viewBox="0 0 28 26" aria-hidden="true"><rect x="2" y="7" width="9" height="12" rx="2" fill="none" stroke="var(--fg)" stroke-width="1.6"/><rect x="17" y="7" width="9" height="12" rx="2" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M11 13h6m-3-3l3 3-3 3" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Atelier Schémas-blocs <small>FTBF</small></span></div>
    <div class="files">
      <button class="btn run" id="bCalc" type="button">Calculer la FTBF</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bEx" type="button">Exemples</button>
      <button class="btn" id="bClear" type="button">Effacer</button>
      <button class="btn" id="bPanel" type="button" aria-pressed="true">Panneau</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <main class="inner work" id="work">
    <nav id="palette" aria-label="Palette de blocs"></nav>
    <section id="stage"><div id="hint"></div><div id="scroller"><svg id="svg" width="1400" height="900" role="application" aria-label="Zone de travail du schéma-blocs"></svg></div></section>
    <aside id="panel" aria-label="Propriétés et résultat"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
/*MATH-START*/
/* ====== Polynômes multivariés (variables : p et les symboles des paramètres) ====== */
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '+': '' };
const sup = n => String(n).split('').map(c => SUP[c] != null ? SUP[c] : c).join('');
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function kparse(k) { const o = Object.create(null); if (k) for (const t of k.split('*')) { const i = t.lastIndexOf('^'); o[t.slice(0, i)] = +t.slice(i + 1); } return o; }
function kstr(o) { return Object.keys(o).filter(n => o[n] > 0).sort().map(n => n + '^' + o[n]).join('*'); }
function mulKey(a, b) { if (!a) return b; if (!b) return a; const o = kparse(a), q = kparse(b); for (const n in q) o[n] = (o[n] || 0) + q[n]; return kstr(o); }
const PLY = {
  c: n => n ? new Map([['', n]]) : new Map(),
  v: n => new Map([[n + '^1', 1]]),
  add(a, b) { const r = new Map(a); for (const [k, c] of b) { const n = (r.get(k) || 0) + c; if (n) r.set(k, n); else r.delete(k); } return r; },
  neg(a) { const r = new Map(); for (const [k, c] of a) r.set(k, -c); return r; },
  mul(a, b) { const r = new Map(); for (const [ka, ca] of a) for (const [kb, cb] of b) { const k = mulKey(ka, kb), n = (r.get(k) || 0) + ca * cb; if (n) r.set(k, n); else r.delete(k); } return r; }
};
const V = n => PLY.v(n), C = n => PLY.c(n), PP = PLY.v('p');
const A = (...x) => x.reduce((a, b) => PLY.add(a, b));
const M = (...x) => x.reduce((a, b) => PLY.mul(a, b));

/* Simplification : facteur monomial et entier communs au numérateur et au dénominateur */
function cancelCommon(Aa, Bb) {
  if (!Aa.size || !Bb.size) return { n: Aa, d: Bb };
  let g = null, ig = 0, intOk = true;
  for (const m of [Aa, Bb]) for (const [k, c] of m) {
    const o = kparse(k);
    if (g === null) g = o; else for (const n in g) g[n] = Math.min(g[n], o[n] || 0);
    if (Number.isInteger(c)) ig = gcd(ig, Math.abs(c)); else intOk = false;
  }
  if (!intOk || ig === 0) ig = 1;
  const div = m => { const r = new Map(); for (const [k, c] of m) { const o = kparse(k); for (const n in g) o[n] -= g[n]; r.set(kstr(o), c / ig); } return r; };
  let n = div(Aa), d = div(Bb);
  if (d.size === 1 && [...d.values()][0] < 0) { n = PLY.neg(n); d = PLY.neg(d); }
  return { n, d };
}
function toArr(P) {
  const arr = [];
  for (const [k, c] of P) { const o = kparse(k), e = o.p || 0; delete o.p; if (!arr[e]) arr[e] = new Map(); arr[e].set(kstr(o), c); }
  for (let i = 0; i < arr.length; i++) if (!arr[i]) arr[i] = new Map();
  return arr;
}
function evalPoly(P, vals) { let s = 0; for (const [k, c] of P) { const o = kparse(k); let v = c; for (const n in o) v *= Math.pow(vals.get(n), o[n]); s += v; } return s; }

/* ====== Types de blocs ====== */
/* params : [base du symbole, libellé, valeur par défaut] */
const TYPES = {
  in: { label: 'Entrée', pre: 'E', nin: 0, params: [] },
  out: { label: 'Sortie', pre: 'S', nin: 1, params: [] },
  sum: { label: 'Comparateur', pre: 'Σ', nin: 2, params: [] },
  prop: { label: 'Proportionnel', pre: 'H', nin: 1, params: [['K', 'Gain K', 2]], poly: s => ({ N: V(s[0]), D: C(1) }), expr: s => `${s[0]}` },
  int: { label: 'Intégrateur', pre: 'H', nin: 1, params: [['K', 'Gain K', 1]], poly: s => ({ N: V(s[0]), D: PP }), expr: s => `${s[0]}/p` },
  der: { label: 'Dérivateur', pre: 'H', nin: 1, params: [['K', 'Gain K', 1]], poly: s => ({ N: M(V(s[0]), PP), D: C(1) }), expr: s => `${s[0]}·p` },
  ord1: { label: '1er ordre', pre: 'H', nin: 1, params: [['K', 'Gain statique K', 1], ['τ', 'Constante de temps τ (s)', 1]],
    poly: s => ({ N: V(s[0]), D: A(C(1), M(V(s[1]), PP)) }), expr: s => `${s[0]}/(1+${s[1]}·p)` },

const F = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const COURSE = [];
COURSE.push({ id: 'vocab', t: 'Vocabulaire des schémas-blocs', h: `
<p>Un système asservi se représente par un <b>schéma-blocs</b> : chaque bloc contient une fonction de transfert H(p) = ${F('S(p)', 'E(p)')} (transformée de Laplace, conditions initiales nulles), et les flèches portent les signaux.</p>
<table class="ctable"><thead><tr><th>Élément</th><th>Rôle</th></tr></thead><tbody>
<tr><td>Bloc</td><td>Multiplie le signal entrant par sa fonction de transfert.</td></tr>
<tr><td>Comparateur (sommateur)</td><td>Additionne ou soustrait des signaux : ε = E − B pour un retour négatif.</td></tr>
<tr><td>Point de prélèvement</td><td>Copie un signal vers plusieurs destinations, sans le modifier.</td></tr>
<tr><td>Chaîne directe</td><td>Chemin de l’entrée E vers la sortie S. Sa fonction de transfert est notée G(p).</td></tr>
<tr><td>Chaîne de retour</td><td>Chemin qui ramène la sortie vers le comparateur. Sa fonction de transfert est notée H(p).</td></tr>
<tr><td>FTBO</td><td>Fonction de transfert en boucle ouverte : on ouvre la boucle au niveau du comparateur. Pour une boucle simple, T<sub>BO</sub> = G·H.</td></tr>
<tr><td>FTBF</td><td>Fonction de transfert en boucle fermée : T(p) = ${F('S(p)', 'E(p)')}, avec la boucle refermée.</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> FTBO = produit des gains de toute la boucle (comparateur ouvert). FTBF = rapport S/E avec la boucle fermée. Ne pas confondre les deux.</div>` });

COURSE.push({ id: 'algebre', t: 'Algèbre des blocs', h: `
<p>Avant d’utiliser une formule globale, on sait déjà réduire des associations simples.</p>
<table class="ctable"><thead><tr><th>Association</th><th>Schéma</th><th>Fonction de transfert équivalente</th></tr></thead><tbody>
<tr><td>Série</td><td>H₁ puis H₂</td><td>H₁·H₂</td></tr>
<tr><td>Parallèle (somme)</td><td>H₁ et H₂ en parallèle, sorties additionnées</td><td>H₁ + H₂ (ou H₁ − H₂ si le comparateur soustrait)</td></tr>
<tr><td>Boucle fermée</td><td>G en chaîne directe, H en retour</td><td>Formule de Black (section suivante)</td></tr>
</tbody></table>
<h3>Déplacer un élément</h3>
<ul>
<li><b>Point de prélèvement</b> déplacé <i>en aval</i> d’un bloc G : on ajoute un bloc ${F('1', 'G')} sur la branche prélevée. <i>En amont</i> : on ajoute un bloc G.</li>
<li><b>Comparateur</b> déplacé <i>en amont</i> d’un bloc G : on ajoute un bloc ${F('1', 'G')} sur l’entrée qui n’a pas traversé G. <i>En aval</i> : on ajoute un bloc G.</li>
</ul>
<div class="cwarn"><b>Attention.</b> Ces déplacements deviennent vite lourds quand les boucles s’imbriquent. La méthode de Mason évite ces manipulations.</div>
<div class="retain"><b>À retenir.</b> Série : on multiplie. Parallèle : on additionne. Boucle : on applique Black.</div>` });

COURSE.push({ id: 'black', t: 'La formule de Black', h: `
<p>La formule de Black donne la FTBF d’une <b>boucle unique</b> : une chaîne directe G(p), une chaîne de retour H(p), un comparateur.</p>
<h3>Démonstration</h3>
<p>Soit ε la sortie du comparateur. Avec un retour négatif :</p>
<div class="formula">ε = E − H·S &nbsp;et&nbsp; S = G·ε &nbsp;⟹&nbsp; S = G·(E − H·S) &nbsp;⟹&nbsp; S·(1 + G·H) = G·E</div>
<h3>Formule de Black</h3>
<div class="formula">T(p) = ${F('S(p)', 'E(p)')} = ${F('G(p)', '1 + G(p)·H(p)')} = ${F('G', '1 + T<sub>BO</sub>')}</div>
<ul>
<li><b>Retour négatif</b> (comparateur « E − retour ») : dénominateur 1 + GH.</li>
<li><b>Retour positif</b> (comparateur « E + retour ») : dénominateur 1 − GH. Dans l’atelier, on obtient ce cas en mettant le signe « + » à l’entrée de retour du comparateur.</li>
<li><b>Retour unitaire</b> (H = 1) : T = ${F('G', '1 + G')}.</li>
</ul>
<h3>Exemple 1 : 1er ordre à retour unitaire</h3>
<p>G(p) = ${F('K', '1 + τp')} et H = 1.</p>
<div class="formula">T(p) = ${F('K/(1 + τp)', '1 + K/(1 + τp)')} = ${F('K', '1 + K + τp')} = ${F('K/(1+K)', '1 + (τ/(1+K))·p')}</div>
<p>C’est encore un 1er ordre : le gain devient ${F('K', '1 + K')} (inférieur à 1) et la constante de temps est divisée par 1 + K : la boucle fermée est plus rapide. Avec K = 4 et τ = 0,5 s : T(p) = ${F('0,8', '1 + 0,1·p')}.</p>
<h3>Exemple 2 : retour non unitaire</h3>
<p>G(p) = ${F('K', 'p·(1 + τp)')} et H(p) = a (gain de capteur).</p>
<div class="formula">T(p) = ${F('K', 'p(1 + τp) + aK')} = ${F('1/a', '1 + p/(aK) + (τ/(aK))·p²')}</div>
<p>Par identification avec ${F('K<sub>BF</sub>', '1 + 2ξp/ω₀ + p²/ω₀²')} : K<sub>BF</sub> = ${F('1', 'a')}, ω₀ = √(${F('aK', 'τ')}) et ξ = ${F('1', '2√(aKτ)')}.</p>
<div class="cwarn"><b>Limite.</b> Black suppose une seule boucle. Dès qu’il y a une boucle à l’intérieur d’une autre, on réduit la boucle interne, puis on applique Black à la boucle externe… ou on passe directement par la méthode de Mason.</div>
<div class="retain"><b>À retenir.</b> T = ${F('G', '1 + G·H')} pour un retour négatif, ${F('G', '1 − G·H')} pour un retour positif. Le dénominateur « 1 + FTBO » est l’équation caractéristique : ses racines sont les pôles de la FTBF.</div>` });

COURSE.push({ id: 'mason', t: 'La méthode de Mason', h: `
<p>La formule de Mason donne directement la FTBF de <b>n’importe quel schéma-blocs</b>, quel que soit le nombre de boucles et de chaînes directes. On la voit comme un graphe : les signaux sont des nœuds, les blocs des gains portés par les branches.</p>
<h3>Vocabulaire</h3>
<ul>
<li><b>Chemin direct</b> P<sub>k</sub> : chemin de E vers S qui ne passe qu’une fois par chaque nœud. Son gain est le produit des gains rencontrés (avec le signe − si on traverse une entrée soustractive d’un comparateur).</li>
<li><b>Boucle</b> L<sub>i</sub> : chemin fermé qui ne passe qu’une fois par chaque nœud. Son gain est le produit des gains de la boucle, y compris le signe. Un retour négatif donne L = −G·H.</li>
<li>Deux boucles (ou une boucle et un chemin) sont <b>disjointes</b> (ou « ne se touchent pas ») si elles n’ont <b>aucun nœud commun</b>.</li>
</ul>
<h3>La formule</h3>
<div class="formula">T(p) = ${F('Σ<sub>k</sub> P<sub>k</sub>·Δ<sub>k</sub>', 'Δ')}</div>
<div class="formula">Δ = 1 − ΣL<sub>i</sub> + ΣL<sub>i</sub>L<sub>j</sub> − ΣL<sub>i</sub>L<sub>j</sub>L<sub>k</sub> + …</div>
<ul>
<li>ΣL<sub>i</sub> : somme des gains de <b>toutes</b> les boucles.</li>
<li>ΣL<sub>i</sub>L<sub>j</sub> : somme des produits des boucles <b>deux à deux disjointes</b> ; puis trois à trois, avec des signes alternés.</li>
<li>Δ<sub>k</sub> : le même calcul que Δ, mais en ne gardant que les boucles qui <b>ne touchent pas</b> le chemin P<sub>k</sub>. Si toutes les boucles touchent P<sub>k</sub>, alors Δ<sub>k</sub> = 1.</li>
</ul>
<h3>Méthode en 5 étapes</h3>
<ol>
<li>Repérer et numéroter les chemins directs P₁, P₂, … et calculer leurs gains.</li>
<li>Repérer toutes les boucles L₁, L₂, … avec leurs gains (signes compris).</li>
<li>Pour chaque paire (ou triplet) de boucles, indiquer si elles sont disjointes.</li>
<li>Calculer Δ, puis chaque Δ<sub>k</sub>.</li>
<li>Assembler T = ${F('ΣP<sub>k</sub>Δ<sub>k</sub>', 'Δ')} et mettre sous forme canonique.</li>
</ol>
<h3>Exemple A : boucles imbriquées</h3>
<p>E → Σ₁ → H₁ → Σ₂ → H₂ → S. Retour unitaire de S vers Σ₁ (boucle externe), et retour H₃ de la sortie de H₂ vers Σ₂ (boucle interne).</p>
<ul>
<li>Chemin direct : P₁ = H₁·H₂.</li>
<li>Boucles : L₁ = −H₁H₂ (externe) et L₂ = −H₂H₃ (interne). Elles passent toutes deux par H₂ : elles se touchent.</li>
<li>Δ = 1 − L₁ − L₂ = 1 + H₁H₂ + H₂H₃. Les deux boucles touchent P₁ : Δ₁ = 1.</li>
</ul>
<div class="formula">T(p) = ${F('H₁H₂', '1 + H₁H₂ + H₂H₃')}</div>
<p>C’est exactement l’exemple « Deux boucles imbriquées » du menu Exemples de l’atelier.</p>
<h3>Exemple B : boucles disjointes</h3>
<p>Chaîne G₁, G₂, G₃. Une boucle de retour H₁ autour de G₁ seul, une autre H₂ autour de G₃ seul. Elles n’ont aucun nœud commun.</p>
<ul>
<li>P₁ = G₁G₂G₃ ; L₁ = −G₁H₁ ; L₂ = −G₃H₂ ; L₁ et L₂ sont disjointes.</li>
<li>Δ = 1 − (L₁ + L₂) + L₁L₂ = 1 + G₁H₁ + G₃H₂ + G₁H₁G₃H₂ = (1 + G₁H₁)(1 + G₃H₂). Δ₁ = 1.</li>
</ul>
<div class="formula">T(p) = ${F('G₁G₂G₃', '(1 + G₁H₁)(1 + G₃H₂)')}</div>
<p>On retrouve le produit de deux boucles fermées indépendantes, comme attendu.</p>
<h3>Exemple C : pourquoi Δ<sub>k</sub> ?</h3>
<p>Deux chemins directs : P₁ = G₁G₂ (avec une boucle de retour H autour de G₂ seul) et P₂ = G₃ (chemin parallèle sans boucle), les deux sorties s’additionnant.</p>
<ul>
<li>Une seule boucle L₁ = −G₂H. Elle touche P₁ (passe par G₂) mais ne touche pas P₂.</li>
<li>Δ = 1 + G₂H ; Δ₁ = 1 (la boucle touche P₁) ; Δ₂ = 1 − L₁ = 1 + G₂H (la boucle ne touche pas P₂).</li>
</ul>
<div class="formula">T(p) = ${F('G₁G₂·1 + G₃·(1 + G₂H)', '1 + G₂H')} = ${F('G₁G₂', '1 + G₂H')} + G₃</div>
<p>Le résultat est bien la somme des deux contributions : le chemin avec boucle, et le chemin parallèle.</p>
<div class="cwarn"><b>Erreurs fréquentes.</b> Oublier le signe de la boucle (retour négatif : L = −GH). Oublier une boucle qui passe par un point de prélèvement. Compter comme « disjointes » deux boucles qui partagent un comparateur.</div>
<div class="retain"><b>À retenir.</b> T = ${F('ΣP<sub>k</sub>Δ<sub>k</sub>', 'Δ')} avec Δ = 1 − ΣL + ΣLL − … Les boucles qui se touchent ne se multiplient pas ; Δ<sub>k</sub> ignore les boucles qui touchent P<sub>k</sub>.</div>` });

COURSE.push({ id: 'lien', t: 'Black et Mason : le lien', h: `
<p>La formule de Black est le cas particulier de Mason avec <b>un seul chemin direct</b> et <b>une seule boucle</b>.</p>
<ul>
<li>Un chemin : P₁ = G.</li>
<li>Une boucle (retour négatif) : L₁ = −G·H.</li>
<li>Δ = 1 − L₁ = 1 + G·H ; Δ₁ = 1 (la boucle touche le chemin).</li>
</ul>
<div class="formula">T = ${F('P₁Δ₁', 'Δ')} = ${F('G', '1 + GH')}</div>
<table class="ctable"><thead><tr><th></th><th>Black</th><th>Mason</th></tr></thead><tbody>
<tr><td>Schémas visés</td><td>Une seule boucle</td><td>Tout schéma</td></tr>
<tr><td>Principe</td><td>Réduire la boucle en un bloc équivalent</td><td>Énumérer chemins et boucles</td></tr>
<tr><td>Intérêt</td><td>Rapide et intuitif</td><td>Systématique, sans déplacer de points de prélèvement</td></tr>
<tr><td>Risque</td><td>Erreurs lors des déplacements de blocs</td><td>Oubli d’une boucle ou d’un signe</td></tr>
</tbody></table>
<h3>Ce que fait l’atelier</h3>
<p>L’atelier applique Mason. Chaque bloc est écrit sous la forme N(p)/D(p). Chaque terme de la formule est multiplié par le produit des dénominateurs D des blocs : le résultat sort ainsi directement sous forme d’un quotient de polynômes, mis sur dénominateur commun. L’encadré « Méthode : formule de Mason » du panneau Résultat liste les chemins P<sub>k</sub>, les boucles L<sub>i</sub> et les Δ trouvés.</p>
<div class="retain"><b>À retenir.</b> Une seule boucle : Black. Plusieurs boucles ou plusieurs chemins : Mason (et Black en est un cas particulier).</div>` });

COURSE.push({ id: 'canonique', t: 'Forme canonique de la FTBF', h: `
<p>Une fois T(p) = ${F('N(p)', 'D(p)')} obtenue, on la met sous <b>forme canonique</b> : on factorise pour que les termes de plus bas degré valent 1.</p>
<div class="formula">T(p) = ${F('K·(1 + b₁p + b₂p² + …)', 'p<sup>α</sup>·(1 + a₁p + a₂p² + …)')}</div>
<ul>
<li><b>K</b> : gain (gain statique si α = 0).</li>
<li><b>α</b> : classe, nombre d’intégrateurs de la FTBF.</li>
<li><b>n</b> : ordre, degré du dénominateur.</li>
</ul>
<table class="ctable"><thead><tr><th>Système</th><th>Forme canonique</th><th>Paramètres</th></tr></thead><tbody>
<tr><td>1er ordre</td><td>${F('K', '1 + τp')}</td><td>K : gain, τ : constante de temps (réponse à 63 % à t = τ)</td></tr>
<tr><td>2nd ordre</td><td>${F('K', '1 + 2ξp/ω₀ + p²/ω₀²')}</td><td>ω₀ : pulsation propre, ξ : amortissement</td></tr>
<tr><td>Intégrateur</td><td>${F('K', 'p')}</td><td>Classe α = 1</td></tr>
</tbody></table>
<h3>Lire un 2nd ordre</h3>
<p>Si D(p) normalisé vaut 1 + a₁p + a₂p², alors ω₀ = ${F('1', '√a₂')} et ξ = ${F('a₁·ω₀', '2')}.</p>
<ul>
<li>ξ &lt; 1 : pôles complexes conjugués, réponse oscillatoire amortie.</li>
<li>ξ = 1 : amortissement critique (pôle double réel).</li>
<li>ξ &gt; 1 : deux pôles réels, réponse apériodique.</li>
</ul>
<h3>Stabilité</h3>
<p>Le système est stable si tous les pôles (racines de D) ont une partie réelle strictement négative. Un retour positif peut rendre la boucle fermée instable même si les blocs sont stables.</p>
<div class="retain"><b>À retenir.</b> Forme canonique = constantes de plus bas degré égales à 1. On lit alors directement gain, classe, constante de temps ou (ω₀, ξ).</div>` });

COURSE.push({ id: 'atelier', t: 'Utiliser l’atelier', h: `
<ol>
<li>Ajoutez une Entrée, une Sortie, un Comparateur et les blocs voulus depuis la palette.</li>
<li>Reliez avec l’outil « Relier ». Un retour négatif est le réglage par défaut du comparateur (entrée 1 : +, entrée 2 : −).</li>
<li>Cliquez sur « Calculer la FTBF ».</li>
<li>Comparez avec votre calcul à la main : activez « Non canonique » (N/D) puis « Canonique ».</li>
<li>Passez en « Valeurs numériques » pour lire K, τ ou ω₀ et ξ, les pôles et la stabilité.</li>
</ol>
<h3>Vérifier un exercice</h3>
<p>Construisez le schéma de l’énoncé, remplacez les valeurs numériques par les vôtres, puis comparez la forme canonique obtenue avec la vôtre. Le panneau « Méthode : formule de Mason » liste les chemins et les boucles : confrontez-les aux vôtres.</p>
<div class="cwarn"><b>Limite.</b> L’atelier ne simplifie pas les pôles et zéros qui se compensent exactement : si votre calcul à la main simplifie un facteur commun, il peut rester dans le résultat de l’atelier.</div>` });

COURSE.push({ id: 'exos', t: 'Exercices', h: `
<div class="ex"><h3>Exercice 1 : Black, retour unitaire</h3>
<p>G(p) = ${F('K', 'p·(1 + τp)')}, retour unitaire. Donner T(p) sous forme canonique, puis ω₀ et ξ pour K = 2 et τ = 0,5 s.</p>
<details><summary>Voir la réponse</summary><p>T = ${F('K', 'p(1 + τp) + K')} = ${F('1', '1 + p/K + (τ/K)p²')}. Pour K = 2 et τ = 0,5 : T = ${F('1', '1 + 0,5p + 0,25p²')}. Donc ω₀ = ${F('1', '√0,25')} = 2 rad/s et ξ = ${F('0,5 × 2', '2')} = 0,5 : oscillatoire amorti.</p></details></div>
<div class="ex"><h3>Exercice 2 : Mason, boucles disjointes</h3>
<p>Chaîne G₁, G₂, G₃ avec un retour H₁ autour de G₁ seul et un retour H₂ autour de G₃ seul. Donner T(p).</p>
<details><summary>Voir la réponse</summary><p>P₁ = G₁G₂G₃ ; L₁ = −G₁H₁, L₂ = −G₃H₂, disjointes ; Δ = (1 + G₁H₁)(1 + G₃H₂) ; Δ₁ = 1. T = ${F('G₁G₂G₃', '(1 + G₁H₁)(1 + G₃H₂)')}.</p></details></div>
<div class="ex"><h3>Exercice 3 : retour positif</h3>
<p>G(p) = ${F('K', '1 + τp')} avec un retour positif unitaire. Donner T(p), puis la condition de stabilité.</p>
<details><summary>Voir la réponse</summary><p>T = ${F('G', '1 − G')} = ${F('K', '1 + τp − K')} = ${F('K/(1 − K)', '1 + (τ/(1 − K))p')}. Le pôle vaut −${F('1 − K', 'τ')} : le système est stable si K &lt; 1 (avec τ &gt; 0).</p></details></div>
<div class="ex"><h3>Exercice 4 : sur l’atelier</h3>
<p>Chargez l’exemple « Deux boucles imbriquées », calculez T(p) à la main avec Mason, puis comparez avec la forme non canonique de l’atelier.</p>
<details><summary>Voir la réponse</summary><p>T = ${F('H₁H₂', '1 + H₁H₂ + H₂H₃')} avec H₁ = ${F('K₁', '1 + τ₁p')}, H₂ = ${F('K₂', 'p')}, H₃ = K₃p. On obtient T = ${F('K₁K₂', 'K₁K₂ + (1 + K₂K₃)p + τ₁(1 + K₂K₃)p²')}.</p></details></div>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire', h: `
<dl class="gloss">
<dt>Boucle (Mason)</dt><dd>Chemin fermé passant une seule fois par chaque nœud ; son gain inclut le signe.</dd>
<dt>Chaîne directe</dt><dd>Chemin de l’entrée vers la sortie.</dd>
<dt>Chaîne de retour</dt><dd>Chemin ramenant la sortie vers le comparateur.</dd>
<dt>Classe α</dt><dd>Nombre d’intégrateurs (puissance de p au dénominateur canonique).</dd>
<dt>Comparateur</dt><dd>Élément qui additionne ou soustrait des signaux.</dd>
<dt>Forme canonique</dt><dd>Écriture avec les termes de plus bas degré égaux à 1 : K, α et les coefficients se lisent directement.</dd>
<dt>FTBF</dt><dd>Fonction de transfert en boucle fermée S/E.</dd>
<dt>FTBO</dt><dd>Fonction de transfert en boucle ouverte (produit des gains de la boucle).</dd>
<dt>Formule de Black</dt><dd>T = G/(1 + GH) pour une boucle à retour négatif.</dd>
<dt>Formule de Mason</dt><dd>T = ΣP<sub>k</sub>Δ<sub>k</sub> / Δ pour un schéma quelconque.</dd>
<dt>Pôle</dt><dd>Racine du dénominateur de T(p).</dd>
<dt>Retour unitaire</dt><dd>Chaîne de retour de gain 1.</dd>
<dt>Zéro</dt><dd>Racine du numérateur de T(p).</dd>
</dl>` });

(function init() {
  const saved = lsGet(KEY, null); let ok = false;
  try {
    if (saved && Array.isArray(saved.blocks) && saved.blocks.length && Array.isArray(saved.links)) {
      S.blocks = saved.blocks.filter(b => TYPES[b.type] && Array.isArray(b.p) && b.p.length === TYPES[b.type].params.length).map(b => ({ id: +b.id, type: b.type, x: +b.x || 40, y: +b.y || 60, name: String(b.name || '?'), signs: Array.isArray(b.signs) ? b.signs : [1, -1], p: b.p.map(q => ({ sym: String(q.sym), val: Number.isFinite(+q.val) ? +q.val : 1 })) }));
      S.links = saved.links.map(l => ({ id: +l.id, from: +l.from, to: +l.to, port: +l.port || 0 }));
      S.nid = Math.max(+saved.nid || 1, ...S.blocks.map(b => b.id + 1)); S.nl = Math.max(+saved.nl || 1, ...S.links.map(l => l.id + 1));
