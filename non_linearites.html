<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--bg:#fff;--bar:#eee;--panel:#fff;--panel2:#f1f3f6;--field:#fff;--line:#b9bfc7;--fg:#111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#fff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;color-scheme:light}

body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}

#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}

.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}
.opts .fld{margin:0;min-width:180px}
.opts input[type=range]{width:200px;max-width:100%}
.slider-val{font-family:var(--font-mono);font-weight:600;color:var(--accent-ink)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono)}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dt thead th{background:var(--panel2);font-weight:600}
.dt tr:last-child td{border-bottom:0}
.qa{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
.qa .qq{font-weight:600;color:var(--accent-ink);margin:0 0 4px;font-size:13.5px}
.qa .aa{margin:0;font-size:13.5px;color:var(--fg)}
.qa .aa b{color:var(--accent-ink)}
.plot-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .plot-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}

<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="14" width="4" height="9" fill="#2e6da4"/><rect x="9" y="9" width="4" height="14" fill="#1e7a2e"/><rect x="15" y="5" width="4" height="18" fill="#9a5b00"/><rect x="21" y="11" width="2.5" height="12" fill="#c0281f"/></svg>
      <span>Non-linéarités <small>PSI* · SII</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>

    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>

<script>
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v===false||v==null)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v===true)el.setAttribute(k,'');else el.setAttribute(k,v)}for(const k of kids.flat())if(k!=null&&k!==false)el.append(k.nodeType?k:document.createTextNode(k));return el}
const NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){const el=document.createElementNS(NS,tag);if(attrs)for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el}
const KEYS={act:'tp-nonlin-v2'};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ====================== SIMULATION MOTEUR ======================
   Modèle 2nd ordre : J θ'' + b θ' = Km · u_sat/seuil
   u = Kp·e + Ki·∫e ; saturation à ±Umax ; seuil (bande morte) optionnel
================================================================*/
function motorSim(opts){
  const o=Object.assign({
    Kp:100,Ki:0,Umax:21.6,seuil:0,thetaC:20,
    Km:1,J:4,b:20,
    useSat:true,useSeuil:false,
    tMax:3,dt:0.004
  },opts);
  const thetaC=o.thetaC*Math.PI/180;
  const n=Math.floor(o.tMax/o.dt);
  const t=[],th=[],u=[],w=[];
  let theta=0,omega=0,integ=0;
  for(let i=0;i<=n;i++){
    const e=thetaC-theta;
    let ucmd=o.Kp*e+(o.Ki?o.Ki*integ:0);
    if(o.useSat)ucmd=Math.max(-o.Umax,Math.min(o.Umax,ucmd));
    let uApp=ucmd;
    if(o.useSeuil&&o.seuil>0){
      if(Math.abs(uApp)<=o.seuil)uApp=0;
      else uApp=Math.sign(uApp)*(Math.abs(uApp)-o.seuil);
    }
    t.push(i*o.dt); th.push(theta*180/Math.PI); u.push(uApp); w.push(omega);
    const dwdt=(o.Km*uApp-o.b*omega)/o.J;
    omega+=dwdt*o.dt;
    if(Math.abs(omega)>200)omega=Math.sign(omega)*200;
    theta+=omega*o.dt;
    integ+=e*o.dt;
    if(!isFinite(theta)||!isFinite(omega)||!isFinite(integ))break;
  }
  return{t,theta:th,u,omega:w};
}

/* ====================== TRACÉ ====================== */
function plotXY(series,opts){
  const W=opts.width||480,H=opts.height||240;
  const ml=54,mr=14,mt=22,mb=32;
  const xmin=opts.xmin??Math.min(...series[0].x);
  const xmax=opts.xmax??Math.max(...series[0].x);
  let ymin=opts.ymin,ymax=opts.ymax;
  if(ymin==null||ymax==null){const all=series.flatMap(s=>s.y);ymin=Math.min(...all);ymax=Math.max(...all);const p=(ymax-ymin)*0.1||1;ymin-=p;ymax+=p;}
  const X=v=>ml+(v-xmin)/(xmax-xmin)*(W-ml-mr);
  const Y=v=>H-mb-(v-ymin)/(ymax-ymin)*(H-mt-mb);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:`max-width:${W}px;display:block;margin:6px auto;border:1px solid #b9bfc7;border-radius:8px;background:#fff`});
  const nX=5,nY=4;
  for(let i=0;i<=nX;i++){const xv=xmin+i/nX*(xmax-xmin);svg.append(svgEl('line',{x1:X(xv),y1:mt,x2:X(xv),y2:H-mb,stroke:'#eef1f5','stroke-width':1}));const tx=svgEl('text',{x:X(xv),y:H-mb+13,'text-anchor':'middle','font-size':10,fill:'#5a6068'});tx.textContent=opts.xfmt?opts.xfmt(xv):xv.toFixed(1);svg.append(tx);}
  for(let i=0;i<=nY;i++){const yv=ymin+i/nY*(ymax-ymin);svg.append(svgEl('line',{x1:ml,y1:Y(yv),x2:W-mr,y2:Y(yv),stroke:'#eef1f5','stroke-width':1}));const ty=svgEl('text',{x:ml-4,y:Y(yv)+3,'text-anchor':'end','font-size':10,fill:'#5a6068'});ty.textContent=opts.yfmt?opts.yfmt(yv):yv.toFixed(1);svg.append(ty);}
  svg.append(svgEl('line',{x1:ml,y1:H-mb,x2:W-mr,y2:H-mb,stroke:'#33475b','stroke-width':1.2}));
  svg.append(svgEl('line',{x1:ml,y1:mt,x2:ml,y2:H-mb,stroke:'#33475b','stroke-width':1.2}));
  (opts.hlines||[]).forEach(hl=>{svg.append(svgEl('line',{x1:ml,y1:Y(hl.y),x2:W-mr,y2:Y(hl.y),stroke:hl.color||'#c0281f','stroke-width':1,'stroke-dasharray':hl.dash||'4 3'}));});
  series.forEach(s=>{let d='';s.x.forEach((xv,i)=>{d+=(i?' L ':'M ')+X(xv).toFixed(1)+' '+Y(s.y[i]).toFixed(1)});svg.append(svgEl('path',{d,fill:'none',stroke:s.color||'#2e6da4','stroke-width':s.width||2,'stroke-dasharray':s.dashed?'5 3':''}));});
  if(series.length>1){let ly=mt+12;series.forEach(s=>{if(s.label){svg.append(svgEl('rect',{x:W-mr-170,y:ly-4,width:14,height:3,fill:s.color||'#2e6da4'}));const t=svgEl('text',{x:W-mr-152,y:ly,'font-size':10.5,fill:'#111'});t.textContent=s.label;svg.append(t);ly+=13;}});}
  const xl=svgEl('text',{x:W-mr,y:H-mb+27,'text-anchor':'end','font-size':11,fill:'#5a6068'});xl.textContent=opts.xlabel||'';svg.append(xl);
  const yl=svgEl('text',{x:ml+4,y:mt-6,'font-size':11,fill:'#5a6068'});yl.textContent=opts.ylabel||'';svg.append(yl);
  return svg;
}

/* ====================== CARACTÉRISTIQUES ====================== */
function saturationSVG(){
  const W=520,H=280,ml=60,mr=20,mt=30,mb=40;
  const Umax=21.6,UeMax=30;
  const X=u=>ml+(u+UeMax)/(2*UeMax)*(W-ml-mr);
  const Y=s=>H-mb-(s+Umax)/(2*Umax)*(H-mt-mb);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'max-width:520px;display:block;margin:8px auto;border:1px solid #b9bfc7;border-radius:8px;background:#fff'});
  // grille
  for(let u=-30;u<=30;u+=10){svg.append(svgEl('line',{x1:X(u),y1:mt,x2:X(u),y2:H-mb,stroke:'#eef1f5','stroke-width':1}));}
  // axes
  svg.append(svgEl('line',{x1:ml,y1:Y(0),x2:W-mr+6,y2:Y(0),stroke:'#33475b','stroke-width':1.2}));
  svg.append(svgEl('line',{x1:X(0),y1:mt-6,x2:X(0),y2:H-mb,stroke:'#33475b','stroke-width':1.2}));
  // droites de saturation (pointillés)
  svg.append(svgEl('line',{x1:ml,y1:Y(Umax),x2:W-mr,y2:Y(Umax),stroke:'#9a5b00','stroke-width':1,'stroke-dasharray':'4 3'}));
  svg.append(svgEl('line',{x1:ml,y1:Y(-Umax),x2:W-mr,y2:Y(-Umax),stroke:'#9a5b00','stroke-width':1,'stroke-dasharray':'4 3'}));
  // caractéristique : M(-UeMax,-Umax) → L(-Umax,-Umax) → L(Umax,Umax) → L(UeMax,Umax)
  const path=`M ${X(-UeMax)} ${Y(-Umax)} L ${X(-Umax)} ${Y(-Umax)} L ${X(Umax)} ${Y(Umax)} L ${X(UeMax)} ${Y(Umax)}`;
  svg.append(svgEl('path',{d:path,fill:'none',stroke:'#2e6da4','stroke-width':2.4}));
  // labels

function betaPlot(thMin,thMax){
  const W=560,H=300,ml=55,mr=20,mt=25,mb=40;
  const f=th=>(2*Math.PI/4)*(170-10*Math.sqrt(177+112*Math.cos(th*Math.PI/180)-128*Math.sin(th*Math.PI/180)));
  const pts=[];for(let th=5;th<=85;th+=1)pts.push([th,f(th)]);
  const bMin=Math.min(...pts.map(q=>q[1]))-5,bMax=Math.max(...pts.map(q=>q[1]))+5;
  const X=th=>ml+(th-5)/80*(W-ml-mr);
  const Y=b=>H-mb-(b-bMin)/(bMax-bMin)*(H-mt-mb);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'max-width:560px;display:block;margin:8px auto;border:1px solid #b9bfc7;border-radius:8px;background:#fff'});
  for(let th=5;th<=85;th+=10){svg.append(svgEl('line',{x1:X(th),y1:mt,x2:X(th),y2:H-mb,stroke:'#eef1f5','stroke-width':1}));const t=svgEl('text',{x:X(th),y:H-mb+14,'text-anchor':'middle','font-size':10,fill:'#5a6068'});t.textContent=th+'°';svg.append(t);}
  svg.append(svgEl('line',{x1:ml,y1:H-mb,x2:W-mr+6,y2:H-mb,stroke:'#33475b','stroke-width':1.2}));
  svg.append(svgEl('line',{x1:ml,y1:mt-6,x2:ml,y2:H-mb,stroke:'#33475b','stroke-width':1.2}));
  svg.append(svgEl('rect',{x:X(thMin),y:mt,width:X(thMax)-X(thMin),height:H-mt-mb,fill:'rgba(46,109,164,0.08)'}));
  let d='';pts.forEach((q,i)=>{d+=(i?' L ':'M ')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1);});
  svg.append(svgEl('path',{d,fill:'none',stroke:'#2e6da4','stroke-width':2.2}));
  const b1=f(thMin),b2=f(thMax),slope=(b2-b1)/(thMax-thMin);
  const reg=`M ${X(thMin)} ${Y(b1)} L ${X(thMax)} ${Y(b2)}`;
  svg.append(svgEl('path',{d:reg,fill:'none',stroke:'#c0281f','stroke-width':2,'stroke-dasharray':'6 4'}));
  const xl=svgEl('text',{x:W-mr+6,y:H-mb+26,'text-anchor':'end','font-size':11,fill:'#5a6068'});xl.textContent='θ';svg.append(xl);
  const yl=svgEl('text',{x:ml+4,y:mt-6,'font-size':11,fill:'#5a6068'});yl.textContent='β (rad)';svg.append(yl);
  return svg;
}

const M5={id:'m5',title:'Correcteur PI et pompage (avec curseurs)',hint:'Manipulez Kp, Ki et le seuil pour observer le cycle limite (pompage).',mount:mountM5,reset:()=>{}};
function mountM5(root){
  root.innerHTML='';
  root.append(h('h2','Action du correcteur PI sur le seuil'));
  root.append(h('div',{class:'formula',html:'C(p) = (2 / 255) · (K<sub>p</sub> + K<sub>I</sub> / (4p))'}));
  root.append(h('p',{html:'Sur le système réel on règle K<sub>p</sub> = 50 et K<sub>I</sub> = 10 : on observe un <b>pompage</b>. Manipulez les curseurs pour le reproduire.'}));

  const kpSlider=h('input',{type:'range',min:10,max:150,step:5,value:50});
  const kpVal=h('b',{class:'slider-val'},'50');
  const kiSlider=h('input',{type:'range',min:0,max:300,step:10,value:150});
  const kiVal=h('b',{class:'slider-val'},'150');
  const seuilSlider=h('input',{type:'range',min:0.5,max:5,step:0.25,value:2});
  const seuilVal=h('b',{class:'slider-val'},'2,0 V');
  root.append(h('div',{class:'opts'},
    h('label',{class:'fld',style:'min-width:240px'},h('span',null,'Kp = ',kpVal),kpSlider),
    h('label',{class:'fld',style:'min-width:240px'},h('span',null,'Ki = ',kiVal),kiSlider),
    h('label',{class:'fld',style:'min-width:240px'},h('span',null,'Seuil = ',seuilVal),seuilSlider)
  ));
  const statBox=h('div',{class:'gstats'});
  root.append(statBox);
  const plotRow=h('div',{class:'plot-row'});
  const plotTh=h('div'),plotU=h('div');
  plotRow.append(plotTh,plotU);
  root.append(plotRow);

  function update(){
    const Kp=+kpSlider.value,Ki=+kiSlider.value,seuil=+seuilSlider.value;
    kpVal.textContent=String(Kp);
    kiVal.textContent=String(Ki);
    seuilVal.textContent=seuil.toFixed(1).replace('.',',')+' V';
    const sim=motorSim({Kp,Ki,seuil,useSeuil:true,useSat:false,thetaC:20,tMax:8,dt:0.005,Km:0.6,J:2,b:10});
    // nombre d'oscillations (changements de signe de la dérivée)
    let nOsc=0,prev=0;
    for(let i=1;i<sim.theta.length;i++){
      const d=sim.theta[i]-sim.theta[i-1];
      if((d>0)!=(prev>0)&&i>10)nOsc++;
      prev=d;
    }
    statBox.innerHTML='';
    statBox.append(
      stat('Kp',String(Kp)),
      stat('Ki',String(Ki)),
      stat('Oscillations',String(Math.floor(nOsc/2))),
      stat('Type',Ki>0&&seuil>0?'Pompage':'Convergent')
    );
    plotTh.innerHTML='';
    plotTh.append(plotXY([
      {x:sim.t,y:sim.theta,color:'#2e6da4',label:'θ'},
      {x:[0,8],y:[20,20],color:'#1e7a2e',dashed:true,label:'consigne'}
    ],{xmin:0,xmax:8,ymin:-5,ymax:45,xlabel:'t (s)',ylabel:'θ (°)',xfmt:v=>v.toFixed(1)}));
    plotU.innerHTML='';
    plotU.append(plotXY([
      {x:sim.t,y:sim.u,color:'#c0281f',label:'u appliqué'}
    ],{xmin:0,xmax:8,ymin:-10,ymax:10,xlabel:'t (s)',ylabel:'u (V)',xfmt:v=>v.toFixed(1),hlines:[{y:seuil,color:'#9a5b00'},{y:-seuil,color:'#9a5b00'}]}));
  }
  kpSlider.addEventListener('input',update);
  kiSlider.addEventListener('input',update);
  seuilSlider.addEventListener('input',update);
  update();

  root.append(h('h3','Interprétation du pompage'));
  root.append(h('ul',null,
    h('li',{html:'Le correcteur intégral <b>accumule</b> l\'erreur tant qu\'elle persiste.'}),
    h('li',{html:'Tant que la commande est inférieure au <b>seuil</b>, le moteur ne bouge pas : l\'intégrateur continue de charger.'}),
    h('li',{html:'Quand la commande franchit le seuil, le moteur démarre brutalement : le bras dépasse la consigne.'}),
    h('li',{html:'L\'intégrateur se décharge, la commande redescend sous le seuil, le moteur s\'arrête… le cycle recommence.'})
  ));

  root.append(h('h3','Question du TP'));
  root.append(questionList([
    {n:19,q:'Observer le pompage avec Kp = 50 et Ki = 10. Expliquer le rôle conjugué du correcteur intégral et du seuil.',
     a:'Le correcteur intégral <b>pousse</b> la commande jusqu\'au seuil d\'adhérence. Une fois le seuil franchi, le moteur démarre et l\'intégrateur se décharge. La commande redescend sous le seuil, le moteur s\'arrête, le cycle recommence : c\'est un <b>cycle limite</b> (pompage) résultant de l\'interaction entre une non-linéarité (seuil) et un correcteur linéaire (intégrateur).'}
  ]));
}

function questionList(items){
  const box=h('div');
  items.forEach(it=>{
    const qa=h('div',{class:'qa'},
      h('p',{class:'qq',html:`Question ${it.n}. ${it.q}`}),
      h('details',null,
        h('summary',null,'Voir le corrigé'),
        h('p',{class:'aa',html:it.a})
      )
    );
    box.append(qa);
  });
  return box;
}

COURSE.push({id:'intro',t:'Limitations des méthodes linéaires',h:`
<p><b>Un système est linéaire</b> s\'il est décrit par des équations différentielles linéaires d\'ordre fini à coefficients constants. On peut alors appliquer le principe de superposition.</p>
<p>En pratique, aucun système physique n\'est complètement linéaire. Les méthodes linéaires ne sont applicables que dans un domaine de fonctionnement restreint.</p>
<ul>
<li>Certains systèmes sont impossibles à modéliser par des modèles linéaires.</li>
<li>Certains phénomènes ne peuvent pas être décrits par des modèles linéaires.</li>
</ul>
<div class="retain"><b>À retenir.</b> Un système non linéaire ne peut pas être décrit par des équations différentielles linéaires. Il n\'y a pas de théorie générale.</div>`});
COURSE.push({id:'nonlin',t:'Non-linéarités dans les systèmes asservis',h:`
<p>On distingue :</p>
<ul>
<li><b>Non-linéarités continues</b> (courbures) : étude locale par linéarisation.</li>
<li><b>Non-linéarités discontinues</b> : <b>saturations</b>, <b>seuils</b>, <b>hystérésis</b>.</li>
</ul>
<h3>Exemples</h3>
<ul>
<li>Alimentation, amplificateur : tension maximale → saturation.</li>

</ul>
<div class="retain"><b>À retenir.</b> Les non-linéarités discontinues (saturation, seuil, hystérésis) sont les plus fréquentes et provoquent des cycles limites.</div>`});

<div class="formula">(3) e(t) = K<sub>e</sub>·ω<sub>m</sub>(t)</div>

<div class="formula">(5) θ<sub>m</sub>(t) = ∫ω<sub>m</sub>(t)·dt</div>

<ul>

<dl class="gloss">

    defi:{q:'Pourquoi un intégrateur peut-il avoir une erreur statique en présence d\'adhérence ?',
      a:'L\'intégrateur annule l\'erreur <b>si</b> le système peut bouger. Avec l\'adhérence, le moteur reste bloqué tant que la commande n\'a pas atteint le seuil : l\'intégrateur accumule l\'erreur sans que le bras ne bouge, ce qui crée un cycle limite.'},
    qcm:[
      {q:'Frottement → erreur statique ?',o:['Non','Oui'],a:1,w:'Le frottement peut créer une erreur statique.'},
      {q:'Adhérence = non-linéarité ?',o:['Non','Oui, seuil','Non, bruit','Oui, continue'],a:1,w:'Blocage sous un seuil.'},
      {q:'Bloc pour l\'adhérence seule ?',o:['Saturation','Seuil','Bande morte','Gain'],a:1,w:'Une fois le seuil franchi, retour au linéaire.'},
      {q:'Bloc pour adhérence + frottement ?',o:['Saturation','Seuil','Bande morte','Dérivée'],a:2,w:'Décalage persistant.'},
      {q:'Protocole pour mettre en évidence le seuil ?',o:['Grand échelon','Rampe en BO','Bruit blanc','Échelon de perturbation'],a:1,w:'Relevé du courant de démarrage.'}
    ]},
  m5:{title:'Correcteur PI et pompage',level:'Niveau 3 · Approfondir',time:'25 min',course:'pi',
    goal:'Comprendre le rôle conjugué du correcteur intégral et du seuil.',
    steps:['Écrivez C(p) = (2/255)(Kp + Ki/(4p)).','Observez le pompage avec Kp=50, Ki=10.','Décrivez le cycle.','Concluez sur le rôle conjugué.'],
    defi:{q:'Pourquoi le pompage est-il un phénomène non linéaire ?',
      a:'Il résulte de l\'interaction entre un correcteur linéaire (l\'intégrateur) et une non-linéarité (le seuil). Sans le seuil, l\'intégrateur convergerait normalement.'},
    qcm:[
      {q:'Équation du correcteur PI ?',o:['C=(2/255)(Kp+Ki/(4p))','C=Kp+Ki·p','C=Kp/(1+τp)','C=Ki/p'],a:0,w:'Correcteur implanté dans la carte.'},
      {q:'Rôle du terme intégral ?',o:['Augmenter le gain','Annuler l\'erreur statique','Filtrer le bruit','Dériver'],a:1,w:'Accumule l\'erreur.'},
      {q:'Qu\'est-ce que le pompage ?',o:['Oscillation entretenue','Divergence','Bruit','Saturation'],a:0,w:'Cycle limite.'},
      {q:'Pourquoi le pompage apparaît ?',o:['PI instable','Intégrateur charge tant que le seuil n\'est pas franchi','Moteur trop puissant','Capteur bruité'],a:1,w:'Interaction intégrateur + seuil.'},
      {q:'Rôle conjugué PI/seuil ?',o:['Compensation parfaite','Cycle limite','Annulation','Aucune'],a:1,w:'L\'intégrateur pousse la commande jusqu\'au seuil.'}
    ]}
};

/* ====================== INTERFACE ====================== */
const UI={cur:'m1'};
const AS={key:'m1',tab:'steps',open:false,st:lsGet(KEYS.act,{})};
const CS={open:false,id:'intro'};

function actSave(){lsSet(KEYS.act,AS.st)}
function actState(){return AS.st[AS.key]||(AS.st[AS.key]={a:{},checked:false,shown:false})}
function actScore(a){const s=actState();return a.qcm.filter((q,i)=>s.a[i]===q.a).length}
function wsById(id){return WORKSHOPS.find(w=>w.id===id)||WORKSHOPS[0]}

function renderSeg(){
  const seg=$('#wsSeg');seg.innerHTML='';
  WORKSHOPS.forEach((w,i)=>{
    seg.append(h('button',{type:'button',role:'tab','aria-pressed':w.id===UI.cur?'true':'false','aria-selected':w.id===UI.cur?'true':'false',onclick:()=>gotoWs(w.id)},(i+1)+'. '+w.title));
  });
}
function mountWs(){
  const w=wsById(UI.cur),root=$('#ws');
  $('#hint').textContent=w.hint;
  root.innerHTML='';
  w.mount(root);
  const sc=$('#scroller');if(sc)sc.scrollTop=0;
}
function gotoWs(id){
  const old=wsById(UI.cur);if(old.leave)old.leave();
  if(CS.open){CS.open=false;renderCourse()}
  UI.cur=id;AS.key=id;AS.tab='steps';
  renderSeg();mountWs();renderAct();
}
function renderAct(){
  const box=$('#act'),btn=$('#bAct');
  btn.setAttribute('aria-pressed',AS.open?'true':'false');
  btn.classList.toggle('pri',AS.open);
  box.hidden=!AS.open;
  if(!AS.open){box.innerHTML='';return}
  const oldB=box.querySelector('.pbody'),tag=AS.key+'|'+AS.tab,keep=oldB&&box.dataset.k===tag?oldB.scrollTop:0;
  box.dataset.k=tag;box.innerHTML='';
  const a=ACT[AS.key];
  const close=h('button',{class:'btn sm',type:'button',onclick:()=>{AS.open=false;renderAct()}},'Fermer');
  box.append(h('div',{class:'phead'},h('b',null,'Activité'),h('span',{class:'sub'},a.title),close));
  const nq=a.qcm.length;
  box.append(h('div',{class:'tabs',role:'tablist'},
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='steps'?'true':'false',onclick:()=>{AS.tab='steps';renderAct()}},'Consignes'),
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='qcm'?'true':'false',onclick:()=>{AS.tab='qcm';renderAct()}},'Questions ('+nq+')')));
  const body=h('div',{class:'pbody'});
  if(AS.tab==='steps'){
    body.append(h('p',{class:'small'},a.level+' · environ '+a.time));
    body.append(h('div',{class:'goal'},h('b',null,'Objectif. '),a.goal));
    body.append(h('ol',{class:'steps'},a.steps.map(s=>h('li',{html:s}))));
    body.append(h('div',{class:'defi'},h('b',null,'Défi'),h('p',{html:a.defi.q}),h('details',null,h('summary',null,'Voir la réponse'),h('p',{html:a.defi.a}))));
    if(a.course)body.append(h('p',null,h('button',{class:'btn',type:'button',onclick:()=>openCourse(a.course)},'Voir le cours : '+courseSection(a.course).t)));
    body.append(h('p',null,h('button',{class:'btn pri',type:'button',onclick:()=>{AS.tab='qcm';renderAct()}},'Passer aux questions')));
  }else{
    const s=actState(),show=s.checked||s.shown;
    a.qcm.forEach((q,i)=>{
      const fs=h('fieldset',{class:'q'},h('legend',null,(i+1)+'. '+q.q));
      q.o.forEach((o,j)=>{
        const good=show&&j===q.a,bad=s.checked&&!s.shown&&s.a[i]===j&&j!==q.a;
        const inp=h('input',{type:'radio',name:'q'+i,checked:show&&s.shown?j===q.a:s.a[i]===j,disabled:show});
        inp.addEventListener('change',()=>{s.a[i]=j;actSave();renderAct()});
        fs.append(h('label',{class:'opt'+(good?' good':'')+(bad?' bad':'')},inp,h('span',null,o+(good?'  ✓':'')+(bad?'  ✗':''))));
      });
      if(show){const miss=s.a[i]==null&&!s.shown;fs.append(h('p',{class:'why'},(miss?'Sans réponse. ':'')+q.w))}
      body.append(fs);
    });
    const done=Object.keys(s.a).length;
    body.append(h('p',{class:'small'},s.shown?'Réponses affichées.':s.checked?'':done+' réponse(s) sur '+nq+'.'));
    if(s.checked&&!s.shown)body.append(h('p',{class:'score'},'Score : '+actScore(a)+' / '+nq));
    const row=h('div',{class:'files'});
    if(!show)row.append(h('button',{class:'btn pri',type:'button',onclick:()=>{s.checked=true;actSave();renderAct()}},'Corriger'));
    row.append(h('button',{class:'btn',type:'button',onclick:()=>{s.shown=true;actSave();renderAct()}},'Afficher les réponses'));
    if(show)row.append(h('button',{class:'btn',type:'button',onclick:()=>{AS.st[AS.key]={a:{},checked:false,shown:false};actSave();renderAct()}},'Recommencer'));
    body.append(row);
  }
  box.append(body);body.scrollTop=keep;
}
function actToggle(){if(CS.open){CS.open=false;renderCourse()}AS.open=!AS.open;renderAct()}
$('#bAct').addEventListener('click',actToggle);

function courseSection(id){return COURSE.find(s=>s.id===id)||COURSE[0]}
function renderCourse(){
  const box=$('#course'),btn=$('#bCourse'),work=$('#work');
  btn.setAttribute('aria-pressed',CS.open?'true':'false');
  btn.classList.toggle('pri',CS.open);
  box.hidden=!CS.open;work.hidden=CS.open;$('#modes').hidden=CS.open;
  if(!CS.open){box.innerHTML='';return}
  box.innerHTML='';
  const cur=courseSection(CS.id),idx=COURSE.indexOf(cur);
  const go=id=>{CS.id=id;renderCourse()};
  const nav=h('nav',{class:'ctoc','aria-label':'Sommaire du cours'},COURSE.map((s,i)=>h('button',{type:'button',class:s.id===cur.id?'on':'','aria-current':s.id===cur.id?'true':'false',onclick:()=>go(s.id)},(i+1)+'. '+s.t)));
  const sel=h('select',{class:'ctoc-sel','aria-label':'Aller à une section',onchange:e=>go(e.target.value)},COURSE.map(s=>h('option',{value:s.id,selected:s.id===cur.id},s.t)));
  const body=h('div',{class:'cbody'});
  body.append(h('p',{class:'ckick'},'Cours · TP non-linéarités'));
  body.append(h('h2',null,cur.t));
  const content=h('div');content.innerHTML=cur.h;body.append(content);
  const cpn=h('div',{class:'cpn'});
  if(idx>0)cpn.append(h('button',{class:'btn',type:'button',onclick:()=>go(COURSE[idx-1].id)},'← '+COURSE[idx-1].t));
  cpn.append(h('span'));
  if(idx<COURSE.length-1)cpn.append(h('button',{class:'btn pri',type:'button',onclick:()=>go(COURSE[idx+1].id)},COURSE[idx+1].t+' →'));
  body.append(cpn);
  const top=h('div',{class:'ctop'},h('b',null,'Cours'),h('button',{class:'btn',type:'button',onclick:()=>{CS.open=false;renderCourse()}},'Fermer'));
  box.append(top);
  const wrap=h('div',{class:'cwrap'},nav,body);
  box.append(sel);box.append(wrap);
}
$('#bCourse').addEventListener('click',()=>{CS.open=!CS.open;renderCourse()});
function openCourse(id){CS.open=true;CS.id=id;renderCourse()}

$('#bHelp').addEventListener('click',()=>{
  const dlg=$('#dlg');dlg.hidden=false;dlg.innerHTML='';
  const box=h('div',{class:'dlgbox'},
    h('header',null,h('b',null,'Aide'),h('button',{class:'btn sm',type:'button',onclick:()=>{dlg.hidden=true}},'Fermer')),
    h('div',{class:'dbody',html:`
      <p><b>prise en compte des non-linéarités</b> — PSI*, SII.</p>
      <p>Cette page reprend le TP du Maxpid : modélisation linéaire, linéarisation, saturation, seuil et bande morte, correcteur PI et pompage.</p>
      <h3>Manipulation</h3>
      <p>Chaque atelier dispose de <b>curseurs</b> pour faire varier les paramètres (Kp, Ki, Umax, seuil) et observer la réponse du modèle en temps réel.</p>
      <h3>Questions</h3>
      <p>Les questions numérotées reprennent celles du TP. Cliquez sur <b>Voir le corrigé</b> pour la réponse.</p>
      <h3>Activité et cours</h3>
      <p>Les boutons <b>Activité</b> et <b>Cours</b> ouvrent respectivement le panneau latéral et le cours complet avec sommaire.</p>
    `}));
  dlg.append(box);
});

/* démarrage */
renderSeg();mountWs();renderAct();
</script>
</body>
</html>
