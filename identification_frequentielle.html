<style>
/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail blanche, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --node-stroke:#33475b;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}

.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}

.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}

.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}

.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}

/* ateliers */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}

#ws p,#ws li{font-size:14.5px;line-height:1.55}

.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:200px;max-width:100%}
.opts input[type=text]{font-family:var(--font-mono);min-width:240px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dt thead th{background:var(--panel2);font-weight:600}
.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.dt tr:last-child td{border-bottom:0}
/* barres de tri */
.stagebox{border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px;background:#fff;margin:8px 0}
.rowname{font-size:12px;color:var(--muted);margin:4px 2px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:176px;padding-top:4px}
.bars.short{height:120px}
.bcol{flex:1 1 0;max-width:54px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bcol .v{font:600 12px var(--font-mono);margin-bottom:2px}
.bcol .b{width:100%;border-radius:5px 5px 0 0;background:#9fb4ca;border:1px solid #6f8aa6;min-height:3px}
.bcol .i{font:11px var(--font-mono);color:var(--muted);margin-top:3px}
.bcol.sorted .b{background:rgba(30,122,46,.75);border-color:var(--ok)}
.bcol.scan .b{background:var(--accent);border-color:var(--accent-ink)}
.bcol.key .b{background:#e8a33a;border-color:var(--warn)}
.bcol.swap .b{background:#e8a33a;border-color:var(--warn)}
.bcol.min .b{background:var(--violet);border-color:#52308f}
.bcol.pivot .b{background:var(--bad);border-color:#8e1d15}
.bcol.left .b{background:#b9d3ee;border-color:var(--accent)}
.bcol.right .b{background:#f3d6a6;border-color:var(--warn)}
.bcol.dim{opacity:.32}
.bcol.empty .b{background:transparent;border:1px dashed var(--line)}
.leg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 6px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #6f8aa6;background:#9fb4ca}
.leg i.s{background:rgba(30,122,46,.75);border-color:var(--ok)}.leg i.c{background:var(--accent);border-color:var(--accent-ink)}.leg i.k{background:#e8a33a;border-color:var(--warn)}.leg i.m{background:var(--violet);border-color:#52308f}.leg i.p{background:var(--bad);border-color:#8e1d15}
/* cellules (comptage) */
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.cell{width:40px;text-align:center}
.cell .v{border:1px solid var(--line);border-radius:6px;padding:6px 0;font:600 14px var(--font-mono);background:#fff;min-height:33px}
.cell .i{font:11px var(--font-mono);color:var(--muted);margin-top:2px}
.cell.scan .v{background:var(--accent);color:#fff;border-color:var(--accent)}
.cell.key .v{background:#e8a33a;border-color:var(--warn)}
.cell.sorted .v{background:rgba(30,122,46,.2);border-color:var(--ok)}
.cell.zero .v{color:#9aa3ad}
/* comparaison */
.cmpr{display:grid;grid-template-columns:120px 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.cmpr i{display:block;height:12px;background:var(--accent);border-radius:3px;min-width:2px}
.cmpr em{font-style:normal;font-family:var(--font-mono);text-align:right}
.seqr{display:flex;gap:4px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font:600 12.5px var(--font-mono);background:#fff}
.card.t1{border-color:#2e6da4;color:#1b4a76}.card.t2{border-color:#9a5b00;color:#7a4700}.card.t3{border-color:#7b4fc2;color:#52308f}.card.t4{border-color:#1e7a2e;color:#1e7a2e}.card.t5{border-color:#c0281f;color:#8e1d15}.card.t6{border-color:#33475b;color:#33475b}

  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}

@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}.bcol .b{transition:height .15s}}

.plotbox canvas{display:block;width:100%;touch-action:none;cursor:crosshair}

.plotbox .ptitle{font-size:12px;color:var(--muted);margin:2px 8px}

.formula{line-height:1.9}
.kv{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.kv td,.kv th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}

.kv td.m,.kv td.n{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}

.badge.ok{background:rgba(30,122,46,.15);border-color:var(--ok);color:var(--ok)}
.badge.warn{background:rgba(154,91,0,.14);border-color:var(--warn);color:var(--warn)}
.badge.no{background:rgba(192,40,31,.13);border-color:var(--bad);color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 16px;align-items:start}

.numin{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}

const COURSE = [];
COURSE.push({ id: 'principe', t: 'Principe de l’identification fréquentielle', h: `
<p>On applique, pour une fréquence donnée, une entrée sinusoïdale d’amplitude <i>A₁</i> et de phase <i>φ₁</i> connues. La sortie est une sinusoïde de <b>même fréquence</b>, d’amplitude <i>A₂</i> et de phase <i>φ₂</i>.</p>
<div class="formula math">Gain : <i>G</i><sub>dB</sub> = 20 log ${fr('A₂', 'A₁')} &nbsp;&nbsp; Déphasage : Δ<i>φ</i> = <i>φ₂</i> − <i>φ₁</i> = −<i>ω</i>·Δ<i>t</i></div>
<p>En faisant varier la fréquence, on trace le gain et le déphasage en fonction de ω. Ils peuvent être représentés dans le plan de <b>Bode</b>, de Nyquist ou de Black. Cet atelier traite les diagrammes de Bode : abscisse logarithmique en rad/s, gain en dB, phase en degrés.</p>
<div class="retain"><b>À retenir.</b> Un essai à une fréquence donne un point du Bode. L’identification consiste à relever des points sur plusieurs décades, puis à les superposer à un modèle.</div>` });

COURSE.push({ id: 'f_ordre1', t: 'Réponse fréquentielle : premier ordre', h: `
<div class="formula math"><i>H(p)</i> = ${fr('S(p)', 'E(p)')} = ${fr('K', '1 + Tp')} &nbsp;; pulsation de coupure <i>ω<sub>c</sub></i> = ${fr('1', 'T')}</div>
<ul><li>Asymptote initiale (basses fréquences) : elle coupe l’axe des ordonnées en <b>20 log K</b>.</li><li>Asymptote finale (hautes fréquences) : pente <b>−20 dB/décade</b> (on dit aussi pente −1).</li><li>La phase varie de <b>0° à −90°</b> et vaut −45° en <i>ω<sub>c</sub></i>.</li><li>En <i>ω<sub>c</sub></i>, le gain est inférieur de <b>3 dB</b> à l’asymptote initiale : 20 log K − 3 dB.</li></ul>
<h3>Identification</h3>
<p><i>K</i> se lit sur le plateau basses fréquences (20 log K) et <i>T</i> = 1/<i>ω<sub>c</sub></i> où <i>ω<sub>c</sub></i> est la pulsation pour laquelle la phase vaut −45° (ou le gain est de 3 dB sous le plateau).</p>
<div class="retain"><b>À retenir.</b> Premier ordre : plateau 20 log K, cassure en 1/T, pente −20 dB/décade, phase de 0° à −90°.</div>` });

COURSE.push({ id: 'f_ordre2', t: 'Réponse fréquentielle : second ordre', h: `
<div class="formula math"><i>H(p)</i> = ${fr('K', '1 + ' + fr('2m', 'ω₀') + 'p + ' + fr('p²', 'ω₀²'))}</div>
<p>Dans tous les cas, l’asymptote finale a une pente de <b>−40 dB/décade</b> (pente −2) et la phase varie de 0° à −180°. La forme dépend de <i>m</i>.</p>
<h3>m &gt; 1</h3>
<p><i>H(p)</i> = ${fr('K', '(1 + T₁p)(1 + T₂p)')} avec <i>T₁</i> = −1/<i>p₁</i>, <i>T₂</i> = −1/<i>p₂</i> et <i>T₁T₂</i> = 1/<i>ω₀</i>², où <i>p₁</i> = <i>ω₀</i>(−<i>m</i> − √(<i>m</i>² − 1)) et <i>p₂</i> = <i>ω₀</i>(−<i>m</i> + √(<i>m</i>² − 1)). Deux cassures en 1/<i>T₂</i> puis 1/<i>T₁</i> : pentes 0, −20, puis −40 dB/décade ; phase étagée par −90°.</p>
<h3>m = 1</h3>
<p><i>H(p)</i> = ${fr('K', '(1 + T₀p)²')} avec <i>T₀</i> = 1/<i>ω₀</i> : pôle double, une seule cassure en <i>ω₀</i>.</p>
<h3>√2/2 ≤ m &lt; 1</h3>
<p>Deux pôles complexes conjugués : <i>p₁,₂</i> = <i>ω₀</i>(−<i>m</i> ∓ j√(1 − <i>m</i>²)). <b>Pas de résonance</b>.</p>
<h3>0 &lt; m &lt; √2/2</h3>
<ul><li>Pôles complexes conjugués, <b>résonance</b> à la pulsation <i>ω<sub>r</sub></i> = <i>ω₀</i>√(1 − 2<i>m</i>²).</li><li>Facteur de surtension : <i>Q</i> = ${fr('|H(jω<sub>r</sub>)|', '|H(0)|')} = ${fr('1', '2m√(1 − m²)')}.</li><li>En décibels : <i>Q</i><sub>dB</sub> = 20 log |H(jω<sub>r</sub>)| − 20 log K = −20 log (2<i>m</i>√(1 − <i>m</i>²)).</li></ul>
<div class="retain"><b>À retenir.</b> Pente finale −40 dB/décade et phase −90° en ω₀ dans tous les cas ; seule la forme autour de ω₀ change avec m.</div>` });

COURSE.push({ id: 'f_ident', t: 'Démarche d’identification d’un second ordre', h: `
<ol><li>La <b>valeur initiale du gain</b> correspond à 20 log |K| et donne le gain statique <i>K</i>.</li><li>La <b>phase φ = −90°</b> donne la pulsation propre <i>ω₀</i>.</li><li>Le <b>gain en ω₀</b>, égal à 20 log |K/2m|, donne le coefficient d’amortissement <i>m</i> : <i>m</i> = ${fr('K', '2·10<sup>G/20</sup>')}.</li></ol>
<p>Cette démarche est la même pour m ≥ 1 et pour √2/2 ≤ m &lt; 1.</p>
<h3>Cas de la résonance (m &lt; √2/2)</h3>
<ul><li><i>K</i> : valeur initiale du gain.</li><li><i>ω₀</i> : phase −90°.</li><li><i>m</i> : le facteur de surtension <i>Q</i><sub>dB</sub> mesuré sur le sommet de la bosse donne <i>m</i> par <i>Q</i><sub>dB</sub> = −20 log (2<i>m</i>√(1 − <i>m</i>²)), soit <i>m</i>² = (1 − √(1 − <i>u</i>²)) / 2 avec <i>u</i> = 10<sup>−Q<sub>dB</sub>/20</sup>.</li></ul>
<div class="retain"><b>À retenir.</b> K : plateau ; ω₀ : phase −90° ; m : gain en ω₀ (ou surtension s’il y a une bosse).</div>` });

COURSE.push({ id: 'f_lien', t: 'Lien avec le comportement temporel', h: `
<table class="ctable"><thead><tr><th>Amortissement</th><th>Bode (gain)</th><th>Réponse indicielle</th></tr></thead><tbody>
<tr><td>m &lt; √2/2</td><td>Résonance, surtension Q</td><td>Oscillations, fort dépassement</td></tr>
<tr><td>√2/2 ≤ m &lt; 1</td><td>Pas de résonance</td><td>Léger dépassement</td></tr>
<tr><td>m ≥ 1</td><td>Gain décroissant sans bosse</td><td>Apériodique, aucun dépassement</td></tr></tbody></table>
<p>Augmenter <i>ω₀</i> déplace le Bode vers les hautes fréquences et accélère la réponse indicielle. Le dépassement relatif <i>d</i> = e<sup>−mπ/√(1−m²)</sup> ne dépend que de <i>m</i>, comme la surtension <i>Q</i>.</p>
<div class="retain"><b>À retenir.</b> Les deux approches décrivent le même système : choisir l’essai le plus simple à réaliser et à exploiter (échelon ou balayage sinusoïdal).</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Réponse harmonique</dt><dd>Réponse en régime permanent à une entrée sinusoïdale.</dd>
<dt>Diagramme de Bode</dt><dd>Gain en dB et phase en degrés en fonction de ω sur une échelle logarithmique.</dd>
<dt>Décade</dt><dd>Intervalle de pulsations dont le rapport vaut 10.</dd>
<dt>Pulsation de coupure</dt><dd>ωc = 1/T pour un premier ordre : gain réduit de 3 dB.</dd>
<dt>Pulsation propre ω₀</dt><dd>Pulsation où la phase d’un second ordre vaut −90°.</dd>
<dt>Résonance</dt><dd>Maximum du gain au-dessus de la valeur initiale, pour m &lt; √2/2.</dd>
<dt>Facteur de surtension Q</dt><dd>Rapport |H(jωr)| / |H(0)|.</dd>
<dt>Asymptote</dt><dd>Droite vers laquelle tend le tracé réel du gain (pentes multiples de −20 dB/décade).</dd>
</dl>` });
/* ---------- interface ---------- */
const UI = { cur: 'f1' };
const AS = { key: 'f1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'principe' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  stopAll(); w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; if (UI.mounted) { mountWs(); } return; }
  stopAll();
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { class: 'math', html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : l’identification fréquentielle'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Six ateliers sur l’identification fréquentielle (diagrammes de Bode) des systèmes du premier et du second ordre : réponse harmonique, premier ordre, second ordre, identification, ajustement manuel, lien temps-fréquence.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Faites glisser les <b>curseurs</b> pour changer le système, et les <b>points rouges ou bleus</b> sur les graphiques pour déplacer P, les curseurs de mesure ou le temps.</li><li>Dans les modes « système mystère », mesurez sur la courbe, entrez vos valeurs puis révélez le système réel.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> rappelle les méthodes.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p><p class="small">Contenu d’après « Identification expérimentale de la fonction de transfert des systèmes de premier et second ordre » (L. Abdellaoui, IPEST).</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); UI.mounted = true; })();
</script>
